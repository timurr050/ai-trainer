name: Probe music sources
on:
  push:
    branches: [main]
    paths: [".github/workflows/probe-music.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "== ccmixter deep house"
          curl -s --max-time 30 "http://ccmixter.org/api/query?tags=deep_house&f=json&limit=200" | python3 -c "import sys,json; d=json.load(sys.stdin); print(len(d)); [print(x.get('upload_name'),'|',x.get('user_name'),'|',x.get('license_name'),'|',(x.get('files') or [{}])[0].get('download_url')) for x in d[:15]]" || true
          echo "== ccmixter house"
          curl -s --max-time 30 "http://ccmixter.org/api/query?tags=house&f=json&limit=300" | python3 -c "import sys,json; d=json.load(sys.stdin); print(len(d)); from collections import Counter; print(Counter(x.get('license_name') for x in d))" || true
          echo "== FMA"
          curl -s -o /dev/null -w "%{http_code}\n" --max-time 30 "https://freemusicarchive.org/genre/Deep-House/"
          echo "== jamendo"
          curl -s --max-time 30 "https://api.jamendo.com/v3.0/tracks/?format=json&limit=2&tags=deephouse" | head -c 300; echo
