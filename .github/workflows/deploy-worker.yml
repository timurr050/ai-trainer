name: Deploy reminders worker
on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/deploy-worker.yml"]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install worker dependencies
        working-directory: worker
        run: npm ci
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: worker
          command: deploy
          secrets: |
            BOT_TOKEN
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      # Обновляем вебхук бота (кнопка «PDF» под ответами) и проверяем AI-тренера: вопрос → ответ → PDF
      - name: Set webhook and test AI coach
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          KEY=$(printf 'wh%s' "$BOT_TOKEN" | sha256sum | cut -c1-32)
          URL=https://ai-trainer.tim9728.workers.dev
          sleep 5
          curl -sS -H "X-Service-Key: $KEY" "$URL/setup" | head -c 300; echo
          curl -sS --max-time 120 -H "X-Service-Key: $KEY" "$URL/aitest" > aitest.json || true
          node -e 'const j=JSON.parse(require("fs").readFileSync("aitest.json","utf8"));console.log("ok:",j.ok,"ms:",j.ms,"pdf bytes:",j.pdfBytes,j.pdfErr||"");console.log(j.text)'
