name: Fetch Jamendo deep house
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"   # раз в неделю обновляем список
  push:
    branches: [main]
    paths: [".github/workflows/fetch-jamendo.yml", "tools/fetch_jamendo.mjs"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node tools/fetch_jamendo.mjs
        env:
          JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID || vars.JAMENDO_CLIENT_ID }}
      - name: Check that streams play
        run: |
          node -e 'const l=require("./music/jamendo.json");for(const t of [l[0],l[100],l[399]])if(t)console.log(t.u)' | while read -r u; do curl -s -o /dev/null -r 0-1000 -w "%{http_code} %{content_type} %{size_download}\n" -L "$u"; done
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Rebuild app and commit
        run: |
          if [ ! -s music/jamendo.json ]; then echo "Список не получен — ключ JAMENDO_CLIENT_ID не найден или API отказал"; exit 1; fi
          python3 src/build.py
          git config user.name "timurr050"
          git config user.email "13timm@gmail.com"
          git add music/jamendo.json app.js app.css index.html standalone.html version.txt
          git commit -m "Обновлён список deep house с Jamendo" || echo "no changes"
          git pull --rebase -q origin main && git push
