ы рукояти были на уровне середины груди. / Сведите лопатки и выжмите рукояти вперёд. / Медленно вернитесь в исходное положение.",2],["Leverage_Deadlift","Становая тяга в рычажном тренажёре","Leverage Deadlift","l","nm","machines",1,0,1,"Встаньте между рукоятями и возьмитесь за нижние. / Опустите таз, держа грудь поднятой и взгляд вперёд. / Встаньте, разгибая ноги и таз, затем опустите вес.",2],["Leverage_Decline_Chest_Press","Жим под отрицательным углом в рычажном тренажёре","Leverage Decline Chest Press","a","fi","machines",1,0,1,"Отрегулируйте сиденье, рукояти на уровне низа груди. / Сведите лопатки и выжмите рукояти вперёд-вниз. / Медленно вернитесь в исходное положение.",2],["Leverage_High_Row","Верхняя тяга в рычажном тренажёре","Leverage High Row","c","b","machines",1,0,1,"Отрегулируйте сиденье и упор для колен, возьмитесь за верхние рукояти прямым хватом. / Потяните рукояти к корпусу, сводя лопатки. / Медленно выпрямите руки.",2],["Leverage_Incline_Chest_Press","Жим под углом вверх в рычажном тренажёре","Leverage Incline Chest Press","a","fi","machines",1,0,1,"Отрегулируйте сиденье, рукояти на уровне верха груди. / Сведите лопатки и выжмите рукояти вперёд-вверх. / Медленно вернитесь в исходное положение.",2],["Leverage_Iso_Row","Изолированная тяга в рычажном тренажёре","Leverage Iso Row","b","hc","machines",1,0,1,"Отрегулируйте сиденье, рукояти на уровне груди. / Потяните рукояти к корпусу, сгибая локти и сводя лопатки. / Задержитесь и медленно выпрямите руки.",2],["Leverage_Shoulder_Press","Жим плечами в рычажном тренажёре","Leverage Shoulder Press","f","i","machines",1,0,1,"Отрегулируйте сиденье, рукояти у верха плеч, хват прямой. / Выжмите рукояти вверх до выпрямления рук. / Медленно опустите их обратно.",2],["Leverage_Shrug","Шраги в рычажном тренажёре","Leverage Shrug","e","j","machines",1,0,0,"Встаньте между рукоятями и возьмитесь за верхние. / Встаньте прямо, разгибая ноги и таз. / Поднимите плечи к ушам, задержитесь и опустите.",2],["Linear_3-Part_Start_Technique","Техника старта из трёх точек","Linear 3-Part Start Technique","m","ol","",1,2,1,"Встаньте на линию, левый носок у правой лодыжки, правая стопа чуть позади. / Поставьте правую руку на линию, перенеся вес вперёд. / Мощно оттолкнитесь и ускорьтесь в спринт.",2],["Linear_Acceleration_Wall_Drill","Упражнение у стены на ускорение","Linear Acceleration Wall Drill","m","onl","",1,2,1,"Наклонитесь к стене под углом около 45 градусов, ноги вместе. / Быстро поднимите правое колено и мощно опустите стопу вниз. / Смените ногу и повторите серию.",2],["Linear_Depth_Jump","Глубинный прыжок","Linear Depth Jump","l","onm","other",2,2,1,"Встаньте на тумбу лицом ко второй тумбе. / Спрыгните на пол, сгибая колени и таз при приземлении. / Сразу мощно выпрыгните на вторую тумбу.",2],["Log_Lift","Подъём бревна","Log Lift","f","kanmdclei","other",2,5,1,"Возьмитесь за рукояти бревна и подтяните его к груди. / Разгибая таз и колени, закиньте бревно на грудь. / Подсядьте и выжмите бревно над головой.",2],["London_Bridges","Лондонские мосты","London Bridges","b","hjc","other",2,0,1,"Закрепите канат над зафиксированным грифом Смита и встаньте на гриф. / Держась за канат, отклонитесь назад, перебирая руками. / Подтяните себя обратно в вертикальное положение.",2],["Looking_At_Ceiling","Прогиб назад стоя на коленях","Looking At Ceiling","l","","",1,1,0,"Встаньте на колени и возьмитесь руками за пятки. / Подайте таз вперёд и вверх, прогибая спину. / Отведите голову назад и посмотрите в потолок.",2],["Low_Cable_Crossover","Сведение рук в кроссовере снизу","Low Cable Crossover","a","f","cable",1,0,0,"Установите блоки внизу, возьмите рукояти и шагните вперёд. / Ладони вперёд, руки ниже пояса, слегка согнуты. / Сведите руки перед грудью по дуге и медленно вернитесь.",2],["Low_Cable_Triceps_Extension","Разгибание рук с канатом от нижнего блока лёжа","Low Cable Triceps Extension","i","","cable",1,0,0,"Лягте на скамью тренажёра головой к блоку и возьмите канат нейтральным хватом. / Держите плечи неподвижными, локти согнуты. / Разогните руки, затем медленно согните обратно.",2],["Low_Pulley_Row_To_Neck","Тяга нижнего блока к шее","Low Pulley Row To Neck","f","hce","cable",1,0,1,"Сядьте в тренажёр с канатом, возьмитесь прямым хватом, спина прямая. / Потяните канат к шее, разводя локти в стороны. / Медленно выпрямите руки.",2],["Lower_Back-SMR","МФР поясницы на ролике","Lower Back-SMR","d","","roller",1,1,0,"Сядьте и подложите ролик под поясницу, скрестите руки на груди. / Поднимите таз и отклонитесь назад, перенося вес на поясницу. / Слегка сместитесь в сторону и прокатайте мышцы.",2],["Lower_Back_Curl","Разгибание спины лёжа на животе","Lower Back Curl","k","","",1,1,0,"Лягте на живот, руки в стороны. / Мышцами поясницы поднимите грудь от пола, не помогая руками. / Медленно опуститесь и повторите 10–20 раз.",2],["Lunge_Pass_Through","Выпады с передачей гири","Lunge Pass Through","m","onl","kettlebell",2,0,1,"Встаньте прямо, держа гирю в правой руке. / Шагните вперёд левой ногой в выпад, опуская заднее колено к полу. / Передайте гирю под передней ногой в другую руку и вернитесь.",2],["Lunge_Sprint","Спринт-выпады в Смите","Lunge Sprint","l","onm","machines",2,0,1,"Положите гриф Смита на плечи и встаньте в разножку. / Опустите заднее колено почти до пола. / Мощно выпрыгните, смените ноги в воздухе и приземлитесь в выпад.",2],["Lying_Bent_Leg_Groin","Растяжка паха лёжа с партнёром","Lying Bent Leg Groin","p","","other",3,1,0,"Лягте на спину, согните колени и соедините стопы, партнёр держит колени. / Попытайтесь свести колени, пока партнёр не даёт этого сделать, 10–20 секунд. / Расслабьтесь, позволяя партнёру мягко углубить растяжку.",2],["Lying_Cable_Curl","Сгибание рук на нижнем блоке лёжа","Lying Cable Curl","h","","cable",2,0,0,"Возьмите прямую рукоять нижнего блока хватом снизу на ширине плеч. / Лягте на спину, стопы упираются в раму тренажёра. / Согните руки к плечам, держа локти у корпуса, и медленно опустите.",2],["Lying_Cambered_Barbell_Row","Тяга изогнутой штанги лёжа на скамье","Lying Cambered Barbell Row","c","hbe","barbell",1,0,0,"Лягте животом на скамью, возьмите изогнутый гриф прямым хватом шире плеч. / На выдохе подтяните гриф к груди, держа локти у корпуса. / Медленно опустите штангу.",2],["Lying_Close-Grip_Bar_Curl_On_High_Pulley","Сгибание рук на верхнем блоке лёжа узким хватом","Lying Close-Grip Bar Curl On High Pulley","h","","cable",1,0,0,"Лягте на скамью перед верхним блоком, возьмите рукоять хватом снизу на ширине плеч. / Вытяните руки вверх над плечами. / Согните руки к голове, держа плечи неподвижными, и медленно разогните.",2],["Lying_Close-Grip_Barbell_Triceps_Extension_Behind_The_Head","Французский жим узким хватом из-за головы лёжа","Lying Close-Grip Barbell Triceps Extension Behind The Head","i","","barbell",2,0,0,"Лягте на скамью, держа штангу узким хватом над грудью. / Согните локти и опустите штангу за голову. / Разогните руки, держа плечи неподвижными.",2],["Lying_Close-Grip_Barbell_Triceps_Press_To_Chin","Французский жим узким хватом к подбородку лёжа","Lying Close-Grip Barbell Triceps Press To Chin","i","","barbell",2,0,0,"Лягте на скамью, голова у края, штанга узким хватом над грудью. / Согните локти и опустите штангу к подбородку. / Разогните руки, держа плечи неподвижными.",2],["Lying_Crossover","Скрестная растяжка лёжа с партнёром","Lying Crossover","q","","",3,1,0,"Лягте на спину, перекиньте согнутую ногу через тело. / Партнёр прижимает ваше плечо к полу и контролирует ногу. / Мягко тянитесь коленом к полу, удерживая растяжку.",2],["Lying_Dumbbell_Tricep_Extension","Французский жим гантелей лёжа","Lying Dumbbell Tricep Extension","i","af","dumbbells",2,0,0,"Лягте на скамью, гантели на прямых руках над грудью, ладони внутрь. / На вдохе согните локти, опуская гантели к голове. / На выдохе разогните руки.",2],["Lying_Face_Down_Plate_Neck_Resistance","Сгибание шеи с блином лёжа лицом вниз","Lying Face Down Plate Neck Resistance","g","","other",2,0,0,"Лягте лицом вниз на скамью, плечи у края, держите блин на затылке. / Опустите голову вниз. / Поднимите голову, разгибая шею, и задержитесь.",2],["Lying_Face_Up_Plate_Neck_Resistance","Сгибание шеи с блином лёжа на спине","Lying Face Up Plate Neck Resistance","g","","other",2,0,0,"Лягте на спину на скамью, плечи у края, держите блин на лбу. / Опустите голову назад. / Поднимите голову, подтягивая подбородок к груди.",2],["Lying_Glute","Растяжка ягодиц лёжа с партнёром","Lying Glute","n","q","",3,1,0,"Лягте на спину, согните ногу и положите стопу над противоположным бедром. / Партнёр фиксирует колено и лодыжку. / Давите ногой против сопротивления, затем расслабьтесь и углубите растяжку.",2],["Lying_Hamstring","Растяжка задней поверхности бедра лёжа с партнёром","Lying Hamstring","m","o","other",3,1,0,"Лягте на спину, поднимите одну ногу вверх, партнёр держит лодыжку. / Давите ногой вниз против сопротивления партнёра несколько секунд. / Расслабьтесь, позволяя партнёру мягко углубить растяжку.",2],["Lying_High_Bench_Barbell_Curl","Сгибание рук со штангой лёжа на высокой скамье","Lying High Bench Barbell Curl","h","","barbell,bench",2,0,0,"Лягте животом на высокую скамью, держите штангу хватом снизу на прямых руках. / Согните руки, поднимая штангу к плечам. / Медленно опустите штангу.",2],["Lying_Leg_Curls","Сгибание ног лёжа в тренажёре","Lying Leg Curls","m","","machines",1,0,0,"Лягте лицом вниз, валик чуть ниже икр, держитесь за ручки. / На выдохе согните ноги, подтягивая валик к ягодицам. / Медленно опустите вес на вдохе.",2],["Lying_Machine_Squat","Приседания в тренажёре лёжа","Lying Machine Squat","l","onm","machines",2,0,1,"Отрегулируйте тренажёр и лягте на спину, колени согнуты, бёдра чуть ниже параллели. / Выжмите платформу, разгибая ноги. / Медленно вернитесь в исходное положение.",2],["Lying_One-Arm_Lateral_Raise","Махи одной рукой лёжа на скамье","Lying One-Arm Lateral Raise","f","","dumbbells",2,0,0,"Лягте грудью на скамью, держа гантель в одной руке нейтральным хватом. / Поднимите руку в сторону до уровня плеча, локоть слегка согнут. / Медленно опустите гантель.",2],["Lying_Prone_Quadriceps","Растяжка квадрицепса лёжа на животе с партнёром","Lying Prone Quadriceps","l","","",3,1,0,"Лягте на живот, согните ногу, партнёр держит колено и лодыжку. / Пытайтесь разогнуть ногу против сопротивления партнёра. / Расслабьтесь, позволяя партнёру подтянуть стопу к ягодице.",2],["Lying_Rear_Delt_Raise","Разведение гантелей лёжа на задние дельты","Lying Rear Delt Raise","f","","dumbbells",2,0,0,"Лягте грудью на скамью, держа гантели нейтральным хватом. / Разведите руки в стороны до уровня плеч, локти слегка согнуты. / Медленно опустите гантели.",2],["Lying_Supine_Dumbbell_Curl","Сгибание рук с гантелями лёжа на спине","Lying Supine Dumbbell Curl","h","","dumbbells",1,0,0,"Лягте на скамью на спину, гантели в руках по бокам, ладони внутрь. / Опустите руки вниз, растягивая бицепс. / Согните руки, поднимая гантели к плечам, и медленно опустите.",2],["Lying_T-Bar_Row","Тяга Т-грифа лёжа","Lying T-Bar Row","c","hb","machines",2,0,1,"Лягте грудью на подушку тренажёра, возьмитесь за рукояти. / Подтяните вес к груди, сводя лопатки. / Медленно опустите вес.",2],["Lying_Triceps_Press","Французский жим лёжа","Lying Triceps Press","i","","barbell",2,0,0,"Лягте на скамью, возьмите EZ-гриф средним хватом и поднимите над грудью. / Согните локти, опуская гриф ко лбу. / Разогните руки, держа плечи неподвижными.",2],["Machine_Bench_Press","Жим от груди в тренажёре","Machine Bench Press","a","fi","machines",1,0,1,"Сядьте в тренажёр и возьмитесь за рукояти прямым хватом. / Выжмите рукояти вперёд на выдохе до выпрямления рук. / Медленно вернитесь на вдохе.",2],["Machine_Bicep_Curl","Сгибание рук в тренажёре","Machine Bicep Curl","h","","machines",1,0,0,"Отрегулируйте сиденье, положите плечи на подушку и возьмитесь за рукояти. / Согните руки, задержитесь в верхней точке. / Медленно разогните руки.",2],["Machine_Preacher_Curls","Сгибание рук в тренажёре Скотта","Machine Preacher Curls","h","","machines",1,0,0,"Сядьте в тренажёр, положите трицепсы на подушку, хват снизу. / Согните руки, поднимая рукояти к плечам. / Медленно опустите их обратно.",2],["Machine_Shoulder_Military_Press","Жим плечами в тренажёре","Machine Shoulder (Military) Press","f","i","machines",1,0,1,"Сядьте в тренажёр и возьмитесь за рукояти, локти согнуты. / На выдохе выжмите рукояти вверх до выпрямления рук. / Медленно опустите их на вдохе.",2],["Machine_Triceps_Extension","Разгибание рук в тренажёре","Machine Triceps Extension","i","","machines",1,0,0,"Отрегулируйте сиденье, положите плечи на подушки и возьмитесь за рукояти. / Разогните руки, задержитесь в конечной точке. / Медленно вернитесь в исходное положение.",2],["Medicine_Ball_Chest_Pass","Передача медбола от груди","Medicine Ball Chest Pass","a","fi","medball",1,2,1,"Встаньте лицом к партнёру или стене, держа медбол у груди. / Мощно выпрямите руки, бросая мяч вперёд. / Поймайте мяч и сразу повторите.",2],["Medicine_Ball_Full_Twist","Передача медбола с полным разворотом","Medicine Ball Full Twist","k","f","medball",1,2,1,"Встаньте спиной к партнёру на расстоянии около метра, мяч перед корпусом. / Одновременно с партнёром повернитесь и передайте мяч. / Повернитесь в другую сторону, чтобы принять мяч.",2],["Medicine_Ball_Scoop_Throw","Бросок медбола снизу вверх","Medicine Ball Scoop Throw","f","kml","medball",1,2,1,"Встаньте в полуприсед, мяч у стоп. / Мощно разогните ноги и таз, выпрыгивая вверх. / Махом прямых рук бросьте мяч вверх-назад над головой.",2],["Middle_Back_Shrug","Шраги лёжа на наклонной скамье","Middle Back Shrug","c","","dumbbells",2,0,0,"Лягте животом на наклонную скамью, гантели на прямых руках вниз. / На выдохе сведите лопатки, задержитесь. / Медленно вернитесь в исходное положение.",2],["Middle_Back_Stretch","Растяжка средней части спины стоя","Middle Back Stretch","c","kbd","",1,1,0,"Встаньте, ноги на ширине плеч, руки на поясе. / Поверните корпус до ощущения растяжения. / Удерживайте 10–15 секунд и повторите в другую сторону.",2],["Mixed_Grip_Chin","Подтягивания разнохватом","Mixed Grip Chin","c","hb","other",3,0,1,"Возьмитесь за перекладину чуть шире плеч, одна ладонь от себя, другая к себе. / На выдохе подтянитесь подбородком выше перекладины. / Медленно опуститесь.",2],["Monster_Walk","Ходьба монстра с резинками","Monster Walk","q","","bands",1,0,1,"Наденьте резинки на лодыжки и колени. / Делайте короткие шаги вперёд, сохраняя натяжение. / Затем пройдите назад тем же способом.",2],["Mountain_Climbers","Скалолаз","Mountain Climbers","l","amf","",1,2,1,"Встаньте в упор лёжа, подтяните одно колено под таз. / Взрывно смените ноги, выпрямляя согнутую и подтягивая другую. / Продолжайте чередовать ноги в быстром темпе.",2],["Moving_Claw_Series","Беговая серия «Коготь»","Moving Claw Series","m","ol","",1,2,1,"Бегите, сгибая колено и захлёстывая пятку к ягодице. / Выносите ногу вперёд и активно ставьте стопу под себя. / Работайте руками в такт бегу.",2],["Muscle_Snatch","Рывок силовой","Muscle Snatch","m","ndlfi","barbell",2,4,1,"Держите штангу широким хватом на уровне середины бедра, плечи чуть впереди грифа. / Мощно разогните ноги и таз, подтягивая штангу вверх. / Выведите штангу над головой без подседа, зафиксируйте и опустите.",2],["Muscle_Up","Выход силой на кольцах","Muscle Up","b","khjcfei","pullup",2,0,1,"Возьмитесь за кольца ложным хватом. / Подтянитесь, притягивая кольца к подмышкам и подавая плечи вперёд. / Переведите локти вверх и выжмите себя над кольцами.",2],["Narrow_Stance_Hack_Squats","Гакк-приседания с узкой постановкой ног","Narrow Stance Hack Squats","l","onm","machines",2,0,1,"Встаньте в гакк-машину, плечи под упорами, стопы узко, носки слегка врозь. / Опуститесь, сгибая колени до параллели. / Выжмите себя вверх, отталкиваясь пятками.",2],["Narrow_Stance_Leg_Press","Жим ногами с узкой постановкой","Narrow Stance Leg Press","l","onm","machines",2,0,1,"Сядьте в тренажёр, поставьте стопы узко на платформу, носки слегка врозь. / Опустите платформу, сгибая колени. / Выжмите платформу, не выпрямляя колени до конца.",2],["Narrow_Stance_Squats","Приседания со штангой с узкой постановкой ног","Narrow Stance Squats","l","onmd","barbell",2,0,1,"Положите штангу на трапеции и снимите её со стоек. / Поставьте стопы уже плеч и присядьте до параллели. / Встаньте, отталкиваясь пятками.",2],["Natural_Glute_Ham_Raise","Обратные гиперэкстензии без тренажёра (нордические сгибания)","Natural Glute Ham Raise","m","ond","",2,0,1,"Встаньте на колени, зафиксировав лодыжки под валиком, корпус прямой. / Медленно опускайтесь вперёд, контролируя движение бицепсом бедра. / Вернитесь в вертикальное положение, сгибая ноги.",2],["Neck-SMR","МФР шеи","Neck-SMR","g","","other",2,1,0,"Приложите ролик или скалку к шее сбоку от позвоночника. / Прокатывайте мышцы шеи, избегая давления на позвоночник. / Задерживайтесь на напряжённых точках.",2],["Neck_Press","Жим штанги лёжа к шее","Neck Press","a","fi","barbell",2,0,1,"Лягте на скамью и снимите штангу средним хватом над шеей. / На вдохе опустите штангу к шее. / На выдохе выжмите её вверх.",2],["Oblique_Crunches","Косые скручивания","Oblique Crunches","k","","",1,0,0,"Лягте на спину, стопы на возвышении, одна рука за головой. / Поднимите плечо к противоположному колену, скручивая корпус. / Медленно опуститесь и смените сторону.",2],["Oblique_Crunches_-_On_The_Floor","Косые скручивания лёжа на боку","Oblique Crunches - On The Floor","k","","",1,0,0,"Лягте на правый бок, колени слегка согнуты, левая рука за головой. / Поднимите левый локоть к бедру, сокращая косые мышцы. / Медленно опуститесь и повторите.",2],["Olympic_Squat","Олимпийские приседания","Olympic Squat","l","onm","barbell",2,4,1,"Положите штангу на трапеции, грудь поднята, стопы на ширине таза. / Опуститесь, выводя колени вперёд и держа корпус вертикально. / Встаньте, отталкиваясь стопами.",2],["On-Your-Back_Quad_Stretch","Растяжка квадрицепса лёжа на спине","On-Your-Back Quad Stretch","l","","other",1,1,0,"Лягте на скамью, свесив одну ногу и руку с края. / Согните колено и возьмитесь за стопу, не прогибая поясницу. / Тяните стопу вниз, удерживая растяжку.",2],["On_Your_Side_Quad_Stretch","Растяжка квадрицепса лёжа на боку","On Your Side Quad Stretch","l","","",1,1,0,"Лягте на правый бок, правое колено согнуто впереди. / Согните левую ногу назад и возьмитесь за стопу левой рукой. / Подайте левое бедро вперёд, удерживая растяжку.",2],["One-Arm_Dumbbell_Row","Тяга гантели одной рукой в наклоне","One-Arm Dumbbell Row","c","hbf","dumbbells",1,0,1,"Обопритесь коленом и рукой о скамью, спина параллельна полу. / Подтяните гантель к поясу, держа локоть у корпуса. / Медленно опустите гантель.",2],["One-Arm_Flat_Bench_Dumbbell_Flye","Разведение гантели одной рукой лёжа","One-Arm Flat Bench Dumbbell Flye","a","","dumbbells,bench",1,0,0,"Лягте на скамью, держа гантель над грудью нейтральным хватом. / Опустите руку в сторону по дуге, локоть слегка согнут. / Верните гантель над грудью.",2],["One-Arm_High-Pulley_Cable_Side_Bends","Боковые наклоны на верхнем блоке одной рукой","One-Arm High-Pulley Cable Side Bends","k","","cable",1,0,0,"Встаньте боком к верхнему блоку и возьмите рукоять одной рукой. / Подтяните рукоять к плечу, свободная рука на поясе. / Наклоняйтесь в сторону, сокращая косые мышцы, и возвращайтесь.",2],["One-Arm_Incline_Lateral_Raise","Махи одной рукой лёжа боком на наклонной скамье","One-Arm Incline Lateral Raise","f","","dumbbells,bench",1,0,0,"Лягте боком на наклонную скамью, гантель в верхней руке перед собой. / Поднимите руку вверх до вертикали. / Медленно опустите гантель.",2],["One-Arm_Kettlebell_Clean","Подъём гири на грудь одной рукой","One-Arm Kettlebell Clean","m","ndfe","kettlebell",2,0,1,"Поставьте гирю между стоп, отведите таз назад и возьмите гирю. / Мощно разогните ноги и таз, подтягивая гирю к плечу. / Поверните кисть, принимая гирю на плечо, затем опустите.",2],["One-Arm_Kettlebell_Clean_and_Jerk","Толчок гири одной рукой с подъёмом на грудь","One-Arm Kettlebell Clean and Jerk","f","","kettlebell",2,0,1,"Поднимите гирю на плечо, разгибая ноги и таз. / Слегка присядьте и мощным толчком ногами выведите гирю вверх. / Подсядьте под гирю, зафиксируйте и выпрямитесь.",2],["One-Arm_Kettlebell_Floor_Press","Жим гири одной рукой лёжа на полу","One-Arm Kettlebell Floor Press","a","i","kettlebell",2,0,1,"Лягте на пол, держа гирю у груди, плечо на полу. / Выжмите гирю вверх, поворачивая кисть. / Опустите гирю обратно и повторите.",2],["One-Arm_Kettlebell_Jerk","Толчок гири одной рукой","One-Arm Kettlebell Jerk","f","oli","kettlebell",2,0,1,"Поднимите гирю на плечо, ладонь вперёд. / Слегка присядьте и мощным толчком ногами выведите гирю вверх. / Подсядьте под гирю, выпрямитесь и опустите её на плечо.",2],["One-Arm_Kettlebell_Military_Press_To_The_Side","Жим гири одной рукой с наклоном в сторону","One-Arm Kettlebell Military Press To The Side","f","i","kettlebell",2,0,1,"Поднимите гирю на плечо, ладонь внутрь. / Смотрите на гирю и выжимайте её вверх, отклоняя корпус в сторону. / Опустите гирю на плечо.",2],["One-Arm_Kettlebell_Para_Press","Жим гири одной рукой «пара-пресс»","One-Arm Kettlebell Para Press","f","i","kettlebell",2,0,1,"Поднимите гирю на плечо, ладонь вперёд. / Опустите гирю, держа локоть в стороне, до уровня плеча. / Выжмите гирю вверх и повторите.",2],["One-Arm_Kettlebell_Push_Press","Швунг гири одной рукой","One-Arm Kettlebell Push Press","f","oli","kettlebell",2,0,1,"Поднимите гирю на плечо, ладонь вперёд. / Слегка присядьте и толчком ногами помогите выжать гирю вверх. / Зафиксируйте гирю над головой и опустите на плечо.",2],["One-Arm_Kettlebell_Row","Тяга гири одной рукой в наклоне","One-Arm Kettlebell Row","c","hb","kettlebell",2,0,1,"Поставьте гирю перед стопами, наклонитесь, отводя таз назад. / Подтяните гирю к животу, сводя лопатку. / Медленно опустите гирю, держа спину прямой.",2],["One-Arm_Kettlebell_Snatch","Рывок гири одной рукой","One-Arm Kettlebell Snatch","f","onmdei","kettlebell",3,0,1,"Поставьте гирю между стоп и отведите таз назад. / Качните гирю между ног и мощно разогните таз, разгоняя её вверх. / Зафиксируйте гирю над головой на прямой руке.",2],["One-Arm_Kettlebell_Split_Jerk","Толчок гири одной рукой в ножницы","One-Arm Kettlebell Split Jerk","f","nmli","kettlebell",2,0,1,"Поднимите гирю на плечо, ладонь вперёд. / Слегка присядьте и толчком ногами выведите гирю вверх. / Уйдите в ножницы под гирю, затем сведите ноги.",2],["One-Arm_Kettlebell_Split_Snatch","Рывок гири одной рукой в ножницы","One-Arm Kettlebell Split Snatch","f","ml","kettlebell",3,0,1,"Держите гирю одной рукой, присядьте. / Мощно разогните таз, колени и голеностопы, выводя гирю над головой. / Уйдите в выпад под гирю, затем сведите ноги.",2],["One-Arm_Kettlebell_Swings","Махи гирей одной рукой","One-Arm Kettlebell Swings","m","ondf","kettlebell",2,0,1,"Встаньте ноги шире плеч, возьмите гирю одной рукой между ног. / Мощным движением таза вперёд выведите гирю до уровня груди. / Опустите гирю обратно между ног и повторите, затем смените руку.",2],["One-Arm_Long_Bar_Row","Тяга Т-грифа одной рукой","One-Arm Long Bar Row","c","hb","barbell",1,0,1,"Закрепите конец грифа в углу или станке, встаньте сбоку и возьмите гриф одной рукой у края. / Наклонитесь вперёд с прямой спиной, слегка согнув колени. / Подтяните гриф к поясу, сведя лопатку, и медленно опустите.",2],["One-Arm_Medicine_Ball_Slam","Бросок медбола одной рукой","One-Arm Medicine Ball Slam","k","bf","medball",1,0,1,"Встаньте в разножку, держа медбол в руке со стороны отставленной ноги. / Поднимите мяч над головой, вытягиваясь на носках. / С силой бросьте мяч в пол перед собой, поймайте и повторите.",2],["One-Arm_Open_Palm_Kettlebell_Clean","Взятие гири на открытую ладонь одной рукой","One-Arm Open Palm Kettlebell Clean","m","jndlf","kettlebell",2,0,1,"Поставьте гирю между стоп и возьмите её за рукоять одной рукой. / Резко поднимите гирю, позволив ей перевернуться так, чтобы шар лёг на ладонь. / Подбросьте гирю, поймайте за рукоять и опустите на пол.",2],["One-Arm_Overhead_Kettlebell_Squats","Приседания с гирей над головой одной рукой","One-Arm Overhead Kettlebell Squats","l","onmf","kettlebell",3,0,1,"Возьмите гирю на грудь и выжмите её над головой одной рукой. / Удерживая руку прямой, присядьте как можно ниже с прямой спиной. / Встаньте, отталкиваясь пятками, сохраняя гирю над головой.",2],["One-Arm_Side_Deadlift","Боковая становая тяга одной рукой","One-Arm Side Deadlift","l","konmde","barbell",3,0,1,"Встаньте сбоку от штанги у её середины. / Присядьте и возьмите гриф одной рукой, как чемодан. / Встаньте, выпрямив ноги и корпус, затем опустите штангу на пол.",2],["One-Arm_Side_Laterals","Отведение гантели в сторону одной рукой","One-Arm Side Laterals","f","","dumbbells",1,0,0,"Возьмите гантель в одну руку, другой держитесь за опору и слегка наклонитесь от неё. / Поднимите гантель через сторону до уровня плеча, локоть слегка согнут. / Медленно опустите и повторите, затем смените руку.",2],["One-Legged_Cable_Kickback","Отведение ноги назад в кроссовере","One-Legged Cable Kickback","n","m","cable",2,0,0,"Наденьте манжету на лодыжку и закрепите её к нижнему блоку, встаньте лицом к тренажёру. / Напрягите ягодицу и отведите рабочую ногу назад. / Медленно верните ногу в исходное положение.",2],["One_Arm_Against_Wall","Растяжка широчайших у стены одной рукой","One Arm Against Wall","b","","",1,1,0,"Встаньте у стены и упритесь в неё согнутой рукой. / Медленно наклоняйтесь к руке, пока не почувствуете растяжение широчайшей. / Удерживайте положение 10–20 секунд и смените сторону.",2],["One_Arm_Chin-Up","Подтягивания на одной руке","One Arm Chin-Up","c","hjb","pullup",3,0,1,"Перекиньте полотенце через перекладину, одной рукой возьмитесь за перекладину обратным хватом, другой за полотенце. / Подтянитесь, пока подбородок не окажется над перекладиной. / Медленно опуститесь до полного выпрямления руки.",2],["One_Arm_Dumbbell_Bench_Press","Жим гантели лёжа одной рукой","One Arm Dumbbell Bench Press","a","fi","dumbbells,bench",1,0,1,"Лягте на горизонтальную скамью с гантелью в одной руке у плеча. / Выжмите гантель вверх до выпрямления руки на выдохе. / Медленно опустите гантель к груди на вдохе.",2],["One_Arm_Dumbbell_Preacher_Curl","Сгибание руки с гантелью на скамье Скотта","One Arm Dumbbell Preacher Curl","h","","dumbbells",1,0,0,"Возьмите гантель одной рукой и положите плечо на подставку скамьи Скотта. / На вдохе медленно опустите гантель до полного выпрямления руки. / На выдохе согните руку, напрягая бицепс.",2],["One_Arm_Floor_Press","Жим с пола одной рукой","One Arm Floor Press","i","af","barbell",2,0,1,"Лягте на пол, согнув колени, и возьмите штангу или гантель одной рукой над грудью. / Опустите вес, пока локоть не коснётся пола. / Выжмите вес вверх до выпрямления руки.",2],["One_Arm_Lat_Pulldown","Тяга верхнего блока одной рукой","One Arm Lat Pulldown","b","hc","cable",1,0,1,"Сядьте в тренажёр, зафиксируйте колени под валиками и возьмите рукоять одной рукой. / Потяните рукоять вниз, прижимая локоть к боку. / Сделайте паузу внизу и медленно верните рукоять вверх.",2],["One_Arm_Pronated_Dumbbell_Triceps_Extension","Разгибание руки с гантелью лёжа прямым хватом","One Arm Pronated Dumbbell Triceps Extension","i","","dumbbells",1,0,0,"Лягте на скамью, держа гантель на прямой руке, ладонь смотрит к ногам. / Медленно опустите гантель, сгибая руку в локте. / Разогните руку трицепсом в исходное положение.",2],["One_Arm_Supinated_Dumbbell_Triceps_Extension","Разгибание руки с гантелью лёжа обратным хватом","One Arm Supinated Dumbbell Triceps Extension","i","","dumbbells",1,0,0,"Лягте на скамью, держа гантель на прямой руке, ладонь смотрит к лицу. / Медленно опустите гантель к плечу, сгибая локоть. / Разогните руку трицепсом в исходное положение.",2],["One_Half_Locust","Поза полусаранчи","One Half Locust","l","kha","",1,1,0,"Лягте на живот, левую руку подложите под левое бедро. / Согните правое колено и возьмитесь правой рукой за стопу. / Поднимите стопу и плечи от пола, удерживайте позу и смените сторону.",2],["One_Handed_Hang","Вис на одной руке","One Handed Hang","b","h","other",1,1,0,"Возьмитесь за перекладину одной рукой прямым хватом, ноги касаются пола. / Перенесите большую часть веса на руку. / Удерживайте 10–20 секунд и смените руку.",2],["One_Knee_To_Chest","Подтягивание колена к груди лёжа","One Knee To Chest","n","md","",1,1,1,"Лягте на спину, одну ногу вытяните прямо. / Обхватите другое колено снизу и подтяните его к груди. / Удерживайте растяжку и смените ногу.",2],["One_Leg_Barbell_Squat","Приседания на одной ноге со штангой","One Leg Barbell Squat","l","onm","barbell",3,0,1,"Встаньте спиной к скамье на расстоянии шага, штанга на плечах. / Поставьте носок задней ноги на скамью. / Присядьте на передней ноге до параллели и встаньте, отталкиваясь пяткой.",2],["Open_Palm_Kettlebell_Clean","Взятие гири на открытые ладони","Open Palm Kettlebell Clean","m","ndlf","kettlebell",3,0,1,"Поставьте гирю между стоп и возьмите её двумя руками. / Мощным разгибанием ног и таза поднимите гирю к плечам. / Отпустите рукоять, чтобы шар гири лёг на ладони, затем опустите гирю на пол.",2],["Otis-Up","Подъём корпуса с жимом веса","Otis-Up","k","afi","other",1,0,1,"Лягте на спину, зафиксируйте стопы, согните колени и держите вес у груди. / Поднимите корпус от пола, одновременно выжимая вес над головой. / Медленно опуститесь в исходное положение.",2],["Overhead_Cable_Curl","Сгибание рук в кроссовере сверху","Overhead Cable Curl","h","","cable",2,0,0,"Установите верхние блоки выше плеч и возьмите рукояти, встав между стойками. / Руки разведены в стороны на уровне плеч, согните их, подводя рукояти к голове. / Медленно разогните руки в исходное положение.",2],["Overhead_Lat","Растяжка широчайших над головой с партнёром","Overhead Lat","b","i","other",3,1,0,"Сядьте на пол, поднимите руку вверх и согните её за спиной, партнёр держит трицепс и запястье. / Попытайтесь опустить плечо вниз, пока партнёр сопротивляется. / Расслабьтесь, и партнёр мягко усилит растяжку.",2],["Overhead_Slam","Бросок медбола из-за головы в пол","Overhead Slam","b","","medball",1,2,1,"Встаньте ноги на ширине плеч, держа медбол двумя руками. / Поднимите мяч над головой, полностью вытянувшись. / С силой бросьте мяч в пол перед собой, поймайте и повторите.",2],["Overhead_Squat","Приседания со штангой над головой","Overhead Squat","l","konmdfi","barbell",3,4,1,"Возьмите штангу широким хватом и зафиксируйте её над головой на прямых руках. / Присядьте как можно ниже, удерживая гриф над стопами и спину прямой. / Встаньте, отталкиваясь пятками.",2],["Overhead_Stretch","Растяжка корпуса с руками над головой","Overhead Stretch","k","ajbi","",1,1,1,"Встаньте прямо, сцепите пальцы в замок ладонями вверх. / Вытяните руки вверх, опустив плечи. / Подкрутите таз и удерживайте растяжку всего корпуса.",2],["Overhead_Triceps","Растяжка трицепса над головой с партнёром","Overhead Triceps","i","b","",3,1,0,"Сядьте на пол, поднимите руку и согните её за спиной, партнёр держит локоть и запястье. / Попытайтесь разогнуть руку вверх, пока партнёр сопротивляется. / Расслабьтесь, и партнёр мягко усилит растяжку.",2],["Pallof_Press","Жим Паллофа","Pallof Press","k","afi","cable",1,0,0,"Установите блок на уровне плеч, встаньте боком и возьмите рукоять двумя руками у груди. / Выжмите рукоять вперёд, не позволяя корпусу разворачиваться. / Задержитесь и верните рукоять к груди.",2],["Pallof_Press_With_Rotation","Жим Паллофа с поворотом","Pallof Press With Rotation","k","afi","cable",1,0,1,"Встаньте боком к блоку на уровне плеч, держа рукоять на вытянутых руках. / Разверните корпус от блока, удерживая руки прямыми. / Медленно вернитесь в исходное положение.",2],["Palms-Down_Dumbbell_Wrist_Curl_Over_A_Bench","Сгибание запястий с гантелями хватом сверху на скамье","Palms-Down Dumbbell Wrist Curl Over A Bench","j","","dumbbells,bench",1,0,0,"Встаньте на колени перед скамьёй и положите предплечья на неё, держа гантели ладонями вниз. / Опустите кисти вниз. / Поднимите кисти как можно выше, сгибая запястья.",2],["Palms-Down_Wrist_Curl_Over_A_Bench","Сгибание запястий со штангой хватом сверху на скамье","Palms-Down Wrist Curl Over A Bench","j","","barbell,bench",1,0,0,"Встаньте на колени перед скамьёй и положите предплечья на неё, держа штангу ладонями вниз. / Опустите кисти вниз. / Поднимите кисти как можно выше, сгибая запястья.",2],["Palms-Up_Barbell_Wrist_Curl_Over_A_Bench","Сгибание запястий со штангой хватом снизу на скамье","Palms-Up Barbell Wrist Curl Over A Bench","j","","barbell,bench",1,0,0,"Встаньте на колени перед скамьёй и положите предплечья на неё, держа штангу ладонями вверх. / Опустите кисти, позволяя грифу скатиться к пальцам. / Согните запястья, поднимая штангу как можно выше.",2],["Palms-Up_Dumbbell_Wrist_Curl_Over_A_Bench","Сгибание запястий с гантелями хватом снизу на скамье","Palms-Up Dumbbell Wrist Curl Over A Bench","j","","dumbbells,bench",1,0,0,"Встаньте на колени перед скамьёй и положите предплечья на неё, держа гантели ладонями вверх. / Опустите кисти вниз. / Согните запястья, поднимая гантели как можно выше.",2],["Parallel_Bar_Dip","Отжимания на брусьях","Parallel Bar Dip","i","af","dips",1,0,1,"Возьмитесь за брусья и поднимитесь на прямых руках. / Согните локти и опуститесь, пока плечи не окажутся ниже локтей. / Выжмите себя вверх до выпрямления рук.",2],["Pelvic_Tilt_Into_Bridge","Наклон таза с переходом в мост","Pelvic Tilt Into Bridge","d","","",2,1,1,"Лягте на спину, стопы на полу, пятки под коленями. / Приподнимите только копчик, втягивая живот. / Поднимите всю спину, кроме шеи, в положение моста и медленно опуститесь.",2],["Peroneals-SMR","Самомассаж малоберцовых мышц на ролле","Peroneals-SMR","o","","roller",2,1,0,"Лягте на бок, опираясь на предплечье, ролл под внешней стороной голени. / Приподнимите таз и прокатывайте голень от колена к лодыжке. / Задерживайтесь на болезненных точках 10–30 секунд.",2],["Peroneals_Stretch","Растяжка малоберцовых мышц","Peroneals Stretch","o","","other",2,1,0,"Сядьте и накиньте ремень или ленту на одну стопу. / Вытяните ногу и потяните ремень так, чтобы стопа развернулась внутрь. / Удерживайте 10–20 секунд и смените ногу.",2],["Physioball_Hip_Bridge","Ягодичный мост на фитболе","Physioball Hip Bridge","n","m","fitball",1,0,1,"Лягте верхней частью спины на фитбол, стопы на полу на ширине бёдер. / Поднимите таз, напрягая ягодицы и бицепс бедра. / Задержитесь вверху и медленно опустите таз.",2],["Pin_Presses","Жим штанги лёжа с упоров","Pin Presses","i","ajbcf","barbell",2,3,1,"Установите скамью в силовую раму и выставьте упоры на нужной высоте, штанга лежит на них. / Лягте под гриф и возьмите его хватом чуть шире плеч. / Мощно выжмите штангу вверх с упоров и опустите обратно.",2],["Piriformis-SMR","Самомассаж грушевидной мышцы на ролле","Piriformis-SMR","n","","roller",2,1,0,"Сядьте ягодицами на ролл и положите лодыжку одной ноги на колено другой. / Перенесите вес на сторону скрещённой ноги. / Прокатывайте ягодицу, задерживаясь на болезненных точках.",2],["Plank","Планка","Plank","k","","",1,0,0,"Примите упор лёжа на предплечьях и носках, локти под плечами. / Держите тело прямой линией, напрягая пресс и ягодицы. / Удерживайте положение как можно дольше.",2],["Plate_Pinch","Удержание блинов щипковым хватом","Plate Pinch","j","","other",2,0,0,"Сложите два блина гладкими сторонами наружу. / Возьмите их щипком: пальцы с одной стороны, большой палец с другой. / Удерживайте блины как можно дольше.",2],["Plate_Twist","Скручивания с блином сидя","Plate Twist","k","","other",2,0,1,"Сядьте на пол, держа блин перед собой, и поднимите скрещённые ноги от пола. / Поверните корпус вправо, опуская блин к полу. / Поверните корпус влево и продолжайте чередовать.",2],["Platform_Hamstring_Slides","Сгибание ног со скольжением пяток","Platform Hamstring Slides","m","n","other",1,0,0,"Лягте на спину на гладком полу, положив полотенце под пятку. / Согните колено, подтягивая пятку к ягодицам. / Медленно выпрямите ногу обратно.",2],["Plie_Dumbbell_Squat","Плие-приседания с гантелью","Plie Dumbbell Squat","l","konm","dumbbells",1,0,1,"Встаньте ноги широко, носки развернуты наружу, держите гантель двумя руками перед собой. / Присядьте, разводя колени в стороны, пока бёдра не станут параллельны полу. / Встаньте, отталкиваясь пятками и напрягая ягодицы.",2],["Plyo_Kettlebell_Pushups","Плиометрические отжимания с гирей","Plyo Kettlebell Pushups","a","fi","kettlebell",3,0,1,"Примите упор лёжа, одна рука на полу, другая на рукояти гири. / Опуститесь как можно ниже и резко оттолкнитесь вверх. / В полёте перенесите вторую руку на гирю, а первую на пол, и повторите.",2],["Plyo_Push-up","Плиометрические отжимания","Plyo Push-up","a","fi","",1,2,1,"Примите упор лёжа, руки на ширине плеч. / Опустите грудь к полу, сгибая локти. / Взрывно оттолкнитесь так, чтобы руки оторвались от пола, и мягко приземлитесь.",2],["Posterior_Tibialis_Stretch","Растяжка задней большеберцовой мышцы","Posterior Tibialis Stretch","o","","other",2,1,0,"Сядьте и накиньте ремень или ленту на одну стопу. / Вытяните ногу и потяните ремень так, чтобы стопа развернулась наружу. / Удерживайте 10–20 секунд и смените ногу.",2],["Power_Clean","Взятие штанги на грудь в стойку","Power Clean","m","ojndclfei","barbell",2,0,1,"Встаньте ноги чуть шире плеч, присядьте и возьмите гриф прямым хватом. / Мощно разогните ноги и таз, подтягивая штангу вверх вдоль тела. / Подсядьте под гриф и примите штангу на грудь, затем встаньте.",2],["Power_Clean_from_Blocks","Взятие штанги на грудь с плинтов","Power Clean from Blocks","m","l","barbell",2,4,1,"Поставьте штангу на плинты нужной высоты и возьмите гриф хватом чуть шире бёдер. / Мощно разогните ноги и таз, подтягивая штангу вверх. / Подсядьте и примите штангу на грудь, затем выпрямитесь.",2],["Power_Jerk","Толчок штанги в стойку","Power Jerk","l","konmfi","barbell",3,4,1,"Встаньте со штангой на груди, стопы под тазом. / Слегка подсядьте и мощно вытолкните штангу вверх ногами. / Подсядьте под гриф, примите его на прямые руки и выпрямитесь.",2],["Power_Partials","Частичные подъёмы гантелей","Power Partials","f","","dumbbells",1,0,0,"Встаньте прямо, держа гантели в опущенных руках ладонями к корпусу. / Не сгибая рук, поднимите гантели вперёд до уровня плеч. / Медленно опустите в исходное положение.",2],["Power_Snatch","Рывок штанги в стойку","Power Snatch","m","ondlfei","barbell",3,4,1,"Встаньте у штанги, возьмите гриф широким хватом, опустите таз, грудь вперёд. / Мощно разогните ноги и таз, выводя штангу вверх вдоль тела. / Подсядьте под гриф, примите его на прямые руки над головой и выпрямитесь.",2],["Power_Snatch_from_Blocks","Рывок штанги в стойку с плинтов","Power Snatch from Blocks","l","ojnmdfei","barbell",2,4,1,"Поставьте штангу на плинты и возьмите гриф широким хватом. / Мощно разогните ноги и таз, выводя штангу вверх. / Подсядьте под гриф, примите его на прямые руки над головой и выпрямитесь.",2],["Power_Stairs","Силовая лестница","Power Stairs","m","pondlfe","other",2,5,1,"Возьмите снаряд двумя руками, поставьте стопы широко, грудь вперёд. / Мощно разогните ноги и таз, поднимая снаряд на следующую ступень. / Поднимитесь следом и повторите до конца лестницы.",2],["Preacher_Curl","Сгибание рук со штангой на скамье Скотта","Preacher Curl","h","","barbell",1,0,0,"Сядьте за скамью Скотта, положите плечи на подставку и возьмите EZ-гриф узким хватом. / На выдохе согните руки, поднимая гриф к плечам. / На вдохе медленно опустите гриф до выпрямления рук.",2],["Preacher_Hammer_Dumbbell_Curl","Молотковые сгибания с гантелями на скамье Скотта","Preacher Hammer Dumbbell Curl","h","j","dumbbells",1,0,0,"Положите плечи на подставку скамьи Скотта, держа гантели нейтральным хватом. / На вдохе опустите гантели до выпрямления рук. / На выдохе согните руки, поднимая гантели к плечам.",2],["Press_Sit-Up","Подъём корпуса с жимом штанги","Press Sit-Up","k","afi","barbell",3,0,1,"Лягте на скамью для пресса, зафиксируйте ноги, штанга на груди. / Поднимайте корпус и одновременно выжмите штангу вверх. / Медленно опуститесь, возвращая штангу к груди.",2],["Prone_Manual_Hamstring","Сгибание ног лёжа с сопротивлением партнёра","Prone Manual Hamstring","m","","",1,0,0,"Лягте на живот с прямыми ногами, партнёр кладёт руку на вашу пятку. / Согните колено, преодолевая сопротивление партнёра. / Медленно выпрямите ногу, пока партнёр давит на пятку.",2],["Prowler_Sprint","Спринт с санями","Prowler Sprint","m","oanlf","other",1,6,1,"Загрузите сани подходящим весом и возьмитесь за рукояти на прямых руках. / Наклонитесь вперёд и начните толкать сани, мощно работая ногами. / Бегите с максимальной скоростью на заданную дистанцию.",2],["Pull_Through","Протяжка троса между ног","Pull Through","n","md","cable",1,0,1,"Встаньте спиной к нижнему блоку, широко расставив ноги, и возьмите канат между ног. / Наклонитесь в тазобедренном суставе, отводя таз назад. / Выпрямитесь, напрягая ягодицы и выводя таз вперёд.",2],["Pullups","Подтягивания","Pullups","b","hc","pullup",1,0,1,"Возьмитесь за перекладину прямым хватом нужной ширины. / Подтянитесь на выдохе, пока подбородок не окажется над перекладиной. / Медленно опуститесь на вдохе до выпрямления рук.",2],["Push-Up_Wide","Отжимания с широкой постановкой рук","Push-Up Wide","a","kfi","",1,0,1,"Примите упор лёжа, руки шире плеч, тело прямое. / На вдохе опустите грудь к полу, сгибая локти. / На выдохе выжмите себя вверх, напрягая грудные.",2],["Push-Ups_-_Close_Triceps_Position","Отжимания узким хватом на трицепс","Push-Ups - Close Triceps Position","i","af","",2,0,1,"Примите упор лёжа, руки уже ширины плеч. / На вдохе опуститесь, пока грудь почти не коснётся пола, локти вдоль корпуса. / На выдохе выжмите себя вверх трицепсами.",2],["Push-Ups_With_Feet_Elevated","Отжимания с ногами на возвышении","Push-Ups With Feet Elevated","a","fi","",1,0,1,"Примите упор лёжа, поставив носки на скамью. / На вдохе опустите грудь почти до пола. / На выдохе выжмите себя вверх.",2],["Push-Ups_With_Feet_On_An_Exercise_Ball","Отжимания с ногами на фитболе","Push-Ups With Feet On An Exercise Ball","a","fi","fitball",2,0,1,"Примите упор лёжа, поставив носки на фитбол. / На вдохе опустите грудь почти до пола, удерживая равновесие. / На выдохе выжмите себя вверх.",2],["Push_Press","Швунг жимовой","Push Press","f","li","barbell",3,4,1,"Встаньте со штангой на груди, стопы на ширине таза. / Слегка подсядьте и мощным разгибанием ног вытолкните штангу вверх. / Дожмите штангу руками до полного выпрямления и опустите на грудь.",2],["Push_Press_-_Behind_the_Neck","Швунг жимовой из-за головы","Push Press - Behind the Neck","f","oli","barbell",2,4,1,"Встаньте со штангой на плечах за головой. / Слегка подсядьте и мощным разгибанием ног вытолкните штангу вверх. / Дожмите штангу руками до выпрямления и опустите на плечи.",2],["Push_Up_to_Side_Plank","Отжимание с переходом в боковую планку","Push Up to Side Plank","a","kfi","",1,0,1,"Примите упор лёжа, руки чуть шире плеч. / Выполните отжимание. / Поднимаясь, развернитесь на бок и поднимите руку вверх, затем вернитесь и повторите в другую сторону.",2],["Pushups","Отжимания от пола","Pushups","a","fi","",1,0,1,"Примите упор лёжа, руки чуть шире плеч, тело прямое. / На вдохе опуститесь, пока грудь почти не коснётся пола. / На выдохе выжмите себя вверх, напрягая грудные.",2],["Pushups_Close_and_Wide_Hand_Positions","Отжимания с узкой и широкой постановкой рук","Pushups (Close and Wide Hand Positions)","a","fi","",1,0,1,"Примите упор лёжа, руки шире или уже плеч в зависимости от варианта. / На вдохе опуститесь, пока грудь почти не коснётся пола. / На выдохе выжмите себя вверх.",2],["Pyramid","Поза пирамиды на фитболе","Pyramid","d","f","fitball",1,1,0,"Лягте животом на фитбол так, чтобы таз оказался в самой высокой точке. / Упритесь руками и стопами в пол. / Расслабьтесь и удерживайте растяжку спины.",2],["Quad_Stretch","Растяжка квадрицепса лёжа на боку","Quad Stretch","l","","other",2,1,0,"Лягте на бок и накиньте ремень на верхнюю стопу. / Согните колено, подтягивая пятку к ягодицам. / Мягко потяните ремень для усиления растяжки и удерживайте 10–20 секунд.",2],["Quadriceps-SMR","Самомассаж квадрицепса на ролле","Quadriceps-SMR","l","","roller",2,1,0,"Лягте лицом вниз, опираясь на руки, ролл под передней поверхностью бедра. / Перенесите вес на ногу и прокатывайте бедро от таза к колену. / Задерживайтесь на болезненных точках 10–30 секунд.",2],["Quick_Leap","Быстрое запрыгивание на тумбу","Quick Leap","l","om","other",1,2,1,"Встаньте лицом к тумбе на расстоянии 30–60 см. / Запрыгните на тумбу на обе ноги, мягко приземлившись. / Сразу выпрыгните вверх, вытягиваясь всем телом, и спрыгните обратно.",2],["Rack_Delivery","Подводка штанги в положение на грудь","Rack Delivery","f","je","barbell",2,4,1,"Держите гриф хватом-замком, плечи параллельны полу, предплечья свисают вниз. / Быстро проверните локти вокруг грифа вперёд. / Примите штангу на дельты, локти направлены вперёд.",2],["Rack_Pull_with_Bands","Тяга с плинтов с резиновыми лентами","Rack Pull with Bands","d","jnmle","barbell",2,3,1,"Установите штангу на упоры силовой рамы и закрепите ленты к основанию и грифу. / Примите позицию для становой тяги и возьмите гриф. / Выпрямитесь, преодолевая сопротивление лент, и опустите штангу на упоры.",2],["Rack_Pulls","Тяга с плинтов","Rack Pulls","d","jnme","barbell",2,3,1,"Установите штангу на упоры силовой рамы на уровне колен. / Примите позицию для становой тяги, спина прогнута. / Выпрямитесь, выводя таз вперёд, и опустите штангу на упоры.",2],["Rear_Leg_Raises","Отведение ноги назад на четвереньках","Rear Leg Raises","l","","",1,1,0,"Встаньте на четвереньки, колени согнуты под прямым углом. / Выпрямите одну ногу назад и вверх. / Вернитесь в исходное положение и смените ногу.",2],["Recumbent_Bike","Горизонтальный велотренажёр","Recumbent Bike","l","onm","machines",1,6,0,"Сядьте на тренажёр и отрегулируйте сиденье по росту. / Выберите программу или ручной режим. / Крутите педали в выбранном темпе нужное время.",2],["Return_Push_from_Stance","Приём и возврат паса из стойки","Return Push from Stance","f","ai","medball",1,2,1,"Встаньте в атлетическую стойку на 2 или 3 точках опоры. / По сигналу займите позицию и поймайте медбол от партнёра. / Сразу верните мяч партнёру двумя руками.",2],["Reverse_Band_Bench_Press","Жим штанги лёжа с обратными лентами","Reverse Band Bench Press","i","ajbcf","barbell,bench",2,3,1,"Установите скамью в силовую раму и закрепите ленты к верху рамы и грифу. / Лягте на скамью, снимите штангу и опустите её к груди. / Выжмите штангу вверх до выпрямления рук.",2],["Reverse_Band_Box_Squat","Приседания на ящик с обратными лентами","Reverse Band Box Squat","l","qpojnmd","barbell",2,3,1,"Закрепите ленты к верху силовой рамы и грифу, позади поставьте ящик. / Сядьте на ящик со штангой на плечах. / Встаньте, отталкиваясь пятками.",2],["Reverse_Band_Deadlift","Становая тяга с обратными лентами","Reverse Band Deadlift","d","qponml","barbell",3,3,1,"Закрепите ленты к верху силовой рамы и грифу. / Встаньте у штанги, стопы на ширине таза, возьмите гриф хватом на ширине плеч. / Выпрямитесь с прямой спиной и опустите штангу.",2],["Reverse_Band_Power_Squat","Приседания со штангой с обратными лентами","Reverse Band Power Squat","l","ponmd","barbell",3,3,1,"Закрепите ленты к верху силовой рамы и грифу. / Снимите штангу на плечи и присядьте до параллели. / Встаньте, отталкиваясь пятками.",2],["Reverse_Band_Sumo_Deadlift","Становая тяга сумо с обратными лентами","Reverse Band Sumo Deadlift","m","qpojndle","barbell",3,3,1,"Закрепите ленты к верху силовой рамы и грифу. / Встаньте очень широко, носки врозь, возьмите гриф узким хватом. / Выпрямитесь, выводя таз вперёд, и опустите штангу.",2],["Reverse_Barbell_Curl","Сгибание рук со штангой обратным хватом","Reverse Barbell Curl","h","j","barbell",1,0,0,"Встаньте прямо, держа штангу хватом сверху на ширине плеч. / Не двигая плечами, согните руки, поднимая штангу к плечам. / Медленно опустите штангу.",2],["Reverse_Barbell_Preacher_Curls","Сгибание рук обратным хватом на скамье Скотта","Reverse Barbell Preacher Curls","h","j","barbell",2,0,0,"Возьмите EZ-гриф хватом сверху и положите плечи на подставку скамьи Скотта. / На выдохе согните руки, поднимая гриф к плечам. / На вдохе медленно опустите гриф.",2],["Reverse_Cable_Curl","Сгибание рук на нижнем блоке обратным хватом","Reverse Cable Curl","h","j","cable",1,0,0,"Встаньте лицом к нижнему блоку и возьмите прямую рукоять хватом сверху на ширине плеч. / Не двигая плечами, согните руки. / Медленно разогните руки в исходное положение.",2],["Reverse_Crunch","Обратные скручивания","Reverse Crunch","k","","",1,0,0,"Лягте на спину, руки вдоль тела, поднимите ноги так, чтобы бёдра были вертикальны. / На выдохе подтяните колени к груди, отрывая таз от пола. / На вдохе медленно опустите таз.",2],["Reverse_Flyes","Обратные разведения гантелей лёжа на наклонной скамье","Reverse Flyes","f","","dumbbells",1,0,0,"Лягте грудью на наклонную скамью, держа гантели нейтральным хватом. / Разведите руки в стороны до уровня плеч, сводя лопатки. / Медленно опустите гантели.",2],["Reverse_Flyes_With_External_Rotation","Обратные разведения с наружной ротацией","Reverse Flyes With External Rotation","f","","dumbbells",2,0,0,"Лягте грудью на скамью с наклоном 30 градусов, гантели в руках ладонями вниз. / Разведите руки в стороны, развернув их наружу. / Медленно вернитесь в исходное положение.",2],["Reverse_Grip_Bent-Over_Rows","Тяга штанги в наклоне обратным хватом","Reverse Grip Bent-Over Rows","c","hbf","barbell",2,0,1,"Возьмите штангу хватом снизу и наклонитесь почти параллельно полу с прямой спиной. / На выдохе подтяните штангу к поясу, сводя лопатки. / На вдохе медленно опустите штангу.",2],["Reverse_Grip_Triceps_Pushdown","Разгибание рук на верхнем блоке обратным хватом","Reverse Grip Triceps Pushdown","i","","cable",1,0,0,"Встаньте лицом к верхнему блоку и возьмите прямую рукоять хватом снизу на ширине плеч. / Прижав локти к корпусу, разогните руки вниз. / Медленно верните рукоять вверх.",2],["Reverse_Hyperextension","Обратная гиперэкстензия","Reverse Hyperextension","m","on","machines",2,0,0,"Лягте животом на тренажёр так, чтобы таз свисал, и зафиксируйте стопы между валиками. / Опустите ноги вниз, сгибая таз. / Поднимите ноги назад, напрягая ягодицы.",2],["Reverse_Machine_Flyes","Обратные разведения в тренажёре","Reverse Machine Flyes","f","","machines",1,0,0,"Отрегулируйте рукояти назад, а сиденье так, чтобы рукояти были на уровне плеч. / Возьмитесь за рукояти и разведите руки в стороны по дуге. / Медленно верните руки в исходное положение.",2],["Reverse_Plate_Curls","Сгибание рук с блином обратным хватом","Reverse Plate Curls","h","j","other",1,0,0,"Встаньте прямо, держа блин двумя руками хватом сверху на прямых руках. / Не двигая плечами, согните руки, поднимая блин к плечам. / Медленно опустите блин.",2],["Reverse_Triceps_Bench_Press","Жим штанги лёжа обратным узким хватом","Reverse Triceps Bench Press","i","af","barbell,bench",2,0,1,"Лягте на скамью и возьмите штангу хватом снизу на ширине плеч. / На вдохе медленно опустите штангу к нижней части груди. / На выдохе выжмите штангу трицепсами вверх.",2],["Rhomboids-SMR","Самомассаж ромбовидных мышц на ролле","Rhomboids-SMR","c","e","roller",2,1,0,"Лягте спиной на ролл под верхней частью спины, скрестив руки на груди. / Поднимите таз и перенесите вес на ролл, смещаясь на одну сторону. / Прокатывайте зону между лопатками, задерживаясь на болезненных точках.",2],["Rickshaw_Carry","Переноска рикши","Rickshaw Carry","j","konmdle","other",2,5,1,"Встаньте в центр рамы и возьмитесь за рукояти. / Поднимите раму, отталкиваясь пятками, грудь вперёд, спина прямая. / Быстро идите короткими шагами на заданную дистанцию.",2],["Rickshaw_Deadlift","Становая тяга рикши","Rickshaw Deadlift","l","jnmde","other",2,5,1,"Встаньте в центр рамы, стопы на ширине таза. / Наклонитесь и возьмитесь за рукояти, опустите таз, спина прямая. / Выпрямитесь, отталкиваясь пятками, и опустите раму.",2],["Ring_Dips","Отжимания на кольцах","Ring Dips","i","af","dips",2,0,1,"Возьмитесь за кольца и поднимитесь на прямых руках. / Согните локти и опуститесь, пока плечи не окажутся ниже локтей. / Выжмите себя вверх до выпрямления рук.",2],["Rocket_Jump","Ракетный прыжок","Rocket Jump","l","om","",1,2,1,"Встаньте ноги на ширине плеч, руки вдоль тела. / Присядьте наполовину и взрывно выпрыгните вверх, вытягивая руки над головой. / Мягко приземлитесь, амортизируя ногами.",2],["Rocking_Standing_Calf_Raise","Подъём на носки стоя с перекатом","Rocking Standing Calf Raise","o","","barbell",1,0,0,"Встаньте в силовую раму со штангой на плечах. / Поднимитесь на носки как можно выше. / Опуститесь и перекатитесь на пятки, поднимая носки.",2],["Rocky_Pull-Ups_Pulldowns","Подтягивания Рокки","Rocky Pull-Ups/Pulldowns","b","hcf","pullup",2,0,1,"Возьмитесь за перекладину широким хватом. / Подтянитесь к груди, затем опуститесь. / Следующее повторение выполните за голову и продолжайте чередовать.",2],["Romanian_Deadlift","Румынская становая тяга","Romanian Deadlift","m","ond","barbell",2,0,1,"Встаньте прямо, держа штангу хватом сверху чуть шире плеч. / Слегка согните колени и наклонитесь, отводя таз назад, гриф скользит вдоль ног. / Выпрямитесь, напрягая ягодицы и бицепс бедра.",2],["Romanian_Deadlift_from_Deficit","Румынская тяга с дефицитом","Romanian Deadlift from Deficit","m","jnde","barbell",2,4,1,"Встаньте на возвышение, держа штангу в опущенных руках. / Слегка согните колени и наклонитесь, отводя таз назад как можно дальше. / Выпрямитесь, выводя таз вперёд.",2],["Rope_Climb","Лазание по канату","Rope Climb","b","hjcf","other",2,0,1,"Возьмитесь за канат обеими руками над головой. / Обвейте канат ногой и зажмите его стопами. / Перехватывайтесь руками вверх, отпуская и снова зажимая канат ногами.",2],["Rope_Crunch","Скручивания на верхнем блоке с канатом","Rope Crunch","k","","cable",1,0,0,"Встаньте на колени перед блоком и возьмите канат обеими руками у головы. / На выдохе скрутите корпус, опуская локти к бёдрам. / Медленно вернитесь в исходное положение.",2],["Rope_Jumping","Прыжки на скакалке","Rope Jumping","l","om","other",2,6,0,"Возьмите скакалку за ручки, положив её за пятками. / Вращайте скакалку над головой. / Перепрыгивайте её, когда она касается пола, держа ровный темп.",2],["Rope_Straight-Arm_Pulldown","Пулловер на верхнем блоке с канатом","Rope Straight-Arm Pulldown","b","","cable",1,0,0,"Закрепите канат на верхнем блоке, встаньте в шаге от него и возьмите канат на прямых руках. / Наклонитесь вперёд с прямой спиной. / Прямыми руками опустите канат к бёдрам и медленно верните вверх.",2],["Round_The_World_Shoulder_Stretch","Растяжка плеч с палкой «вокруг света»","Round The World Shoulder Stretch","f","ha","other",1,1,0,"Встаньте прямо, держа палку за бёдрами широким хватом сверху. / Медленно поднимайте руки вверх за спиной. / Не форсируйте движение и удерживайте растяжку.",2],["Rowing_Stationary","Гребной тренажёр","Rowing, Stationary","l","honmdc","machines",2,6,0,"Сядьте в тренажёр и зафиксируйте стопы ремнями. / Оттолкнитесь ногами, затем отклонитесь назад и подтяните рукоять к груди. / Выпрямите руки, наклонитесь вперёд и согните ноги, возвращаясь в исходное положение.",2],["Runners_Stretch","Растяжка бегуна","Runner's Stretch","m","o","",1,1,0,"Сделайте шаг назад одной ногой и опустите корпус к полу. / Поставьте руки по обе стороны от передней ноги, пятка на полу. / Удерживайте растяжку и смените ногу.",2],["Running_Treadmill","Бег на беговой дорожке","Running, Treadmill","l","onm","machines",1,6,0,"Встаньте на дорожку и выберите программу или ручной режим. / Установите скорость и наклон. / Бегите в выбранном темпе нужное время.",2],["Russian_Twist","Русские скручивания","Russian Twist","k","d","",2,0,1,"Сядьте на пол, согните колени и зафиксируйте стопы. / Отклоните корпус назад, руки вытянуты перед собой. / Поворачивайте корпус поочерёдно вправо и влево.",2],["Sandbag_Load","Погрузка мешков с песком","Sandbag Load","l","khojnmdcfe","other",1,5,1,"Подойдите к мешку и обхватите его как можно плотнее. / Поднимите мешок к груди, разгибая ноги и таз. / Донесите мешок до платформы и загрузите его на неё.",2],["Scapular_Pull-Up","Лопаточные подтягивания","Scapular Pull-Up","e","bc","pullup",1,0,0,"Возьмитесь за перекладину прямым хватом и повисните. / Не сгибая рук, опустите лопатки, приподнимая тело на несколько сантиметров. / Задержитесь и медленно вернитесь в вис.",2],["Scissor_Kick","Ножницы лёжа","Scissor Kick","k","","",1,1,0,"Лягте на спину, руки вдоль тела ладонями вниз. / Поднимите прямые ноги примерно на 15 см от пола. / Попеременно поднимайте и опускайте ноги, как ножницы.",2],["Scissors_Jump","Прыжки ножницами","Scissors Jump","l","nm","",1,2,1,"Встаньте в выпад, переднее колено над стопой. / Выпрыгните как можно выше, помогая взмахом рук. / В воздухе смените ноги и приземлитесь в выпад.",2],["Seated_Band_Hamstring_Curl","Сгибание ног сидя с резиновой лентой","Seated Band Hamstring Curl","m","","other",1,0,0,"Закрепите ленту низко, сядьте на скамью и наденьте ленту на лодыжки. / Согните колени, подтягивая стопы к скамье. / Медленно выпрямите ноги.",2],["Seated_Barbell_Military_Press","Армейский жим штанги сидя","Seated Barbell Military Press","f","i","barbell",2,0,1,"Сядьте на скамью со спинкой и возьмите штангу хватом шире плеч. / Выжмите штангу над головой на выдохе. / Медленно опустите штангу к верхней части груди на вдохе.",2],["Seated_Barbell_Twist","Скручивания со штангой сидя","Seated Barbell Twist","k","","barbell",1,0,0,"Сядьте на край скамьи, держа штангу на плечах. / Поворачивайте корпус вправо, не двигая бёдрами. / Вернитесь и повернитесь влево, чередуя стороны.",2],["Seated_Bent-Over_One-Arm_Dumbbell_Triceps_Extension","Разгибание руки с гантелью сидя в наклоне","Seated Bent-Over One-Arm Dumbbell Triceps Extension","i","","dumbbells",1,0,0,"Сядьте на край скамьи, наклонитесь вперёд с прямой спиной, держа гантель в одной руке. / Прижмите плечо к корпусу и разогните руку назад. / Медленно согните руку в исходное положение.",2],["Seated_Bent-Over_Rear_Delt_Raise","Разведение гантелей в наклоне сидя","Seated Bent-Over Rear Delt Raise","f","","dumbbells",2,0,0,"Сядьте на край скамьи, гантели за голенями, наклонитесь вперёд с прямой спиной. / Поднимите гантели через стороны до уровня плеч, слегка согнув локти. / Медленно опустите гантели в исходное положение.",2],["Seated_Bent-Over_Two-Arm_Dumbbell_Triceps_Extension","Разгибание рук с гантелями в наклоне сидя","Seated Bent-Over Two-Arm Dumbbell Triceps Extension","i","","dumbbells",2,0,0,"Сядьте на край скамьи, наклоните корпус почти параллельно полу, плечи прижаты к телу. / Разогните руки в локтях назад, напрягая трицепсы. / Медленно согните руки обратно.",2],["Seated_Biceps","Растяжка бицепса сидя с партнёром","Seated Biceps","h","af","",3,1,0,"Сядьте на пол, вытяните руки назад, партнёр держит вас за запястья. / Попытайтесь согнуть локти 10–20 секунд, партнёр не даёт движению произойти. / Расслабьтесь, и партнёр мягко углубит растяжку.",2],["Seated_Cable_Rows","Тяга нижнего блока сидя","Seated Cable Rows","c","hbf","cable",1,0,1,"Сядьте в тренажёр, упритесь ногами, возьмите V-рукоять, спина прямая. / Подтяните рукоять к животу, сводя лопатки, на выдохе. / Медленно выпрямите руки на вдохе.",2],["Seated_Cable_Shoulder_Press","Жим от плеч в блочном тренажёре сидя","Seated Cable Shoulder Press","f","i","cable",1,0,1,"Сядьте, возьмите рукояти, локти согнуты под 90 градусов на уровне плеч. / Выжмите рукояти вверх до выпрямления рук на выдохе. / Медленно опустите в исходное положение.",2],["Seated_Calf_Raise","Подъём на носки сидя в тренажёре","Seated Calf Raise","o","","machines",1,0,0,"Сядьте в тренажёр, носки на платформе, пятки свисают, валик на бёдрах. / Поднимитесь на носки максимально высоко, напрягая икры. / Медленно опустите пятки ниже уровня платформы.",2],["Seated_Calf_Stretch","Растяжка икроножной мышцы сидя","Seated Calf Stretch","o","md","",1,1,0,"Сядьте на коврик, одну ногу согните, другую выпрямите. / Тяните носок выпрямленной ноги на себя полотенцем, резинкой или рукой. / Удерживайте 10–20 секунд и смените ногу.",2],["Seated_Close-Grip_Concentration_Barbell_Curl","Концентрированный подъём штанги узким хватом сидя","Seated Close-Grip Concentration Barbell Curl","h","","barbell",2,0,0,"Сядьте на скамью, возьмите штангу узким хватом, обопритесь трицепсами о внутреннюю сторону бёдер. / Согните руки, поднимая штангу к плечам. / Медленно опустите штангу до полного выпрямления рук.",2],["Seated_Dumbbell_Curl","Сгибание рук с гантелями сидя","Seated Dumbbell Curl","h","","dumbbells",1,0,0,"Сядьте на скамью, гантели в опущенных руках, локти прижаты к корпусу. / Согните руки, разворачивая ладони вверх, на выдохе. / Медленно опустите гантели в исходное положение.",2],["Seated_Dumbbell_Inner_Biceps_Curl","Сгибание рук с гантелями внутрь сидя","Seated Dumbbell Inner Biceps Curl","h","","dumbbells",1,0,0,"Сядьте на край скамьи, гантели в опущенных руках нейтральным хватом. / Согните руки, поднимая гантели к плечам и разводя их слегка в стороны. / Медленно опустите гантели.",2],["Seated_Dumbbell_Palms-Down_Wrist_Curl","Сгибание запястий с гантелями хватом сверху сидя","Seated Dumbbell Palms-Down Wrist Curl","j","","dumbbells",1,0,0,"Сядьте на край скамьи, положите предплечья на бёдра ладонями вниз, кисти свисают. / Поднимите кисти вверх, сгибая запястья. / Медленно опустите кисти вниз.",2],["Seated_Dumbbell_Palms-Up_Wrist_Curl","Сгибание запястий с гантелями хватом снизу сидя","Seated Dumbbell Palms-Up Wrist Curl","j","","dumbbells",1,0,0,"Сядьте на край скамьи, положите предплечья на бёдра ладонями вверх, кисти свисают. / Согните запястья, поднимая гантели вверх. / Медленно опустите гантели вниз.",2],["Seated_Dumbbell_Press","Жим гантелей сидя","Seated Dumbbell Press","f","i","dumbbells",1,0,1,"Сядьте на скамью со спинкой, поднимите гантели к плечам ладонями вперёд. / Выжмите гантели вверх до выпрямления рук на выдохе. / Медленно опустите гантели к плечам.",2],["Seated_Flat_Bench_Leg_Pull-In","Подтягивание коленей к груди сидя на скамье","Seated Flat Bench Leg Pull-In","k","","",1,0,1,"Сядьте на скамью, держитесь за края, отклоните корпус назад, ноги вытянуты. / Подтяните колени к груди, одновременно наклоняя корпус вперёд. / Вернитесь в исходное положение, выпрямляя ноги.",2],["Seated_Floor_Hamstring_Stretch","Растяжка задней поверхности бедра сидя на полу","Seated Floor Hamstring Stretch","m","o","",1,1,0,"Сядьте на коврик, одну ногу вытяните, стопу другой прижмите к внутренней стороне бедра. / Наклонитесь вперёд от таза и тянитесь к лодыжке. / Удерживайте 15 секунд и смените сторону.",2],["Seated_Front_Deltoid","Растяжка передней дельты сидя с партнёром","Seated Front Deltoid","f","a","",3,1,0,"Сядьте на пол, разведите прямые руки в стороны и отведите их назад, партнёр держит запястья. / Попытайтесь свести руки вперёд 10–20 секунд, партнёр не даёт движению произойти. / Расслабьтесь, и партнёр мягко углубит растяжку.",2],["Seated_Glute","Растяжка ягодиц сидя с партнёром","Seated Glute","n","p","",3,1,0,"Сядьте, положите лодыжку одной ноги на колено другой и наклонитесь вперёд, партнёр упирается в плечи. / Попытайтесь отклониться назад 10–20 секунд, партнёр сопротивляется. / Расслабьтесь и наклонитесь глубже вперёд.",2],["Seated_Good_Mornings","Наклоны со штангой на плечах сидя","Seated Good Mornings","d","n","barbell",2,3,1,"Сядьте на ящик в силовой раме, положите штангу на заднюю часть плеч, спина прямая. / Наклонитесь вперёд от таза, сохраняя прогиб в пояснице. / Вернитесь в вертикальное положение, напрягая разгибатели спины.",2],["Seated_Hamstring","Растяжка задней поверхности бедра сидя с партнёром","Seated Hamstring","m","o","",3,1,0,"Сядьте с вытянутыми ногами и наклонитесь вперёд, партнёр упирается в плечи. / Попытайтесь отклониться назад 10–20 секунд, партнёр сопротивляется. / Расслабьтесь и наклонитесь глубже вперёд.",2],["Seated_Hamstring_and_Calf_Stretch","Растяжка бедра и икры с ремнём сидя","Seated Hamstring and Calf Stretch","m","o","other",2,1,0,"Сядьте с вытянутыми ногами, накиньте ремень или резинку на стопу. / Слегка наклонитесь вперёд и потяните носок на себя. / Удерживайте 10–20 секунд и смените ногу.",2],["Seated_Head_Harness_Neck_Resistance","Разгибание шеи с упряжью сидя","Seated Head Harness Neck Resistance","g","","other",2,0,0,"Сядьте на край скамьи, наденьте упряжь с грузом на голову, наклоните корпус вперёд. / Поднимите голову вверх, разгибая шею. / Медленно опустите голову, подбородок к груди.",2],["Seated_Leg_Curl","Сгибание ног в тренажёре сидя","Seated Leg Curl","m","","machines",1,0,0,"Сядьте в тренажёр, валик под икрами, фиксатор на бёдрах, возьмитесь за рукояти. / Согните ноги, опуская валик вниз, на выдохе. / Медленно вернитесь в исходное положение.",2],["Seated_Leg_Tucks","Подтягивание коленей сидя","Seated Leg Tucks","k","","",1,0,0,"Сядьте на скамью, держитесь за края, отклоните корпус назад, ноги вытянуты. / Подтяните колени к груди, наклоняя корпус навстречу. / Выпрямите ноги и вернитесь в исходное положение.",2],["Seated_One-Arm_Dumbbell_Palms-Down_Wrist_Curl","Сгибание запястья с гантелью хватом сверху одной рукой сидя","Seated One-Arm Dumbbell Palms-Down Wrist Curl","j","","dumbbells",2,0,0,"Сядьте на скамью, положите предплечье на бедро ладонью вниз, кисть свисает. / Поднимите кисть вверх, сгибая запястье. / Медленно опустите и после подхода смените руку.",2],["Seated_One-Arm_Dumbbell_Palms-Up_Wrist_Curl","Сгибание запястья с гантелью хватом снизу одной рукой сидя","Seated One-Arm Dumbbell Palms-Up Wrist Curl","j","","dumbbells",1,0,0,"Сядьте на скамью, положите предплечье на бедро ладонью вверх, кисть свисает. / Согните запястье, поднимая гантель вверх. / Медленно опустите и после подхода смените руку.",2],["Seated_One-arm_Cable_Pulley_Rows","Тяга нижнего блока одной рукой сидя","Seated One-arm Cable Pulley Rows","c","hbe","cable",2,0,1,"Сядьте в тренажёр, упритесь ногами, возьмите одиночную рукоять одной рукой. / Подтяните рукоять к поясу, отводя локоть назад и разворачивая корпус. / Медленно выпрямите руку и после подхода смените сторону.",2],["Seated_Overhead_Stretch","Боковая растяжка сидя с рукой за головой","Seated Overhead Stretch","k","","",1,1,0,"Сядьте прямо, соедините стопы, одна рука на полу, другая за головой. / Поднимите локоть к потолку и наклоните корпус в противоположную сторону. / Удерживайте 10–20 секунд и смените сторону.",2],["Seated_Palm-Up_Barbell_Wrist_Curl","Сгибание запястий со штангой хватом снизу сидя","Seated Palm-Up Barbell Wrist Curl","j","","barbell",1,0,0,"Сядьте, положите предплечья на бёдра, штанга в руках ладонями вверх. / Согните запястья, поднимая штангу. / Медленно опустите штангу, разгибая запястья.",2],["Seated_Palms-Down_Barbell_Wrist_Curl","Разгибание запястий со штангой хватом сверху сидя","Seated Palms-Down Barbell Wrist Curl","j","","barbell",1,0,0,"Сядьте, положите предплечья на бёдра, штанга в руках ладонями вниз. / Поднимите кисти вверх, разгибая запястья. / Медленно опустите штангу.",2],["Seated_Side_Lateral_Raise","Махи гантелями в стороны сидя","Seated Side Lateral Raise","f","","dumbbells",1,0,0,"Сядьте на край скамьи, гантели в опущенных руках ладонями внутрь. / Поднимите гантели через стороны до уровня плеч, локти слегка согнуты. / Медленно опустите гантели без раскачки.",2],["Seated_Triceps_Press","Французский жим гантели сидя","Seated Triceps Press","i","","dumbbells",1,0,0,"Сядьте на скамью со спинкой, держите гантель двумя руками над головой. / Опустите гантель за голову, сгибая локти. / Разогните руки вверх, напрягая трицепсы.",2],["Seated_Two-Arm_Palms-Up_Low-Pulley_Wrist_Curl","Сгибание запястий на нижнем блоке сидя","Seated Two-Arm Palms-Up Low-Pulley Wrist Curl","j","","cable",1,0,0,"Сядьте перед нижним блоком, предплечья на бёдрах, рукоять в руках ладонями вверх. / Согните запястья, поднимая рукоять. / Медленно опустите кисти вниз.",2],["See-Saw_Press_Alternating_Side_Press","Попеременный жим гантелей стоя («качели»)","See-Saw Press (Alternating Side Press)","f","ki","dumbbells",2,0,1,"Встаньте прямо, поднимите гантели к плечам ладонями к себе. / Выжмите одну гантель вверх, разворачивая ладонь вперёд. / Опустите её и одновременно выжмите другую.",2],["Shotgun_Row","Тяга нижнего блока одной рукой в выпаде","Shotgun Row","b","hc","cable",1,0,1,"Встаньте в широкую разножку перед нижним блоком, рука с рукоятью вытянута. / Подтяните рукоять к поясу, отводя лопатку и сгибая локоть. / Медленно выпрямите руку и после подхода смените сторону.",2],["Shoulder_Circles","Круговые движения плечами","Shoulder Circles","f","e","",1,1,0,"Расслабьте плечи, руки свободно опущены. / Вращайте плечами вперёд, вверх, назад и вниз. / Повторите в обратную сторону, по очереди или обоими плечами сразу.",2],["Shoulder_Press_-_With_Bands","Жим от плеч с резинкой стоя","Shoulder Press - With Bands","f","i","bands",1,0,1,"Встаньте на резинку, поднимите рукояти к плечам ладонями вперёд. / Выжмите рукояти вверх до выпрямления рук. / Медленно опустите их к плечам.",2],["Shoulder_Raise","Подъём плеч без веса","Shoulder Raise","f","b","",1,1,0,"Встаньте прямо, руки расслаблены вдоль тела. / Поднимите плечи к ушам. / Опустите плечи вниз.",2],["Shoulder_Stretch","Растяжка плеча стоя","Shoulder Stretch","f","","",1,1,0,"Вытяните одну руку поперёк груди. / Другой рукой прижмите её к телу за локоть. / Удерживайте 15–20 секунд и смените руку.",2],["Side-Lying_Floor_Stretch","Растяжка боковой поверхности лёжа на боку","Side-Lying Floor Stretch","b","","",1,1,0,"Лягте на бок, согните нижнее колено впереди для устойчивости, верхнюю ногу выпрямите назад. / Вытяните верхнюю руку за голову и мягко потяните её. / Удерживайте 15–20 секунд и смените сторону.",2],["Side_Bridge","Боковая планка","Side Bridge","k","f","",1,0,0,"Лягте на бок, обопритесь на предплечье, ноги вместе. / Поднимите таз так, чтобы тело образовало прямую линию. / Удерживайте положение, затем смените сторону.",2],["Side_Hop-Sprint","Боковые прыжки с ускорением","Side Hop-Sprint","l","qpom","other",1,2,1,"Встаньте сбоку от конуса или барьера. / Быстро прыгайте через него в стороны заданное число раз. / После последнего приземления сделайте короткий спринт.",2],["Side_Jackknife","Боковой складной нож","Side Jackknife","k","","",1,0,1,"Лягте на бок, нижняя рука на полу, верхняя за головой. / Одновременно поднимите верхнюю ногу и корпус, сближая локоть и колено. / Медленно опуститесь и после подхода смените сторону.",2],["Side_Lateral_Raise","Махи гантелями в стороны стоя","Side Lateral Raise","f","","dumbbells",1,0,0,"Встаньте прямо, гантели у бёдер. / Поднимите гантели через стороны до уровня плеч, локти слегка согнуты. / Медленно опустите гантели без раскачки.",2],["Side_Laterals_to_Front_Raise","Подъём гантелей перед собой с разведением в стороны","Side Laterals to Front Raise","f","e","dumbbells",1,0,0,"Встаньте прямо, гантели у бёдер. / Поднимите гантели перед собой до уровня плеч, затем разведите их в стороны. / Опустите гантели через стороны и повторите в обратном порядке.",2],["Side_Leg_Raises","Махи ногой в сторону","Side Leg Raises","p","","",1,1,0,"Встаньте у опоры на одну ногу, держитесь рукой. / Отведите прямую ногу в сторону и махом верните её, заводя за опорную. / Повторите 5–10 раз, увеличивая амплитуду, и смените ногу.",2],["Side_Lying_Groin_Stretch","Растяжка паха лёжа на боку","Side Lying Groin Stretch","p","m","",1,1,0,"Лягте на бок, согните нижнее колено впереди, голова на руке. / Поднимите верхнюю ногу и возьмитесь за колено или стопу. / Подтяните колено к плечу, удерживайте 15–20 секунд и смените сторону.",2],["Side_Neck_Stretch","Растяжка боковой поверхности шеи","Side Neck Stretch","g","","",1,1,0,"Расслабьте плечи и наклоните голову к плечу. / Мягко потяните голову рукой в ту же сторону. / Удерживайте 15–20 секунд и смените сторону.",2],["Side_Standing_Long_Jump","Прыжок в длину боком","Side Standing Long Jump","l","onm","",1,2,1,"Встаньте в атлетическую стойку, ноги на ширине таза. / Наклонитесь в сторону и выпрыгните боком, мощно разгибая бёдра, колени и стопы. / Мягко приземлитесь на обе ноги.",2],["Side_To_Side_Chins","Подтягивания широким хватом со смещением в стороны","Side To Side Chins","b","hjcf","other",2,0,1,"Возьмитесь за перекладину широким хватом, отклоните корпус назад, грудь вперёд. / Подтянитесь, смещаясь к одной руке. / Опуститесь и в следующем повторении сместитесь к другой руке.",2],["Side_Wrist_Pull","Растяжка запястья и плеча с подтягиванием в сторону","Side Wrist Pull","f","jb","",1,1,0,"Стоя, заведите одну руку перед корпусом и возьмите её запястье другой рукой на уровне бёдер. / Медленно выпрямите и потяните руку вверх до уровня плеча. / Удерживайте 15–20 секунд и смените руку.",2],["Side_to_Side_Box_Shuffle","Боковые перескоки через тумбу","Side to Side Box Shuffle","l","qpom","other",1,2,1,"Встаньте сбоку от тумбы, одна стопа на ней. / Перепрыгните на другую сторону, меняя ноги, помогая махом рук. / Продолжайте перескакивать туда и обратно в быстром темпе.",2],["Single-Arm_Cable_Crossover","Сведение рук в кроссовере одной рукой","Single-Arm Cable Crossover","a","","cable",1,0,0,"Установите блоки вверху, возьмите рукоять одной рукой, шагните вперёд. / Сведите руку по дуге вниз и к центру корпуса, локоть слегка согнут. / Медленно верните руку в исходное положение.",2],["Single-Arm_Linear_Jammer","Жим штанги в упоре одной рукой (лендмайн)","Single-Arm Linear Jammer","f","ai","barbell",2,0,1,"Закрепите гриф в лендмайне, поднимите конец к плечу, встаньте широко. / Выжмите гриф вверх и вперёд, разгибая локоть. / Медленно верните гриф к плечу.",2],["Single-Arm_Push-Up","Отжимания на одной руке","Single-Arm Push-Up","a","fi","",2,0,1,"Примите упор лёжа на одной руке, ноги расставлены шире для устойчивости. / Опуститесь, сгибая рабочую руку, корпус прямой. / Выжмите себя вверх до выпрямления руки.",2],["Single-Cone_Sprint_Drill","Беговое упражнение вокруг конуса","Single-Cone Sprint Drill","l","onm","other",1,2,0,"Встаньте рядом с конусом, одна рука впереди, другая сзади. / Быстро перебирайте ногами, обегая конус с высоким подъёмом коленей. / Отдохните после трёх кругов.",2],["Single-Leg_High_Box_Squat","Приседания на одной ноге на высокой тумбе","Single-Leg High Box Squat","l","nm","other",1,0,1,"Встаньте на тумбу на одну ногу, держась за резинку для равновесия. / Опуститесь на одной ноге, другая свободно свисает. / Поднимитесь, после подхода смените ногу.",2],["Single-Leg_Hop_Progression","Прыжки на одной ноге через конусы","Single-Leg Hop Progression","l","qpom","other",1,2,1,"Встаньте на одну ногу перед рядом конусов, другое колено поднято. / Прыгайте вперёд через конусы, приземляясь на ту же ногу. / В конце ряда смените ногу.",2],["Single-Leg_Lateral_Hop","Боковые прыжки на одной ноге","Single-Leg Lateral Hop","l","qpom","other",1,2,1,"Встаньте на одну ногу сбоку от конуса, колено слегка согнуто. / Перепрыгните через конус в сторону и приземлитесь на ту же ногу. / Сразу оттолкнитесь и прыгните обратно.",2],["Single-Leg_Leg_Extension","Разгибание одной ноги в тренажёре","Single-Leg Leg Extension","l","","machines",1,0,0,"Сядьте в тренажёр, валик на нижней части голени, колено на одной линии с осью. / Разогните одну ногу до прямой, напрягая квадрицепс. / Медленно опустите и после подхода смените ногу.",2],["Single-Leg_Stride_Jump","Прыжки на одной ноге с тумбы","Single-Leg Stride Jump","l","qpom","other",1,2,1,"Встаньте сбоку от тумбы, ближняя стопа на её краю. / Махом рук оттолкнитесь верхней ногой и выпрыгните вверх, поднимая другое колено. / Приземлитесь в исходное положение и повторите.",2],["Single_Dumbbell_Raise","Подъём гантели перед собой двумя руками","Single Dumbbell Raise","f","je","dumbbells",1,0,0,"Встаньте широко, держите одну гантель двумя руками за диск, руки опущены. / Поднимите гантель прямыми руками выше уровня плеч. / Медленно опустите гантель.",2],["Single_Leg_Butt_Kick","Прыжки на одной ноге с захлёстом голени","Single Leg Butt Kick","l","om","",1,2,1,"Встаньте на одну ногу, другое колено поднято. / Выпрыгните вверх и коснитесь пяткой толчковой ноги ягодицы. / Приземлитесь на ту же ногу и повторите.",2],["Single_Leg_Glute_Bridge","Ягодичный мост на одной ноге","Single Leg Glute Bridge","n","m","",1,0,0,"Лягте на спину, ноги согнуты, одно колено подтяните к груди. / Упираясь пяткой, поднимите таз вверх, напрягая ягодицы. / Медленно опустите таз на пол.",2],["Single_Leg_Push-off","Толчок одной ногой с тумбы","Single Leg Push-off","l","om","other",1,2,1,"Встаньте, поставив одну стопу на тумбу. / Оттолкнитесь ногой с тумбы и выпрыгните как можно выше. / Приземлитесь той же стопой на тумбу, другая нога возвращается на пол.",2],["Sit-Up","Подъём корпуса (сит-ап)","Sit-Up","k","","",1,0,0,"Лягте на спину, ноги согнуты и зафиксированы, руки за головой. / Поднимите корпус к бёдрам на выдохе. / Медленно опуститесь на вдохе.",2],["Sit_Squats","Неполные приседания","Sit Squats","l","qnm","",1,1,0,"Встаньте, ноги на ширине плеч. / Присядьте, отводя таз назад, не опускаясь до параллели. / Быстро поднимитесь в исходное положение.",2],["Skating","Катание на роликах","Skating","l","qponm","other",2,6,0,"Наденьте ролики и защитную экипировку. / Катайтесь ритмично, отталкиваясь поочерёдно ногами. / Следите за равновесием, освойте повороты и торможение.",2],["Sled_Drag_-_Harness","Тяга саней с упряжью","Sled Drag - Harness","l","onm","other",1,5,1,"Нагрузите сани и закрепите тяговый ремень на упряжи или поясе. / Наклонитесь в сторону движения. / Идите вперёд или назад, мощно разгибая бёдра и колени.",2],["Sled_Overhead_Backward_Walk","Ходьба назад с санями, руки над головой","Sled Overhead Backward Walk","f","ocl","other",1,0,1,"Встаньте лицом к саням, держите рукояти прямыми руками над головой. / Идите назад, сохраняя натяжение троса. / Держите руки прямыми и корпус ровным.",2],["Sled_Overhead_Triceps_Extension","Разгибание рук из-за головы с санями","Sled Overhead Triceps Extension","i","","other",1,0,0,"Встаньте спиной к саням, рукояти в руках за головой, локти вверх. / Разогните руки вверх, напрягая трицепсы. / Согните руки, сделайте шаг вперёд и повторите.",2],["Sled_Push","Толкание саней","Sled Push","l","oanmi","other",1,5,1,"Нагрузите сани и возьмитесь за рукояти прямыми руками, наклонившись вперёд. / Толкайте сани как можно быстрее. / Мощно разгибайте бёдра и колени на каждом шаге.",2],["Sled_Reverse_Flye","Обратная разводка с санями","Sled Reverse Flye","f","","other",1,0,0,"Встаньте лицом к саням, рукояти в прямых руках на уровне пояса. / Разведите руки в стороны, сводя лопатки. / Верните руки и сделайте шаг назад для натяжения.",2],["Sled_Row","Тяга саней к поясу","Sled Row","c","hb","other",1,0,1,"Встаньте лицом к саням, рукояти в вытянутых руках, колени слегка согнуты. / Подтяните рукояти к поясу, сводя лопатки. / Выпрямите руки, отступите назад и повторите.",2],["Sledgehammer_Swings","Удары кувалдой по покрышке","Sledgehammer Swings","k","ojbcf","other",1,2,1,"Встаньте перед покрышкой в разножке, возьмите кувалду. / Замахнитесь кувалдой над головой. / С силой ударьте по покрышке, перехватывая рукоять.",2],["Smith_Incline_Shoulder_Raise","Подъём плеч в Смите на наклонной скамье","Smith Incline Shoulder Raise","f","a","barbell,bench",1,0,0,"Лягте на наклонную скамью под гриф Смита, возьмите его прямыми руками. / Поднимите плечи к грифу, не сгибая руки. / Медленно опустите плечи.",2],["Smith_Machine_Behind_the_Back_Shrug","Шраги за спиной в Смите","Smith Machine Behind the Back Shrug","e","f","machines",1,0,0,"Встаньте спиной к грифу, возьмите его хватом сверху на ширине плеч. / Поднимите плечи к ушам. / Медленно опустите плечи.",2],["Smith_Machine_Bench_Press","Жим лёжа в Смите","Smith Machine Bench Press","a","fi","machines",1,0,1,"Лягте на скамью под гриф, возьмите его хватом шире плеч. / Опустите гриф к середине груди на вдохе. / Выжмите вверх на выдохе.",2],["Smith_Machine_Bent_Over_Row","Тяга в наклоне в Смите","Smith Machine Bent Over Row","c","hbf","machines",1,0,1,"Наклонитесь с прямой спиной почти параллельно полу, возьмите гриф хватом сверху. / Подтяните гриф к животу, сводя лопатк
