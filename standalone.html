<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>AI-Тренер</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #000;
  --surface: #111;
  --surface-2: #1a1a1a;
  --line: #262626;
  --text: #fff;
  --muted: #8a8a8a;
  --lime: #ccff00;
  --lime-dim: rgba(204, 255, 0, 0.14);
  --danger: #ff4d4d;
  --radius: 22px;
  --display: "Unbounded", system-ui, sans-serif;
  --body: "Inter", system-ui, -apple-system, sans-serif;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { background: var(--bg); color: var(--text); font-family: var(--body); }
body { min-height: 100vh; overscroll-behavior: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
img { display: block; }

#app { padding: 0 16px calc(96px + var(--safe-bottom)); max-width: 560px; margin: 0 auto; }
.screen.nav-fwd { animation: nav-fwd .28s cubic-bezier(.2, .8, .2, 1); }
.screen.nav-back { animation: nav-back .28s cubic-bezier(.2, .8, .2, 1); }
.screen.nav-tab { animation: nav-tab .2s ease-out; }
@keyframes nav-fwd { from { opacity: .55; transform: translateX(28px); } to { opacity: 1; transform: none; } }
@keyframes nav-back { from { opacity: .55; transform: translateX(-28px); } to { opacity: 1; transform: none; } }
@keyframes nav-tab { from { opacity: .6; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .screen.nav-fwd, .screen.nav-back, .screen.nav-tab { animation: none; } }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* Typography */
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.h1 { font-family: var(--display); font-weight: 900; font-size: 40px; line-height: 1; letter-spacing: -.02em; text-transform: uppercase; }
.h2 { font-family: var(--display); font-weight: 700; font-size: 22px; line-height: 1.1; text-transform: uppercase; }
.h3 { font-family: var(--display); font-weight: 700; font-size: 16px; text-transform: uppercase; }
.lime { color: var(--lime); }
.muted { color: var(--muted); }
.big-num { font-family: var(--display); font-weight: 900; font-size: 34px; line-height: 1; }

.top { padding: 20px 0 16px; display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
.section { margin-top: 28px; }
.section-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }

/* Hero */
.hero { position: relative; border-radius: var(--radius); overflow: hidden; min-height: 300px; background: linear-gradient(135deg, #1d2400, #000 70%); display: flex; flex-direction: column; justify-content: flex-end; padding: 20px; }
.hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: grayscale(.2) contrast(1.1); }
.hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0) 20%, rgba(0,0,0,.92) 100%); }
.hero > *:not(img) { position: relative; z-index: 1; }
.tag { display: inline-flex; align-items: center; gap: 6px; background: var(--lime); color: #000; font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; padding: 6px 10px; border-radius: 999px; width: fit-content; }
.tag.ghost { background: rgba(255,255,255,.12); color: #fff; backdrop-filter: blur(8px); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 56px; padding: 0 24px; border-radius: 999px; background: var(--lime); color: #000; font-family: var(--display); font-weight: 700; font-size: 15px; text-transform: uppercase; letter-spacing: .02em; transition: transform .1s; }
.btn:active { transform: scale(.97); }
.btn.block { width: 100%; }
.btn.dark { background: var(--surface-2); color: #fff; }
.btn.outline { background: transparent; color: var(--lime); box-shadow: inset 0 0 0 2px var(--lime); }

/* Cards */
.card { background: var(--surface); border-radius: var(--radius); padding: 18px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--surface); border-radius: 18px; padding: 14px; }
.stat .big-num { font-size: 24px; }
.stat .eyebrow { font-size: 10px; margin-top: 6px; }

/* Week strip */
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.day { background: var(--surface); border-radius: 16px; padding: 10px 0; text-align: center; }
.day b { display: block; font-family: var(--display); font-size: 18px; margin-top: 4px; }
.day small { font-size: 11px; color: var(--muted); text-transform: uppercase; }
.day i { display: block; width: 6px; height: 6px; margin: 6px auto 0; border-radius: 50%; background: var(--line); }
.day.done i { background: var(--lime); }
.day.today { background: var(--lime); color: #000; }
.day.today small { color: #000; }
.day.today i { background: #000; }

/* Workout rows */
.list { display: flex; flex-direction: column; gap: 8px; }
.row { display: flex; align-items: center; gap: 14px; background: var(--surface); border-radius: 20px; padding: 10px; text-align: left; width: 100%; }
.thumb { position: relative; width: 64px; height: 64px; border-radius: 14px; overflow: hidden; flex: none; background: linear-gradient(135deg, #2a3300, #111); }
.thumb img { width: 100%; height: 100%; object-fit: cover; }
.row .grow { flex: 1; min-width: 0; }
.row .title { font-weight: 700; font-size: 16px; }
.row .sub { font-size: 13px; color: var(--muted); margin-top: 3px; }
.row .chev { color: var(--muted); font-size: 22px; padding-right: 6px; }
.row.rest { opacity: .55; }
.pill { font-size: 11px; font-weight: 700; padding: 4px 8px; border-radius: 999px; background: var(--lime-dim); color: var(--lime); text-transform: uppercase; }

/* Chips & search */
.chips { display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px; padding: 0 16px 4px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; height: 38px; padding: 0 16px; border-radius: 999px; background: var(--surface); font-weight: 600; font-size: 14px; }
.chip.active { background: var(--lime); color: #000; }
.search { width: 100%; height: 50px; border-radius: 16px; background: var(--surface); border: 0; color: #fff; font: inherit; padding: 0 16px; margin-bottom: 12px; outline: none; }
.search:focus { box-shadow: inset 0 0 0 2px var(--lime); }

.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { position: relative; border-radius: 20px; overflow: hidden; aspect-ratio: 3/4; background: linear-gradient(160deg, #2a3300, #0d0d0d); text-align: left; }
.tile img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.tile::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 35%, rgba(0,0,0,.9)); }
.tile .cap { position: absolute; left: 12px; right: 12px; bottom: 12px; z-index: 1; }
.tile .cap b { display: block; font-family: var(--display); font-size: 14px; text-transform: uppercase; line-height: 1.15; }
.tile .cap span { font-size: 12px; color: var(--lime); font-weight: 600; }

/* Detail */
.back { display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px 0 10px; border-radius: 999px; background: rgba(0,0,0,.55); backdrop-filter: blur(8px); font-weight: 600; font-size: 14px; }
.detail-hero { position: relative; margin: 0 -16px; height: 340px; background: linear-gradient(160deg, #2a3300, #000); overflow: hidden; }
.detail-hero img { width: 100%; height: 100%; object-fit: cover; }
.detail-hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.25), transparent 30%, #000); }
.detail-hero .back { position: absolute; top: 14px; left: 16px; z-index: 2; }
.detail-body { margin-top: -60px; position: relative; z-index: 1; }
.kv { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 18px; }
.kv div { background: var(--surface); border-radius: 16px; padding: 12px; }
.kv b { display: block; font-size: 15px; margin-top: 4px; }
.steps { counter-reset: s; display: flex; flex-direction: column; gap: 10px; }
.steps li { list-style: none; display: flex; gap: 12px; line-height: 1.45; font-size: 15px; }
.steps li::before { counter-increment: s; content: counter(s); flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--lime); color: #000; font-weight: 800; display: grid; place-items: center; font-size: 13px; }

.set-table { width: 100%; border-collapse: collapse; }
.set-table td { padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
.set-table td:last-child { text-align: right; font-weight: 700; }

/* Timer */
.seg { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--surface); border-radius: 999px; padding: 4px; }
.seg button { height: 42px; border-radius: 999px; font-weight: 600; font-size: 14px; color: var(--muted); }
.seg button.active { background: var(--lime); color: #000; }
.ring-wrap { position: relative; width: min(78vw, 320px); aspect-ratio: 1; margin: 28px auto 20px; }
.ring-wrap svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring-bg { fill: none; stroke: var(--surface-2); stroke-width: 14; }
.ring-fg { fill: none; stroke: var(--lime); stroke-width: 14; stroke-linecap: round; transition: stroke-dashoffset .25s linear; }
.ring-fg.rest { stroke: #fff; }
.ring-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.ring-center .time { font-family: var(--display); font-weight: 900; font-size: clamp(48px, 17vw, 76px); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.ring-center .phase { font-family: var(--display); font-weight: 700; font-size: 14px; text-transform: uppercase; letter-spacing: .1em; color: var(--lime); }
.controls { display: flex; gap: 10px; justify-content: center; }
.controls .btn { flex: 1; }
.round-btn { width: 56px; height: 56px; flex: none !important; padding: 0; }
.steppers { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 16px; }
.stepper { background: var(--surface); border-radius: 18px; padding: 12px 8px; text-align: center; }
.stepper .val { font-family: var(--display); font-weight: 700; font-size: 20px; margin: 6px 0; }
.stepper .pm { display: flex; justify-content: center; gap: 8px; }
.stepper .pm button { width: 34px; height: 34px; border-radius: 50%; background: var(--surface-2); font-size: 18px; font-weight: 700; }
.presets { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 16px; }
.presets button { height: 52px; border-radius: 16px; background: var(--surface); font-family: var(--display); font-weight: 700; }
.presets button.active { background: var(--lime); color: #000; }
.laps { margin-top: 16px; }

/* History */
.heat { display: grid; grid-template-columns: repeat(12, 1fr); grid-auto-flow: column; grid-template-rows: repeat(7, 1fr); gap: 4px; }
.heat i { aspect-ratio: 1; border-radius: 4px; background: var(--surface-2); }
.heat i.l1 { background: rgba(204,255,0,.3); }
.heat i.l2 { background: rgba(204,255,0,.6); }
.heat i.l3 { background: var(--lime); }
.month { margin: 22px 0 10px; }
.hist { background: var(--surface); border-radius: 20px; padding: 16px; display: flex; gap: 14px; align-items: center; }
.date-box { width: 56px; flex: none; text-align: center; border-right: 1px solid var(--line); padding-right: 12px; }
.date-box b { display: block; font-family: var(--display); font-size: 24px; }
.date-box small { font-size: 11px; color: var(--muted); text-transform: uppercase; }
.hist-meta { display: flex; gap: 12px; margin-top: 6px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
.hist-meta b { color: #fff; }

/* Charts */
.chart { width: 100%; height: auto; display: block; }
.chart .grid-line { stroke: var(--line); stroke-width: 1; }
.chart .axis { fill: var(--muted); font-size: 11px; font-family: var(--body); }
.chart .line { fill: none; stroke: var(--lime); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.chart .area { fill: url(#limeFade); }
.chart .dot { fill: #000; stroke: var(--lime); stroke-width: 3; }
.chart .bar { fill: var(--surface-2); }
.chart .bar.hi { fill: var(--lime); }
.chart .val { fill: #fff; font-size: 11px; font-weight: 700; font-family: var(--body); }
.delta { font-weight: 700; color: var(--lime); font-size: 14px; }
.pr { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--line); }
.pr:last-child { border-bottom: 0; }
.pr b { font-family: var(--display); font-size: 18px; }

/* Tab bar */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: grid; grid-template-columns: repeat(5, 1fr); padding: 8px 4px calc(8px + var(--safe-bottom)); background: rgba(0,0,0,.86); backdrop-filter: blur(16px); border-top: 1px solid var(--line); }
.tabbar button { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; color: var(--muted); font-size: 10px; font-weight: 600; }
.tabbar svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.tabbar button.active { color: var(--lime); }
.tabbar.hidden { display: none; }

.toast { position: fixed; left: 50%; bottom: calc(100px + var(--safe-bottom)); transform: translateX(-50%); background: var(--lime); color: #000; font-weight: 700; padding: 12px 18px; border-radius: 999px; z-index: 20; animation: fade .2s; white-space: nowrap; }

/* ---------- v2: онбординг, сессия, пустые состояния ---------- */
.ob { min-height: 100vh; display: flex; flex-direction: column; padding-top: 20px; padding-bottom: 24px; }
.ob-progress { display: grid; grid-auto-flow: column; gap: 6px; margin-bottom: 28px; }
.ob-progress i { height: 4px; border-radius: 4px; background: var(--surface-2); }
.ob-progress i.on { background: var(--lime); }
.ob-sub { color: var(--muted); font-size: 15px; line-height: 1.45; margin-top: 12px; }
.ob-foot { margin-top: auto; padding-top: 24px; display: flex; gap: 10px; }
.ob-foot .btn { flex: 1; }
.opts { display: flex; flex-direction: column; gap: 10px; margin-top: 24px; }
.opt { position: relative; display: flex; align-items: center; gap: 14px; background: var(--surface); border-radius: 20px; padding: 16px; text-align: left; width: 100%; box-shadow: inset 0 0 0 2px transparent; transition: box-shadow .15s, background .15s; }
.opt .emo { width: 48px; height: 48px; border-radius: 14px; background: var(--surface-2); display: grid; place-items: center; font-size: 24px; flex: none; }
.opt b { display: block; font-size: 17px; }
.opt small { display: block; color: var(--muted); font-size: 13px; margin-top: 3px; line-height: 1.35; }
.opt.on { box-shadow: inset 0 0 0 2px var(--lime); background: #141a00; }
.opt.on .emo { background: var(--lime); }
.opt-photo { overflow: hidden; min-height: 110px; align-items: flex-end; }
.opt-photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .55; }
.opt-photo::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(0,0,0,.85), rgba(0,0,0,.2)); }
.opt-photo > div { position: relative; z-index: 1; }
.eq { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 24px; }
.eq button { background: var(--surface); border-radius: 18px; padding: 14px 12px; text-align: left; box-shadow: inset 0 0 0 2px transparent; min-height: 74px; }
.eq button span { font-size: 22px; display: block; }
.eq button b { display: block; font-size: 14px; margin-top: 6px; }
.eq button.on { box-shadow: inset 0 0 0 2px var(--lime); background: #141a00; }
.eq button.on b { color: var(--lime); }
.row2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(60px, 1fr)); gap: 8px; margin-top: 12px; }
.row2 button { height: 52px; border-radius: 16px; background: var(--surface); font-family: var(--display); font-weight: 700; }
.row2 button.on { background: var(--lime); color: #000; }
.label { margin-top: 26px; }

.icon-btn { width: 44px; height: 44px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; font-size: 20px; flex: none; }
.coach { display: flex; gap: 12px; align-items: flex-start; background: var(--surface); border-radius: 20px; padding: 14px; margin-top: 12px; }
.coach .ava { width: 36px; height: 36px; border-radius: 50%; background: var(--lime); color: #000; display: grid; place-items: center; font-weight: 900; font-family: var(--display); font-size: 13px; flex: none; }
.coach p { font-size: 14px; line-height: 1.45; }
.mini-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.mini-tags span { font-size: 12px; padding: 5px 9px; border-radius: 999px; background: var(--surface-2); color: #ddd; }

.empty { text-align: center; padding: 48px 24px; background: var(--surface); border-radius: var(--radius); }
.empty .big { font-size: 44px; }
.empty b { display: block; font-family: var(--display); text-transform: uppercase; font-size: 16px; margin-top: 12px; }
.empty p { color: var(--muted); font-size: 14px; line-height: 1.45; margin-top: 8px; }
.empty .btn { margin-top: 18px; }

.ex-card { background: var(--surface); border-radius: 20px; padding: 12px; }
.ex-card.done { box-shadow: inset 0 0 0 2px var(--lime); }
.ex-head { display: flex; gap: 12px; align-items: center; }
.ex-head .grow { flex: 1; min-width: 0; }
.ex-head .title { font-weight: 700; font-size: 16px; }
.ex-head .sub { font-size: 13px; color: var(--muted); margin-top: 3px; }
.swap { font-size: 12px; font-weight: 700; color: var(--lime); padding: 8px 10px; border-radius: 999px; background: var(--lime-dim); }
.sets { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; align-items: center; }
.set { min-width: 46px; height: 42px; padding: 0 10px; border-radius: 12px; background: var(--surface-2); font-weight: 700; font-size: 14px; }
.set.on { background: var(--lime); color: #000; }
.w-input { width: 84px; height: 42px; border-radius: 12px; background: var(--surface-2); border: 0; color: #fff; font: inherit; font-weight: 700; text-align: center; outline: none; }
.w-input:focus { box-shadow: inset 0 0 0 2px var(--lime); }
.restbar { position: fixed; left: 16px; right: 16px; bottom: calc(84px + var(--safe-bottom)); z-index: 15; background: var(--lime); color: #000; border-radius: 18px; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; font-weight: 800; animation: fade .2s; }
.restbar b { font-family: var(--display); font-size: 22px; }
.restbar button { font-weight: 800; font-size: 14px; padding: 6px 12px; border-radius: 999px; background: rgba(0,0,0,.12); }
.groups { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.groups button { height: 54px; border-radius: 16px; background: var(--surface); font-weight: 600; font-size: 14px; }
.groups button.on { background: var(--lime); color: #000; }
.bar-list .br { display: grid; grid-template-columns: 90px 1fr 34px; gap: 10px; align-items: center; margin: 10px 0; font-size: 13px; }
.bar-list .tr { height: 10px; border-radius: 6px; background: var(--surface-2); overflow: hidden; }
.bar-list .tr i { display: block; height: 100%; background: var(--lime); border-radius: 6px; }
.bar-list .br span:last-child { text-align: right; color: var(--muted); }
.danger-link { color: var(--danger); font-weight: 600; font-size: 14px; padding: 12px; display: block; margin: 16px auto 0; }

/* вся база и подборка */
.chip.ghost { background: transparent; box-shadow: inset 0 0 0 1.5px var(--surface-2); color: #ddd; font-weight: 500; }
.tile-db::after { background: linear-gradient(180deg, transparent 35%, rgba(0,0,0,.92)) !important; }
.in-basket { position: absolute; top: 10px; right: 10px; z-index: 2; width: 28px; height: 28px; border-radius: 50%; background: var(--lime); color: #000; font-weight: 900; display: grid; place-items: center; }
.pics { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pics figure { margin: 0; border-radius: 16px; overflow: hidden; background: var(--surface); position: relative; aspect-ratio: 1; }
.pics img { width: 100%; height: 100%; object-fit: cover; }
.pics figcaption { position: absolute; left: 8px; bottom: 8px; background: #000; color: var(--lime); font-size: 11px; font-weight: 700; padding: 4px 8px; border-radius: 999px; text-transform: uppercase; }
.basket-bar { position: fixed; left: 16px; right: 16px; bottom: calc(84px + var(--safe-bottom)); z-index: 14; display: flex; gap: 8px; }
.basket-bar .grow { height: 52px; border-radius: 999px; background: var(--lime); color: #000; font-family: var(--display); font-weight: 700; font-size: 14px; text-transform: uppercase; box-shadow: 0 8px 30px rgba(0,0,0,.6); }
.basket-bar .x { width: 52px; height: 52px; border-radius: 50%; background: var(--surface-2); color: #fff; font-size: 16px; box-shadow: 0 8px 30px rgba(0,0,0,.6); }
.ph { position: absolute; inset: 0; display: grid; place-items: center; font-size: 64px; background: radial-gradient(circle at 50% 40%, #3a4a00, #0d0d0d 70%); }
.thumb .ph { font-size: 28px; }
.anim { position: absolute; inset: 0; cursor: pointer; overflow: hidden; --zoom: 1; }
.anim img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scale(var(--zoom)); }
.anim .f1 { opacity: 0; }
.gifbox { position: absolute; inset: 0; background: #fff; }
.anim .gifbox img, .gifbox canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; transform: none; }
.gifbox canvas { display: none; }
.gifpic { position: absolute; inset: 0; background: #fff; }

 with Cable","f","","cable",1,0,0,"Установите блок на уровне локтя и встаньте к нему боком, локоть согнут под 90° и прижат к корпусу. / Дальней рукой поверните рукоять наружу от тела. / Медленно вернитесь в исходное положение.",2,""],["Face_Pull","Тяга каната к лицу","Face Pull","f","c","cable",2,0,1,"Встаньте лицом к верхнему блоку с канатом, плечи параллельны полу. / Тяните канат к лицу, разводя руки в стороны. / Задержитесь на секунду и медленно верните вес.",2,""],["Farmers_Walk","Прогулка фермера","Farmer's Walk","j","knmdle","other",2,5,1,"Встаньте между снарядами или гантелями и возьмитесь за рукояти. / Поднимите вес, оттолкнувшись пятками, спина прямая. / Идите короткими быстрыми шагами, держа корпус напряжённым.",2,"qPEzJjA"],["Fast_Skipping","Быстрые подскоки","Fast Skipping","l","qponm","",1,2,1,"Встаньте расслабленно, одна нога немного впереди. / Выполняйте подскоки, чередуя ноги по схеме шаг-подскок. / Держитесь ближе к земле, минимизируя время в воздухе.",2,""],["Finger_Curls","Сгибание пальцев со штангой","Finger Curls","j","","barbell",1,0,0,"Сядьте, возьмите штангу хватом снизу на ширине плеч, предплечья на бёдрах. / Разожмите пальцы, позволив грифу скатиться к кончикам пальцев. / Сожмите пальцы и затем кисти, поднимая гриф обратно.",2,"awG04cF"],["Flat_Bench_Cable_Flyes","Сведение рук в кроссовере лёжа на горизонтальной скамье","Flat Bench Cable Flyes","a","","cable",2,0,0,"Поставьте скамью между нижними блоками и лягте, взяв рукояти. / Разведите руки в стороны со слегка согнутыми локтями, растягивая грудь. / Сведите руки над грудью, сокращая грудные мышцы.",2,""],["Flat_Bench_Leg_Pull-In","Подтягивание коленей к груди лёжа на скамье","Flat Bench Leg Pull-In","k","","",1,0,1,"Лягте на скамью, ноги свисают с края, руки держатся за скамью. / Согните ноги и подтяните колени к груди на выдохе. / Медленно выпрямите ноги вперёд на вдохе.",2,""],["Flat_Bench_Lying_Leg_Raise","Подъём ног лёжа на скамье","Flat Bench Lying Leg Raise","k","","",1,0,0,"Лягте с ",2,5,1,"Прикрепите к саням ремни с рукоятями и встаньте спиной к саням. / Сделайте шаг вперёд, сдвигая сани. / На каждом шаге выжимайте рукояти вперёд, выпрямляя руки.",2,""],["Frankenstein_Squat","Присед Франкенштейна","Frankenstein Squat","l","konm","barbell",2,4,1,"Положите штангу на передние дельты и вытяните руки вперёд. / Присядьте, удерживая гриф на плечах без помощи рук. / Встаньте, сохраняя корпус вертикальным.",2,"bdWcbaU"],["Freehand_Jump_Squat","Приседания с выпрыгиванием без веса","Freehand Jump Squat","l","onm","",2,0,1,"Скрестите руки на груди, ноги на ширине плеч. / Присядьте до параллели бёдер с полом на вдохе. / Мощно выпрыгните вверх и мягко приземлитесь в присед.",2,""],["Frog_Hops","Лягушачьи прыжки","Frog Hops","l","onm","",2,1,1,"Руки за головой, опуститесь в присед, корпус прямо. / Прыгните вперёд на расстояние, не прыгая слишком высоко. / Мягко приземлитесь в присед и сразу прыгайте снова.",2,""],["Frog_Sit-Ups","Скручивания «лягушка»","Frog Sit-Ups","k","","",2,0,0,"Лягте на спину, согните ноги и соедините стопы, колени разведены. / Скрутите корпус, поднимая плечи от пола на выдохе. / Медленно опуститесь на вдохе.",2,"FFRP97T"],["Front_Barbell_Squat","Фронтальные приседания со штангой","Front Barbell Squat","l","onm","barbell",3,0,1,"Положите штангу на передние дельты, локти высоко. / Присядьте до параллели или ниже, держа корпус вертикально. / Встаньте, отталкиваясь пятками, на выдохе.",2,"IeTIEqg"],["Front_Barbell_Squat_To_A_Bench","Фронтальные приседания со штангой на скамью","Front Barbell Squat To A Bench","l","onm","barbell,bench",3,0,1,"Поставьте скамью сзади, положите штангу на передние дельты, локти высоко. / Присядьте до касания скамьи, корпус вертикален. / Встаньте, отталкиваясь пятками.",2,""],["Front_Box_Jump","Прыжки на тумбу","Front Box Jump","m","qponl","other",1,2,1,"Встаньте перед тумбой на расстоянии 30–60 см, ноги на ширине плеч. / Немного присядьте, отведя руки назад. / Мощно выпрыгните и приземлитесь на тумбу в мягкий присед.",2,""],["Front_Cable_Raise","Подъём руки перед собой в кроссовере","Front Cable Raise","f","","cable",1,0,0,"Встаньте спиной к нижнему блоку, рукоять в руке перед бедром. / Поднимите прямую руку вперёд до уровня плеч на выдохе. / Медленно опустите руку на вдохе.",2,""],["Front_Cone_Hops_or_hurdle_hops","Прыжки через конусы","Front Cone Hops (or hurdle hops)","l","qponm","other",1,2,1,"Расставьте конусы в ряд на расстоянии около метра и встаньте перед первым. / Перепрыгните конус двумя ногами, помогая махом рук. / Мягко приземлитесь и сразу прыгайте через следующий.",2,""],["Front_Dumbbell_Raise","Подъём гантелей перед собой поочерёдно","Front Dumbbell Raise","f","","dumbbells",1,0,0,"Встаньте прямо, гантели перед бёдрами. / Поднимите одну гантель вперёд до уровня плеч, не раскачиваясь. / Опустите её и повторите другой рукой.",2,""],["Front_Incline_Dumbbell_Raise","Подъём гантелей перед собой на наклонной скамье","Front Incline Dumbbell Raise","f","","dumbbells,bench",1,0,0,"Сядьте на наклонную скамью (30–60°), гантели в прямых руках ладонями вниз. / Поднимите гантели вперёд и вверх до уровня плеч. / Медленно опустите в исходное положение.",2,""],["Front_Leg_Raises","Махи ногой вперёд","Front Leg Raises","m","","",1,1,0,"Встаньте боком к опоре и держитесь за неё одной рукой. / Махните прямой ногой вперёд, затем назад, насколько позволяет гибкость. / Повторите 5–10 раз и смените ногу.",2,""],["Front_Plate_Raise","Подъём блина перед собой","Front Plate Raise","f","","other",2,0,0,"Встаньте прямо, держите блин двумя руками перед бёдрами. / Поднимите блин прямыми руками до уровня плеч на выдохе. / Медленно опустите на вдохе.",2,""],["Front_Raise_And_Pullover","Подъём штанги перед собой с пуловером лёжа","Front Raise And Pullover","a","bfi","barbell",1,0,1,"Лягте на скамью, держите штангу хватом сверху на бёдрах. / Поднимите гриф дугой над головой прямыми руками. / Верните штангу тем же путём на бёдра.",2,""],["Front_Squat_Clean_Grip","Фронтальные приседания хватом для взятия на грудь","Front Squat (Clean Grip)","l","knm","barbell",2,0,1,"Положите штангу на передние дельты, удерживая гриф пальцами, локти высоко. / Присядьте как можно ниже, корпус вертикален. / Встаньте, отталкиваясь пятками.",2,""],["Front_Squats_With_Two_Kettlebells","Фронтальные приседания с двумя гирями","Front Squats With Two Kettlebells","l","on","kettlebell",2,0,1,"Возьмите две гири на грудь. / Присядьте как можно ниже, глядя прямо перед собой. / Встаньте, отталкиваясь пятками.",2,""],["Front_Two-Dumbbell_Raise","Подъём двух гантелей перед собой","Front Two-Dumbbell Raise","f","","dumbbells",1,0,0,"Встаньте прямо, гантели перед бёдрами. / Одновременно поднимите гантели вперёд до уровня плеч, не раскачиваясь. / Медленно опустите гантели.",2,""],["Full_Range-Of-Motion_Lat_Pulldown","Тяга верхних блоков с полной амплитудой","Full Range-Of-Motion Lat Pulldown","b","hcf","cable",2,0,1,"Возьмитесь за рукояти двух верхних блоков скрестными руками. / Тяните рукояти вниз к плечам, держа грудь поднятой. / Медленно верните руки вверх, растягивая широчайшие.",2,""],["Gironda_Sternum_Chins","Подтягивания Жиронды к грудине","Gironda Sternum Chins","b","hc","other",2,0,1,"Повисните на турнике обратным хватом на ширине плеч, отклонившись назад. / Подтягивайтесь, прогибаясь, пока перекладина не коснётся грудины. / Медленно опуститесь до полного выпрямления рук.",2,""],["Glute_Ham_Raise","Ягодично-бицепсовый подъём на тренажёре","Glute Ham Raise","m","on","machines",2,3,1,"Настройте тренажёр, стопы упираются в платформу, колени за подушкой. / Согните колени, поднимая корпус вверх усилием бицепса бедра. / Медленно опуститесь в исходное положение.",2,"Vvwjz6N"],["Glute_Kickback","Отведение ноги назад на четвереньках","Glute Kickback","n","m","",1,0,1,"Встаньте на четвереньки, спина прямая. / Отведите согнутую ногу назад и вверх, напрягая ягодицу. / Медленно вернитесь и повторите, затем смените ногу.",2,""],["Goblet_Squat","Гоблет-присед","Goblet Squat","l","onmf","kettlebell",1,0,1,"Держите гирю за рога у груди. / Присядьте как можно ниже, держа грудь и голову поднятыми. / Встаньте, отталкиваясь пятками.",2,""],["Good_Morning","Гуд монинг со штангой","Good Morning","m","knd","barbell",2,3,1,"Положите штангу на верх спины, колени слегка согнуты. / Наклонитесь вперёд, отводя таз назад, спина прямая. / Вернитесь в вертикальное положение.",2,""],["Good_Morning_off_Pins","Гуд монинг со штангой с упоров","Good Morning off Pins","m","knd","barbell",2,3,1,"Установите штангу на упоры на уровне живота и подлезьте под неё в наклоне. / Поднимите корпус в вертикальное положение, держа спину прямой. / Опустите штангу обратно на упоры в наклоне.",2,""],["Gorilla_Chin_Crunch","Подтягивания с подъёмом коленей","Gorilla Chin/Crunch","k","hb","",2,0,1,"Повисните на турнике обратным хватом, колени согнуты под 90°. / Подтянитесь и одновременно подтяните колени к груди. / Медленно опуститесь в вис.",2,""],["Groin_and_Back_Stretch","Растяжка паха и спины сидя","Groin and Back Stretch","p","","",2,1,1,"Сядьте, согнув колени и соединив стопы, руки за головой. / Наклонитесь вниз, опуская локти к внутренней стороне бёдер. / Задержитесь и вернитесь в исходное положение.",2,""],["Groiners","Прыжки в упоре лёжа ноги к рукам","Groiners","p","","",2,1,1,"Примите упор лёжа. / Прыжком подтяните обе ноги к рукам, голова поднята. / Вернитесь в упор лёжа и сразу повторите.",2,""],["Hack_Squat","Гакк-приседания","Hack Squat","l","onm","machines",1,0,1,"Встаньте в тренажёр, плечи под подушками, ноги на ширине плеч. / Присядьте до параллели бёдер с платформой на вдохе. / Выжмите вес вверх, отталкиваясь пятками.",2,""],["Hammer_Curls","Молотковые сгибания с гантелями","Hammer Curls","h","","dumbbells",1,0,0,"Встаньте прямо, гантели в опущенных руках ладонями к корпусу. / Согните руки, не поворачивая кисти, на выдохе. / Медленно опустите гантели на вдохе.",2,""],["Hammer_Grip_Incline_DB_Bench_Press","Жим гантелей на наклонной скамье нейтральным хватом","Hammer Grip Incline  Crunch With Alternating Oblique Twists","k","","cable",1,0,0,"Встаньте на колени перед верхним блоком, держите канат у головы. / Скрутитесь, напрягая пресс, и опустите локти к бёдрам. / Чередуйте с поворотом корпуса в стороны, работая косыми мышцами.",2,""],["Kneeling_Cable_Triceps_Extension","Разгибание рук на блоке стоя на коленях","Kneeling Cable Triceps Extension","i","","cable",2,0,0,"Поставьте скамью перед верхним блоком, возьмите прямую рукоять узким хватом над головой. / Встаньте на колени спиной к блоку, обопритесь плечами о скамью, локти согнуты. / Разогните руки вперёд, держа плечи неподвижными, и вернитесь обратно.",2,""],["Kneeling_Forearm_Stretch","Растяжка предплечий стоя на коленях","Kneeling Forearm Stretch","j","","",1,1,0,"Встаньте на колени, ладони на полу, пальцы направлены к коленям. / Медленно отклонитесь назад, не отрывая ладоней, до ощущения растяжения. / Удерживайте 20–30 секунд.",2,""],["Kneeling_High_Pulley_Row","Тяга верхнего блока к лицу стоя на коленях","Kneeling High Pulley Row","b","hc","cable",1,0,1,"Прикрепите канат к верхнему блоку и встаньте на колени, руки вытянуты вперёд. / Согните локти и потяните канат к корпусу, сводя лопатки. / Задержитесь и медленно вернитесь в исходное положение.",2,""],["Kneeling_Hip_Flexor","Растяжка сгибателей бедра стоя на колене","Kneeling Hip Flexor","l","l","",1,1,0,"Встаньте на левое колено, правая стопа впереди на полу. / Сместите вес вперёд до ощущения растяжения в тазобедренном суставе. / Удерживайте 15 секунд и повторите на другую сторону.",2,""],["Kneeling_Jump_Squat","Прыжок из положения на коленях в присед","Kneeling Jump Squat","n","oml","barbell",3,4,1,"Встаньте на колени со штангой на плечах или без веса. / Сядьте тазом на пятки, держа голову и грудь поднятыми. / Мощным махом рук и таза выпрыгните на стопы в присед.",2,"UgDm3oy"],["Kneeling_Single-Arm_High_Pulley_Row","Тяга верхнего блока одной рукой стоя на коленях","Kneeling Single-Arm High Pulley Row","b","hc","cable",1,0,1,"Прикрепи Triceps_Extension","Разгибание рук с канатом от нижнего блока лёжа","Low Cable Triceps Extension","i","","cable",1,0,0,"Лягте на скамью тренажёра головой к блоку и возьмите канат нейтральным хватом. / Держите плечи неподвижными, локти согнуты. / Разогните руки, затем медленно согните обратно.",2,""],["Low_Pulley_Row_To_Neck","Тяга нижнего блока к шее","Low Pulley Row To Neck","f","hce","cable",1,0,1,"Сядьте в тренажёр с канатом, возьмитесь прямым хватом, спина прямая. / Потяните канат к шее, разводя локти в стороны. / Медленно выпрямите руки.",2,""],["Lower_Back-SMR","МФР поясницы на ролике","Lower Back-SMR","d","","roller",1,1,0,"Сядьте и подложите ролик под поясницу, скрестите руки на груди. / Поднимите таз и отклонитесь назад, перенося вес на поясницу. / Слегка сместитесь в сторону и прокатайте мышцы.",2,""],["Lower_Back_Curl","Разгибание спины лёжа на животе","Lower Back Curl","k","","",1,1,0,"Лягте на живот, руки в стороны. / Мышцами поясницы поднимите грудь от пола, не помогая руками. / Медленно опуститесь и повторите 10–20 раз.",2,"ANbbry2"],["Lunge_Pass_Through","Выпады с передачей гири","Lunge Pass Through","m","onl","kettlebell",2,0,1,"Встаньте прямо, держа гирю в правой руке. / Шагните вперёд левой ногой в выпад, опуская заднее колено к полу. / Передайте гирю под передней ногой в другую руку и вернитесь.",2,""],["Lunge_Sprint","Спринт-выпады в Смите","Lunge Sprint","l","onm","machines",2,0,1,"Положите гриф Смита на плечи и встаньте в разножку. / Опустите заднее колено почти до пола. / Мощно выпрыгните, смените ноги в воздухе и приземлитесь в выпад.",2,""],["Lying_Bent_Leg_Groin","Растяжка паха лёжа с партнёром","Lying Bent Leg Groin","p","","other",3,1,0,"Лягте на спину, согните колени и соедините стопы, партнёр держит колени. / Попытайтесь свести колени, пока партнёр не даёт этого сделать, 10–20 секунд. / Расслабьтесь, позволяя партнёру мягко углубить растяжку.",2,""],["Lying_Cable_Curl","Сгибание рук на нижнем блоке лёжа","Lying Cable Curl","h","","cabl утрь. / На вдохе согните локти, опуская гантели к голове. / На выдохе разогните руки.",2,""],["Lying_Face_Down_Plate_Neck_Resistance","Сгибание шеи с блином лёжа лицом вниз","Lying Face Down Plate Neck Resistance","g","","other",2,0,0,"Лягте лицом вниз на скамью, плечи у края, держите блин на затылке. / Опустите голову вниз. / Поднимите голову, разгибая шею, и задержитесь.",2,""],["Lying_Face_Up_Plate_Neck_Resistance","Сгибание шеи с блином лёжа на спине","Lying Face Up Plate Neck Resistance","g","","other",2,0,0,"Лягте на спину на скамью, плечи у края, держите блин на лбу. / Опустите голову назад. / Поднимите голову, подтягивая подбородок к груди.",2,""],["Lying_Glute","Растяжка ягодиц лёжа с партнёром","Lying Glute","n","q","",3,1,0,"Лягте на спину, согните ногу и положите стопу над противоположным бедром. / Партнёр фиксирует колено и лодыжку. / Давите ногой против сопротивления, затем расслабьтесь и углубите растяжку.",2,""],["Lying_Hamstring","Растяжка задней поверхности бедра лёжа с партнёром","Lying Hamstring","m","o","other",3,1,0,"Лягте на спину, поднимите одну ногу вверх, партнёр держит лодыжку. / Давите ногой вниз против сопротивления партнёра несколько секунд. / Расслабьтесь, позволяя партнёру мягко углубить растяжку.",2,""],["Lying_High_Bench_Barbell_Curl","Сгибание рук со штангой лёжа на высокой скамье","Lying High Bench Barbell Curl","h","","barbell,bench",2,0,0,"Лягте животом на высокую скамью, держите штангу хватом снизу на прямых руках. / Согните руки, поднимая штангу к плечам. / Медленно опустите штангу.",2,""],["Lying_Leg_Curls","Сгибание ног лёжа в тренажёре","Lying Leg Curls","m","","machines",1,0,0,"Лягте лицом вниз, валик чуть ниже икр, держитесь за ручки. / На выдохе согните ноги, подтягивая валик к ягодицам. / Медленно опустите вес на вдохе.",2,"17lJ1kr"],["Lying_Machine_Squat","Приседания в тренажёре лёжа","Lying Machine Squat","l","onm","machines",2,0,1,"Отрегулируйте тренажёр и лягте на спину, колени согнуты, бёдра чуть ниже параллели. / ats","l","onm","machines",2,0,1,"Встаньте в гакк-машину, плечи под упорами, стопы узко, носки слегка врозь. / Опуститесь, сгибая колени до параллели. / Выжмите себя вверх, отталкиваясь пятками.",2,""],["Narrow_Stance_Leg_Press","Жим ногами с узкой постановкой","Narrow Stance Leg Press","l","onm","machines",2,0,1,"Сядьте в тренажёр, поставьте стопы узко на платформу, носки слегка врозь. / Опустите платформу, сгибая колени. / Выжмите платформу, не выпрямляя колени до конца.",2,""],["Narrow_Stance_Squats","Приседания со штангой с узкой постановкой ног","Narrow Stance Squats","l","onmd","barbell",2,0,1,"Положите штангу на трапеции и снимите её со стоек. / Поставьте стопы уже плеч и присядьте до параллели. / Встаньте, отталкиваясь пятками.",2,""],["Natural_Glute_Ham_Raise","Обратные гиперэкстензии без тренажёра (нордические сгибания)","Natural Glute Ham Raise","m","ond","",2,0,1,"Встаньте на колени, зафиксировав лодыжки под валиком, корпус прямой. / Медленно опускайтесь вперёд, контролируя движение бицепсом бедра. / Вернитесь в вертикальное положение, сгибая ноги.",2,""],["Neck-SMR","МФР шеи","Neck-SMR","g","","other",2,1,0,"Приложите ролик или скалку к шее сбоку от позвоночника. / Прокатывайте мышцы шеи, избегая давления на позвоночник. / Задерживайтесь на напряжённых точках.",2,""],["Neck_Press","Жим штанги лёжа к шее","Neck Press","a","fi","barbell",2,0,1,"Лягте на скамью и снимите штангу средним хватом над шеей. / На вдохе опустите штангу к шее. / На выдохе выжмите её вверх.",2,""],["Oblique_Crunches","Косые скручивания","Oblique Crunches","k","","",1,0,0,"Лягте на спину, стопы на возвышении, одна рука за головой. / Поднимите плечо к противоположному колену, скручивая корпус. / Медленно опуститесь и смените сторону.",2,""],["Oblique_Crunches_-_On_The_Floor","Косые скручивания лёжа на боку","Oblique Crunches - On The Floor","k","","",1,0,0,"Лягте на правый бок, колени слегка согнуты, левая рука за головой. / Поднимите левый локоть к бедру, сокращая косые мышцы. / Медленно опуститесь и повторите.",2,""],["Olympic_Squat","Олимпийские приседания","Olympic Squat","l","onm","barbell",2,4,1,"Положите штангу на трапеции, грудь поднята, стопы на ширине таза. / Опуститесь, выводя колени вперёд и держа корпус вертикально. / Встаньте, отталкиваясь стопами.",2,""],["On-Your-Back_Quad_Stretch","Растяжка квадрицепса лёжа на спине","On-Your-Back Quad Stretch","l","","other",1,1,0,"Лягте на скамью, свесив одну ногу и руку с края. / Согните колено и возьмитесь за стопу, не прогибая поясницу. / Тяните стопу вниз, удерживая растяжку.",2,""],["On_Your_Side_Quad_Stretch","Растяжка квадрицепса лёжа на боку","On Your Side Quad Stretch","l","","",1,1,0,"Лягте на правый бок, правое колено согнуто впереди. / Согните левую ногу назад и возьмитесь за стопу левой рукой. / Подайте левое бедро вперёд, удерживая растяжку.",2,"BWnJR72"],["One-Arm_Dumbbell_Row","Тяга гантели одной рукой в наклоне","One-Arm Dumbbell Row","c","hbf","dumbbells",1,0,1,"Обопритесь коленом и рукой о скамью, спина параллельна полу. / Подтяните гантель к поясу, держа локоть у корпуса. / Медленно опустите гантель.",2,"C0MA9bC"],["One-Arm_Flat_Bench_Dumbbell_Flye","Разведение гантели одной рукой лёжа","One-Arm Flat Bench Dumbbell Flye","a","","dumbbells,bench",1,0,0,"Лягте на скамью, держа гантель над грудью нейтральным хватом. / Опустите руку в сторону по дуге, локоть слегка согнут. / Верните гантель над грудью.",2,""],["One-Arm_High-Pulley_Cable_Side_Bends","Боковые наклоны на верхнем блоке одной рукой","One-Arm High-Pulley Cable Side Bends","k","","cable",1,0,0,"Встаньте боком к верхнему блоку и возьмите рукоять одной рукой. / Подтяните рукоять к плечу, свободная рука на поясе. / Наклоняйтесь в сторону, сокращая косые мышцы, и возвращайтесь.",2,""],["One-Arm_Incline_Lateral_Raise","Махи одной рукой лёжа боком на наклонной скамье","One-Arm Incline Lateral Raise","f","","dumbbells,bench",1,0,0,"Лягте боком на наклонную скамью, гантель в верхней руке перед собой. / Поднимите руку вверх до , положите предплечья на бёдра, штанга в руках ладонями вниз. / Поднимите кисти вверх, разгибая запястья. / Медленно опустите штангу.",2,""],["Seated_Side_Lateral_Raise","Махи гантелями в стороны сидя","Seated Side Lateral Raise","f","","dumbbells",1,0,0,"Сядьте на край скамьи, гантели в опущенных руках ладонями внутрь. / Поднимите гантели через стороны до уровня плеч, локти слегка согнуты. / Медленно опустите гантели без раскачки.",2,""],["Seated_Triceps_Press","Французский жим гантели сидя","Seated Triceps Press","i","","dumbbells",1,0,0,"Сядьте на скамью со спинкой, держите гантель двумя руками над головой. / Опустите гантель за голову, сгибая локти. / Разогните руки вверх, напрягая трицепсы.",2,""],["Seated_Two-Arm_Palms-Up_Low-Pulley_Wrist_Curl","Сгибание запястий на нижнем блоке сидя","Seated Two-Arm Palms-Up Low-Pulley Wrist Curl","j","","cable",1,0,0,"Сядьте перед нижним блоком, предплечья на бёдрах, рукоять в руках ладонями вверх. / Согните запястья, поднимая рукоять. / Медленно опустите кисти вниз.",2,""],["See-Saw_Press_Alternating_Side_Press","Попеременный жим гантелей стоя («качели»)","See-Saw Press (Alternating Side Press)","f","ki","dumbbells",2,0,1,"Встаньте прямо, поднимите гантели к плечам ладонями к себе. / Выжмите одну гантель вверх, разворачивая ладонь вперёд. / Опустите её и одновременно выжмите другую.",2,""],["Shotgun_Row","Тяга нижнего блока одной рукой в выпаде","Shotgun Row","b","hc","cable",1,0,1,"Встаньте в широкую разножку перед нижним блоком, рука с рукоятью вытянута. / Подтяните рукоять к поясу, отводя лопатку и сгибая локоть. / Медленно выпрямите руку и после подхода смените сторону.",2,""],["Shoulder_Circles","Круговые движения плечами","Shoulder Circles","f","e","",1,1,0,"Расслабьте плечи, руки свободно опущены. / Вращайте плечами вперёд, вверх, назад и вниз. / Повторите в обратную сторону, по очереди или обоими плечами сразу.",2,""],["Shoulder_Press_-_With_Bands","Жим от плеч с резинкой стоя","Shoulder Press - With Bands","f","i", ","e","dumbbells",1,0,0,"Встаньте прямо, гантели у бёдер. / Поднимите гантели перед собой до уровня плеч, затем разведите их в стороны. / Опустите гантели через стороны и повторите в обратном порядке.",2,""],["Side_Leg_Raises","Махи ногой в сторону","Side Leg Raises","p","","",1,1,0,"Встаньте у опоры на одну ногу, держитесь рукой. / Отведите прямую ногу в сторону и махом верните её, заводя за опорную. / Повторите 5–10 раз, увеличивая амплитуду, и смените ногу.",2,""],["Side_Lying_Groin_Stretch","Растяжка паха лёжа на боку","Side Lying Groin Stretch","p","m","",1,1,0,"Лягте на бок, согните нижнее колено впереди, голова на руке. / Поднимите верхнюю ногу и возьмитесь за колено или стопу. / Подтяните колено к плечу, удерживайте 15–20 секунд и смените сторону.",2,""],["Side_Neck_Stretch","Растяжка боковой поверхности шеи","Side Neck Stretch","g","","",1,1,0,"Расслабьте плечи и наклоните голову к плечу. / Мягко потяните голову рукой в ту же сторону. / Удерживайте 15–20 секунд и смените сторону.",2,""],["Side_Standing_Long_Jump","Прыжок в длину боком","Side Standing Long Jump","l","onm","",1,2,1,"Встаньте в атлетическую стойку, ноги на ширине таза. / Наклонитесь в сторону и выпрыгните боком, мощно разгибая бёдра, колени и стопы. / Мягко приземлитесь на обе ноги.",2,""],["Side_To_Side_Chins","Подтягивания широким хватом со смещением в стороны","Side To Side Chins","b","hjcf","other",2,0,1,"Возьмитесь за перекладину широким хватом, отклоните корпус назад, грудь вперёд. / Подтянитесь, смещаясь к одной руке. / Опуститесь и в следующем повторении сместитесь к другой руке.",2,""],["Side_Wrist_Pull","Растяжка запястья и плеча с подтягиванием в сторону","Side Wrist Pull","f","jb","",1,1,0,"Стоя, заведите одну руку перед корпусом и возьмите её запястье другой рукой на уровне бёдер. / Медленно выпрямите и потяните руку вверх до уровня плеча. / Удерживайте 15–20 секунд и смените руку.",2,""],["Side_to_Side_Box_Shuffle","Боковые перескоки через тумбу","Side to Side Box Shuffle","l","q ине плеч, гири у плеч, ладони вперёд / Напрягите корпус, запястья над предплечьями / Выжмите гири над головой до выпрямления рук / Под контролем опустите гири к плечам",0,"blBXysN"],["e_BLCvwr2","Обратное сгибание запястий с гантелями","Dumbbell reverse wrist curl","j","h","dumbbells",2,0,0,"Сядьте на скамью или стул, возьмите по гантели хватом сверху / Обопритесь предплечьями о бёдра, кисти свободны / Разгибайте кисти вверх, предплечья неподвижны / Плавно опустите гантели, не роняя их",0,"BLCvwr2"],["e_bLyQokI","Тяга каната «Лондонский мост»","London bridge","c","fhj","rope",2,0,1,"Закрепите канат на высокой точке и встаньте к ней спиной, ноги на ширине плеч / Вытяните руки вперёд, не округляя спину / Тяните канат к корпусу, отводя локти назад / Вернитесь в начало без рывка корпусом",0,"bLyQokI"],["e_BmrwWzo","Протяжка гантели между ног в сумо-стойке","Dumbbell sumo pull through","n","mlk","dumbbells",2,0,1,"Встаньте шире плеч, носки врозь, гантель двумя руками перед собой / Разблокируйте колени, напрягите пресс и отведите таз назад / Гантель держите близко к ногам, спина прямая / Вытолкните таз вперёд и встаньте, не прогибаясь",0,"BmrwWzo"],["e_bmwlYvD","Подтягивания «горилла» подбородком к перекладине","Gorilla chin","k","jh","",1,0,1,"Возьмитесь за перекладину хватом сверху чуть шире плеч / Из активного виса тяните локти вниз / Поднимите верх груди к перекладине без маха ногами / Плавно опуститесь в вис на прямых руках",0,"bmwlYvD"],["e_bndCa3Q","Жим штанги из упоров в стойке","Barbell pin presses","i","f","barbell",2,0,1,"Установите штангу в силовой раме на уровне груди / Встаньте под штангу, ноги на ширине плеч, запястья над предплечьями / Выжмите штангу вверх, корпус напряжён / Под контролем опустите штангу в упоры",0,"bndCa3Q"],["e_bpJL2Qs","Разгибание рук с гантелью хватом сверху","Dumbbell pronate-grip triceps extension","i","j","dumbbells",2,0,0,"Сядьте на скамью со спиной прямой / Возьмите гантель двумя руками ладонями вниз и поднимите над головой / Опус const LS_KEY = "aicoach_v2";
let store = { profile: null, history: [], session: null, shuffle: {}, basket: [], runs: [], run: null };
try { Object.assign(store, JSON.parse(localStorage.getItem(LS_KEY) || "{}")); } catch (e) {}
if (!Array.isArray(store.basket)) store.basket = [];
// v3: в зале появился новый инвентарь из полной базы упражнений
if (store.profile && !store.profile.v3) { if (store.profile.place === "gym") store.profile.eq = [...new Set([...store.profile.eq, "fitball", "medball", "roller", "other"])]; store.profile.v3 = 1; }
const cloud = tg && tg.CloudStorage && tg.isVersionAtLeast && tg.isVersionAtLeast("6.9") ? tg.CloudStorage : null;
let cloudTimer = null;
function save() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(store)); } catch (e) {}
  if (!cloud) return;
  clearTimeout(cloudTimer);
  cloudTimer = setTimeout(() => {
    try {
      cloud.setItem("p", JSON.stringify(store.profile || null));
      const h = JSON.stringify(store.history), parts = [];
      for (let i = 0; i < h.length; i += 4000) parts.push(h.slice(i, i + 4000));
      parts.forEach((p, i) => cloud.setItem("h" + i, p));
      cloud.setItem("hn", String(parts.length));
    } catch (e) {}
  }, 800);
}
function cloudLoad() {
  if (!cloud) return;
  try {
    cloud.getItems(["p", "hn"], (err, v) => {
      if (err || !v) return;
      let changed = false;
      if (!store.profile && v.p && v.p !== "null") { try { store.profile = JSON.parse(v.p); changed = true; } catch (e) {} }
      const n = +v.hn || 0;
      const finish = () => { if (changed) { save(); render(); } };
      if (!n) return finish();
      cloud.getItems(Array.from({ length: n }, (_, i) => "h" + i), (e2, hv) => {
        if (!e2 && hv) {
          try {
            const remote = JSON.parse(Array.from({ length: n }, (_, i) => hv["h" + i] || "").join(""));
            const seen = new Set(store.history.map((h) => h.d));
            const add = remote.filter((h) => !seen.has(h.d));
            if (add.length) { store.history = [...store.history, ...add].sort((a, b) => new Date(b.d) - new Date(a.d)); changed = true; }
          } catch (e) {}
        }
        finish();
      });
    });
  } catch (e) {}
}
function resetAll() {
  if (cloud) try { cloud.getKeys((e, keys) => { if (!e && keys && keys.length) cloud.removeItems(keys); }); } catch (e) {}
  geoStop(); wakeOff();
  store = { profile: null, history: [], session: null, shuffle: {}, basket: [], runs: [], run: null };
  try { localStorage.removeItem(LS_KEY); } catch (e) {}
  state.stack = []; state.ob = null; state.tab = "coach";
  render();
}

function parseQuery(raw) {
  const f = { mus: [], eq: [], cat: [], place: null, lvl: 0, bw: false, mine: false, comp: null, text: [], seen: [] };
  let q = " " + norm(raw) + " ";
  for (const [re, fn] of Q_PHRASES) { const m = q.match(re); if (m) { fn(f); f.seen.push(m[0].trim()); q = q.replace(m[0], " "); } }
  for (const w of q.split(" ").filter(Boolean)) {
    const rule = Q_WORDS.find(([stems]) => stems.some((s) => (s.length <= 3 ? w === s || (w.startsWith(s) && w.length <= s.length + 3) : w.startsWith(s))));
    if (rule) { rule[1](f); f.seen.push(w); continue; }
    if (STOP.some((s) => w === s || (s.length > 3 && w.startsWith(s)))) continue;
    f.text.push(w);
  }
  return f;
}
const stem = (w) => (w.length > 5 ? w.slice(0, w.length - 2) : w.length > 3 ? w.slice(0, w.length - 1) : w);
const textHit = (hay, w) => (" " + hay).includes(" " + stem(w));

function searchAll(raw, opts = {}) {
  const f = parseQuery(raw), p = store.profile;
  const allowed = f.mine ? p.eq : f.place ? PLACE_EQ[f.place] : null;
  const out = [];
  for (const e of ALL) {
    if (opts.group && opts.group !== "all" && e.group !== opts.group) continue;
    if (opts.mine && !eqFits(e, p.eq)) continue;
    if (e.where && f.place && e.where !== f.place) continue;
    if (!eqFits(e, allowed)) continue;
    if (f.bw && e.eq.length) continue;
    if (f.eq.length && !e.eq.some((r) => r.split("|").some((x) => f.eq.includes(x)))) continue;
    if (f.cat.length && !f.cat.includes(e.cat)) continue;
    if (f.lvl === 1 && e.level > 1) continue;
    if (f.lvl === 2 && e.level !== 2) continue;
    if (f.lvl === 3 && e.level < 2) continue;
    if (f.comp != null && e.compound !== f.comp) continue;
    let score = e.db ? 0 : 3, primHit = true;
    if (f.mus.length) {
      const pm = e.prim.filter((m) => f.mus.includes(m)).length, sm = e.sec.filter((m) => f.mus.includes(m)).length;
      if (!pm && !sm) continue;
      primHit = pm > 0;
      score += (pm ? 10 : 0) + Math.min(sm, 2) - (pm ? 0 : 6);
    }
    let ok = true;
    for (const w of f.text) {
      if (textHit(e._n, w)) score += 12; else if (textHit(e._t, w)) score += 3; else { ok = false; break; }
    }
    if (!ok) continue;
    if (!f.cat.length && !f.text.length && e.cat) score -= e.cat === 1 ? 4 : 2; // растяжки и спецвиды ниже, если не просили
    out.push([score + (e.compound ? 1 : 0) - e.level * 0.1, e, primHit]);
  }
  out.sort((a, b) => b[0] - a[0]);
  // если по основной мышце нашлось достаточно, вспомогательные не показываем
  const res = out.filter((x) => x[2]).length >= 6 ? out.filter((x) => x[2]) : out;
  return { f, list: res.map((x) => x[1]) };
}

function understood(f) {
  const bits = [];
  if (f.mus.length) { const set = [...new Set(f.mus)]; bits.push(set.length >= 5 && set.includes(11) ? "ноги" : set.length === 4 && set.includes(1) ? "спина" : set.map((m) => MUSCLE_RU[m].toLowerCase()).join(", ")); }
  if (f.bw) bits.push("свой вес");
  if (f.eq.length) bits.push([...new Set(f.eq)].map(EQ_RU).join(" или "));
  if (f.place) bits.push(PLACES.find((x) => x.id === f.place).name.toLowerCase());
  if (f.mine) bits.push("твой инвентарь");

// до 16 лет без штанги, «прочего» снаряда и взрывных упражнений с гирей
const KID_BAN_EQ = ["barbell", "other"], KID_BAN = new Set(["kb_snatch", "deadlift"]);
function canDo(ex, p, levelBoost = 0) {
  const have = new Set(p.eq);
  if (isKid(p) && (KID_BAN.has(ex.id) || ex.eq.some((req) => req.split("|").every((x) => KID_BAN_EQ.includes(x))))) return false;
  if (ex.where && ex.where !== p.place) return false;
  if (ex.level > p.level + levelBoost) return false;
  if (p.level >= 2 && EASY.has(ex.id)) return false;
  return ex.eq.every((req) => req.split("|").some((x) => have.has(x)));
}

function scheme(ex, p) {
  const G = {
    lose: { sets: 3, reps: 15, rest: 30, sec: 40 },
    mass: { sets: 4, reps: 10, rest: 90, sec: 45 },
    strength: ex.compound && isWeighted(ex) ? { sets: 5, reps: 5, rest: 150, sec: 45 } : { sets: 4, reps: 8, rest: 90, sec: 45 },
    endurance: { sets: 3, reps: 20, rest: 30, sec: 50 },
    fit: { sets: 3, reps: 12, rest: 60, sec: 40 },
    gto: { sets: 3, reps: 12, rest: 60, sec: 30 },
  }[p.goal] || { sets: 3, reps: 12, rest: 60, sec: 40 };
  // подросткам — без тяжёлых силовых схем: не меньше 8 повторений, до 16 лет — не меньше 10
  if (isTeen(p) && G.reps < 8) Object.assign(G, { sets: 4, reps: 8, rest: 90 });
  if (isKid(p) && isWeighted(ex) && G.reps < 10) Object.assign(G, { sets: 3, reps: 12, rest: 75 });
  let sets = G.sets - (p.level === 1 ? 1 : 0) + (p.level === 3 && ex.compound ? 1 : 0);
  sets = Math.max(2, Math.min(6, sets));
  let reps = G.reps;
  if (p.goal === "gto") {
    if (ex.group === "back" && !isWeighted(ex)) reps = [5, 8, 12][p.level - 1] || 6;
    if (ex.id === "long_jump") reps = 6;
  }
  if (!isWeighted(ex) && (p.goal === "strength" || p.goal === "mass")) reps = ex.level >= 2 ? 8 : 15;
  const sec = Math.round((G.sec * (p.level === 1 ? 0.75 : p.level === 3 ? 1.4 : 1)) / 5) * 5;
  return { sets, reps: ex.unit === "s" ? sec : reps, unit: ex.unit, rest: G.rest };
}

function buildWorkout(title, groups, seed, p) {
  const r = rng(seed);
  const count = { 20: 4, 30: 5, 45: 6, 60: 7 }[p.minutes] || 5;
  const wantFinisher = (p.goal === "lose" || p.goal === "endurance") && !groups.includes("cardio");
  const slots = wantFinisher ? count - 1 : count;
  const used = new Set(), items = [], missing = new Set();
  const pick = (g, preferCompound) => {
    let pool = EXERCISES.filter((e) => e.group === g && !used.has(e.id) && canDo(e, p));
    if (!pool.length) pool = EXERCISES.filter((e) => e.group === g && !used.has(e.id) && canDo(e, p, 1));
    if (!pool.length) return null;
    if (p.goal === "gto" && GTO_PREF[g]) {
      const pref = GTO_PREF[g].map(exById).filter((e) => e && pool.includes(e));
      if (pref.length) return !seenGroup.has(g) ? pref[0] : pref[Math.floor(r() * Math.min(pref.length, 3))];
    }
    if (preferCompound) { const c = pool.filter((e) => e.compound); if (c.length) pool = c; }
    return pool[Math.floor(r() * pool.length)];
  };
  const seenGroup = new Set();
  for (let i = 0, tries = 0; items.length < slots && tries < slots * 4; i++, tries++) {
    const g = groups[i % groups.length];
    const ex = pick(g, !seenGroup.has(g) && p.goal !== "endurance");
    seenGroup.add(g);
    if (!ex) { missing.add(g); continue; }
    used.add(ex.id); items.push({ id: ex.id, ...scheme(ex, p) });
  }
  if (wantFinisher) { const ex = pick("cardio", false); if (ex) { used.add(ex.id); items.push({ id: ex.id, ...scheme(ex, p) }); } }
  // базовые упражнения в начало
  items.sort((a, b) => (exById(b.id).compound && isWeighted(exById(b.id))) - (exById(a.id).compound && isWeighted(exById(a.id))));
  const realMissing = [...missing].filter((g) => !items.some((it) => exById(it.id).group === g));
  return { title, groups: [...new Set(groups)], items, missing: realMissing };
}

function weekPlan(p) {
  if (p.goal === "gto") {
    let k = 0;
    return DAYS.map((_, i) => { if (!SCHEDULES[p.days][i]) return null; const t = k++ % 2 ? "gtoB" : "gtoA"; return { type: t, ...GTO_DAYS[t] }; });
  }
  const sch = { ...SCHEDULES[p.days] };
  if (p.goal === "lose" && p.days >= 3) { const last = Math.max(...Object.keys(sch).map(Number)); sch[last] = "cardio"; }
  return DAYS.map((_, i) => (sch[i] ? { type: sch[i], ...DAY_TYPES[sch[i]] } : null));
}
function dayWorkout(i) {
  const p = store.profile, d = weekPlan(p)[i];
  if (!d) return null;
  const sh = store.shuffle[`${weekNo()}-${i}`] || 0;
  return buildWorkout(d.title, d.groups, hash(JSON.stringify(p)) + weekNo() * 31 + i * 7 + sh * 101, p);
}
function swapItem(w, idx) {
  const p = store.profile, cur = exById(w.items[idx].id);
  const used = new Set(w.items.map((it) => it.id));
  const pool = EXERCISES.filter((e) => e.group === cur.group && !used.has(e.id) && canDo(e, p, 1));
  if (!pool.length) { toast("Других вариантов с твоим инвентарём нет"); return; }
  const ex = pool[Math.floor(Math.random() * pool.length)];
  w.items[idx] = { id: ex.id, ...scheme(ex, p) };
}

// при переходе внутрь запоминаем, где был экран, и возвращаемся туда же по «Назад»
const scrollMem = {};
const scrollKey = () => (state.stack.length ? "s" + state.stack.length : "t:" + state.tab);
// анимация перехода: вперёд экран выезжает справа, назад слева, вкладки плавно проявляются

function push(v) {

  state.stack.push(v); navAnim = "fwd"; render(); window.scrollTo(0, 0);
}
function pop() { state.stack.pop(); navAnim = "back"; render(); const y = scrollMem[scrollKey()] || 0; delete scrollMem[scrollKey()]; window.scrollTo(0, y); requestAnimationFrame(() => window.scrollTo(0, y)); }

function weekStats() {

  const doneDays = new Set(wk.map((h) => dow(new Date(h.d))));
  const days = new Set(store.history.map((h) => new Date(h.d).toDateString()));
  const plan = weekPlan(store.profile);
  let streak = 0; const d = new Date(); d.setHours(0, 0, 0, 0);
  if (!days.has(d.toDateString())) d.setDate(d.getDate() - 1);
  for (let i = 0; i < 120; i++) {
    if (days.has(d.toDateString())) streak++;
    else if (plan[dow(d)]) break;
    d.setDate(d.getDate() - 1);
  }
  return { count: wk.length, minutes: wk.reduce((s, h) => s + h.m, 0), doneDays, streak };
}

// ===================== ДЕМОНСТРАЦИЯ ТЕХНИКИ =====================
// Сцена на 15–30 с: повторы в рабочем темпе (кадры старт ↔ финиш), подсказки по шагам техники, счёт повторов.
function demoPlan(e) {
  const hold = e.unit === "s";
  if (hold) return { hold, dur: e.cat === 1 ? 20 : 25, period: 0, reps: 0 };
  const period = e.cat === 2 || e.cat === 6 || e.group === "cardio" ? 1.4 : e.compound ? 3.2 : 2.6;
  let reps = Math.round(20 / period);
  const dur = Math.min(30, Math.max(15, Math.round(reps * period)));
  return { hold, period: dur / reps, reps, dur };
}
const ease = (x) => x * x * (3 - 2 * x);
function phaseAt(plan, t) { // 0 — старт, 1 — финиш
  if (plan.hold) return t < 1.5 ? ease(t / 1.5) : 1;
  const x = (t % plan.period) / plan.period;
  return x < 0.12 ? 0 : x < 0.45 ? ease((x - 0.12) / 0.33) : x < 0.58 ? 1 : x < 0.95 ? 1 - ease((x - 0.58) / 0.37) : 0;
}
let demoRaf = 0;
function startDemo(an) {
  cancelAnimationFrame(demoRaf);
  const top = state.stack[state.stack.length - 1], e = exById(top.id), plan = demoPlan(e);
  const gif = an.querySelector("img.gif"), gc = an.querySelector("canvas.gifc");
  const f1 = an.querySelector(".f1"), ph = an.querySelector(".ph"), cap = document.getElementById("demo-cap"), rep = document.getElementById("demo-rep");
  const ar = document.getElementById("anim-r"), tl = document.getElementById("demo-t"), btn = $app.querySelector("[data-anim=toggle]"), spd = $app.querySelector("[data-anim=speed]");
  const st = { t: 0, playing: true, speed: 1, last: performance.now() };
  const steps = e.steps;
  const paint = () => {
    const t = Math.min(st.t, plan.dur), p = phaseAt(plan, t);
    if (f1) f1.style.opacity = p;
    an.style.setProperty("--zoom", 1 + 0.04 * p);
    if (ph) ph.style.transform = `scale(${1 + 0.25 * p})`;
    const si = Math.min(steps.length - 1, Math.floor((t / plan.dur) * steps.length));
    cap.textContent = steps[si];
    rep.textContent = plan.hold ? (t < plan.dur ? `Держи · ${Math.ceil(plan.dur - t)} с` : "Готово") : `Повтор ${Math.min(plan.reps, Math.floor(t / plan.period) + 1)} / ${plan.reps}`;
    ar.value = Math.round(t * 10); tl.textContent = `${fmt(Math.floor(t))} / ${fmt(plan.dur)}`;
  };
  // GIF нельзя поставить на паузу: на паузе показываем текущий кадр на canvas
  const freeze = (v) => {
    if (!gif || !gc) return;
    if (v && gif.complete && gif.naturalWidth) { gc.width = gif.naturalWidth; gc.height = gif.naturalHeight; try { gc.getContext("2d").drawImage(gif, 0, 0); } catch (err) {} gc.style.display = "block"; gif.style.visibility = "hidden"; }
    else { gc.style.display = "none"; gif.style.visibility = "visible"; }
  };
  const setPlaying = (v) => { st.playing = v; if (v && st.t >= plan.dur) st.t = 0; st.last = performance.now(); btn.textContent = v ? "❚❚" : "▶"; freeze(!v); };
  const loop = (now) => {
    if (!an.isConnected) return;
    if (st.playing) { st.t += ((now - st.last) / 1000) * st.speed; if (st.t >= plan.dur) { st.t = plan.dur; setPlaying(false); btn.textContent = "↻"; } }
    st.last = now; paint(); demoRaf = requestAnimationFrame(loop);
  };
  btn.onclick = () => { haptic(); setPlaying(!st.playing); };
  an.onclick = () => { haptic(); setPlaying(!st.playing); };
  if (spd) spd.onclick = () => { haptic(); const sp = { "1×": "0.5×", "0.5×": "2×", "2×": "1×" }[spd.textContent]; spd.textContent = sp; st.speed = parseFloat(sp); };
  ar.oninput = () => { st.t = +ar.value / 10; setPlaying(false); paint(); };
  paint(); demoRaf = requestAnimationFrame(loop);
}

  H.slice(0, 30).forEach((h) => (h.x || []).forEach(([id]) => (freq[id] = (freq[id] || 0) + 1)));
  const ex = Object.keys(freq).sort((a, b) => freq[b] - freq[a]).slice(0, 3);
