  if (t === "inbox") api({ action: "admin_inbox" }).then((r) => { if (r && r.ok) { adm.inbox = r.list; render(); } });
  if (t === "send") {
    api({ action: "admin_photo" }).then((r) => { if (r && r.ok) { adm.hasPhoto = r.has; if (!r.has) adm.photo = false; render(); } });
    api({ action: "admin_scheduled" }).then((r) => { if (r && r.ok) { adm.scheduled = r.list; render(); } });
    segCount();
  }
  if (t === "more") api({ action: "admin_cfg" }).then((r) => { if (r && r.ok) { adm.cfg = r.cfg; adm.bot = r.bot || ""; render(); } });
}
function segCount() { adm.segN = null; api({ action: "admin_count", seg: adm.seg }).then((r) => { if (r && r.ok) { adm.segN = r.n; render(); } }); }
function openUser(id) {
  adm.user = { id, loading: true }; adm.reply = ""; push({ type: "admin_user", id });
  api({ action: "admin_user", id }).then((r) => { if (r && r.ok) { adm.user = r; render(); } else { adm.user = { id, err: true }; render(); } });
  api({ action: "admin_read", id }).then(() => { if (adm.inbox) adm.inbox.forEach((c) => c.id === id && (c.unread = 0)); if (adm.data) adm.data.unread = Math.max(0, (adm.data.unread || 0) - 1); });
}

function adminBlock() {
  if (adm.flag.admin) return `<button class="row" data-admin style="padding:16px;margin-top:16px"><div class="grow"><div class="title" style="font-size:15px">🛠 Админ-панель</div><div class="sub" style="margin:4px 0 0">Пользователи, сообщения, рассылка, статистика</div></div><span class="swap">Открыть</span></button>`;
  if (adm.flag.claimable) return `<div class="card" style="margin-top:16px"><b>Вы владелец бота?</b><p class="muted" style="font-size:13px;margin:6px 0 12px">Админ-панель пока ни за кем не закреплена. Нажмите, и она станет доступна только с вашего аккаунта Telegram.</p><button class="btn" data-admin-claim>Стать администратором</button></div>`;
  return "";
}

// ---------- помощники ----------
const ruN = (n, a, b, c) => { const m = n % 10, h = n % 100; return n + " " + (m === 1 && h !== 11 ? a : m >= 2 && m <= 4 && (h < 12 || h > 14) ? b : c); };
const ruDate = (d) => { if (!d) return "—"; const [y, m, dd] = String(d).slice(0, 10).split("-"); return `${+dd}.${m}.${y.slice(2)}`; };
const ruTime = (ts) => { const d = new Date(ts); return d.toLocaleDateString("ru-RU", { day: "numeric", month: "short" }) + ", " + d.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" }); };
const uName = (u) => esc([u.f, u.l].filter(Boolean).join(" ") || "Без имени");
const goalName = (id) => (GOALS.find((g) => g.id === id) || {}).name || id;
const levelName = (id) => (LEVELS.find((g) => String(g.id) === String(id)) || {}).name || id;
const placeName = (id) => (PLACES.find((g) => g.id === id) || {}).name || id;
const exName = (id) => { try { const e = exById(id); return e ? e.name : id; } catch (e) { return id; } };
const kv = (k, v) => `<div style="display:flex;justify-content:space-between;gap:12px"><span class="muted">${k}</span><b style="text-align:right">${v}</b></div>`;
const tile = (v, k) => `<div class="card" style="padding:14px"><div style="font:700 26px var(--display);color:var(--lime)">${v}</div><div class="muted" style="font-size:12px;margin-top:4px">${k}</div></div>`;
const grid3 = (a) => `<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">${a.join("")}</div>`;
const field = "width:100%;box-sizing:border-box;background:var(--bg);color:inherit;border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;font-size:15px";

// столбики за 30 дней; нажатие на столбик показывает значение
function admBars(id, title, days, vals) {
  const max = Math.max(1, ...vals), W = 300, H = 90, bw = W / vals.length;
  const total = vals.reduce((a, b) => a + b, 0);
  const bars = vals.map((v, i) => {
    const h = v ? Math.max(3, (v / max) * (H - 14)) : 0, x = i * bw;
    return `<g data-tip="${id}|${ruDate(days[i])}: ${v}"><rect x="${x}" y="0" width="${bw}" height="${H}" fill="transparent"/>${h ? `<rect x="${x + 1}" y="${H - h}" width="${bw - 2}" height="${h}" rx="2" fill="var(--lime)"/>` : ""}</g>`;
  }).join("");
  return `<div class="card" style="margin-top:8px"><div style="display:flex;justify-content:space-between;align-items:baseline"><b style="font-size:14px">${title}</b><span class="muted" style="font-size:12px" id="tip-${id}">за 30 дней: ${total}</span></div>
    <svg viewBox="0 0 ${W} ${H + 1}" style="width:100%;height:auto;margin-top:10px;display:block"><line x1="0" y1="${H + 0.5}" x2="${W}" y2="${H + 0.5}" stroke="var(--line)"/>${bars}</svg>
    <div class="muted" style="display:flex;justify-content:space-between;font-size:11px;margin-top:4px"><span>${ruDate(days[0])}</span><span>макс. ${max} в день</span><span>сегодня</span></div></div>`;
}
// горизонтальные полоски «что популярнее»
function hBars(title, obj, nameFn, empty = "Пока нет данных") {
  const rows = Object.entries(obj || {}).sort((a, b) => b[1] - a[1]).slice(0, 8), max = Math.max(1, ...rows.map((r) => r[1]));
  return `<div class="card" style="margin-top:8px"><b style="font-size:14px">${title}</b>${rows.length ? rows.map(([k, v]) => `
    <div style="margin-top:10px"><div style="display:flex;justify-content:space-between;font-size:13px"><span>${esc(nameFn(k))}</span><b>${v}</b></div>
    <div style="height:6px;border-radius:4px;background:var(--surface-2);margin-top:4px;overflow:hidden"><i style="display:block;height:100%;width:${(v / max) * 100}%;background:var(--lime);border-radius:4px"></i></div></div>`).join("") : `<p class="muted" style="font-size:13px;margin:8px 0 0">${empty}</p>`}</div>`;
}

// ---------- экраны ----------
function viewAdmin() {
  const D = adm.data;
  const head = `<div class="top"><div><button class="back" data-back style="background:var(--surface)">‹ Назад</button><div class="h1" style="margin-top:16px">Админ-панель</div></div>
    <button class="swap" data-admin-reload style="align-self:flex-end">${adm.loading ? "…" : "Обновить"}</button></div>`;
  if (!D) return head + `<div class="card" style="text-align:center;padding:32px">${adm.err ? `<p>${esc(adm.err)}</p><button class="btn" data-admin-reload style="margin-top:12px">Повторить</button>` : "Загружаю…"}</div>`;
  const tabs = [["overview", "Обзор"], ["inbox", "Сообщения" + (D.unread ? ` (${D.unread})` : "")], ["send", "Рассылка"], ["people", "Люди"], ["more", "Ещё"]];
  const bar = `<div class="chips" style="margin-bottom:12px">${tabs.map(([k, n]) => `<button class="chip ${adm.tab === k ? "active" : ""}" data-admin-tab="${k}">${n}</button>`).join("")}</div>`;
  const body = { overview: admOverview, inbox: admInbox, send: admSend, people: admPeople, more: admMore }[adm.tab](D);
  return head + bar + body;
}

function admOverview(D) {
  const R = D.ret, base = D.retBase;
  const ret = { "Один день": R.d0, "2–4 дня": R.d1_3, "5–8 дней": R.d4_7, "9–31 день": R.d8_30, "Больше месяца": R.d30 };
  return `
  ${grid3([tile(D.total, "всего"), tile(D.actWeek, "активны за неделю"), tile(D.reminders, "с напоминаниями")])}
  <div class="card" style="margin-top:8px;font-size:14px;line-height:1.9">
    ${kv("Новые: сегодня / неделя / месяц", `${D.newDay} / ${D.newWeek} / ${D.newMonth}`)}
    ${kv("Активные: сегодня / неделя / месяц", `${D.actDay} / ${D.actWeek} / ${D.actMonth}`)}
    ${kv("Тренировок / пробежек всего", `${D.workouts} / ${D.runs}`)}
    ${kv("Заблокировали бота / в бане", `${D.blocked} / ${D.banned}`)}
  </div>
  ${D.webhook ? "" : `<div class="card" style="margin-top:8px"><b>Бот пока не отвечает на /start</b><p class="muted" style="font-size:13px;margin:6px 0 12px">Подключите, чтобы бот здоровался с новыми людьми, принимал сообщения и записывал всех в список.</p><button class="btn" data-admin-webhook>Подключить</button></div>`}
  <div class="section"><div class="section-head"><div class="h2">Графики</div><span class="muted" style="font-size:12px">нажмите на столбик</span></div>
    ${admBars("new", "Новые пользователи", D.days, D.newBy)}
    ${admBars("dau", "Заходили в приложение", D.days, D.dau)}
    ${hBars("Сколько дней люди пользуются", Object.fromEntries(Object.entries(ret).filter(([, v]) => v)), (k) => k, "Появится через неделю: считаем тех, кто пришёл 7+ дней назад")}
    ${base ? `<p class="muted" style="font-size:12px;margin:6px 4px 0">Из ${ruN(base, "человека", "человек", "человек")}, пришедших неделю назад и раньше, ${D.ret.alive} всё ещё заходят.</p>` : ""}
  </div>
  <div class="section"><div class="section-head"><div class="h2">Популярное</div></div>
    ${hBars("Цели", D.goals, goalName)}
    ${hBars("Упражнения (топ у пользователей)", D.ex, exName, "Появится, когда люди начнут тренироваться")}
    ${hBars("Уровень", D.levels, levelName)}
    ${hBars("Где тренируются", D.places, placeName)}
    ${hBars("Откуда пришли", D.sources, (k) => k, "Создайте ссылки во вкладке «Ещё»")}
  </div>`;
}

function admInbox() {
  const L = adm.inbox;
  if (!L) return `<div class="card muted">Загружаю…</div>`;
  if (!L.length) return `<div class="card"><b>Пока нет сообщений</b><p class="muted" style="font-size:13px;margin:6px 0 0">Всё, что люди пишут боту, появится здесь. Бот также пришлёт вам уведомление в чат: ответьте на него свайпом влево, и ответ уйдёт человеку от лица бота.</p></div>`;
  return `<div class="list">${L.map((c) => `<button class="row" data-admin-user="${c.id}" style="padding:12px 16px;display:block;text-align:left;width:100%">
    <div style="display:flex;justify-content:space-between;gap:8px"><b style="font-size:14px">${uName(c)}${c.unread ? ` <span style="background:var(--lime);color:#000;border-radius:999px;padding:1px 7px;font-size:12px">${c.unread}</span>` : ""}</b><span class="muted" style="font-size:12px;white-space:nowrap">${ruTime(c.last)}</span></div>
    <div class="muted" style="font-size:13px;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${c.d === "out" ? "Вы: " : ""}${esc(c.t)}</div></button>`).join("")}</div>`;
}

function segOptions(D) {
  const o = [["all", "Все"], ["new7", "Новые за неделю"], ["act7", "Активные за неделю"], ["idle7", "Не заходили 7+ дней"], ["idle30", "Не заходили 30+ дней"], ["noapp", "Нажали /start, но не открыли приложение"]];
  GOALS.forEach((g) => o.push(["goal:" + g.id, "Цель: " + g.name]));
  LEVELS.forEach((g) => o.push(["level:" + g.id, "Уровень: " + g.name]));
  PLACES.forEach((g) => o.push(["place:" + g.id, "Место: " + g.name]));
  Object.keys(D.sources || {}).forEach((s) => o.push(["src:" + s, "Источник: " + s]));
  return o;
}
function admSend(D) {
  const S = adm.sending, busy = S && !S.done, opts = segOptions(D);
  const segName = (opts.find((o) => o[0] === adm.seg) || ["", "Все"])[1];
  const limit = adm.photo ? 1024 : 4096;
  const sch = adm.scheduled || [];
  const stLabel = (b) => b.status === "done" ? `отправлено ${b.sent}${b.failed ? `, не доставлено ${b.failed}` : ""}` : b.status === "run" ? `идёт: ${b.sent} отправлено` : "ждёт отправки";
  return `
  <div class="card">
    <div class="sub" style="margin:0 0 6px">Кому</div>
    <select id="adm-seg" style="${field};appearance:auto" ${busy ? "disabled" : ""}>${opts.map(([k, n]) => `<option value="${esc(k)}" ${adm.seg === k ? "selected" : ""}>${esc(n)}</option>`).join("")}</select>
    <div class="muted" style="font-size:13px;margin-top:6px">${adm.segN == null ? "Считаю получателей…" : `Получат: ${ruN(adm.segN, "человек", "человека", "человек")}`}</div>
    <div class="sub" style="margin:14px 0 6px">Текст</div>
    <textarea id="adm-text" rows="5" maxlength="${limit}" placeholder="Сообщение. {name} заменится на имя человека" style="${field};resize:vertical" ${busy ? "disabled" : ""}>${esc(adm.text)}</textarea>
    <div class="pr" style="padding:12px 0 0"><span>Кнопка «Открыть приложение»</span><button class="toggle ${adm.button ? "on" : ""}" data-admin-btn><i></i></button></div>
    <div class="pr" style="padding:12px 0 0"><div><span>Картинка</span><div class="muted" style="font-size:12px;margin-top:2px">${adm.hasPhoto ? "Последнее фото, которое вы прислали боту. До 1024 символов текста" : "Пришлите фото боту в чат, и оно появится здесь"}</div></div>
      <button class="toggle ${adm.photo ? "on" : ""}" data-admin-photo ${adm.hasPhoto ? "" : 'style="opacity:.4;pointer-events:none"'}><i></i></button></div>
    <div class="sub" style="margin:14px 0 6px">Когда</div>
    <div class="chips" style="margin:0;padding:0"><button class="chip ${adm.when === "now" ? "active" : ""}" data-admin-when="now">Сейчас</button><button class="chip ${adm.when === "later" ? "active" : ""}" data-admin-when="later">Запланировать</button></div>
    ${adm.when === "later" ? `<input type="datetime-local" id="adm-at" value="${esc(adm.at)}" style="${field};margin-top:10px"><div class="muted" style="font-size:12px;margin-top:6px">По вашему времени. Сервер рассылает партиями по ~40 человек каждые 15 минут.</div>` : ""}
    ${S ? `<p style="margin:12px 0 0">${S.done ? `Готово: доставлено ${S.sent}${S.failed ? `, не доставлено ${S.failed}` : ""}.` : `Отправляю… ${S.sent + S.failed} из ${S.total}. Не закрывайте приложение.`}</p>` : ""}
    <div style="display:flex;gap:8px;margin-top:14px"><button class="btn" data-admin-test style="flex:1;background:var(--surface-2);color:inherit">Себе</button>
      <button class="btn" data-admin-send style="flex:2" ${busy ? "disabled" : ""}>${adm.when === "later" ? "Запланировать" : "Отправить"}</button></div>
    <div class="muted" style="font-size:12px;margin-top:8px">Сегмент: ${esc(segName)}. Заблокировавшие бота и забаненные не получат.</div>
  </div>
  ${sch.length ? `<div class="section"><div class="section-head"><div class="h2">Запланированные и прошлые</div></div><div class="list">${sch.map((b) => `
    <div class="row" style="padding:12px 16px;display:block"><div style="display:flex;justify-content:space-between;gap:8px"><b style="font-size:14px">${ruTime(b.at)}</b>${b.status === "wait" ? `<button class="swap" data-admin-unsch="${esc(b.key)}">Отменить</button>` : ""}</div>
    <div class="muted" style="font-size:12px;margin-top:4px">${esc(b.segName || b.seg)} · ${stLabel(b)}${b.photo ? " · с картинкой" : ""}</div>
    <div style="font-size:13px;margin-top:6px;white-space:pre-wrap">${esc(String(b.text).slice(0, 200))}</div></div>`).join("")}</div></div>` : ""}`;
}

function admPeople(D) {
  return `<input id="adm-q" placeholder="Поиск по имени, @нику или ID" value="${esc(adm.q)}" style="${field}">
  <div id="adm-people">${admPeopleList(D)}</div>`;
}
function admPeopleList(D) {
  const q = adm.q.trim().toLowerCase();
  const L = D.users.filter((u) => !q || [u.f, u.l, u.n, String(u.id)].join(" ").toLowerCase().includes(q)).slice(0, 200);
  return `<div class="muted" style="font-size:12px;margin:8px 4px">Найдено: ${L.length}. Сортировка по последней активности.</div>
  <div class="list">${L.map((u) => `<button class="row" data-admin-user="${u.id}" style="padding:12px 16px;display:block;text-align:left;width:100%">
    <div style="display:flex;justify-content:space-between;gap:8px"><b style="font-size:14px">${uName(u)}${u.x ? ' <span class="muted">· бан</span>' : u.b ? ' <span class="muted">· заблокировал</span>' : ""}</b><span class="muted" style="font-size:12px;white-space:nowrap">${ruDate(u.a || u.s)}</span></div>
    <div class="muted" style="font-size:12px;margin-top:4px">${u.n ? "@" + esc(u.n) + " · " : ""}${ruN(u.w || 0, "тренировка", "тренировки", "тренировок")} · ${ruN(u.r || 0, "пробежка", "пробежки", "пробежек")}${u.g ? " · " + esc(goalName(u.g)) : ""}${!u.a ? " · приложение не открывал" : ""}</div></button>`).join("") || '<div class="card muted">Никого не нашли</div>'}</div>`;
}

function admMore() {
  const C = adm.cfg;
  if (!C) return `<div class="card muted">Загружаю…</div>`;
  const link = (s) => `https://t.me/${adm.bot}?start=${encodeURIComponent(s)}`;
  const srcs = Object.entries((adm.data && adm.data.sources) || {}).sort((a, b) => b[1] - a[1]);
  return `
  <div class="section" style="margin-top:0"><div class="section-head"><div class="h2">Автосообщения</div></div>
    <div class="card">
      <div class="pr" style="padding:0"><div><b>«Давно не тренировался»</b><div class="muted" style="font-size:12px;margin-top:4px">В 18:00 по времени человека, один раз после перерыва</div></div><button class="toggle ${C.nudge ? "on" : ""}" data-admin-cfg="nudge"><i></i></button></div>
      ${C.nudge ? `<div class="chips" style="margin:12px 0 0;padding:0">${[3, 5, 7, 14].map((d) => `<button class="chip ${C.nudgeDays === d ? "active" : ""}" data-admin-ndays="${d}" style="height:32px;padding:0 12px;font-size:13px">через ${d} дн.</button>`).join("")}</div>
      <textarea id="adm-ntext" rows="3" style="${field};margin-top:12px;resize:vertical">${esc(C.nudgeText)}</textarea>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px"><span class="muted" style="font-size:12px">{name} — имя, {days} — дней без тренировок</span><button class="swap" data-admin-ntext>Сохранить</button></div>` : ""}
      <div class="pr" style="padding:16px 0 0;margin-top:16px;border-top:1px solid var(--line)"><div><b>Поздравления с рубежами</b><div class="muted" style="font-size:12px;margin-top:4px">10, 25, 50, 100, 200, 300 и 500 тренировок</div></div><button class="toggle ${C.milestones ? "on" : ""}" data-admin-cfg="milestones"><i></i></button></div>
    </div></div>
  <div class="section"><div class="section-head"><div class="h2">Ссылки-источники</div></div>
    <div class="card">
      <p class="muted" style="font-size:13px;margin:0 0 10px">Создайте отдельную ссылку для каждого места, где рекламируетесь. В «Обзоре» будет видно, сколько людей пришло по каждой.</p>
      <input id="adm-src" placeholder="Название латиницей, например instagram" value="${esc(adm.srcName)}" style="${field}">
      <div id="adm-srclink">${srcLink()}</div>
    </div>
    ${srcs.length ? `<div class="list" style="margin-top:8px">${srcs.map(([s, n]) => `<div class="row" style="padding:12px 16px"><div class="grow"><b style="font-size:14px">${esc(s)}</b><div class="muted" style="font-size:12px;margin-top:2px">${ruN(n, "человек", "человека", "человек")}</div></div><button class="swap" data-admin-copy="${esc(link(s))}">Копировать</button></div>`).join("")}</div>` : ""}
  </div>
  <div class="section"><div class="section-head"><div class="h2">Выгрузка</div></div>
    <div class="card"><p class="muted" style="font-size:13px;margin:0 0 12px">Бот пришлёт вам в чат файл со всеми пользователями. Он открывается в Excel и Google Таблицах.</p><button class="btn" data-admin-export>Выгрузить в Excel</button></div>
  </div>`;
}

function srcLink() {
  const nm = adm.srcName.replace(/[^\w-]/g, ""), link = `https://t.me/${adm.bot}?start=${encodeURIComponent(nm)}`;
  return nm && adm.bot ? `<div style="margin-top:10px;font-size:14px;word-break:break-all">${esc(link)}</div><button class="btn" data-admin-copy="${esc(link)}" style="margin-top:10px">Скопировать ссылку</button>` : "";
}

function viewAdminUser() {
  const R = adm.user || {};
  const head = `<div class="top"><div><button class="back" data-back style="background:var(--surface)">‹ Назад</button></div></div>`;
  if (R.loading) return head + `<div class="card muted">Загружаю…</div>`;

function adminSend() {
  const text = adm.text.trim(); if (!text) { toast("Напишите текст"); return; }
  const segName = (segOptions(adm.data).find((o) => o[0] === adm.seg) || ["", ""])[1];
  const payload = { text, button: adm.button ? "Открыть приложение" : "", photo: adm.photo ? 1 : 0, seg: adm.seg };
  const ask = (q, fn) => (tg && tg.showConfirm ? tg.showConfirm(q, (ok) => ok && fn()) : confirm(q) && fn());
  if (adm.when === "later") {
    const at = adm.at && new Date(adm.at);
    if (!at || isNaN(at) || at < Date.now()) { toast("Выберите время в будущем"); return; }
    api({ action: "admin_schedule", ...payload, segName, at: at.toISOString() }).then((r) => {
      if (r && r.ok) { toast("Рассылка запланирована"); adm.text = ""; adminTab("send"); } else toast("Не получилось запланировать");
    });
    return;
  }
  const n = adm.segN == null ? "" : ` ${ruN(adm.segN, "человеку", "людям", "людям")}`;
  ask(`Отправить сообщение${n}?`, () => {
    adm.sending = { sent: 0, failed: 0, total: adm.segN || 0, done: false }; render();
    const step = (offset) => api({ action: "admin_send", ...payload, offset }).then((r) => {
      if (!r || !r.ok) { adm.sending.done = true; toast("Рассылка прервалась, проверь интернет"); render(); return; }
      adm.sending.sent += r.sent; adm.sending.failed += r.failed; adm.sending.total = r.total;
      if (r.done) { adm.sending.done = true; adm.text = ""; render(); } else { render(); step(r.next); }
    });
    step(0);
  });
}

// Markdown ответа → HTML (заголовки, списки, жирный, таблицы)
function mdHtml(md) {
  const inl = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/(^|[^*])\*(?!\s)([^*]+?)\*(?!\*)/g, "$1<i>$2</i>").replace(/`([^`]+)`/g, "<code>$1</code>");
  const cells = (l) => l.trim().replace(/^\||\|$/g, "").split("|").map((x) => x.trim());
  const lines = md.split("\n"), out = [];
  let list = null;
  const closeList = () => { if (list) { out.push(`</${list}>`); list = null; } };
  for (let i = 0; i < lines.length; i++) {
    const l = lines[i];
    let m;
    if (/^\s*\|.*\|\s*$/.test(l)) {
      closeList();
      const rows = [];
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) { if (!/^[\s|:-]+$/.test(lines[i])) rows.push(cells(lines[i])); i++; }
      i--;
      out.push(`<div class="md-table"><table>${rows.map((r, ri) => `<tr>${r.map((c) => (ri ? `<td${c.length <= 12 ? ' class="n"' : ""}>${inl(c)}</td>` : `<th>${inl(c.replace(/\*\*/g, ""))}</th>`)).join("")}</tr>`).join("")}</table></div>`);
    } else if ((m = /^\s*#{1,6}\s+(.*)$/.exec(l))) { closeList(); out.push(`<div class="md-h">${inl(m[1].replace(/\*\*/g, ""))}</div>`); }
    else if ((m = /^\s*[-*•]\s+(.*)$/.exec(l))) { if (list !== "ul") { closeList(); out.push("<ul>"); list = "ul"; } out.push(`<li>${inl(m[1])}</li>`); }
    else if ((m = /^\s*\d+[.)]\s+(.*)$/.exec(l))) { if (list !== "ol") { closeList(); out.push("<ol>"); list = "ol"; } out.push(`<li>${inl(m[1])}</li>`); }
    else if (/^\s*(---|\*\*\*)\s*$/.test(l)) { closeList(); out.push("<hr>"); }
    else if (!l.trim()) closeList();
    else { closeList(); out.push(`<p>${inl(l)}</p>`); }
  }
  closeList();
  return out.join("");
}

const TRACKS = [{"f": "volatile-reaction", "t": "Volatile Reaction", "d": 165}, {"f": "hitman", "t": "Hitman", "d": 200}, {"f": "movement-proposition", "t": "Movement Proposition", "d": 141}, {"f": "clash-defiant", "t": "Clash Defiant", "d": 375}, {"f": "exhilarate", "t": "Exhilarate", "d": 145}, {"f": "raving-energy", "t": "Raving Energy", "d": 267}, {"f": "ouroboros", "t": "Ouroboros", "d": 161}, {"f": "rocket", "t": "Rocket", "d": 146}, {"f": "burnt-spirit", "t": "Burnt Spirit", "d": 114}, {"f": "digital-lemonade", "t": "Digital Lemonade", "d": 180}, {"f": "severe-tire-damage", "t": "Severe Tire Damage", "d": 411}, {"f": "killers", "t": "Killers", "d": 305}];
// ===================== МУЗЫКА ДЛЯ ТРЕНИРОВКИ =====================
// Источник: список deep house с Jamendo (music/jamendo.json, поток с их серверов), иначе треки Kevin MacLeod (CC BY 4.0) из music/*.mp3.
// Список TRACKS собирает build.py из tools/music-log.txt. Мини-плеер сверху виден на всех экранах.
const music = { on: false, i: 0, playing: false, shuffle: true, order: [], audio: null };
try { Object.assign(music, JSON.parse(localStorage.getItem("music") || "{}"), { on: false, playing: false, audio: null }); } catch (e) {}
const saveMusic = () => { try { localStorage.setItem("music", JSON.stringify({ i: music.i, shuffle: music.shuffle })); } catch (e) {} };

function musicAudio() {
  if (music.audio) return music.audio;
  const a = new Audio();
  a.preload = "auto";
  a.addEventListener("ended", () => musicNext());
  a.addEventListener("play", () => { music.playing = true; renderMusicBar(); if (chatOpenMusic()) render(); });
  a.addEventListener("pause", () => { music.playing = false; renderMusicBar(); if (chatOpenMusic()) render(); });
  a.addEventListener("error", () => { if (music.on) setTimeout(musicNext, 400); });
  if ("mediaSession" in navigator) {
    try {
      navigator.mediaSession.setActionHandler("play", () => musicPlay());
      navigator.mediaSession.setActionHandler("pause", () => a.pause());
      navigator.mediaSession.setActionHandler("nexttrack", () => musicNext());
      navigator.mediaSession.setActionHandler("previoustrack", () => musicPrev());
    } catch (e) {}
  }
  return (music.audio = a);
}
function musicLoad(i) {
  if (!TRACKS.length) return;
  music.i = ((i % TRACKS.length) + TRACKS.length) % TRACKS.length;
  const t = TRACKS[music.i], a = musicAudio();
  a.src = t.u || "music/" + t.f + ".mp3";
  if ("mediaSession" in navigator && window.MediaMetadata) { try { navigator.mediaSession.metadata = new MediaMetadata({ title: t.t, artist: t.a || "Kevin MacLeod", album: "AI-Тренер" }); } catch (e) {} }
  saveMusic();
}
function musicPlay() {
  if (!TRACKS.length) { toast("Музыка скоро появится"); return; }
  const a = musicAudio();
  if (!a.src) musicLoad(music.i || 0);
  music.on = true;
  const p = a.play(); if (p && p.catch) p.catch(() => toast("Нажми ▶ ещё раз, чтобы включить звук"));
  renderMusicBar();
}
function musicToggle() { const a = musicAudio(); if (music.playing) a.pause(); else musicPlay(); }
function musicNext() {
  const n = music.shuffle && TRACKS.length > 2 ? (music.i + 1 + Math.floor(Math.random() * (TRACKS.length - 1))) % TRACKS.length : music.i + 1;
  musicLoad(n); musicPlay();
}
function musicPrev() { const a = musicAudio(); if (a.currentTime > 5) { a.currentTime = 0; return; } musicLoad(music.i - 1); musicPlay(); }

const timer = { mode: "interval", work: 40, rest: 20, rounds: 8, preset: 90, running: false, phase: "work", round: 1, left: 40, total: 40, elapsed: 0, laps: [] };
let ticker = null, audioCtx = null;
function beep(freq = 880, dur = 0.12) {
  try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.frequency.value = freq; o.connect(g); g.connect(audioCtx.destination);
    g.gain.setValueAtTime(0.2, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur); o.start(); o.stop(audioCtx.currentTime + dur);
  } catch (e) {}
}
function resetTimer() {
  timer.running = false; timer.phase = "work"; timer.round = 1; timer.elapsed = 0; timer.laps = [];
  timer.left = timer.total = timer.mode === "interval" ? timer.work : timer.mode === "rest" ? timer.preset : 0;
  stopTicker();
}
function stopTicker() { if (ticker) { clearInterval(ticker); ticker = null; } }
function tick() {
  if (timer.mode === "stopwatch") { timer.elapsed++; return paintTimer(); }
  timer.left--;
  if (timer.left <= 3 && timer.left > 0) beep(660, 0.08);
  if (timer.left <= 0) {
    if (timer.mode === "rest") { beep(990, 0.4); notify(); timer.running = false; stopTicker(); timer.left = 0; return render(); }
    if (timer.phase === "work") { timer.phase = "rest"; timer.left = timer.total = timer.rest; beep(520, 0.3); haptic("heavy"); }
    else if (timer.round < timer.rounds) { timer.round++; timer.phase = "work"; timer.left = timer.total = timer.work; beep(990, 0.3); haptic("heavy"); }
    else { beep(990, 0.6); notify(); timer.running = false; stopTicker(); timer.phase = "done"; return render(); }
  }
  paintTimer();
}
function paintTimer() {
  const fg = document.getElementById("ring-fg"); if (!fg) return;
  const C = 2 * Math.PI * 140;
  const p = timer.mode === "stopwatch" ? (timer.elapsed % 60) / 60 : timer.total ? timer.left / timer.total : 0;
  fg.style.strokeDashoffset = C * (1 - p);
  fg.classList.toggle("rest", timer.phase === "rest");
  document.getElementById("t-time").textContent = fmt(timer.mode === "stopwatch" ? timer.elapsed : timer.left);
  const ph = document.getElementById("t-phase");
  if (ph) ph.textContent = timer.mode === "interval" ? (timer.phase === "done" ? "Готово!" : timer.phase === "work" ? "Работа" : "Отдых") : timer.mode === "rest" ? "Отдых" : "Секундомер";
  const rd = document.getElementById("t-round"); if (rd) rd.textContent = `Раунд ${timer.round} из ${timer.rounds}`;
}

function lineChart(values, labels, unit = "") {
  const W = 340, H = 180, P = { l: 34, r: 12, t: 16, b: 26 };
  let min = Math.min(...values), max = Math.max(...values); if (max === min) { max += 1; min = Math.max(0, min - 1); }
  min = Math.floor(min * 0.95); max = Math.ceil(max * 1.03);
  const x = (i) => P.l + (values.length === 1 ? (W - P.l - P.r) / 2 : (i * (W - P.l - P.r)) / (values.length - 1));
  const y = (v) => P.t + (H - P.t - P.b) * (1 - (v - min) / (max - min));
  const pts = values.map((v, i) => `${x(i)},${y(v)}`).join(" "), last = values.length - 1;
  const ticks = [0, 1, 2, 3].map((k) => min + ((max - min) * k) / 3);
  const step = Math.max(1, Math.ceil(values.length / 4));
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">
    <defs><linearGradient id="limeFade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ccff00" stop-opacity=".35"/><stop offset="1" stop-color="#ccff00" stop-opacity="0"/></linearGradient></defs>
    ${ticks.map((t) => `<line class="grid-line" x1="${P.l}" x2="${W - P.r}" y1="${y(t)}" y2="${y(t)}"/><text class="axis" x="${P.l - 6}" y="${y(t) + 4}" text-anchor="end">${Math.round(t)}</text>`).join("")}
    <polygon class="area" points="${x(0)},${H - P.b} ${pts} ${x(last)},${H - P.b}"/><polyline class="line" points="${pts}"/>
    ${labels.map((l, i) => (i % step === 0 || i === last) ? `<text class="axis" x="${x(i)}" y="${H - 6}" text-anchor="${i === last && last ? "end" : "middle"}">${l}</text>` : "").join("")}
    <circle class="dot" cx="${x(last)}" cy="${y(values[last])}" r="6"/>
    <text class="val" x="${x(last) - 10}" y="${y(values[last]) - 12}" text-anchor="end">${values[last]}${unit}</text></svg>`;
}
function barChart(values, labels) {
  const W = 340, H = 170, P = { l: 6, r: 6, t: 20, b: 24 }, max = Math.max(1, ...values), bw = (W - P.l - P.r) / values.length;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${values.map((v, i) => { const h = Math.max(v ? 4 : 2, (H - P.t - P.b) * (v / max)); const hi = i === values.length - 1;
    return `<rect class="bar ${hi ? "hi" : ""}" x="${P.l + i * bw + 4}" y="${H - P.b - h}" width="${bw - 8}" height="${h}" rx="6"/>
    ${v ? `<text class="val" x="${P.l + i * bw + bw / 2}" y="${H - P.b - h - 6}" text-anchor="middle">${v}</text>` : ""}
    <text class="axis" x="${P.l + i * bw + bw / 2}" y="${H - 6}" text-anchor="middle">${labels[i]}</text>`; }).join("")}</svg>`;
}
function runWeeks() {
  const mon = mondayOf(), kms = Array(8).fill(0), labels = [];
  for (let i = 7; i >= 0; i--) { const d = new Date(mon); d.setDate(d.getDate() - i * 7); labels.push(i === 0 ? "эта" : String(d.getDate())); }
  (store.runs || []).forEach((x) => { const w = Math.floor((mon - mondayOf(new Date(x.d))) / (7 * 864e5)); if (w >= 0 && w < 8) kms[7 - w] += x.m / 1000; });
  return `<div class="card section" style="margin-top:10px"><div class="section-head"><div><div class="eyebrow">Бег, км в неделю</div><div class="big-num" style="margin-top:6px">${kms[7].toFixed(1)} <span style="font-size:18px">км</span></div></div><span class="muted" style="font-size:13px">8 недель</span></div>${barChart(kms.map((k) => Math.round(k * 10) / 10), labels)}</div>`;

const RUN_ATTR = '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>';
const RUN_TILES_2 = "https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}";

// --- загрузка Leaflet по требованию (сначала своя копия, затем CDN) ---
let leafletP = null;
function loadLeaflet() {
  if (window.L) return Promise.resolve(window.L);
  if (leafletP) return leafletP;
  const add = (src, css) => new Promise((ok, fail) => {
    const l = document.createElement("link"); l.rel = "stylesheet"; l.href = css; document.head.appendChild(l);
    const s = document.createElement("script"); s.src = src; s.onload = () => ok(window.L); s.onerror = fail; document.head.appendChild(s);
  });
  leafletP = add("vendor/leaflet/leaflet.js", "vendor/leaflet/leaflet.css")
    .catch(() => add("https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js", "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"))
    .catch(() => { leafletP = null; return null; });
  return leafletP;
}

// --- математика ---
function distM(a, b) {
  const R = 6371000, r = Math.PI / 180, dLa = (b[0] - a[0]) * r, dLo = (b[1] - a[1]) * r;
  const h = Math.sin(dLa / 2) ** 2 + Math.cos(a[0] * r) * Math.cos(b[0] * r) * Math.sin(dLo / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
const paceStr = (secPerKm) => (!isFinite(secPerKm) || secPerKm <= 0 || secPerKm > 3600 ? "—" : `${Math.floor(secPerKm / 60)}:${String(Math.round(secPerKm % 60)).padStart(2, "0")}`);
const hms = (s) => { s = Math.floor(s); const h = Math.floor(s / 3600); return h ? `${h}:${String(Math.floor((s % 3600) / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}` : fmt(s); };
const km = (m) => (m / 1000).toFixed(2);
const runWeight = () => (store.profile && store.profile.weight) || 70;
// ккал: бег ≈ 1 ккал на кг на км, ходьба ≈ 0,6
const kcalFor = (meters, mps) => runWeight() * (meters / 1000) * (mps > 1.8 ? 1.03 : 0.62);

// --- состояние текущей пробежки (store.run сохраняется, чтобы пережить перезагрузку) ---
const geo = { watch: null, poll: null, fix: null, err: null, wake: null, tick: null };
const runElapsed = (r = store.run) => (r ? (r.acc + (r.seg ? Date.now() - r.seg : 0)) / 1000 : 0);
function runPacing(r) {
  // текущий темп по последним ~30 с движения
  const pts = r.segs[r.segs.length - 1] || [];
  if (pts.length < 2) return Infinity;
  const last = pts[pts.length - 1]; let d = 0, i = pts.length - 1;
  while (i > 0 && last[2] - pts[i - 1][2] <= 30) { d += distM(pts[i - 1], pts[i]); i--; }
  const t = last[2] - pts[i][2];
  if (runElapsed(r) - last[2] > 12) return Infinity; // давно не двигались
  return d > 15 && t > 0 ? t / (d / 1000) : Infinity;
}

function onFix(c) {
  geo.fix = c; geo.err = null;
  const r = store.run;
  if (r && r.seg) {
    const acc = c.accuracy || 99;
    const p = [c.latitude, c.longitude, Math.round(runElapsed(r) * 10) / 10, c.altitude != null ? Math.round(c.altitude * 10) / 10 : null];
    let seg = r.segs[r.segs.length - 1];
    if (!seg) { seg = []; r.segs.push(seg); }
    const prev = seg[seg.length - 1];
    if (acc <= (prev ? 30 : 50)) {
      if (!prev) { seg.push(p); runMapAdd(p, true); }
      else {
        const d = distM(prev, p), dt = Math.max(0.5, p[2] - prev[2]);
        if (d >= 5 && d / dt < 12) {
          seg.push(p); r.m += d; r.k += kcalFor(d, d / dt);
          if (p[3] != null && acc <= 20) { if (r.alt == null) r.alt = p[3]; else if (p[3] - r.alt > 3) { r.up += p[3] - r.alt; r.alt = p[3]; } else if (r.alt - p[3] > 3) r.alt = p[3]; }
          const kmDone = Math.floor(r.m / 1000);
          if (kmDone > r.sp.length) { const t = p[2] - r.sp.reduce((a, b) => a + b, 0); r.sp.push(Math.round(t)); runCue(kmDone, p[2], t); }
          runMapAdd(p, false);
          if (Date.now() - (geo.saved || 0) > 8000) { geo.saved = Date.now(); save(); }
        }
      }
    }
  }
  else if (!r && runDot && runMap) { runDot.setLatLng([c.latitude, c.longitude]); runMap.panTo([c.latitude, c.longitude]); }
  paintRun();
}
function onGeoErr(e) {
  geo.err = e && e.code === 1 ? "denied" : "nofix";
  if (e && e.code === 1 && tryTelegramLocation()) return;
  paintRun();
}
// В некоторых версиях Telegram браузерная геолокация закрыта — тогда берём координаты через LocationManager бота
function tryTelegramLocation() {
  const lm = tg && tg.LocationManager;
  if (!lm || geo.poll) return false;
  const go = () => {
    if (!lm.isLocationAvailable) { geo.err = "denied"; paintRun(); return; }
    const once = () => lm.getLocation((d) => { if (!d) { if (!lm.isAccessGranted) { geo.err = "denied"; clearInterval(geo.poll); geo.poll = null; paintRun(); } return; }
      onFix({ latitude: d.latitude, longitude: d.longitude, altitude: d.altitude, accuracy: d.horizontal_accuracy || 20 }); });
    once(); geo.poll = setInterval(once, 3000);
  };
  try { lm.inited ? go() : lm.init(go); return true; } catch (e) { return false; }
}
function geoStart() {
  if (geo.watch != null || geo.poll) return;
  if (navigator.geolocation) geo.watch = navigator.geolocation.watchPosition((p) => onFix(p.coords), onGeoErr, { enableHighAccuracy: true, maximumAge: 0, timeout: 30000 });
  else if (!tryTelegramLocation()) { geo.err = "nogeo"; paintRun(); }
}
function geoStop() {
  if (geo.watch != null) { navigator.geolocation.clearWatch(geo.watch); geo.watch = null; }
  if (geo.poll) { clearInterval(geo.poll); geo.poll = null; }
}
async function wakeOn() { try { if (navigator.wakeLock && !geo.wake) { geo.wake = await navigator.wakeLock.request("screen"); geo.wake.addEventListener("release", () => (geo.wake = null)); } } catch (e) {} }
function wakeOff() { try { geo.wake && geo.wake.release(); } catch (e) {} geo.wake = null; }
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && store.run) { wakeOn(); paintRun(); } });

function speak(text) {
  if (!store.profile || store.profile.voice === false) return;
  try { const u = new SpeechSynthesisUtterance(text); u.lang = "ru-RU"; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch (e) {}
}
const ruMin = (s) => { const m = Math.floor(s / 60), sec = Math.round(s % 60); return `${m} ${plural(m, "минута", "минуты", "минут")}${sec ? ` ${sec} ${plural(sec, "секунда", "секунды", "секунд")}` : ""}`; };
function runCue(kmN, total, split) { notify(); speak(`${kmN} ${plural(kmN, "километр", "километра", "километров")}. Время ${ruMin(total)}. Темп ${ruMin(split)} на километр.`); }

function runStart() {
  store.run = { d: new Date().toISOString(), acc: 0, seg: Date.now(), segs: [[]], m: 0, k: 0, up: 0, alt: null, sp: [] };
  save(); notify(); wakeOn(); geoStart();
  if (geo.fix) onFix(geo.fix);
  speak("Старт. Удачной пробежки!");
  render();
}
function runPause() { const r = store.run; if (!r || !r.seg) return; r.acc += Date.now() - r.seg; r.seg = null; save(); haptic("medium"); speak("Пауза"); render(); }
function runResume() { const r = store.run; if (!r || r.seg) return; r.seg = Date.now(); r.segs.push([]); save(); haptic("medium"); speak("Продолжаем"); render(); }
function simplify(pts, max) { if (pts.length <= max) return pts; const step = pts.length / max, out = []; for (let i = 0; i < max; i++) out.push(pts[Math.floor(i * step)]); out.push(pts[pts.length - 1]); return out; }
function runFinish(quiet) {
  const r = store.run; if (!r) return;
  if (r.seg) { r.acc += Date.now() - r.seg; r.seg = null; }
  const s = Math.round(r.acc / 1000);
  geoStop(); wakeOff(); store.run = null;
  if (s < 20 && r.m < 30) { save(); if (!quiet) { render(); toast("Слишком короткая пробежка, не сохранил"); } return; }
  const total = r.segs.reduce((a, g) => a + g.length, 0), maxPts = 900;
  const segs = r.segs.filter((g) => g.length).map((g) => simplify(g, Math.max(2, Math.round((g.length / Math.max(1, total)) * maxPts))).map((p) => [Math.round(p[0] * 1e5) / 1e5, Math.round(p[1] * 1e5) / 1e5, Math.round(p[2])]));
  const run = { d: r.d, s, m: Math.round(r.m), k: Math.round(r.k), up: Math.round(r.up), sp: r.sp, segs };
  store.runs.unshift(run); save(); notify();
  if (quiet) return;
  speak(`Пробежка завершена. ${km(r.m).replace(".", ",")} километра за ${ruMin(s)}.`);
  state.stack = [{ type: "run", i: 0, fresh: true }]; render(); window.scrollTo(0, 0);
}

// --- карта ---
let runMap = null, runLine = null, runDot = null;
function killMap() { if (runMap) { try { runMap.remove(); } catch (e) {} } runMap = runLine = runDot = null; }
function runMapAdd(p, newSeg) {
  if (!runMap || !window.L) return;
  if (newSeg || !runLine) runLine = L.polyline([], { color: "#ccff00", weight: 5, opacity: 0.95 }).addTo(runMap);
  runLine.addLatLng([p[0], p[1]]);
  if (runDot) runDot.setLatLng([p[0], p[1]]);
  runMap.panTo([p[0], p[1]], { animate: true });
}
let mapMounting = false;
async function mountMap(el, segs, opts = {}) {
  mapMounting = true;
  const Lf = await loadLeaflet();
  mapMounting = false;
  if (!Lf || !el.isConnected) { if (!Lf) el.innerHTML = `<div class="map-off">Карта не загрузилась. Маршрут сохранён и появится, когда будет интернет.</div>`; return; }
  killMap();
  el.innerHTML = "";
  runMap = Lf.map(el, { zoomControl: false, attributionControl: true, dragging: !opts.live, scrollWheelZoom: false, tap: false }).setView(opts.center || [55.75, 37.62], opts.center ? 16 : 11);
  runMap.attributionControl.setPrefix(false);
  const tl = Lf.tileLayer(RUN_TILES, { maxZoom: 19, attribution: RUN_ATTR, className: "tiles-dark" }).addTo(runMap);
  let bad = 0, ok = 0;
  tl.on("tileload", () => ok++);
  tl.on("tileerror", () => { if (++bad === 3 && !ok && runMap) { runMap.removeLayer(tl); Lf.tileLayer(RUN_TILES_2, { maxZoom: 19, attribution: RUN_ATTR_2, className: "tiles-dark" }).addTo(runMap); } });
  const all = [];
  segs.forEach((g) => { if (g.length) { runLine = Lf.polyline(g.map((p) => [p[0], p[1]]), { color: "#ccff00", weight: 5, opacity: 0.95 }).addTo(runMap); g.forEach((p) => all.push([p[0], p[1]])); } });
  if (opts.live) {
    const here = all.length ? all[all.length - 1] : opts.center;
    if (here) runDot = Lf.circleMarker(here, { radius: 8, color: "#000", weight: 3, fillColor: "#ccff00", fillOpacity: 1 }).addTo(runMap);
    if (here) runMap.setView(here, 16);
  } else if (all.length) {
    Lf.circleMarker(all[0], { radius: 7, color: "#000", weight: 3, fillColor: "#3ddc84", fillOpacity: 1 }).addTo(runMap).bindTooltip("Старт");
    Lf.circleMarker(all[all.length - 1], { radius: 7, color: "#000", weight: 3, fillColor: "#ff4d4d", fillOpacity: 1 }).addTo(runMap).bindTooltip("Финиш");
    runMap.fitBounds(all, { padding: [28, 28] });
  }
}

// --- экраны ---
function runStatsBlock(o) {
  return `<div class="run-grid">
    <div><span class="eyebrow">Дистанция</span><b id="r-dist">${km(o.m)}</b><small>км</small></div>
    <div><span class="eyebrow">${o.live ? "Темп сейчас" : "Средний темп"}</span><b id="r-pace">${paceStr(o.pace)}</b><small>мин/км</small></div>
    <div><span class="eyebrow">Калории</span><b id="r-kcal">${Math.round(o.k)}</b><small>ккал</small></div>
    <div><span class="eyebrow">${o.live ? "Ср. темп" : "Скорость"}</span><b id="r-avg">${o.live ? paceStr(o.s / (o.m / 1000)) : (o.m / 1000 / (o.s / 3600) || 0).toFixed(1)}</b><small>${o.live ? "мин/км" : "км/ч"}</small></div>
    <div><span class="eyebrow">${o.live ? "Скорость" : "Подъём"}</span><b id="r-speed">${o.live ? (o.m / 1000 / (o.s / 3600) || 0).toFixed(1) : o.up}</b><small>${o.live ? "км/ч" : "м"}</small></div>
    <div><span class="eyebrow">${o.live ? "Подъём" : "Шаги ≈"}</span><b id="r-up">${o.live ? Math.round(o.up) : Math.round(o.m / 1.05).toLocaleString("ru")}</b><small>${o.live ? "м" : "шагов"}</small></div>
  </div>`;
}
function gpsLabel() {
  if (geo.err === "denied") return `<span class="gps bad">● Нет доступа к геолокации</span>`;
  if (geo.err === "nogeo") return `<span class="gps bad">● Геолокация недоступна</span>`;
  if (!geo.fix) return `<span class="gps wait">● Ищу GPS…</span>`;
  const a = Math.round(geo.fix.accuracy || 0);
  return `<span class="gps ${a <= 15 ? "ok" : a <= 35 ? "wait" : "bad"}">● GPS ${a <= 15 ? "отличный" : a <= 35 ? "нормальный" : "слабый"} · ±${a} м</span>`;
}
function viewRun() {
  geoStart();
  const r = store.run;
  if (r) {
    const s = runElapsed(r);
    return `
    <div class="top"><div><div class="eyebrow" id="r-gps">${gpsLabel()}</div><div class="run-clock" id="r-time">${hms(s)}</div></div></div>
    <div class="run-map live" id="run-map"></div>
    ${runStatsBlock({ live: true, m: r.m, k: r.k, s, up: r.up, pace: runPacing(r) })}
    ${r.sp.length ? `<div class="muted" style="font-size:13px;margin-top:10px">Последний км: <b style="color:#fff">${paceStr(r.sp[r.sp.length - 1])}</b> мин/км</div>` : ""}
    <div class="run-ctl">${r.seg ? `<button class="btn dark" data-run="pause">❚❚ Пауза</button>` : `<button class="btn" data-run="resume">▶ Продолжить</button>`}
      <button class="btn outline" data-run="finish">■ Завершить</button></div>
    <div class="muted" style="font-size:12px;text-align:center;margin-top:12px">Не блокируй экран: при блокировке телефон приостанавливает Telegram, и GPS перестаёт писать маршрут.</div>`;
  }
  const R = store.runs, mon = mondayOf();
  const weekM = R.filter((x) => new Date(x.d) >= mon).reduce((a, x) => a + x.m, 0), allM = R.reduce((a, x) => a + x.m, 0);
  const best = R.filter((x) => x.m >= 1000).map((x) => x.s / (x.m / 1000)).sort((a, b) => a - b)[0];
  const p = store.profile;
  return `
  <div class="top"><div><div class="eyebrow" id="r-gps">${gpsLabel()}</div><div class="h1" style="margin-top:8px">Бег</div></div></div>
  <div class="run-map" id="run-map"></div>
  <button class="run-start" data-run="start" ${geo.err ? 'style="opacity:.5"' : ""}><span>Старт</span></button>
  ${geo.err === "denied" ? `<div class="coach"><div class="ava">!</div><p>Разреши Telegram доступ к геопозиции: на iPhone Настройки → Telegram → Геопозиция → «При использовании», на Android Настройки → Приложения → Telegram → Разрешения → Местоположение. Затем открой экран бега снова.</p></div>` : ""}
  <div class="stats" style="margin-top:16px">
    <div class="stat"><div class="big-num lime">${km(weekM)}</div><div class="eyebrow">км за неделю</div></div>
    <div class="stat"><div class="big-num">${km(allM)}</div><div class="eyebrow">км всего</div></div>
    <div class="stat"><div class="big-num">${best ? paceStr(best) : "—"}</div><div class="eyebrow">лучший темп</div></div>
  </div>
  <div class="card section" style="margin-top:12px">
    <div class="pr"><div>Вес для расчёта калорий</div><div class="wt-stepper"><button data-wt="-1">−</button><b>${runWeight()} кг</b><button data-wt="1">+</button></div></div>
    <div class="pr"><div>Голосовые подсказки каждый км</div><button class="toggle ${p.voice === false ? "" : "on"}" data-voice aria-label="Голос"><i></i></button></div>
  </div>
  ${R.length ? `<div class="section"><div class="section-head"><div class="h2">Пробежки</div></div><div class="list">${R.slice(0, 5).map(runRow).join("")}</div></div>` : ""}`;
}
function runRow(x) {
  const i = store.runs.indexOf(x), d = new Date(x.d);
  return `<button class="hist" style="width:100%;text-align:left" data-runview="${i}"><div class="date-box"><b>${d.getDate()}</b><small>${DAYS[dow(d)]}</small></div>
    <div style="flex:1;min-width:0"><div style="font-weight:700">🏃 Бег · ${km(x.m)} км</div>
    <div class="hist-meta"><span>⏱ <b>${hms(x.s)}</b></span><span>⚡ <b>${paceStr(x.s / (x.m / 1000))}</b> /км</span><span>🔥 <b>${x.k}</b> ккал</span></div></div></button>`;
}
function viewRunDetail(v) {
  const x = store.runs[v.i];
  if (!x) return `<div class="empty" style="margin-top:40px"><b>Пробежка не найдена</b></div>`;
  const d = new Date(x.d), maxSp = Math.max(...x.sp, 1), minSp = Math.min(...x.sp);
  const tail = x.m - x.sp.length * 1000;
  return `
  <div class="top"><div><button class="back" data-back style="background:var(--surface)">‹ Назад</button>
    <div class="eyebrow" style="margin-top:16px">${d.getDate()} ${MONTHS_SHORT[d.getMonth()]} · ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}</div>
    <div class="h1" style="margin-top:8px">${v.fresh ? "Отличная <span class=\"lime\">пробежка!</span>" : "Пробежка"}</div></div></div>
  <div class="run-map big" id="run-map"></div>
  <div class="run-hero"><div><b>${km(x.m)}</b><span>км</span></div><div><b>${hms(x.s)}</b><span>время</span></div></div>
  ${runStatsBlock({ live: false, m: x.m, k: x.k, s: x.s, up: x.up, pace: x.s / (x.m / 1000) })}
  ${x.sp.length ? `<div class="section"><div class="section-head"><div class="h2">Темп по километрам</div></div>
    <div class="card"><div class="bar-list">${x.sp.map((t, i) => `<div class="br"><span>${i + 1} км</span><div class="tr"><i style="width:${(t / maxSp) * 100}%;${t === minSp && x.sp.length > 1 ? "" : "opacity:.55"}"></i></div><span>${paceStr(t)}</span></div>`).join("")}
    ${tail > 50 ? `<div class="br"><span>+${(tail / 1000).toFixed(2)}</span><div class="tr"></div><span></span></div>` : ""}</div>
    ${x.sp.length > 1 ? `<div class="muted" style="font-size:12px;margin-top:10px">Лучший километр: <b class="lime">${paceStr(minSp)}</b> мин/км</div>` : ""}</div></div>` : ""}
  <button class="danger-link" data-rundel="${v.i}">Удалить пробежку</button>`;
}
// обновление цифр без перерисовки всего экрана
function paintRun() {
  const g = document.getElementById("r-gps"); if (g) g.innerHTML = gpsLabel();
  const r = store.run; if (!r) { const top = state.stack[state.stack.length - 1]; if (!top && state.tab === "run" && !runMap && !mapMounting && geo.fix) afterRunRender(); return; }
  const s = runElapsed(r), set = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };
  set("r-time", hms(s)); set("r-dist", km(r.m)); set("r-pace", paceStr(runPacing(r))); set("r-kcal", Math.round(r.k));
  set("r-avg", paceStr(s / (r.m / 1000))); set("r-speed", (r.m / 1000 / (s / 3600) || 0).toFixed(1)); set("r-up", Math.round(r.up));
  const rb = document.getElementById("runbar"); if (rb) rb.querySelector("b").textContent = `${hms(s)} · ${km(r.m)} км`;
}
function afterRunRender() {
  const el = document.getElementById("run-map");
  if (!el) { killMap(); return; }
  const top = state.stack[state.stack.length - 1];
  if (top && top.type === "run") { const x = store.runs[top.i]; if (x) mountMap(el, x.segs); return; }
  const r = store.run, here = geo.fix ? [geo.fix.latitude, geo.fix.longitude] : null;
  if (r) mountMap(el, r.segs, { live: true, center: here });
  else if (here) mountMap(el, [], { live: true, center: here });
  else el.innerHTML = `<div class="map-off">${geo.err ? "Без доступа к геопозиции карта не покажет, где ты" : "Определяю, где ты…"}</div>`;
}
function renderRunBar() {
  let el = document.getElementById("runbar");
  const top = state.stack[state.stack.length - 1];
  const show = store.run && store.profile && !(state.tab === "run" && !top) && !(top && top.type === "session");
  document.body.classList.toggle("has-runbar", !!show);
  if (!show) { if (el) el.remove(); return; }
  if (!el) { el = document.createElement("button"); el.id = "runbar"; el.className = "runbar"; document.body.appendChild(el);
    el.onclick = () => { haptic(); go("run"); }; }
  el.innerHTML = `<span>🏃 ${store.run.seg ? "Бег идёт" : "Пауза"}</span><b>${hms(runElapsed())} · ${km(store.run.m)} км</b>`;
}
setInterval(() => { if (store.run) paintRun(); }, 1000);
// вкладку «Бег» убрали в v3.11: незавершённую пробежку сохраняем в историю, прошлые пробежки там же
if (store.run) runFinish(true);

// раз в день обновляем расписание на сервере напоминаний (план мог поменяться)
try { const today = new Date().toDateString(); if (remindCfg().on && localStorage.getItem("remind_sync") !== today) { syncRemind(); localStorage.setItem("remind_sync", today); } } catch (e) {}

render();
cloudLoad();
hello();

</script>
</body>
</html>
