<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>AI-Тренер</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #000;
  --surface: #111;
  --surface-2: #1a1a1a;
  --line: #262626;
  --text: #fff;
  --muted: #8a8a8a;
  --lime: #ccff00;
  --lime-dim: rgba(204, 255, 0, 0.14);
  --danger: #ff4d4d;
  --radius: 22px;
  --display: "Unbounded", system-ui, sans-serif;
  --body: "Inter", system-ui, -apple-system, sans-serif;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { background: var(--bg); color: var(--text); font-family: var(--body); }
body { min-height: 100vh; overscroll-behavior: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
img { display: block; }

#app { padding: 0 16px calc(96px + var(--safe-bottom)); max-width: 560px; margin: 0 auto; }
.screen { animation: fade .25s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* Typography */
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.h1 { font-family: var(--display); font-weight: 900; font-size: 40px; line-height: 1; letter-spacing: -.02em; text-transform: uppercase; }
.h2 { font-family: var(--display); font-weight: 700; font-size: 22px; line-height: 1.1; text-transform: uppercase; }
.h3 { font-family: var(--display); font-weight: 700; font-size: 16px; text-transform: uppercase; }
.lime { color: var(--lime); }
.muted { color: var(--muted); }
.big-num { font-family: var(--display); font-weight: 900; font-size: 34px; line-height: 1; }

.top { padding: 20px 0 16px; display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
.section { margin-top: 28px; }
.section-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }

/* Hero */
.hero { position: relative; border-radius: var(--radius); overflow: hidden; min-height: 300px; background: linear-gradient(135deg, #1d2400, #000 70%); display: flex; flex-direction: column; justify-content: flex-end; padding: 20px; }
.hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: grayscale(.2) contrast(1.1); }
.hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0) 20%, rgba(0,0,0,.92) 100%); }
.hero > *:not(img) { position: relative; z-index: 1; }
.tag { display: inline-flex; align-items: center; gap: 6px; background: var(--lime); color: #000; font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; padding: 6px 10px; border-radius: 999px; width: fit-content; }
.tag.ghost { background: rgba(255,255,255,.12); color: #fff; backdrop-filter: blur(8px); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 56px; padding: 0 24px; border-radius: 999px; background: var(--lime); color: #000; font-family: var(--display); font-weight: 700; font-size: 15px; text-transform: uppercase; letter-spacing: .02em; transition: transform .1s; }
.btn:active { transform: scale(.97); }
.btn.block { width: 100%; }
.btn.dark { background: var(--surface-2); color: #fff; }
.btn.outline { background: transparent; color: var(--lime); box-shadow: inset 0 0 0 2px var(--lime); }

/* Cards */
.card { background: var(--surface); border-radius: var(--radius); padding: 18px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--surface); border-radius: 18px; padding: 14px; }
.stat .big-num { font-size: 24px; }
.stat .eyebrow { font-size: 10px; margin-top: 6px; }

/* Week strip */
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.day { background: var(--surface); border-radius: 16px; padding: 10px 0; text-align: center; }
.day b { display: block; font-family: var(--display); font-size: 18px; margin-top: 4px; }
.day small { font-size: 11px; color: var(--muted); text-transform: uppercase; }
.day i { display: block; width: 6px; height: 6px; margin: 6px auto 0; border-radius: 50%; background: var(--line); }
.day.done i { background: var(--lime); }
.day.today { background: var(--lime); color: #000; }
.day.today small { color: #000; }
.day.today i { background: #000; }

/* Workout rows */
.list { display: flex; flex-direction: column; gap: 8px; }
.row { display: flex; align-items: center; gap: 14px; background: var(--surface); border-radius: 20px; padding: 10px; text-align: left; width: 100%; }
.thumb { position: relative; width: 64px; height: 64px; border-radius: 14px; overflow: hidden; flex: none; background: linear-gradient(135deg, #2a3300, #111); }
.thumb img { width: 100%; height: 100%; object-fit: cover; }
.row .grow { flex: 1; min-width: 0; }
.row .title { font-weight: 700; font-size: 16px; }
.row .sub { font-size: 13px; color: var(--muted); margin-top: 3px; }
.row .chev { color: var(--muted); font-size: 22px; padding-right: 6px; }
.row.rest { opacity: .55; }
.pill { font-size: 11px; font-weight: 700; padding: 4px 8px; border-radius: 999px; background: var(--lime-dim); color: var(--lime); text-transform: uppercase; }

/* Chips & search */
.chips { display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px; padding: 0 16px 4px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; height: 38px; padding: 0 16px; border-radius: 999px; background: var(--surface); font-weight: 600; font-size: 14px; }
.chip.active { background: var(--lime); color: #000; }
.search { width: 100%; height: 50px; border-radius: 16px; background: var(--surface); border: 0; color: #fff; font: inherit; padding: 0 16px; margin-bottom: 12px; outline: none; }
.search:focus { box-shadow: inset 0 0 0 2px var(--lime); }

.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { position: relative; border-radius: 20px; overflow: hidden; aspect-ratio: 3/4; background: linear-gradient(160deg, #2a3300, #0d0d0d); text-align: left; }
.tile img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.tile::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 35%, rgba(0,0,0,.9)); }
.tile .cap { position: absolute; left: 12px; right: 12px; bottom: 12px; z-index: 1; }
.tile .cap b { display: block; font-family: var(--display); font-size: 14px; text-transform: uppercase; line-height: 1.15; }
.tile .cap span { font-size: 12px; color: var(--lime); font-weight: 600; }

/* Detail */
.back { display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px 0 10px; border-radius: 999px; background: rgba(0,0,0,.55); backdrop-filter: blur(8px); font-weight: 600; font-size: 14px; }
.detail-hero { position: relative; margin: 0 -16px; height: 340px; background: linear-gradient(160deg, #2a3300, #000); overflow: hidden; }
.detail-hero img { width: 100%; height: 100%; object-fit: cover; }
.detail-hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.25), transparent 30%, #000); }
.detail-hero .back { position: absolute; top: 14px; left: 16px; z-index: 2; }
.detail-body { margin-top: -60px; position: relative; z-index: 1; }
.kv { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 18px; }
.kv div { background: var(--surface); border-radius: 16px; padding: 12px; }
.kv b { display: block; font-size: 15px; margin-top: 4px; }
.steps { counter-reset: s; display: flex; flex-direction: column; gap: 10px; }
.steps li { list-style: none; display: flex; gap: 12px; line-height: 1.45; font-size: 15px; }
.steps li::before { counter-increment: s; content: counter(s); flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--lime); color: #000; font-weight: 800; display: grid; place-items: center; font-size: 13px; }

.set-table { width: 100%; border-collapse: collapse; }
.set-table td { padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
.set-table td:last-child { text-align: right; font-weight: 700; }

/* Timer */
.seg { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--surface); border-radius: 999px; padding: 4px; }
.seg button { height: 42px; border-radius: 999px; font-weight: 600; font-size: 14px; color: var(--muted); }
.seg button.active { background: var(--lime); color: #000; }
.ring-wrap { position: relative; width: min(78vw, 320px); aspect-ratio: 1; margin: 28px auto 20px; }
.ring-wrap svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring-bg { fill: none; stroke: var(--surface-2); stroke-width: 14; }
.ring-fg { fill: none; stroke: var(--lime); stroke-width: 14; stroke-linecap: round; transition: stroke-dashoffset .25s linear; }
.ring-fg.rest { stroke: #fff; }
.ring-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.ring-center .time { font-family: var(--display); font-weight: 900; font-size: clamp(48px, 17vw, 76px); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.ring-center .phase { font-family: var(--display); font-weight: 700; font-size: 14px; text-transform: uppercase; letter-spacing: .1em; color: var(--lime); }
.controls { display: flex; gap: 10px; justify-content: center; }
.controls .btn { flex: 1; }
.round-btn { width: 56px; height: 56px; flex: none !important; padding: 0; }
.steppers { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 16px; }
.stepper { background: var(--surface); border-radius: 18px; padding: 12px 8px; text-align: center; }
.stepper .val { font-family: var(--display); font-weight: 700; font-size: 20px; margin: 6px 0; }
.stepper .pm { display: flex; justify-content: center; gap: 8px; }
.stepper .pm button { width: 34px; height: 34px; border-radius: 50%; background: var(--surface-2); font-size: 18px; font-weight: 700; }
.presets { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 16px; }
.presets button { height: 52px; border-radius: 16px; background: var(--surface); font-family: var(--display); font-weight: 700; }
.presets button.active { background: var(--lime); color: #000; }
.laps { margin-top: 16px; }

/* History */
.heat { display: grid; grid-template-columns: repeat(12, 1fr); grid-auto-flow: column; grid-template-rows: repeat(7, 1fr); gap: 4px; }
.heat i { aspect-ratio: 1; border-radius: 4px; background: var(--surface-2); }
.heat i.l1 { background: rgba(204,255,0,.3); }
.heat i.l2 { background: rgba(204,255,0,.6); }
.heat i.l3 { background: var(--lime); }
.month { margin: 22px 0 10px; }
.hist { background: var(--surface); border-radius: 20px; padding: 16px; display: flex; gap: 14px; align-items: center; }
.date-box { width: 56px; flex: none; text-align: center; border-right: 1px solid var(--line); padding-right: 12px; }
.date-box b { display: block; font-family: var(--display); font-size: 24px; }
.date-box small { font-size: 11px; color: var(--muted); text-transform: uppercase; }
.hist-meta { display: flex; gap: 12px; margin-top: 6px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
.hist-meta b { color: #fff; }

/* Charts */
.chart { width: 100%; height: auto; display: block; }
.chart .grid-line { stroke: var(--line); stroke-width: 1; }
.chart .axis { fill: var(--muted); font-size: 11px; font-family: var(--body); }
.chart .line { fill: none; stroke: var(--lime); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.chart .area { fill: url(#limeFade); }
.chart .dot { fill: #000; stroke: var(--lime); stroke-width: 3; }
.chart .bar { fill: var(--surface-2); }
.chart .bar.hi { fill: var(--lime); }
.chart .val { fill: #fff; font-size: 11px; font-weight: 700; font-family: var(--body); }
.delta { font-weight: 700; color: var(--lime); font-size: 14px; }
.pr { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--line); }
.pr:last-child { border-bottom: 0; }
.pr b { font-family: var(--display); font-size: 18px; }

/* Tab bar */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: grid; grid-template-columns: repeat(6, 1fr); padding: 8px 4px calc(8px + var(--safe-bottom)); background: rgba(0,0,0,.86); backdrop-filter: blur(16px); border-top: 1px solid var(--line); }
.tabbar button { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; color: var(--muted); font-size: 10px; font-weight: 600; }
.tabbar svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.tabbar button.active { color: var(--lime); }
.tabbar.hidden { display: none; }

.toast { position: fixed; left: 50%; bottom: calc(100px + var(--safe-bottom)); transform: translateX(-50%); background: var(--lime); color: #000; font-weight: 700; padding: 12px 18px; border-radius: 999px; z-index: 20; animation: fade .2s; white-space: nowrap; }

/* ---------- v2: онбординг, сессия, пустые состояния ---------- */
.ob { min-height: 100vh; display: flex; flex-direction: column; padding-top: 20px; padding-bottom: 24px; }
.ob-progress { display: grid; grid-auto-flow: column; gap: 6px; margin-bottom: 28px; }
.ob-progress i { height: 4px; border-radius: 4px; background: var(--surface-2); }
.ob-progress i.on { background: var(--lime); }
.ob-sub { color: var(--muted); font-size: 15px; line-height: 1.45; margin-top: 12px; }
.ob-foot { margin-top: auto; padding-top: 24px; display: flex; gap: 10px; }
.ob-foot .btn { flex: 1; }
.opts { display: flex; flex-direction: column; gap: 10px; margin-top: 24px; }
.opt { position: relative; display: flex; align-items: center; gap: 14px; background: var(--surface); border-radius: 20px; padding: 16px; text-align: left; width: 100%; box-shadow: inset 0 0 0 2px transparent; transition: box-shadow .15s, background .15s; }
.opt .emo { width: 48px; height: 48px; border-radius: 14px; background: var(--surface-2); display: grid; place-items: center; font-size: 24px; flex: none; }
.opt b { display: block; font-size: 17px; }
.opt small { display: block; color: var(--muted); font-size: 13px; margin-top: 3px; line-height: 1.35; }
.opt.on { box-shadow: inset 0 0 0 2px var(--lime); background: #141a00; }
.opt.on .emo { background: var(--lime); }
.opt-photo { overflow: hidden; min-height: 110px; align-items: flex-end; }
.opt-photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .55; }
.opt-photo::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(0,0,0,.85), rgba(0,0,0,.2)); }
.opt-photo > div { position: relative; z-index: 1; }
.eq { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 24px; }
.eq button { background: var(--surface); border-radius: 18px; padding: 14px 12px; text-align: left; box-shadow: inset 0 0 0 2px transparent; min-height: 74px; }
.eq button span { font-size: 22px; display: block; }
.eq button b { display: block; font-size: 14px; margin-top: 6px; }
.eq button.on { box-shadow: inset 0 0 0 2px var(--lime); background: #141a00; }
.eq button.on b { color: var(--lime); }
.row2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(60px, 1fr)); gap: 8px; margin-top: 12px; }
.row2 button { height: 52px; border-radius: 16px; background: var(--surface); font-family: var(--display); font-weight: 700; }
.row2 button.on { background: var(--lime); color: #000; }
.label { margin-top: 26px; }

.icon-btn { width: 44px; height: 44px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; font-size: 20px; flex: none; }
.coach { display: flex; gap: 12px; align-items: flex-start; background: var(--surface); border-radius: 20px; padding: 14px; margin-top: 12px; }
.coach .ava { width: 36px; height: 36px; border-radius: 50%; background: var(--lime); color: #000; display: grid; place-items: center; font-weight: 900; font-family: var(--display); font-size: 13px; flex: none; }
.coach p { font-size: 14px; line-height: 1.45; }
.mini-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.mini-tags span { font-size: 12px; padding: 5px 9px; border-radius: 999px; background: var(--surface-2); color: #ddd; }

.empty { text-align: center; padding: 48px 24px; background: var(--surface); border-radius: var(--radius); }
.empty .big { font-size: 44px; }
.empty b { display: block; font-family: var(--display); text-transform: uppercase; font-size: 16px; margin-top: 12px; }
.empty p { color: var(--muted); font-size: 14px; line-height: 1.45; margin-top: 8px; }
.empty .btn { margin-top: 18px; }

.ex-card { background: var(--surface); border-radius: 20px; padding: 12px; }
.ex-card.done { box-shadow: inset 0 0 0 2px var(--lime); }
.ex-head { display: flex; gap: 12px; align-items: center; }
.ex-head .grow { flex: 1; min-width: 0; }
.ex-head .title { font-weight: 700; font-size: 16px; }
.ex-head .sub { font-size: 13px; color: var(--muted); margin-top: 3px; }
.swap { font-size: 12px; font-weight: 700; color: var(--lime); padding: 8px 10px; border-radius: 999px; background: var(--lime-dim); }
.sets { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; align-items: center; }
.set { min-width: 46px; height: 42px; padding: 0 10px; border-radius: 12px; background: var(--surface-2); font-weight: 700; font-size: 14px; }
.set.on { background: var(--lime); color: #000; }
.w-input { width: 84px; height: 42px; border-radius: 12px; background: var(--surface-2); border: 0; color: #fff; font: inherit; font-weight: 700; text-align: center; outline: none; }
.w-input:focus { box-shadow: inset 0 0 0 2px var(--lime); }
.restbar { position: fixed; left: 16px; right: 16px; bottom: calc(84px + var(--safe-bottom)); z-index: 15; background: var(--lime); color: #000; border-radius: 18px; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; font-weight: 800; animation: fade .2s; }
.restbar b { font-family: var(--display); font-size: 22px; }
.restbar button { font-weight: 800; font-size: 14px; padding: 6px 12px; border-radius: 999px; background: rgba(0,0,0,.12); }
.groups { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.groups button { height: 54px; border-radius: 16px; background: var(--surface); font-weight: 600; font-size: 14px; }
.groups button.on { background: var(--lime); color: #000; }
.bar-list .br { display: grid; grid-template-columns: 90px 1fr 34px; gap: 10px; align-items: center; margin: 10px 0; font-size: 13px; }
.bar-list .tr { height: 10px; border-radius: 6px; background: var(--surface-2); overflow: hidden; }
.bar-list .tr i { display: block; height: 100%; background: var(--lime); border-radius: 6px; }
.bar-list .br span:last-child { text-align: right; color: var(--muted); }
.danger-link { color: var(--danger); font-weight: 600; font-size: 14px; padding: 12px; display: block; margin: 16px auto 0; }

/* вся база и подборка */
.chip.ghost { background: transparent; box-shadow: inset 0 0 0 1.5px var(--surface-2); color: #ddd; font-weight: 500; }
.tile-db::after { background: linear-gradient(180deg, transparent 35%, rgba(0,0,0,.92)) !important; }
.in-basket { position: absolute; top: 10px; right: 10px; z-index: 2; width: 28px; height: 28px; border-radius: 50%; background: var(--lime); color: #000; font-weight: 900; display: grid; place-items: center; }
.pics { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pics figure { margin: 0; border-radius: 16px; overflow: hidden; background: var(--surface); position: relative; aspect-ratio: 1; }
.pics img { width: 100%; height: 100%; object-fit: cover; }
.pics figcaption { position: absolute; left: 8px; bottom: 8px; background: #000; color: var(--lime); font-size: 11px; font-weight: 700; padding: 4px 8px; border-radius: 999px; text-transform: uppercase; }
.basket-bar { position: fixed; left: 16px; right: 16px; bottom: calc(84px + var(--safe-bottom)); z-index: 14; display: flex; gap: 8px; }
.basket-bar .grow { height: 52px; border-radius: 999px; background: var(--lime); color: #000; font-family: var(--display); font-weight: 700; font-size: 14px; text-transform: uppercase; box-shadow: 0 8px 30px rgba(0,0,0,.6); }
.basket-bar .x { width: 52px; height: 52px; border-radius: 50%; background: var(--surface-2); color: #fff; font-size: 16px; box-shadow: 0 8px 30px rgba(0,0,0,.6); }
.ph { position: absolute; inset: 0; display: grid; place-items: center; font-size: 64px; background: radial-gradient(circle at 50% 40%, #3a4a00, #0d0d0d 70%); }
.thumb .ph { font-size: 28px; }
.anim { position: absolute; inset: 0; cursor: pointer; overflow: hidden; --zoom: 1; }
.anim img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scale(var(--zoom)); }
.anim .f1 { opacity: 0; }
.demo-cap { position: absolute; left: 16px; right: 16px; bottom: 76px; z-index: 2; font-weight: 600; font-size: 15px; line-height: 1.3; text-shadow: 0 1px 8px #000; }
.demo-rep { position: absolute; top: 18px; right: 16px; z-index: 2; background: var(--lime); color: #000; font-weight: 800; font-size: 13px; padding: 7px 12px; border-radius: 999px; }
.anim-ctl { display: flex; align-items: center; gap: 10px; margin: 0 0 16px; padding: 8px; border-radius: 999px; background: rgba(20,20,20,.88); backdrop-filter: blur(12px); }
.anim-ctl .play, .anim-ctl .spd { flex: none; width: 40px; height: 40px; border-radius: 50%; background: var(--lime); color: #000; font-weight: 900; font-size: 13px; }
.anim-ctl .spd { width: auto; padding: 0 12px; border-radius: 999px; background: var(--surface-2); color: #fff; }
.anim-ctl .lbl { font-size: 11px; font-weight: 700; color: var(--muted, #999); text-transform: uppercase; }
.anim-ctl input { flex: 1; accent-color: var(--lime); min-width: 0; }
/* бег */
.gps { text-transform: none; letter-spacing: 0; font-size: 13px; }
.gps.ok { color: var(--lime); } .gps.wait { color: #ffc23d; } .gps.bad { color: var(--danger); }
.run-map { position: relative; height: 230px; border-radius: 22px; overflow: hidden; background: var(--surface); margin-top: 4px; z-index: 0; }
.run-map.live { height: 260px; }
.run-map.big { height: 320px; }
.map-off { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; color: var(--muted); font-size: 14px; }
.leaflet-container { background: #111 !important; font: inherit; }
.leaflet-control-attribution { background: rgba(0,0,0,.6) !important; color: #777 !important; font-size: 9px !important; }
.leaflet-control-attribution a { color: #999 !important; }
.run-start { display: grid; place-items: center; width: 150px; height: 150px; margin: -60px auto 0; position: relative; z-index: 2; border-radius: 50%; background: var(--lime); color: #000; box-shadow: 0 0 0 10px #000, 0 0 50px rgba(204,255,0,.35); }
.run-start span { font-family: var(--display); font-weight: 900; font-size: 26px; text-transform: uppercase; }
.run-start:active { transform: scale(.96); }
.run-clock { font-family: var(--display); font-weight: 900; font-size: 64px; line-height: 1; margin-top: 8px; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.run-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
.run-grid > div { background: var(--surface); border-radius: 18px; padding: 12px; min-width: 0; }
.run-grid .eyebrow { font-size: 10px; letter-spacing: .08em; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.run-grid b { display: block; font-family: var(--display); font-size: 22px; margin-top: 8px; font-variant-numeric: tabular-nums; }
.run-grid small { color: var(--muted); font-size: 12px; }
.run-grid > div:first-child b { color: var(--lime); }
.run-ctl { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
.run-hero { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
.run-hero > div { background: var(--lime); color: #000; border-radius: 20px; padding: 14px 16px; }
.run-hero b { display: block; font-family: var(--display); font-weight: 900; font-size: 34px; line-height: 1; }
.run-hero span { font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
.stepper { display: flex; align-items: center; gap: 10px; }
.stepper button { width: 34px; height: 34px; border-radius: 50%; background: var(--surface-2); color: #fff; font-size: 18px; font-weight: 700; }
.toggle { width: 52px; height: 30px; border-radius: 999px; background: var(--surface-2); position: relative; flex: none; }
.toggle i { position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #666; transition: .2s; }
.toggle.on { background: var(--lime); } .toggle.on i { left: 25px; background: #000; }
.runbar { position: fixed; left: 16px; right: 16px; top: calc(10px + env(safe-area-inset-top)); z-index: 16; display: flex; justify-content: space-between; align-items: center; background: var(--lime); color: #000; border-radius: 999px; padding: 10px 16px; font-weight: 800; font-size: 14px; box-shadow: 0 8px 30px rgba(0,0,0,.6); }
.runbar b { font-variant-numeric: tabular-nums; }
body.has-runbar .screen { padding-top: 46px; }
.tiles-dark { filter: invert(1) hue-rotate(180deg) brightness(.9) contrast(.9) saturate(.6); }

гравитационный жим","Anti-Gravity Press","f","cei","barbell",1,0,1,"Лягте грудью на наклонную скамью, возьмите штангу с пола прямым хватом. / Подтяните гриф к груди. / Выжмите штангу вперёд параллельно полу и верните.",2],["Arm_Circles","Круги руками","Arm Circles","f","e","",1,1,0,"Встаньте, руки в стороны параллельно полу. / Делайте небольшие круги вытянутыми руками. / Смените направление вращения.",2],["Arnold_Dumbbell_Press","Жим Арнольда","Arnold Dumbbell Press","f","i","dumbbells",2,0,1,"Сядьте, гантели у груди, ладони к себе. / Выжимайте вверх, разворачивая ладони вперёд. / Опускайте, возвращая ладони к себе.",2],["Around_The_Worlds","«Вокруг света» с гантелями","Around The Worlds","a","f","dumbbells",2,0,1,"Лягте на скамью, гантели у бёдер ладонями вверх, локти чуть согнуты. / Ведите руки по дуге через стороны до положения над головой. / Верните тем же путём.",2],["Atlas_Stone_Trainer","Тренажёр для камней Атласа","Atlas Stone Trainer","d","hjnml","other",2,5,1,"Встаньте над снарядом, обхватите его руками, согнувшись в тазу. / Поднимите вес к груди разгибанием ног и таза. / Выпрямитесь полностью и опустите.",2],["Atlas_Stones","Камни Атласа","Atlas Stones","d","kphojnmcle","other",3,5,1,"Камень между стоп, обхватите его руками снизу. / Подтяните камень к корпусу и поднимите на бёдра. / Мощно разогнитесь и закиньте камень на платформу.",2],["Axle_Deadlift","Становая тяга с толстым грифом","Axle Deadlift","d","jnmcle","other",2,5,1,"Гриф над серединой стоп, стопы на ширине таза. / Возьмитесь разнохватом, спина ровная. / Поднимите вес разгибанием ног и таза.",2],["Back_Flyes_-_With_Bands","Обратные разведения с резинкой","Back Flyes - With Bands","f","ci","bands",1,0,1,"Закрепите резинку за опору, держите рукояти перед собой. / Разведите прямые руки в стороны, сводя лопатки. / Медленно вернитесь.",2],["Backward_Drag","Протяжка саней спиной вперёд","Backward Drag","l","ojnmd","other",1,5,1,"Закрепите ремни на санях и возьмитесь за них. / Отклонитесь назад и идите спиной короткими быстрыми шагами. / Пройдите заданную дистанцию.",2],["Backward_Medicine_Ball_Throw","Бросок медбола назад","Backward Medicine Ball Throw","f","","medball",1,2,1,"Держите мяч между ног, стоя спиной к направлению броска. / Присядьте и взрывно выпрямитесь. / Бросьте мяч назад через голову.",2],["Balance_Board","Балансировочная доска","Balance Board","o","ml","other",1,0,1,"Встаньте на балансировочную доску. / Удерживайте равновесие. / Держите позицию сколько сможете.",2],["Ball_Leg_Curl","Сгибание ног на фитболе","Ball Leg Curl","m","on","fitball",1,0,0,"Лягте на спину, стопы на мяче. / Поднимите таз, опираясь на лопатки. / Подкатите мяч к себе, сгибая колени, и выкатите обратно.",2],["Band_Assisted_Pull-Up","Подтягивания с резинкой","Band Assisted Pull-Up","b","kjc","pullup",1,0,1,"Закрепите резинку на турнике, поставьте колено в петлю. / Возьмитесь хватом средней ширины. / Подтянитесь до подбородка над грифом и опуститесь.",2],["Band_Good_Morning","Наклоны с резинкой (гуд морнинг)","Band Good Morning","m","nd","bands",1,3,1,"Встаньте на резинку, петля за шеей. / Наклонитесь вперёд от таза с прямой спиной. / Разогнитесь в тазу до вертикали.",2],["Band_Good_Morning_Pull_Through","Протяжка резинки между ног","Band Good Morning (Pull Through)","m","nd","bands",1,3,1,"Резинка закреплена за опорой сзади, петля за шеей. / Наклонитесь, отводя таз назад до 90°. / Разогнитесь за счёт ягодиц.",2],["Band_Hip_Adductions","Отведение ноги с резинкой","Band Hip Adductions","p","","bands",1,0,0,"Закрепите резинку на лодыжке, встаньте боком к опоре. / Отведите прямую ногу в сторону. / Медленно верните.",2],["Band_Pull_Apart","Разведение резинки перед собой","Band Pull Apart","f","ce","bands",1,0,0,"Держите резинку на вытянутых руках перед собой. / Разведите руки в стороны до касания резинкой груди. / Медленно вернитесь.",2],["Band_Skull_Crusher","Французский жим с резинкой","Band Skull Crusher","i","","bands",1,0,0,"Закрепите резинку у головы, лягте на скамью. / Плечи вертикально, локти согнуты. / Разгибайте руки, не двигая плечами.",2],["Barbell_Ab_Rollout","Выкатка со штангой","Barbell Ab Rollout","k","df","barbell",2,0,1,"Встаньте в упор лёжа, держась за штангу с лёгкими блинами. / Катите штангу вперёд, вытягивая тело. / Напрягите пресс и вернитесь.",2],["Barbell_Ab_Rollout_-_On_Knees","Выкатка со штангой с колен","Barbell Ab Rollout - On Knees","k","df","barbell",3,0,1,"Встаньте на колени, руки на штанге. / Медленно катите штангу вперёд. / Вернитесь усилием пресса.",2],["Barbell_Bench_Press_-_Medium_Grip","Жим штанги лёжа средним хватом","Barbell Bench Press - Medium Grip","a","fi","barbell,bench",1,0,1,"Лягте на скамью, возьмите гриф хватом шире плеч. / Опустите штангу к середине груди на вдохе. / Выжмите вверх на выдохе.",2],["Barbell_Curl","Подъём штанги на бицепс","Barbell Curl","h","j","barbell",1,0,0,"Встаньте прямо, штанга хватом на ширине плеч ладонями вперёд. / Сгибайте руки, локти неподвижны. / Медленно опустите.",2],["Barbell_Curls_Lying_Against_An_Incline","Подъём штанги на бицепс лёжа на наклонной","Barbell Curls Lying Against An Incline","h","","barbell,bench",1,0,0,"Лягте грудью на наклонную скамью, штанга в опущенных руках. / Поднимите гриф максимально высоко, сжимая бицепс. / Медленно опустите.",2],["Barbell_Deadlift","Становая тяга со штангой","Barbell Deadlift","d","ojnmbcle","barbell",2,0,1,"Встаньте у штанги, спина ровная, хват на ширине плеч. / Поднимите вес, разгибая колени и таз. / Опустите штангу вдоль ног.",2],["Barbell_Full_Squat","Глубокие приседания со штангой","Barbell Full Squat","l","onmd","barbell",2,0,1,"Положите гриф на трапеции, стопы на ширине плеч. / Приседайте максимально глубоко, спина ровная. / Встаньте, толкаясь пятками.",2],["Barbell_Glute_Bridge","Ягодичный мост со штангой","Barbell Glute Bridge","n","om","barbell",2,3,1,"Лягте на пол, гриф на тазу. / Поднимите таз, толкаясь пятками. / Сожмите ягодицы вверху и опуститесь.",2],["Barbell_Guillotine_Bench_Press","Жим штанги к шее (гильотина)","Barbell Guillotine Bench Press","a","fi","barbell,bench",2,0,1,"Лягте на скамью, гриф над шеей. / Медленно опустите штангу к шее. / Выжмите вверх.",2],["Barbell_Hack_Squat","Гакк-приседания со штангой сзади","Barbell Hack Squat","l","ojm","barbell",2,0,1,"Держите штангу за спиной на прямых руках. / Приседайте, спина прямая, голова вверх. / Встаньте, толкаясь пятками.",2],["Barbell_Hip_Thrust","Ягодичный мост со штангой от скамьи","Barbell Hip Thrust","n","om","barbell",2,3,1,"Лопатки на скамье, штанга на тазу. / Поднимите таз до горизонтали. / Задержитесь и опуститесь.",2],["Barbell_Incline_Bench_Press_-_Medium_Grip","Жим штанги на наклонной скамье","Barbell Incline Bench Press - Medium Grip","a","fi","barbell,bench",1,0,1,"Лягте на наклонную скамью, хват средний. / Опустите штангу к верху груди. / Выжмите вверх.",2],["Barbell_Incline_Shoulder_Raise","Подъём плеч со штангой на наклонной","Barbell Incline Shoulder Raise","f","a","barbell,bench",1,0,1,"Лягте на наклонную скамью, штанга на прямых руках. / Поднимите гриф за счёт лопаток, не сгибая рук. / Опустите.",2],["Barbell_Lunge","Выпады со штангой","Barbell Lunge","l","onm","barbell",2,0,1,"Штанга на трапециях, шаг вперёд. / Опуститесь, почти касаясь коленом пола. / Вернитесь и смените ногу.",2],["Barbell_Rear_Delt_Row","Тяга штанги на задние дельты","Barbell Rear Delt Row","f","hbc","barbell",1,0,1,"Наклонитесь, хват широкий. / Тяните штангу к верху груди, разводя локти. / Медленно опустите.",2],["Barbell_Rollout_from_Bench","Выкатка штанги со скамьи","Barbell Rollout from Bench","k","nmbf","barbell,bench",2,0,1,"Встаньте коленями на скамью, руки на штанге на полу. / Катите штангу вперёд. / Вернитесь усилием пресса.",2],["Barbell_Seated_Calf_Raise","Подъём на носки сидя со штангой","Barbell Seated Calf Raise","o","","barbell",1,0,0,"Сядьте, носки на подставке, штанга на бёдрах. / Поднимитесь на носки максимально высоко. / Опуститесь.",2],["Barbell_Shoulder_Press","Жим штанги сидя","Barbell Shoulder Pr ове. / Разогните.",2],["Dynamic_Back_Stretch","Динамическая растяжка спины","Dynamic Back Stretch","b","","",1,1,0,"Встаньте, ноги на ширине плеч. / Прямыми руками делайте махи вперёд и вверх 5–10 раз. / С каждым повтором увеличивайте амплитуду, пока руки не окажутся над головой.",2],["Dynamic_Chest_Stretch","Динамическая растяжка груди","Dynamic Chest Stretch","a","c","",1,1,0,"Встаньте, вытяните руки перед собой ладонями вместе. / Не сгибая рук, быстро разведите их назад как можно дальше и верните обратно. / Повторите 5–10 раз, постепенно ускоряясь.",2],["EZ-Bar_Curl","Подъём EZ-штанги на бицепс","EZ-Bar Curl","h","","barbell",1,0,0,"Встаньте прямо, возьмите EZ-гриф за широкие изгибы, локти прижмите к корпусу. / Не двигая плечами, согните руки и поднимите гриф к плечам на выдохе. / Медленно опустите штангу в исходное положение на вдохе.",2],["EZ-Bar_Skullcrusher","Французский жим EZ-штанги лёжа","EZ-Bar Skullcrusher","i","j","barbell",1,0,0,"Лягте на скамью, держите EZ-гриф узким хватом над грудью на прямых руках. / Не двигая плечами, согните локти и опустите гриф ко лбу на вдохе. / Разогните руки трицепсом на выдохе.",2],["Elbow_Circles","Круговые движения локтями","Elbow Circles","f","e","",1,1,0,"Сядьте или встаньте, положите кисти на плечи, локти разведите на уровне плеч. / Медленно описывайте локтями круги. / Выдыхайте в начале круга и вдыхайте в конце.",2],["Elbow_to_Knee","Скручивание локоть к колену","Elbow to Knee","k","","",1,0,1,"Лягте на спину, согните левую ногу и положите на неё правую, руки за головой. / Скрутите корпус и потянитесь левым локтем к правому колену. / Вернитесь в исходное положение и выполните нужное число повторов, затем смените сторону.",2],["Elbows_Back","Сведение локтей назад","Elbows Back","a","f","",1,1,0,"Встаньте прямо, положите ладони на поясницу пальцами вниз, локти в стороны. / Мягко отведите локти назад, стремясь свести их вместе. / Задержитесь на несколько секунд и расслабьтесь.",2],["Elevated_Back_Lunge","Выпады назад с возвышения со штангой","Elevated Back Lunge","l","nm","barbell",2,0,1,"Положите штангу на верх спины и встаньте обеими ногами на низкую платформу. / Сделайте шаг назад с платформы и опуститесь в выпад, держа корпус прямо. / Оттолкнитесь передней ногой и вернитесь на платформу, затем смените ногу.",2],["Elevated_Cable_Rows","Тяга нижнего блока сидя с возвышения","Elevated Cable Rows","b","ce","cable",2,0,1,"Положите на сиденье тренажёра платформу высотой 10–15 см и сядьте на неё, колени слегка согнуты. / Тяните рукоять к животу, сводя лопатки, спина прямая. / Медленно верните рукоять, растягивая широчайшие.",2],["Elliptical_Trainer","Эллиптический тренажёр","Elliptical Trainer","l","onm","machines",2,6,0,"Встаньте на тренажёр и выберите программу или ручной режим. / Двигайтесь плавно, работая одновременно ногами и руками. / Регулируйте сопротивление и наклон для нужной интенсивности.",2],["Exercise_Ball_Crunch","Скручивания на фитболе","Exercise Ball Crunch","k","","fitball",1,0,0,"Лягте поясницей на фитбол, стопы упираются в пол, руки на груди или за головой. / На выдохе скрутите корпус, поднимая плечи и сокращая пресс. / Медленно вернитесь назад на вдохе.",2],["Exercise_Ball_Pull-In","Подтягивание фитбола к груди","Exercise Ball Pull-In","k","","fitball",1,0,1,"Примите упор лёжа, положив голени на фитбол. / Согните ноги и подкатите мяч коленями к груди на выдохе. / Выпрямите ноги и откатите мяч назад на вдохе.",2],["Extended_Range_One-Arm_Kettlebell_Floor_Press","Жим гири одной рукой лёжа на полу с увеличенной амплитудой","Extended Range One-Arm Kettlebell Floor Press","a","fi","kettlebell",1,0,1,"Лягте на пол, возьмите гирю за ручку, ногу с той же стороны согните и заведите через корпус. / Выжмите гирю вверх, одновременно поворачивая корпус в сторону рабочей руки. / Медленно опустите гирю и повторите, затем смените руку.",2],["External_Rotation","Наружная ротация плеча с гантелью лёжа на боку","External Rotation","f","","dumbbells",1,0,0,"Лягте на бок на скамью, гантель в верхней руке, локоть согнут под 90° и прижат к корпусу. / Поверните предплечье вверх, не отрывая локоть от тела, на выдохе. / Медленно опустите гантель на вдохе.",2],["External_Rotation_with_Band","Наружная ротация плеча с резиной","External Rotation with Band","f","","bands",1,0,1,"Закрепите резину на уровне локтя и встаньте к ней боком, локоть согнут под 90° и прижат к корпусу. / Возьмите резину дальней рукой и поверните предплечье наружу. / Медленно вернитесь в исходное положение.",2],["External_Rotation_with_Cable","Наружная ротация плеча в кроссовере","External Rotation with Cable","f","","cable",1,0,0,"Установите блок на уровне локтя и встаньте к нему боком, локоть согнут под 90° и прижат к корпусу. / Дальней рукой поверните рукоять наружу от тела. / Медленно вернитесь в исходное положение.",2],["Face_Pull","Тяга каната к лицу","Face Pull","f","c","cable",2,0,1,"Встаньте лицом к верхнему блоку с канатом, плечи параллельны полу. / Тяните канат к лицу, разводя руки в стороны. / Задержитесь на секунду и медленно верните вес.",2],["Farmers_Walk","Прогулка фермера","Farmer's Walk","j","knmdle","other",2,5,1,"Встаньте между снарядами или гантелями и возьмитесь за рукояти. / Поднимите вес, оттолкнувшись пятками, спина прямая. / Идите короткими быстрыми шагами, держа корпус напряжённым.",2],["Fast_Skipping","Быстрые подскоки","Fast Skipping","l","qponm","",1,2,1,"Встаньте расслабленно, одна нога немного впереди. / Выполняйте подскоки, чередуя ноги по схеме шаг-подскок. / Держитесь ближе к земле, минимизируя время в воздухе.",2],["Finger_Curls","Сгибание пальцев со штангой","Finger Curls","j","","barbell",1,0,0,"Сядьте, возьмите штангу хватом снизу на ширине плеч, предплечья на бёдрах. / Разожмите пальцы, позволив грифу скатиться к кончикам пальцев. / Сожмите пальцы и затем кисти, поднимая гриф обратно.",2],["Flat_Bench_Cable_Flyes","Сведение рук в кроссовере лёжа на горизонтальной скамье","Flat Bench Cable Flyes","a","","cable",2,0,0,"Поставьте скамью между нижними блоками и лягте, взяв рукояти. / Разведите руки в стороны со слегка согнутыми локтями, растягивая грудь. / Сведите руки над грудью, сокращая грудные мышцы.",2],["Flat_Bench_Leg_Pull-In","Подтягивание коленей к груди лёжа на скамье","Flat Bench Leg Pull-In","k","","",1,0,1,"Лягте на скамью, ноги свисают с края, руки держатся за скамью. / Согните ноги и подтяните колени к груди на выдохе. / Медленно выпрямите ноги вперёд на вдохе.",2],["Flat_Bench_Lying_Leg_Raise","Подъём ног лёжа на скамье","Flat Bench Lying Leg Raise","k","","",1,0,0,"Лягте спиной на скамью, ноги вытянуты за край, руки держатся за скамью. / Поднимите прямые ноги до вертикали на выдохе. / Медленно опустите ноги, не касаясь пола, на вдохе.",2],["Flexor_Incline_Dumbbell_Curls","Сгибания рук с гантелями на наклонной скамье со смещённым хватом","Flexor Incline Dumbbell Curls","h","","dumbbells,bench",1,0,0,"Сядьте на наклонную скамью, держите гантели ближе к внешнему краю диска. / Сгибайте руки, максимально отведя запястья назад. / Медленно опустите гантели в исходное положение.",2],["Floor_Glute-Ham_Raise","Обратная гиперэкстензия на полу (ягодично-бицепсовый подъём)","Floor Glute-Ham Raise","m","on","",2,0,0,"Встаньте на колени, закрепите стопы под опорой или попросите партнёра их держать. / Медленно наклонитесь вперёд прямым корпусом, контролируя движение бицепсом бедра. / Вернитесь вверх усилием задней поверхности бедра.",2],["Floor_Press","Жим штанги лёжа на полу","Floor Press","i","af","barbell",2,3,1,"Лягте на пол в силовой раме и снимите штангу, сведя лопатки. / Опустите гриф к низу груди до касания плечами пола. / Выжмите штангу вверх.",2],["Floor_Press_with_Chains","Жим штанги лёжа на полу с цепями","Floor Press with Chains","i","af","barbell",2,3,1,"Повесьте цепи на концы грифа и лягте на пол в раме, сведя лопатки. / Опустите штангу к низу груди до касания плечами пола. / Мощно выжмите вес вверх.",2],["Flutter_Kicks","Махи ногами лёжа на животе","Flutter Kicks","n","m","",1,0,1,"Лягте животом на скамью, таз на краю, руками держитесь за скамью. / Поднимите прямые ноги до уровня таза, напрягая ягодицы. / Поочерёдно делайте небольшие махи ногами вверх-вниз.",2],["Foot-SMR","Миофасциальный массаж стопы роликом","Foot-SMR","o","","other",2,1,0,"Сядьте без обуви и поставьте стопу сводом на ролик. / Надавите на ролик и прокатывайте его от пятки к пальцам. / Задерживайтесь на болезненных точках 10–30 секунд.",2],["Forward_Drag_with_Press","Тяга саней вперёд с жимом","Forward Drag with Press","a","onmlfi","other",2,5,1,"Прикрепите к саням ремни с рукоятями и встаньте спиной к саням. / Сделайте шаг вперёд, сдвигая сани. / На каждом шаге выжимайте рукояти вперёд, выпрямляя руки.",2],["Frankenstein_Squat","Присед Франкенштейна","Frankenstein Squat","l","konm","barbell",2,4,1,"Положите штангу на передние дельты и вытяните руки вперёд. / Присядьте, удерживая гриф на плечах без помощи рук. / Встаньте, сохраняя корпус вертикальным.",2],["Freehand_Jump_Squat","Приседания с выпрыгиванием без веса","Freehand Jump Squat","l","onm","",2,0,1,"Скрестите руки на груди, ноги на ширине плеч. / Присядьте до параллели бёдер с полом на вдохе. / Мощно выпрыгните вверх и мягко приземлитесь в присед.",2],["Frog_Hops","Лягушачьи прыжки","Frog Hops","l","onm","",2,1,1,"Руки за головой, опуститесь в присед, корпус прямо. / Прыгните вперёд на расстояние, не прыгая слишком высоко. / Мягко приземлитесь в присед и сразу прыгайте снова.",2],["Frog_Sit-Ups","Скручивания «лягушка»","Frog Sit-Ups","k","","",2,0,0,"Лягте на спину, согните ноги и соедините стопы, колени разведены. / Скрутите корпус, поднимая плечи от пола на выдохе. / Медленно опуститесь на вдохе.",2],["Front_Barbell_Squat","Фронтальные приседания со штангой","Front Barbell Squat","l","onm","barbell",3,0,1,"Положите штангу на передние дельты, локти высоко. / Присядьте до параллели или ниже, держа корпус вертикально. / Встаньте, отталкиваясь пятками, на выдохе.",2],["Front_Barbell_Squat_To_A_Bench","Фронтальные приседания со штангой на скамью","Front Barbell Squat To A Bench","l","onm","barbell,bench",3,0,1,"Поставьте скамью сзади, положите штангу на передние дельты, локти высоко. / Присядьте до касания скамьи, корпус вертикален. / Встаньте, отталкиваясь пятками.",2],["Front_Box_Jump","Прыжки на тумбу","Front Box Jump","m","qponl","other",1,2,1,"Встаньте перед тумбой на расстоянии 30–60 см, ноги на ширине плеч. / Немного присядьте, отведя руки назад. / Мощно выпрыгните и приземлитесь на тумбу в мягкий присед.",2],["Front_Cable_Raise","Подъём руки перед собой в кроссовере","Front Cable Raise","f","","cable",1,0,0,"Встаньте спиной к нижнему блоку, рукоять в руке перед бедром. / Поднимите прямую руку вперёд до уровня плеч на выдохе. / Медленно опустите руку на вдохе.",2],["Front_Cone_Hops_or_hurdle_hops","Прыжки через конусы","Front Cone Hops (or hurdle hops)","l","qponm","other",1,2,1,"Расставьте конусы в ряд на расстоянии около метра и встаньте перед первым. / Перепрыгните конус двумя ногами, помогая махом рук. / Мягко приземлитесь и сразу прыгайте через следующий.",2],["Front_Dumbbell_Raise","Подъём гантелей перед собой поочерёдно","Front Dumbbell Raise","f","","dumbbells",1,0,0,"Встаньте прямо, гантели перед бёдрами. / Поднимите одну гантель вперёд до уровня плеч, не раскачиваясь. / Опустите её и повторите другой рукой.",2],["Front_Incline_Dumbbell_Raise","Подъём гантелей перед собой на наклонной скамье","Front Incline Dumbbell Raise","f","","dumbbells,bench",1,0,0,"Сядьте на наклонную скамью (30–60°), гантели в прямых руках ладонями вниз. / Поднимите гантели вперёд и вверх до уровня плеч. / Медленно опустите в исходное положение.",2],["Front_Leg_Raises","Махи ногой вперёд","Front Leg Raises","m","","",1,1,0,"Встаньте боком к опоре и держитесь за неё одной рукой. / Махните прямой ногой вперёд, затем назад, насколько позволяет гибкость. / Повторите 5–10 раз и смените ногу.",2],["Front_Plate_Raise","Подъём блина перед собой","Front Plate Raise","f","","other",2,0,0,"Встаньте прямо, держите блин двумя руками перед бёдрами. / Поднимите блин прямыми руками до уровня плеч на выдохе. / Медленно опустите на вдохе.",2],["Front_Raise_And_Pullover","Подъём штанги перед собой с пуловером лёжа","Front Raise And Pullover","a","bfi","barbell",1,0,1,"Лягте на скамью, держите штангу хватом сверху на бёдрах. / Поднимите гриф дугой над головой прямыми руками. / Верните штангу тем же путём на бёдра.",2],["Front_Squat_Clean_Grip","Фронтальные приседания хватом для взятия на грудь","Front Squat (Clean Grip)","l","knm","barbell",2,0,1,"Положите штангу на передние дельты, удерживая гриф пальцами, локти высоко. / Присядьте как можно ниже, корпус вертикален. / Встаньте, отталкиваясь пятками.",2],["Front_Squats_With_Two_Kettlebells","Фронтальные приседания с двумя гирями","Front Squats With Two Kettlebells","l","on","kettlebell",2,0,1,"Возьмите две гири на грудь. / Присядьте как можно ниже, глядя прямо перед собой. / Встаньте, отталкиваясь пятками.",2],["Front_Two-Dumbbell_Raise","Подъём двух гантелей перед собой","Front Two-Dumbbell Raise","f","","dumbbells",1,0,0,"Встаньте прямо, гантели перед бёдрами. / Одновременно поднимите гантели вперёд до уровня плеч, не раскачиваясь. / Медленно опустите гантели.",2],["Full_Range-Of-Motion_Lat_Pulldown","Тяга верхних блоков с полной амплитудой","Full Range-Of-Motion Lat Pulldown","b","hcf","cable",2,0,1,"Возьмитесь за рукояти двух верхних блоков скрестными руками. / Тяните рукояти вниз к плечам, держа грудь поднятой. / Медленно верните руки вверх, растягивая широчайшие.",2],["Gironda_Sternum_Chins","Подтягивания Жиронды к грудине","Gironda Sternum Chins","b","hc","other",2,0,1,"Повисните на турнике обратным хватом на ширине плеч, отклонившись назад. / Подтягивайтесь, прогибаясь, пока перекладина не коснётся грудины. / Медленно опуститесь до полного выпрямления рук.",2],["Glute_Ham_Raise","Ягодично-бицепсовый подъём на тренажёре","Glute Ham Raise","m","on","machines",2,3,1,"Настройте тренажёр, стопы упираются в платформу, колени за подушкой. / Согните колени, поднимая корпус вверх усилием бицепса бедра. / Медленно опуститесь в исходное положение.",2],["Glute_Kickback","Отведение ноги назад на четвереньках","Glute Kickback","n","m","",1,0,1,"Встаньте на четвереньки, спина прямая. / Отведите согнутую ногу назад и вверх, напрягая ягодицу. / Медленно вернитесь и повторите, затем смените ногу.",2],["Goblet_Squat","Гоблет-присед","Goblet Squat","l","onmf","kettlebell",1,0,1,"Держите гирю за рога у груди. / Присядьте как можно ниже, держа грудь и голову поднятыми. / Встаньте, отталкиваясь пятками.",2],["Good_Morning","Гуд монинг со штангой","Good Morning","m","knd","barbell",2,3,1,"Положите штангу на верх спины, колени слегка согнуты. / Наклонитесь вперёд, отводя таз назад, спина прямая. / Вернитесь в вертикальное положение.",2],["Good_Morning_off_Pins","Гуд монинг со штангой с упоров","Good Morning off Pins","m","knd","barbell",2,3,1,"Установите штангу на упоры на уровне живота и подлезьте под неё в наклоне. / Поднимите корпус в вертикальное положение, держа спину прямой. / Опустите штангу обратно на упоры в наклоне.",2],["Gorilla_Chin_Crunch","Подтягивания с подъёмом коленей","Gorilla Chin/Crunch","k","hb","",2,0,1,"Повисните на турнике обратным хватом, колени согнуты под 90°. / Подтянитесь и одновременно подтяните колени к груди. / Медленно опуститесь в вис.",2],["Groin_and_Back_Stretch","Растяжка паха и спины сидя","Groin and Back Stretch","p","","",2,1,1,"Сядьте, согнув колени и соединив стопы, руки за головой. / Наклонитесь вниз, опуская локти к внутренней стороне бёдер. / Задержитесь и вернитесь в исходное положение.",2],["Groiners","Прыжки в упоре лёжа ноги к рукам","Groiners","p","","",2,1,1,"Примите упор лёжа. / Прыжком подтяните обе ноги к рукам, голова поднята. / Вернитесь в упор лёжа и сразу повторите.",2],["Hack_Squat","Гакк-приседания","Hack Squat","l","onm","machines",1,0,1,"Встаньте в тренажёр, плечи под подушками, ноги на ширине плеч. / Присядьте до параллели бёдер с платформой на вдохе. / Выжмите вес вверх, отталкиваясь пятками.",2],["Hammer_Curls","Молотковые сгибания с гантелями","Hammer Curls","h","","dumbbells",1,0,0,"Встаньте прямо, гантели в опущенных руках ладонями к корпусу. / Согните руки, не поворачивая кисти, на выдохе. / Медленно опустите гантели на вдохе.",2],["Hammer_Grip_Incline_DB_Bench_Press","Жим гантелей на наклонной скамье нейтральным хватом","Hammer Grip Incline DB Bench Press","a","fi","dumbbells,bench",1,0,1,"Лягте на наклонную скамью, гантели у плеч ладонями друг к другу. / Выжмите гантели вверх на выдохе. / Медленно опустите к груди на вдохе.",2],["Hamstring-SMR","Миофасциальный массаж бицепса бедра роликом","Hamstring-SMR","m","","roller",1,1,0,"Сядьте, положив заднюю поверхность бёдер на ролик, руки сзади. / Приподнимите таз и прокатывайте ролик от ягодиц к коленям. / Задерживайтесь на болезненных точках 10–30 секунд.",2],["Hamstring_Stretch","Растяжка бицепса бедра лёжа с ремнём","Hamstring Stretch","m","","",1,1,0,"Лягте на спину, поднимите одну ногу вверх, накинув ремень на стопу. / Потяните ремень на себя до ощущения растяжения. / Задержитесь на 10–20 секунд и смените ногу.",2],["Handstand_Push-Ups","Отжимания в стойке на руках","Handstand Push-Ups","f","i","",3,0,1,"Поставьте руки на ширине плеч у стены и выйдите в стойку на руках. / Опустите тело, сгибая руки, до лёгкого касания головой пола. / Выжмите себя вверх до полного выпрямления рук.",2],["Hang_Clean","Взятие штанги на грудь с виса","Hang Clean","l","ojnmdfe","barbell",2,4,1,"Держите штангу хватом на ширине плеч на середине бёдер, наклон вперёд. / Взрывно разогнитесь в тазу, коленях и лодыжках, пожимая плечами. / Подсядьте под штангу и примите её на передние дельты.",2],["Hang_Clean_-_Below_the_Knees","Взятие штанги на грудь с виса ниже колен","Hang Clean - Below the Knees","l","ojnmdfe","barbell",2,4,1,"Держите штангу хватом на ширине плеч чуть ниже колен, спина прямая. / Взрывно разогнитесь в тазу, коленях и лодыжках. / Подсядьте под штангу и примите её на грудь.",2],["Hang_Snatch","Рывок штанги с виса","Hang Snatch","m","kojndlfe","barbell",3,4,1,"Держите штангу широким хватом на уровне таза, колени слегка согнуты. / Взрывно разогнитесь, подбрасывая штангу вверх. / Подсядьте под штангу и зафиксируйте её на прямых руках над головой.",2],["Hang_Snatch_-_Below_Knees","Рывок штанги с виса ниже колен","Hang Snatch - Below Knees","m","kojndlfe","barbell",3,4,1,"Держите штангу широким хватом чуть ниже колен, спина прямая. / Взрывно разогнитесь, подбрасывая штангу вверх. / Подсядьте и зафиксируйте штангу на прямых руках над головой.",2],["Hanging_Bar_Good_Morning","Гуд монинг с подвешенной штангой","Hanging Bar Good Morning","m","knd","barbell",2,3,1,"Подвесьте штангу на цепях на уровне живота и подлезьте под неё в наклоне. / Поднимите корпус в вертикальное положение, спина прямая. / Опустите штангу вниз в наклоне до провисания цепей.",2],["Hanging_Leg_Raise","Подъём ног в висе","Hanging Leg Raise","k","","pullup",3,0,0,"Повисните на турнике, ноги прямые. / Поднимите ноги до угла 90° с корпусом на выдохе. / Медленно опустите ноги на вдохе.",2],["Hanging_Pike","Подъём ног к перекладине в висе","Hanging Pike","k","","pullup",3,0,1,"Повисните на турнике хватом сверху, ноги вместе. / Поднимите ноги вверх, стараясь коснуться перекладины. / Медленно опустите ноги в вис.",2],["Heaving_Snatch_Balance","Подсед в рывке со швунгом","Heaving Snatch Balance","l","kjnmfi","barbell",2,4,1,"Держите лёгкую штангу на плечах сзади, ноги чуть шире таза. / Слегка подсядьте и вытолкните штангу вверх. / Быстро уйдите в глубокий присед, фиксируя штангу на прямых руках.",2],["Heavy_Bag_Thrust","Толчок тяжёлого мешка","Heavy Bag Thrust","a","kfi","other",1,2,1,"Встаньте у мешка в разножке, ладонь на мешке на уровне груди. / Скрутите корпус и мощно толкните мешок вперёд. / Поймайте мешок и повторите.",2],["High_Cable_Curls","Сгибания рук на верхних блоках","High Cable Curls","h","","cable",2,0,1,"Встаньте между верхними блоками, руки параллельны полу ладонями к себе. / Согните руки, подводя рукояти к ушам. / Медленно выпрямите руки.",2],["Hip_Circles_prone","Круговые движения бедром на четвереньках","Hip Circles (prone)","q","p","",1,1,0,"Встаньте на четвереньки и приподнимите одно согнутое колено. / Описывайте коленом большие круги, вращая бедро. / Выполните нужное количество повторов и смените ногу.",2],["Hip_Extension_with_Bands","Разгибание бедра с резиной","Hip Extension with Bands","n","m","bands",1,0,1,"Закрепите резину на ноге и встаньте лицом к опоре, держась за неё. / Отведите прямую ногу назад как можно дальше. / Медленно вернитесь в исходное положение.",2],["Hip_Flexion_with_Band","Сгибание бедра с резиной","Hip Flexion with Band","l","","bands",1,0,1,"Закрепите резину на лодыжке и встаньте спиной к точке крепления. / Поднимите колено вверх до 90° и задержитесь. / Медленно опустите ногу.",2],["Hip_Lift_with_Band","Ягодичный мостик с резиной","Hip Lift with Band","n","om","bands",1,3,1,"Лягте на спину в раме, резина закреплена над тазом. / Поднимите таз вверх, преодолевая сопротивление резины. / Медленно опустите таз вниз.",2],["Hug_A_Ball","Обнимание фитбола","Hug A Ball","d","on","fitball",1,1,0,"Сядьте на пол, расположив фитбол между ног. / Обнимите мяч руками и опустите таз к полу. / Задержитесь в растяжке 20–30 секунд.",2],["Hug_Knees_To_Chest","Подтягивание коленей к груди лёжа","Hug Knees To Chest","d","n","",1,1,0,"Лягте на спину и подтяните колени к груди. / Обхватите ноги под коленями. / Медленно притягивайте колени к плечам и задержитесь.",2],["Hurdle_Hops","Прыжки через барьеры","Hurdle Hops","m","qponm","other",1,2,1,"Расставьте барьеры в ряд и встаньте перед первым. / Перепрыгните барьер двумя ногами, помогая махом рук. / Мягко приземлитесь и сразу прыгайте через следующий.",2],["Hyperextensions_Back_Extensions","Гиперэкстензия","Hyperextensions (Back Extensions)","d","nm","other",1,0,0,"Лягте на тренажёр, закрепив ноги под валиками, руки скрещены на груди. / Наклонитесь вперёд, сгибаясь в тазобедренных суставах, спина прямая. / Поднимите корпус до прямой линии с ногами.",2],["Hyperextensions_With_No_Hyperextension_Bench","Гиперэкстензия на скамье без тренажёра","Hyperextensions With No Hyperextension Bench","d","nm","",2,0,1,"Лягте на скамью, свесив корпус с края, партнёр держит ноги. / Опустите корпус вниз, сгибаясь в тазу. / Поднимите корпус до прямой линии с ногами.",2],["IT_Band_and_Glute_Stretch","Растяжка ИТ-тракта и ягодиц лёжа","IT Band and Glute Stretch","q","","other",2,1,0,"Лягте на спину и накиньте ремень на стопу. / Заведите прямую ногу через корпус в противоположную сторону. / Задержитесь на 10–20 секунд и смените ногу.",2],["Iliotibial_Tract-SMR","Миофасциальный массаж ИТ-тракта роликом","Iliotibial Tract-SMR","q","","roller",2,1,0,"Лягте на бок, положив бедро на ролик. / Прокатывайте ролик от таза к колену. / Задерживайтесь на болезненных точках 10–30 секунд.",2],["Inchworm","Гусеница","Inchworm","m","","",1,1,1,"Встаньте, ноги вместе, и наклонитесь, поставив руки на пол. / Переступайте руками вперёд до положения упора лёжа. / Мелкими шагами подведите ноги к рукам и повторите.",2],["Incline_Barbell_Triceps_Extension","Французский жим штанги на наклонной скамье","Incline Barbell Triceps Extension","i","j","barbell,bench",2,0,0,"Лягте на наклонную скамью, держите штангу над головой на прямых руках. / Согните локти и опустите гриф за голову на вдохе. / Разогните руки трицепсом на выдохе.",2],["Incline_Bench_Pull","Тяга гантелей лёжа на наклонной скамье","Incline Bench Pull","c","bf","barbell,bench",1,0,0,"Лягте грудью на скамью с наклоном 30°, гантели в опущенных руках хватом сверху. / Тяните гантели вверх, разводя локти в стороны. / Медленно опустите гантели.",2],["Incline_Cable_Chest_Press","Жим в тренажёре на наклонной скамье с блоками","Incline Cable Chest Press","a","fi","cable",1,0,1,"Сядьте в тренажёр, возьмите рукояти, локти согнуты под 90°. / Выжмите рукояти вперёд и вверх на выдохе. / Медленно верните их назад на вдохе.",2],["Incline_Cable_Flye","Сведение рук в кроссовере на наклонной скамье","Incline Cable Flye","a","f","cable",2,0,0,"Поставьте скамью с наклоном 45° между нижними блоками и лягте, взяв рукояти. / Разведите руки в стороны со слегка согнутыми локтями. / Сведите руки над грудью, сокращая грудные мышцы.",2],["Incline_Dumbbell_Bench_With_Palms_Facing_In","Жим гантелей на наклонной скамье ладонями внутрь","Incline Dumbbell Bench With Palms Facing In","a","fi","dumbbells,bench",1,0,1,"Лягте на наклонную скамью, гантели у плеч ладонями друг к другу. / Выжмите гантели вверх на выдохе. / Медленно опустите к груди на вдохе.",2],["Incline_Dumbbell_Curl","Сгибания рук с гантелями на наклонной скамье","Incline Dumbbell Curl","h","","dumbbells,bench",1,0,0,"Сядьте на наклонную скамью, гантели в опущенных руках ладонями вперёд. / Согните руки, не двигая плечами, на выдохе. / Медленно опустите гантели на вдохе.",2],["Incline_Dumbbell_Flyes","Разведение гантелей на наклонной скамье","Incline Dumbbell Flyes","a","f","dumbbells,bench",1,0,1,"Лягте на наклонную скамью (до 30°), гантели над грудью, локти слегка согнуты. / Разведите руки в стороны дугой, растягивая грудь. / Сведите гантели обратно над грудью.",2],["Incline_Dumbbell_Flyes_-_With_A_Twist","Разведение гантелей на наклонной скамье с разворотом","Incline Dumbbell Flyes - With A Twist","a","f","dumbbells,bench",1,0,1,"Лягте на наклонную скамью, гантели над грудью, ладони к себе. / Разведите руки дугой, разворачивая кисти ладонями друг к другу. / Сведите гантели, разворачивая кисти обратно.",2],["Incline_Dumbbell_Press","Жим гантелей на наклонной скамье","Incline Dumbbell Press","a","fi","dumbbells,bench",1,0,1,"Лягте на наклонную скамью, поднимите гантели к плечам. / Выжмите гантели вверх на выдохе. / Медленно опустите к груди на вдохе.",2],["Incline_Hammer_Curls","Молотковые сгибания на наклонной скамье","Incline Hammer Curls","h","","dumbbells,bench",1,0,0,"Сядьте на наклонную скамью, гантели в опущенных руках нейтральным хватом. / Согните руки, не поворачивая кисти. / Медленно опустите гантели.",2],["Incline_Inner_Biceps_Curl","Сгибания рук на наклонной скамье с разворотом наружу","Incline Inner Biceps Curl","h","","dumbbells,bench",1,0,0,"Лягте на наклонную скамью, гантели в опущенных руках ладонями наружу. / Сгибайте руки наружу и вверх на выдохе. / Медленно опустите гантели.",2],["Incline_Push-Up","Отжимания от скамьи","Incline Push-Up","a","fi","",1,0,1,"Поставьте руки на край скамьи чуть шире плеч, тело прямое. / Опустите грудь к краю скамьи, сгибая руки. / Выжмите себя вверх.",2],["Incline_Push-Up_Close-Grip","Отжимания от опоры узким хватом","Incline Push-Up Close-Grip","i","af","",1,0,1,"Поставьте руки рядом друг с другом на гриф в Смите или опору. / Опустите грудь к грифу, сгибая руки. / Выжмите себя вверх.",2],["Incline_Push-Up_Depth_Jump","Отжимания с отталкиванием от наклонной опоры","Incline Push-Up Depth Jump","a","fi","other",1,2,1,"Поставьте ноги на тумбу, руки между двумя степами. / Оттолкнитесь руками и приземлитесь ладонями на степы. / Оттолкнитесь снова и вернитесь в исходное положение.",2],["Incline_Push-Up_Medium","Отжимания от опоры средним хватом","Incline Push-Up Medium","a","kfi","",1,0,1,"Поставьте руки на гриф в Смите на ширине плеч, тело прямое. / Опустите грудь к грифу, сгибая руки. / Выжмите себя вверх.",2],["Incline_Push-Up_Reverse_Grip","Отжимания от опоры обратным хватом","Incline Push-Up Reverse Grip","a","kfi","",1,0,1,"Возьмитесь за гриф в Смите хватом снизу на ширине плеч. / Опустите грудь к грифу, сгибая руки. / Выжмите себя вверх.",2],["Incline_Push-Up_Wide","Отжимания от опоры широким хватом","Incline Push-Up Wide","a","kfi","",1,0,1,"Поставьте руки на гриф в Смите шире плеч, тело прямое. / Опустите грудь к грифу, сгибая руки. / Выжмите себя вверх.",2],["Intermediate_Groin_Stretch","Растяжка паха лёжа с ремнём","Intermediate Groin Stretch","m","","other",2,1,0,"Лягте на спину и накиньте ремень на стопу. / Отведите прямую ногу в сторону как можно дальше. / Задержитесь на 10–20 секунд и смените ногу.",2],["Intermediate_Hip_Flexor_and_Quad_Stretch","Растяжка сгибателей бедра и квадрицепса лёжа","Intermediate Hip Flexor and Quad Stretch","l","","other",2,1,1,"Лягте на живот, накиньте ремень на стопу. / Тяните ремень, сгибая колено и отрывая бедро от пола. / Задержитесь на 10–20 секунд и смените ногу.",2],["Internal_Rotation_with_Band","Внутренняя ротация плеча с резиной","Internal Rotation with Band","f","","bands",1,0,0,"Закрепите резину на уровне локтя и встаньте к ней боком, локоть согнут под 90°. / Ближней рукой поверните предплечье к животу. / Медленно вернитесь в исходное положение.",2],["Inverted_Row","Австралийские подтягивания","Inverted Row","c","b","",1,0,1,"Установите гриф на уровне пояса, повисните под ним хватом шире плеч, пятки на полу. / Подтяните грудь к грифу, сводя лопатки. / Медленно опуститесь до прямых рук.",2],["Inverted_Row_with_Straps","Австралийские подтягивания на петлях","Inverted Row with Straps","c","hb","other",1,0,1,"Закрепите петли и повисните на них, тело прямое, пятки на полу. / Подтяните грудь к рукам, сводя лопатки. / Медленно опуститесь до прямых рук.",2],["Iron_Cross","Железный крест с гантелями","Iron Cross","f","anmdle","dumbbells",2,0,1,"Встаньте прямо, гантели в опущенных руках. / Поднимите гантели вперёд до уровня плеч, затем разведите в стороны. / Медленно верните руки вперёд и опустите.",2],["Iron_Crosses_stretch","Скорпион лёжа на животе","Iron Crosses (stretch)","l","","",2,1,1,"Лягте на живот, руки разведены в стороны. / Согните ногу и заведите её за корпус к противоположной руке. / Вернитесь и повторите другой ногой.",2],["Isometric_Chest_Squeezes","Изометрическое сжатие ладоней перед грудью","Isometric Chest Squeezes","a","fi","",1,2,1,"Согните руки и соедините ладони перед грудью. / Сильно давите ладонями друг на друга, напрягая грудь. / Удерживайте 5–10 секунд и расслабьтесь.",2],["Isometric_Neck_Exercise_-_Front_And_Back","Изометрическое упражнение для шеи вперёд-назад","Isometric Neck Exercise - Front And Back","g","","",1,0,0,"Положите ладони на лоб, голова прямо. / Давите головой вперёд, сопротивляясь руками без движения. / Повторите, положив руки на затылок.",2],["Isometric_Neck_Exercise_-_Sides","Изометрическое упражнение для шеи в стороны","Isometric Neck Exercise - Sides","g","","",1,0,0,"Положите ладонь на боковую сторону головы. / Давите головой в сторону, сопротивляясь рукой без движения. / Повторите на другую сторону.",2],["Isometric_Wipers","Изометрические «дворники»","Isometric Wipers","a","kfi","",1,0,1,"Примите упор лёжа, руки чуть шире плеч. / Перенесите вес в сторону, сгибая одну руку. / Вернитесь в центр и повторите в другую сторону.",2],["JM_Press","Жим JM","JM Press","i","af","barbell",1,0,1,"Лягте на скамью, держите штангу узким хватом над верхом груди. / Опустите гриф к подбородку, сгибая локти. / Выжмите штангу вверх трицепсом.",2],["Jackknife_Sit-Up","Складка","Jackknife Sit-Up","k","","",1,0,1,"Лягте на спину, руки вытянуты за головой. / Одновременно поднимите руки и ноги, касаясь стоп. / Медленно вернитесь в исходное положение.",2],["Janda_Sit-Up","Подъём корпуса по Янде","Janda Sit-Up","k","","",1,0,0,"Лягте на спину, колени согнуты под 90°, стопы на полу. / Напрягите ягодицы и бицепс бедра и медленно поднимайте корпус. / Медленно опуститесь вниз.",2],["Jefferson_Squats","Приседания Джефферсона","Jefferson Squats","l","onmde","barbell",2,0,1,"Встаньте над штангой вдоль грифа и возьмитесь одной рукой спереди, другой сзади. / Встаньте со штангой между ног. / Присядьте и вернитесь вверх.",2],["Jerk_Balance","Подсед в толчке ножницами","Jerk Balance","f","nmli","barbell",2,4,1,"Держите штангу на груди, ноги слегка в разножке. / Выполните подсед с выпадом вперёд, вытолкнув штангу над головой. / Зафиксируйте положение и вернитесь в исходное.",2],["Jerk_Dip_Squat","Подсед в толчке (полуприсед)","Jerk Dip Squat","l","ko","barbell",2,4,1,"Держите штангу на груди, ноги под тазом. / Слегка подсядьте, держа корпус вертикально. / Мощно разогнитесь вверх.",2],["Jogging_Treadmill","Бег трусцой на беговой дорожке","Jogging, Treadmill","l","nm","machines",1,6,0,"Встаньте на дорожку и выберите программу или ручной режим. / Бегите в спокойном темпе, держа корпус прямо. / Регулируйте скорость и наклон для нужной интенсивности.",2],["Keg_Load","Погрузка бочонков","Keg Load","d","khojnmclfe","other",2,5,1,"Наклоните бочонок на бок и возьмитесь за нижний край. / Поднимите бочонок к груди. / Донесите его до платформы и погрузите.",2],["Kettlebell_Arnold_Press","Жим Арнольда с гирей","Kettlebell Arnold Press","f","i","kettlebell",2,0,1,"Возьмите гирю на плечо, ладонь внутрь. / Выжмите гирю вверх, разворачивая ладонь вперёд. / Опустите гирю на плечо.",2],["Kettlebell_Dead_Clean","Взятие гири на грудь с пола","Kettlebell Dead Clean","m","ondle","kettlebell",2,0,1,"Поставьте гирю между ног и отведите таз назад. / Взрывно разогнитесь и поднимите гирю на плечо. / Опустите гирю обратно на пол.",2],["Kettlebell_Figure_8","Восьмёрка с гирей","Kettlebell Figure 8","k","mf","kettlebell",2,0,0,"Встаньте шире плеч, наклонитесь с прямой спиной. / Передавайте гирю из руки в руку между ног по восьмёрке. / Повторите несколько раз и смените направление.",2],["Kettlebell_Halo","Гало с гирей","Kettlebell Halo","f","ecki","kettlebell",1,0,1,"Встаньте прямо, держите гирю за рога у груди. / Обведите гирю вокруг головы, держа локти близко. / Вернитесь к груди и повторите в другую сторону.",0],["Kettlebell_Halo_With_Overhead_Extension","Гало с гирей с разгибанием над головой","Kettlebell Halo with Overhead Extension","fi","eck","kettlebell",2,0,1,"Встаньте прямо, держите гирю дном вверх за рожки у груди, напрягите пресс и ягодицы. / Держа локти близко к голове, проведите гирю по кругу вокруг головы. / Затем выжмите гирю над головой, разгибая руки, и вернитесь в исходное положение.",0],["Kettlebell_Hang_Clean","Подъём гири на грудь из виса","Kettlebell Hang Clean","m","ondfe","kettlebell",2,0,1,"Поставьте гирю между стоп, отведите таз назад и смотрите вперёд. / Мощно разогните ноги и таз, подтягивая гирю к плечу. / Поверните кисть, принимая гирю на плечо, затем опустите её вниз.",2],["Kettlebell_One-Legged_Deadlift","Становая тяга с гирей на одной ноге","Kettlebell One-Legged Deadlift","m","nd","kettlebell",2,0,1,"Возьмите гирю в одну руку и встаньте на ногу с той же стороны, слегка согнув колено. / Наклонитесь в тазобедренном суставе, отводя свободную ногу назад для баланса. / Опустите гирю до параллели корпуса с полом и вернитесь в исходное положение.",2],["Kettlebell_Overhead_Triceps_Extension","Французский жим с гирей стоя","Kettlebell Overhead Triceps Extension","i","fk","kettlebell",1,0,0,"Встаньте, ноги на ширине таза, выжмите гирю за рожки над головой. / Держа плечи вертикально у головы, согните локти и опустите гирю за голову. / Разогните руки и вернитесь в исходное положение.",0],["Kettlebell_Pass_Between_The_Legs","Передача гири между ног","Kettlebell Pass Between The Legs","k","nmf","kettlebell",2,0,1,"Поставьте гирю между ног и наклонитесь, отводя таз назад и сохраняя спину прямой. / Возьмите гирю и передайте её в другую руку между ног восьмёркой. / Продолжайте передачи вперёд и назад нужное число повторений.",2],["Kettlebell_Pirate_Ships","Пиратский корабль с гирей","Kettlebell Pirate Ships","f","k","kettlebell",1,0,1,"Встаньте широко, держите гирю двумя руками на уровне пояса на прямых руках. / Повернитесь в сторону, раскачивая гирю до уровня головы, и задержитесь вверху. / Опустите гирю вниз и качните её в другую сторону.",2],["Kettlebell_Pistol_Squat","Пистолетик с гирей","Kettlebell Pistol Squat","l","onmf","kettlebell",3,0,1,"Держите гирю за рожки перед собой и поднимите одну ногу от пола. / Присядьте на опорной ноге, отводя таз назад и держа гирю перед собой. / Задержитесь внизу на секунду и встаньте, отталкиваясь пяткой.",2],["Kettlebell_Seated_Press","Жим гири сидя на полу","Kettlebell Seated Press","f","i","kettlebell",2,0,1,"Сядьте на пол, удобно разведя ноги. / Поднимите гирю на плечо. / Выжмите гирю над головой до полного выпрямления руки и опустите обратно.",2],["Kettlebell_Seesaw_Press","Попеременный жим двух гирь","Kettlebell Seesaw Press","f","i","kettlebell",2,0,1,"Поднимите две гири на плечи. / Выжмите одну гирю над головой. / Опустите её и сразу выжмите другую, выполняя одинаковое число повторений на каждую руку.",2],["Kettlebell_Sumo_High_Pull","Протяжка гири в стойке сумо","Kettlebell Sumo High Pull","e","pnmlf","kettlebell",2,0,1,"Поставьте гирю между стоп, встаньте широко и возьмите гирю двумя руками. / Отведите таз назад, согните колени, держите грудь и голову поднятыми. / Мощно разогните ноги и таз, подтягивая гирю к подбородку, локти выше кистей.",2],["Kettlebell_Thruster","Трастер с гирями","Kettlebell Thruster","f","li","kettlebell",2,0,1,"Поднимите две гири на плечи, разгибая ноги и таз. / Присядьте, сгибая колени и таз, держа гири на плечах. / Мощно встаньте и сразу выжмите гири над головой.",2],["Kettlebell_Turkish_Get-Up_Lunge_style","Турецкий подъём с гирей через выпад","Kettlebell Turkish Get-Up (Lunge style)","f","kmli","kettlebell",2,0,1,"Лягте на спину и выжмите гирю вверх, согнув колено на той же стороне. / Удерживая гирю на прямой руке, перекатитесь и, опираясь свободной рукой, выйдите в выпад. / Встаньте из выпада, затем в обратном порядке вернитесь на пол.",2],["Kettlebell_Turkish_Get-Up_Squat_style","Турецкий подъём с гирей через присед","Kettlebell Turkish Get-Up (Squat style)","f","komli","kettlebell",2,0,1,"Лягте на спину и выжмите гирю вверх, согнув колено на той же стороне. / Удерживая гирю на прямой руке, перекатитесь и, опираясь свободной рукой, перейдите в присед. / Встаньте из приседа, затем в обратном порядке вернитесь на пол.",2],["Kettlebell_Windmill","Мельница с гирей","Kettlebell Windmill","k","nmfi","kettlebell",2,0,1,"Поднимите гирю на плечо и выжмите её над головой. / Удерживая руку с гирей прямой, наклонитесь в сторону, опуская свободную руку к стопе. / Вернитесь в вертикальное положение, не сводя глаз с гири.",2],["Kipping_Muscle_Up","Выход силой на кольцах с киппингом","Kipping Muscle Up","b","khjcfei","pullup",2,0,1,"Возьмитесь за кольца ложным хватом и слегка качните ноги назад. / Махом ног вперёд и вверх подтяните себя к кольцам. / В верхней точке переведите локти вверх и выжмите себя над кольцами.",2],["Knee_Across_The_Body","Растяжка с перекрёстом колена лёжа","Knee Across The Body","n","qd","",1,1,0,"Лягте на пол, правая нога прямая, левую согните и перекиньте через тело. / Прижмите колено к полу правой рукой, левую руку отведите в сторону и поверните голову влево. / Удерживайте растяжку, затем повторите на другую сторону.",2],["Knee_Circles","Круговые вращения коленями","Knee Circles","o","ml","",1,1,1,"Встаньте, ноги вместе, руки на поясе. / Выполняйте круговые движения коленями, дыша ровно. / Повторите нужное число раз в каждую сторону.",2],["Knee_Hip_Raise_On_Parallel_Bars","Подъём коленей на брусьях","Knee/Hip Raise On Parallel Bars","k","","other",1,0,0,"Упритесь предплечьями в подлокотники, возьмитесь за ручки, спина прижата к спинке. / Поднимите колени к груди, подкручивая таз. / Медленно опустите ноги в исходное положение.",2],["Knee_Tuck_Jump","Прыжок с подтягиванием коленей","Knee Tuck Jump","m","qponl","",1,2,1,"Встаньте, слегка согнув колени, руки перед грудью ладонями вниз. / Быстро присядьте на четверть и мощно выпрыгните вверх. / Подтяните колени к груди, коснувшись ладоней, и мягко приземлитесь.",2],["Kneeling_Arm_Drill","Отработка работы рук стоя на колене","Kneeling Arm Drill","f","k","",1,2,0,"Встаньте на правое колено, левая нога впереди, давите на пятку передней ноги. / Выполняйте длинные маятниковые махи руками, как при беге. / Постепенно уменьшайте угол в локтях, ускоряя темп движений.",2],["Kneeling_Cable_Crunch_With_Alternating_Oblique_Twists","Скручивания на блоке стоя на коленях с поворотами","Kneeling Cable Crunch With Alternating Oblique Twists","k","","cable",1,0,0,"Встаньте на колени перед верхним блоком, держите канат у головы. / Скрутитесь, напрягая пресс, и опустите локти к бёдрам. / Чередуйте с поворотом корпуса в стороны, работая косыми мышцами.",2],["Kneeling_Cable_Triceps_Extension","Разгибание рук на блоке стоя на коленях","Kneeling Cable Triceps Extension","i","","cable",2,0,0,"Поставьте скамью перед верхним блоком, возьмите прямую рукоять узким хватом над головой. / Встаньте на колени спиной к блоку, обопритесь плечами о скамью, локти согнуты. / Разогните руки вперёд, держа плечи неподвижными, и вернитесь обратно.",2],["Kneeling_Forearm_Stretch","Растяжка предплечий стоя на коленях","Kneeling Forearm Stretch","j","","",1,1,0,"Встаньте на колени, ладони на полу, пальцы направлены к коленям. / Медленно отклонитесь назад, не отрывая ладоней, до ощущения растяжения. / Удерживайте 20–30 секунд.",2],["Kneeling_High_Pulley_Row","Тяга верхнего блока к лицу стоя на коленях","Kneeling High Pulley Row","b","hc","cable",1,0,1,"Прикрепите канат к верхнему блоку и встаньте на колени, руки вытянуты вперёд. / Согните локти и потяните канат к корпусу, сводя лопатки. / Задержитесь и медленно вернитесь в исходное положение.",2],["Kneeling_Hip_Flexor","Растяжка сгибателей бедра стоя на колене","Kneeling Hip Flexor","l","l","",1,1,0,"Встаньте на левое колено, правая стопа впереди на полу. / Сместите вес вперёд до ощущения растяжения в тазобедренном суставе. / Удерживайте 15 секунд и повторите на другую сторону.",2],["Kneeling_Jump_Squat","Прыжок из положения на коленях в присед","Kneeling Jump Squat","n","oml","barbell",3,4,1,"Встаньте на колени со штангой на плечах или без веса. / Сядьте тазом на пятки, держа голову и грудь поднятыми. / Мощным махом рук и таза выпрыгните на стопы в присед.",2],["Kneeling_Single-Arm_High_Pulley_Row","Тяга верхнего блока одной рукой стоя на коленях","Kneeling Single-Arm High Pulley Row","b","hc","cable",1,0,1,"Прикрепите рукоять к верхнему блоку и встаньте на колени, взяв её одной рукой. / Потяните рукоять к корпусу, сгибая локоть и сводя лопатку. / Медленно выпрямите руку и повторите.",2],["Kneeling_Squat","Приседания со штангой на коленях","Kneeling Squat","n","kmd","barbell",2,3,1,"Установите штангу в раме и встаньте на колени под гриф, положив его на плечи. / Сведите лопатки и снимите штангу со стоек. / Опустите таз к пяткам и вернитесь в вертикальное положение, напрягая ягодицы.",2],["Landmine_180s","Повороты с мини-штангой (лендмайн 180)","Landmine 180's","k","ndf","barbell",1,0,1,"Закрепите гриф в лендмайне, поднимите его конец до уровня плеч на прямых руках. / Встаньте широко и поверните корпус, опуская гриф к бедру. / Проведите гриф по дуге на другую сторону.",2],["Landmine_Linear_Jammer","Лендмайн джаммер","Landmine Linear Jammer","f","koamli","barbell",2,0,1,"Закрепите гриф в лендмайне с рукоятками и поднимите их к плечам. / Присядьте в атлетической стойке. / Мощно разогните ноги и выжмите гриф вверх-вперёд, затем вернитесь обратно.",2],["Lateral_Bound","Боковые прыжки","Lateral Bound","p","qonml","",1,2,1,"Встаньте в полуприсед боком к направлению движения. / Перенесите вес на внешнюю ногу и мощно оттолкнитесь в сторону как можно дальше. / Приземлитесь на другую ногу и повторите прыжок обратно.",2],["Lateral_Box_Jump","Боковые запрыгивания на тумбу","Lateral Box Jump","p","qonml","other",1,2,1,"Встаньте рядом с невысокой тумбой. / Быстро присядьте на четверть и выпрыгните вверх и в сторону. / Приземлитесь на тумбу, сойдите и повторите.",2],["Lateral_Cone_Hops","Боковые прыжки через конусы","Lateral Cone Hops","p","qonml","other",1,2,1,"Расставьте конусы в ряд и встаньте боком к ним. / Слегка присядьте и оттолкнитесь, перепрыгивая через конус. / Сразу после приземления выполняйте следующий прыжок.",2],["Lateral_Raise_-_With_Bands","Махи в стороны с эспандером","Lateral Raise - With Bands","f","","bands",1,0,0,"Встаньте на ленту, возьмите рукояти, руки вдоль бёдер. / С лёгким сгибом в локтях поднимите руки через стороны до уровня плеч. / Медленно опустите руки вниз.",2],["Latissimus_Dorsi-SMR","МФР широчайших на ролике","Latissimus Dorsi-SMR","b","","roller",1,1,0,"Лягте на бок, подложив ролик под спину чуть ниже подмышки. / Перенесите вес на широчайшую, удерживая корпус над полом. / Задержитесь на болезненных точках и прокатайте мышцу.",2],["Leg-Over_Floor_Press","Жим гири лёжа на полу с перекрещенными ногами","Leg-Over Floor Press","a","fi","kettlebell",2,0,1,"Лягте на пол с гирей на груди, рабочая нога перекинута через другую. / Выжмите гирю вверх до полного выпрямления руки. / Опустите гирю, пока локоть не коснётся пола.",2],["Leg-Up_Hamstring_Stretch","Растяжка задней поверхности бедра лёжа с поднятой ногой","Leg-Up Hamstring Stretch","m","","",1,1,0,"Лягте на спину, согните одну ногу, стопа на полу. / Поднимите другую ногу вверх и выпрямите колено, стопа к потолку. / Удерживайте растяжку и смените ногу.",2],["Leg_Extensions","Разгибание ног в тренажёре","Leg Extensions","l","","machines",1,0,0,"Сядьте в тренажёр, валик на нижней части голени, держитесь за ручки. / Разогните ноги до полного выпрямления на выдохе. / Медленно опустите вес на вдохе.",2],["Leg_Lift","Отведение ноги назад стоя","Leg Lift","n","m","",1,0,0,"Встаньте прямо и держитесь за опору для равновесия. / Согните одну ногу и поднимите пятку к ягодице, как при сгибании ног. / Медленно опустите ногу и повторите.",2],["Leg_Press","Жим ногами","Leg Press","l","onm","machines",1,0,1,"Сядьте в тренажёр, поставьте стопы на платформу на ширине плеч. / Снимите упоры и опустите платформу, сгибая колени до 90 градусов. / Выжмите платформу, не выпрямляя колени до конца.",2],["Leg_Pull-In","Подтягивание коленей к груди лёжа","Leg Pull-In","k","","",1,0,1,"Лягте на коврик, ноги прямые, руки вдоль тела или под ягодицами. / На выдохе согните колени и подтяните бёдра к животу. / Медленно выпрямите ноги в исходное положение.",2],["Leverage_Chest_Press","Жим от груди в рычажном тренажёре","Leverage Chest Press","a","fi","machines",1,0,1,"Отрегулируйте сиденье так, чтоб
