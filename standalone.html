и. / Медленно опустите гриф.",2],["Smith_Machine_Calf_Raise","Подъём на носки в Смите","Smith Machine Calf Raise","o","","machines",1,0,0,"Встаньте носками на блин, гриф на плечах. / Поднимитесь на носки как можно выше. / Медленно опустите пятки ниже уровня опоры.",2],["Smith_Machine_Close-Grip_Bench_Press","Жим лёжа узким хватом в Смите","Smith Machine Close-Grip Bench Press","i","af","machines",1,0,1,"Лягте на скамью под гриф, возьмите его на ширине плеч. / Опустите гриф к нижней части груди, локти вдоль корпуса. / Выжмите гриф вверх, напрягая трицепсы.",2],["Smith_Machine_Decline_Press","Жим на скамье с отрицательным наклоном в Смите","Smith Machine Decline Press","a","fi","machines",1,0,1,"Лягте на скамью головой вниз, гриф над грудью. / Опустите гриф к нижней части груди. / Выжмите вверх до выпрямления рук.",2],["Smith_Machine_Hang_Power_Clean","Взятие на грудь с виса в Смите","Smith Machine Hang Power Clean","m","ndlfe","machines",2,0,1,"Возьмите гриф хватом шире плеч на уровне колен. / Мощно разогните бёдра и колени, подтягивая гриф вверх. / Подсядьте и примите гриф на передние дельты.",2],["Smith_Machine_Hip_Raise","Подъём таза ногами в Смите","Smith Machine Hip Raise","k","","machines",1,0,0,"Лягте на скамью, упритесь стопами в гриф, выпрямите ноги. / Поднимите таз вверх, выжимая гриф ногами. / Медленно опустите таз.",2],["Smith_Machine_Incline_Bench_Press","Жим на наклонной скамье в Смите","Smith Machine Incline Bench Press","a","fi","machines",1,0,1,"Лягте на наклонную скамью под гриф, возьмите его хватом шире плеч. / Опустите гриф к верху груди. / Выжмите вверх на выдохе.",2],["Smith_Machine_Leg_Press","Жим ногами лёжа в Смите","Smith Machine Leg Press","l","onm","machines",2,0,1,"Лягте под гриф, поставьте на него середину стоп, колени у груди. / Выжмите гриф ногами вверх. / Медленно опустите, сгибая колени.",2],["Smith_Machine_One-Arm_Upright_Row","Тяга к подбородку одной рукой в Смите","Smith Machine One-Arm Upright Row","f","he","machines",1,0,1,"Встаньте прямо, возьмите гриф одной рукой. / Поднимите гриф вдоль корпуса к груди, локоть вверх. / Медленно опустите и после подхода смените руку.",2],["Smith_Machine_Overhead_Shoulder_Press","Жим от плеч сидя в Смите","Smith Machine Overhead Shoulder Press","f","i","machines",1,0,1,"Сядьте на скамью под гриф, возьмите его хватом шире плеч. / Выжмите гриф вверх до выпрямления рук. / Медленно опустите гриф к верху груди.",2],["Smith_Machine_Pistol_Squat","Приседания на одной ноге в Смите","Smith Machine Pistol Squat","l","onm","machines",2,0,1,"Встаньте под гриф, положите его на плечи, вынесите одну ногу вперёд. / Присядьте на опорной ноге, удерживая другую на весу. / Поднимитесь, после подхода смените ногу.",2],["Smith_Machine_Reverse_Calf_Raises","Обратный подъём на носки в Смите","Smith Machine Reverse Calf Raises","o","","machines",1,0,0,"Встаньте пятками на платформу, носки свисают, гриф на плечах. / Поднимите носки вверх, напрягая переднюю поверхность голени. / Медленно опустите носки.",2],["Smith_Machine_Squat","Приседания в Смите","Smith Machine Squat","l","onmd","machines",1,0,1,"Встаньте под гриф, положите его на верх спины, снимите со стоек. / Присядьте до параллели бёдер с полом на вдохе. / Поднимитесь, упираясь пятками, на выдохе.",2],["Smith_Machine_Stiff-Legged_Deadlift","Румынская тяга в Смите","Smith Machine Stiff-Legged Deadlift","m","nd","machines",1,0,1,"Возьмите гриф хватом сверху на ширине плеч, ноги почти прямые. / Наклонитесь вперёд с прямой спиной, опуская гриф вдоль ног. / Вернитесь в вертикальное положение, напрягая ягодицы и бёдра.",2],["Smith_Machine_Upright_Row","Тяга к подбородку в Смите","Smith Machine Upright Row","e","hcf","machines",1,0,1,"Возьмите гриф хватом сверху чуть уже плеч, руки опущены. / Поднимите гриф вдоль корпуса к подбородку, локти выше кистей. / Медленно опустите гриф.",2],["Smith_Single-Leg_Split_Squat","Болгарские выпады в Смите","Smith Single-Leg Split Squat","l","onm","machines",1,0,1,"Положите гриф на плечи, заднюю стопу поставьте на скамью позади. / Опуститесь на передней ноге до параллели бедра с полом. / Поднимитесь, после подхода смените ногу.",2],["Snatch","Рывок штанги","Snatch","l","hnmdfei","barbell",2,4,1,"Встаньте над штангой, возьмите её широким хватом, спина прямая. / Мощно разогните ноги и таз, подтягивая штангу вверх. / Подсядьте и зафиксируйте штангу на прямых руках над головой, затем встаньте.",2],["Snatch_Balance","Рывковый баланс","Snatch Balance","l","onmfi","barbell",2,4,1,"Положите штангу на плечи, возьмите рывковым хватом. / Сделайте короткий подсед и толчок, быстро уходя под штангу в глубокий присед. / Зафиксируйте штангу на прямых руках и встаньте.",2],["Snatch_Deadlift","Тяга рывковым хватом","Snatch Deadlift","m","jnmdle","barbell",2,4,1,"Встаньте над штангой, возьмите её широким рывковым хватом, спина прямая. / Поднимите штангу, разгибая ноги, сохраняя угол спины. / Выпрямитесь полностью и опустите штангу.",2],["Snatch_Pull","Рывковая тяга","Snatch Pull","m","ondle","barbell",2,0,1,"Возьмите штангу рывковым хватом, таз опущен, грудь вперёд. / Поднимите штангу от пола и мощно разогните таз, колени и стопы. / Завершите подъёмом плеч и опустите штангу.",2],["Snatch_Shrug","Рывковые шраги","Snatch Shrug","e","jf","barbell",2,4,1,"Держите штангу широким хватом на уровне середины бедра, корпус слегка наклонён. / Поднимите плечи к ушам взрывным движением. / Опустите плечи и повторите.",2],["Snatch_from_Blocks","Рывок с плинтов","Snatch from Blocks","l","ojnmdfei","barbell",3,4,1,"Положите штангу на плинты, возьмите её широким хватом. / Мощно разогните ноги и таз, подтягивая штангу вверх. / Подсядьте и примите штангу на прямые руки над головой.",2],["Speed_Band_Overhead_Triceps","Скоростное разгибание рук с резинкой из-за головы","Speed Band Overhead Triceps","i","","bands",1,0,0,"Закрепите резинку внизу, возьмите её за головой, локти вверх. / Быстро разогните руки вверх. / Медленно согните руки обратно.",2],["Speed_Box_Squat","Скоростные приседания на ящик","Speed Box Squat","l","onm","barbell",2,3,1,"Закрепите резинки на грифе, положите гриф на плечи, встаньте перед ящиком. / Присядьте на ящик, контролируя движение. / Взрывно встаньте с ящика.",2],["Speed_Squats","Скоростные приседания со штангой","Speed Squats","l","onmd","barbell",3,0,1,"Положите штангу на верх спины и снимите со стоек. / Быстро присядьте до параллели. / Взрывно поднимитесь вверх.",2],["Spell_Caster","«Заклинатель» с гантелями","Spell Caster","k","nf","dumbbells",1,0,1,"Встаньте широко, гантели в руках хватом сверху. / Отведите обе гантели к бедру, разворачивая корпус. / Махом проведите их по дуге через корпус в другую сторону.",2],["Spider_Crawl","«Паук» (ползание)","Spider Crawl","k","afi","",1,0,1,"Примите упор лёжа на руках и носках, руки согнуты под 90 градусов. / Подтяните колено к локтю той же стороны, развернув ногу. / Переставляйте руки и ноги, продвигаясь вперёд.",2],["Spider_Curl","Паучьи сгибания со штангой","Spider Curl","h","","barbell",1,0,0,"Лягте грудью на наклонную сторону скамьи Скотта, руки свисают вертикально. / Согните руки, поднимая штангу к плечам. / Медленно опустите штангу.",2],["Spinal_Stretch","Скручивания позвоночника сидя","Spinal Stretch","c","bdge","",1,1,0,"Сядьте прямо на стул, руки за головой, локти в стороны. / Поверните корпус в одну сторону несколько раз. / Наклонитесь вперёд и потянитесь локтем к полу, затем смените сторону.",2],["Split_Clean","Взятие на грудь в ножницы","Split Clean","l","ojnmdfe","barbell",2,4,1,"Возьмите штангу хватом сверху у голеней, спина прямая. / Мощно подтяните штангу вверх, разгибая таз и колени. / Уйдите в выпад-ножницы, примите штангу на грудь и встаньте.",2],["Split_Jerk","Толчок в ножницы","Split Jerk","l","nmfi","barbell",2,4,1,"Держите штангу на груди, сделайте короткий подсед. / Взрывно вытолкните штангу вверх. / Уйдите в ножницы, зафиксируйте штангу на прямых руках и сведите ноги.",2],["Split_Jump","Прыжки в выпаде","Split Jump","l","onm","",1,2,1,"Встаньте в выпад, заднее колено почти касается пола. / Выпрыгните вверх, помогая махом рук. / Смените ноги в воздухе и приземлитесь в выпад.",2],["Split_Snatch","Рывок в ножницы","Split Snatch","m","ojnmdlfei","barbell",3,4,1,"Возьмите штангу широким хватом, таз опущен, грудь вперёд. / Мощно подтяните штангу вверх. / Уйдите в ножницы, зафиксируйте штангу над головой и сведите ноги.",2],["Split_Squat_with_Dumbbells","Болгарские выпады с гантелями","Split Squat with Dumbbells","l","nm","dumbbells",1,0,1,"Встаньте в разножку, заднюю стопу поставьте на опору, гантели в руках. / Опуститесь, сгибая переднее колено. / Поднимитесь и после подхода смените ногу.",2],["Split_Squats","Прыжки со сменой ног в разножке","Split Squats","m","onl","",2,1,0,"Встаньте прямо. / Прыжком перейдите в разножку и слегка присядьте. / Сразу выпрыгните, меняя ноги, повторите 5–10 раз.",2],["Squat_Jerk","Толчок в присед","Squat Jerk","l","onmfi","barbell",3,0,1,"Держите штангу на груди, сделайте короткий подсед. / Взрывно вытолкните штангу вверх и уйдите в присед. / Зафиксируйте штангу на прямых руках и встаньте.",2],["Squat_with_Bands","Приседания со штангой с резинками","Squat with Bands","l","ponmd","barbell",2,3,1,"Закрепите резинки на грифе, положите штангу на верх спины. / Присядьте до параллели, сохраняя спину прямой. / Мощно поднимитесь, преодолевая натяжение резинок.",2],["Squat_with_Chains","Приседания со штангой с цепями","Squat with Chains","l","ponmd","barbell",2,3,1,"Повесьте цепи на гриф, положите штангу на верх спины. / Присядьте до параллели, сохраняя спину прямой. / Поднимитесь, преодолевая нарастающую нагрузку.",2],["Squat_with_Plate_Movers","Приседания со штангой с переноской блинов","Squat with Plate Movers","l","qponm","barbell",2,0,1,"Снимите штангу со стоек, отступите к блину на полу. / Выполните приседание и верните штангу на стойки. / Перенесите блин в другое место и повторите.",2],["Squats_-_With_Bands","Приседания с резинкой","Squats - With Bands","l","onmd","bands",1,0,1,"Встаньте на середину резинки, ноги на ширине плеч, рукояти у плеч. / Присядьте до параллели бёдер с полом. / Поднимитесь, упираясь пятками.",2],["Stairmaster","Степпер-лестница","Stairmaster","l","onm","machines",2,6,0,"Встаньте на тренажёр и выберите программу. / Шагайте в ровном ритме, держа корпус прямо. / Не опирайтесь сильно на поручни.",2],["Standing_Alternating_Dumbbell_Press","Попеременный жим гантелей стоя","Standing Alternating Dumbbell Press","f","i","dumbbells",1,0,1,"Встаньте прямо, гантели у плеч ладонями вперёд. / Выжмите одну гантель вверх, не наклоняя корпус. / Опустите её и выжмите другую.",2],["Standing_Barbell_Calf_Raise","Подъём на носки со штангой стоя","Standing Barbell Calf Raise","o","","barbell",1,0,0,"Положите штангу на плечи, носки на возвышении. / Поднимитесь на носки как можно выше. / Медленно опустите пятки.",2],["Standing_Barbell_Press_Behind_Neck","Жим штанги из-за головы стоя","Standing Barbell Press Behind Neck","f","i","barbell",2,0,1,"Снимите штангу со стоек, держа её на плечах за головой. / Выжмите штангу вверх до выпрямления рук. / Медленно опустите её за голову.",2],["Standing_Bent-Over_One-Arm_Dumbbell_Triceps_Extension","Разгибание руки с гантелью в наклоне","Standing Bent-Over One-Arm Dumbbell Triceps Extension","i","f","dumbbells",1,0,0,"Наклонитесь почти параллельно полу, плечо прижато к корпусу, локоть согнут. / Разогните руку назад, напрягая трицепс. / Медленно согните руку и после подхода смените сторону.",2],["Standing_Bent-Over_Two-Arm_Dumbbell_Triceps_Extension","Разгибание рук с гантелями в наклоне стоя","Standing Bent-Over Two-Arm Dumbbell Triceps Extension","i","","dumbbells",1,0,0,"Наклонитесь почти параллельно полу, плечи прижаты к корпусу, локти согнуты. / Разогните руки назад, напрягая трицепсы. / Медленно согните руки.",2],["Standing_Biceps_Cable_Curl","Сгибание рук на нижнем блоке стоя","Standing Biceps Cable Curl","h","","cable",1,0,0,"Встаньте прямо, возьмите рукоять нижнего блока хватом снизу, локти у корпуса. / Согните руки, поднимая рукоять к плечам. / Медленно опустите рукоять.",2],["Standing_Biceps_Stretch","Растяжка бицепса стоя","Standing Biceps Stretch","h","af","other",1,1,0,"Сцепите руки за спиной, выпрямите их. / Разверните ладони вниз. / Поднимите руки вверх до ощущения растяжения в бицепсах.",2],["Standing_Bradford_Press","Жим Брэдфорда стоя","Standing Bradford Press","f","i","barbell",1,0,1,"Возьмите штангу на грудь хватом на ширине плеч. / Выжмите гриф чуть выше головы и опустите его за голову. / Снова выжмите и опустите на грудь, чередуя стороны.",2],["Standing_Cable_Chest_Press","Жим в кроссовере стоя","Standing Cable Chest Press","a","fi","cable",1,0,1,"Встаньте между блоками на уровне груди, возьмите рукояти. / Выжмите рукояти вперёд до выпрямления рук на выдохе. / Медленно верните руки назад на вдохе.",2],["Standing_Cable_Lift","Подъём каната снизу вверх по диагонали","Standing Cable Lift","k","f","cable",1,0,1,"Встаньте боком к нижнему блоку, возьмите рукоять двумя руками. / Потяните рукоять по диагонали вверх, разворачивая корпус. / Подконтрольно вернитесь в исходное положение.",2],["Standing_Cable_Wood_Chop","Дровосек на верхнем блоке","Standing Cable Wood Chop","k","f","cable",1,0,1,"Встаньте боком к верхнему блоку, возьмите рукоять двумя руками. / Потяните рукоять по диагонали вниз к противоположному колену, разворачивая корпус. / Медленно вернитесь в исходное положение.",2],["Standing_Calf_Raises","Подъём на носки стоя в тренажёре","Standing Calf Raises","o","","machines",1,0,0,"Подставьте плечи под валики, носки на платформе. / Поднимитесь на носки как можно выше и задержитесь. / Медленно опустите пятки ниже платформы.",2],["Standing_Concentration_Curl","Концентрированный подъём гантели стоя","Standing Concentration Curl","h","j","dumbbells",1,0,0,"Наклонитесь вперёд, рабочая рука с гантелью висит вертикально. / Согните руку, поднимая гантель к плечу без движения плеча. / Медленно опустите гантель.",2],["Standing_Dumbbell_Calf_Raise","Подъём на носки с гантелями стоя","Standing Dumbbell Calf Raise","o","","dumbbells",2,0,0,"Встаньте носками на возвышение, гантели в опущенных руках. / Поднимитесь на носки как можно выше. / Медленно опустите пятки до растяжения икр.",2],["Standing_Dumbbell_Press","Жим гантелей стоя","Standing Dumbbell Press","f","i","dumbbells",1,0,1,"Встаньте прямо, гантели у плеч ладонями вперёд. / Выжмите гантели вверх на выдохе. / Медленно опустите их к плечам.",2],["Standing_Dumbbell_Reverse_Curl","Подъём гантелей обратным хватом стоя","Standing Dumbbell Reverse Curl","h","j","dumbbells",2,0,0,"Встаньте прямо, гантели в руках хватом сверху. / Согните руки, поднимая гантели к плечам, локти прижаты. / Медленно опустите гантели.",2],["Standing_Dumbbell_Straight-Arm_Front_Delt_Raise_Above_Head","Подъём гантели прямыми руками над головой стоя","Standing Dumbbell Straight-Arm Front Delt Raise Above Head","f","","dumbbells",2,0,0,"Встаньте прямо, держите гантель перед бёдрами прямыми руками. / Поднимите гантель через перед над головой, не сгибая рук. / Медленно опустите в исходное положение.",2],["Standing_Dumbbell_Triceps_Extension","Французский жим гантели стоя","Standing Dumbbell Triceps Extension","i","","dumbbells",1,0,0,"Возьмите гантель двумя руками и поднимите над головой. / Опустите гантель за голову, сгибая локти. / Разогните руки, возвращая гантель вверх.",2],["Standing_Dumbbell_Upright_Row","Тяга гантелей к подбородку","Standing Dumbbell Upright Row","e","hf","dumbbells",1,0,1,"Встаньте прямо, гантели перед бёдрами хватом сверху. / Поднимите гантели к подбородку, ведя локти вверх и в стороны. / Медленно опустите гантели.",2],["Standing_Elevated_Quad_Stretch","Растяжка квадрицепса с опорой ноги на возвышение","Standing Elevated Quad Stretch","l","","other",1,1,0,"Встаньте спиной к скамье и положите на неё подъём стопы одной ноги. / Слегка согните опорную ногу и подайте таз вперёд. / Задержитесь на 20–30 секунд и смените ногу.",2],["Standing_Front_Barbell_Raise_Over_Head","Подъём штанги перед собой над головой стоя","Standing Front Barbell Raise Over Head","f","","barbell",2,0,0,"Встаньте прямо, держите штангу перед бёдрами хватом сверху. / Прямыми руками поднимите штангу вверх над головой. / Медленно опустите в исходное положение.",2],["Standing_Gastrocnemius_Calf_Stretch","Растяжка икроножной мышцы стоя","Standing Gastrocnemius Calf Stretch","o","m","",1,1,0,"Упритесь руками в стену, одну ногу отставьте назад. / Прижмите пятку задней ноги к полу, держа колено прямым. / Задержитесь на 20–30 секунд и смените ногу.",2],["Standing_Hamstring_and_Calf_Stretch","Растяжка бицепса бедра и икры стоя","Standing Hamstring and Calf Stretch","m","","other",1,1,0,"Выставьте одну ногу вперёд на пятку, носок на себя. / Наклонитесь к ноге с прямой спиной. / Задержитесь на 20–30 секунд и смените ногу.",2],["Standing_Hip_Circles","Круговые вращения бёдрами стоя","Standing Hip Circles","q","p","",1,1,0,"Встаньте прямо, руки на поясе, ноги на ширине плеч. / Выполняйте плавные круговые движения тазом. / Смените направление вращения.",2],["Standing_Hip_Flexors","Растяжка сгибателей бедра стоя","Standing Hip Flexors","l","","",1,1,0,"Встаньте в небольшой выпад, задняя пятка оторвана от пола. / Подайте таз вперёд, чувствуя растяжение передней поверхности бедра. / Задержитесь и смените ногу.",2],["Standing_Inner-Biceps_Curl","Подъём гантелей на бицепс с разворотом наружу","Standing Inner-Biceps Curl","h","","dumbbells",2,0,0,"Встаньте прямо, гантели в опущенных руках ладонями к себе. / Согните руки, разворачивая ладони и уводя гантели наружу. / Медленно опустите гантели.",2],["Standing_Lateral_Stretch","Боковая растяжка стоя","Standing Lateral Stretch","k","","",1,1,0,"Встаньте прямо, поднимите одну руку над головой. / Наклонитесь в противоположную сторону, вытягивая бок. / Задержитесь и повторите в другую сторону.",2],["Standing_Leg_Curl","Сгибание ноги стоя в тренажёре","Standing Leg Curl","m","","machines",1,0,0,"Встаньте в тренажёр, валик за пяткой рабочей ноги. / Согните ногу, подтягивая пятку к ягодице. / Медленно опустите ногу.",2],["Standing_Long_Jump","Прыжок в длину с места","Standing Long Jump","l","onm","",1,2,1,"Встаньте прямо, ноги на ширине плеч. / Присядьте и взмахните руками назад. / Выпрыгните вперёд как можно дальше и мягко приземлитесь.",2],["Standing_Low-Pulley_Deltoid_Raise","Подъём руки в сторону на нижнем блоке","Standing Low-Pulley Deltoid Raise","f","j","cable",1,0,0,"Встаньте боком к нижнему блоку, возьмите рукоять дальней рукой. / Поднимите руку в сторону до уровня плеча. / Медленно опустите руку.",2],["Standing_Low-Pulley_One-Arm_Triceps_Extension","Разгибание руки из-за головы на нижнем блоке","Standing Low-Pulley One-Arm Triceps Extension","i","af","cable",2,0,0,"Встаньте спиной к нижнему блоку, рукоять в руке за головой. / Разогните руку вверх, держа плечо неподвижным. / Медленно опустите рукоять за голову.",2],["Standing_Military_Press","Армейский жим стоя","Standing Military Press","f","i","barbell",1,0,1,"Возьмите штангу на грудь хватом чуть шире плеч. / Выжмите штангу над головой на выдохе. / Медленно опустите её на грудь.",2],["Standing_Olympic_Plate_Hand_Squeeze","Сжатие блинов пальцами стоя","Standing Olympic Plate Hand Squeeze","j","h","other",1,0,0,"Держите блины за край в каждой руке нейтральным хватом. / Опустите блины, разжимая пальцы почти полностью. / Сожмите пальцы, возвращая блины вверх.",2],["Standing_One-Arm_Cable_Curl","Сгибание руки на нижнем блоке стоя","Standing One-Arm Cable Curl","h","","cable",2,0,0,"Встаньте лицом к нижнему блоку, возьмите рукоять одной рукой. / Согните руку, подтягивая рукоять к плечу, локоть прижат. / Медленно разогните руку.",2],["Standing_One-Arm_Dumbbell_Curl_Over_Incline_Bench","Подъём гантели одной рукой через наклонную скамью стоя","Standing One-Arm Dumbbell Curl Over Incline Bench","h","","dumbbells,bench",1,0,0,"Встаньте за наклонной скамьёй и положите плечо на спинку. / Согните руку, поднимая гантель к плечу. / Медленно опустите гантель до выпрямления руки.",2],["Standing_One-Arm_Dumbbell_Triceps_Extension","Разгибание руки с гантелью из-за головы стоя","Standing One-Arm Dumbbell Triceps Extension","i","af","dumbbells",1,0,0,"Поднимите гантель над головой одной рукой. / Опустите гантель за голову, сгибая локоть. / Разогните руку вверх.",2],["Standing_Overhead_Barbell_Triceps_Extension","Французский жим штанги стоя","Standing Overhead Barbell Triceps Extension","i","f","barbell",1,0,0,"Поднимите штангу над головой узким хватом. / Опустите штангу за голову, сгибая локти. / Разогните руки, возвращая штангу вверх.",2],["Standing_Palm-In_One-Arm_Dumbbell_Press","Жим гантели одной рукой нейтральным хватом стоя","Standing Palm-In One-Arm Dumbbell Press","f","i","dumbbells",1,0,1,"Держите гантель у плеча ладонью к себе. / Выжмите гантель вверх на выдохе. / Медленно опустите её к плечу.",2],["Standing_Palms-In_Dumbbell_Press","Жим гантелей нейтральным хватом стоя","Standing Palms-In Dumbbell Press","f","i","dumbbells",2,0,1,"Держите гантели у плеч ладонями друг к другу. / Выжмите гантели вверх на выдохе. / Медленно опустите их к плечам.",2],["Standing_Palms-Up_Barbell_Behind_The_Back_Wrist_Curl","Сгибание запястий со штангой за спиной стоя","Standing Palms-Up Barbell Behind The Back Wrist Curl","j","","barbell",1,0,0,"Держите штангу за ягодицами на прямых руках. / Согните запястья, поднимая штангу вверх. / Медленно опустите штангу.",2],["Standing_Pelvic_Tilt","Наклоны таза стоя","Standing Pelvic Tilt","d","n","",1,1,0,"Встаньте прямо, колени слегка согнуты, руки на поясе. / Подкрутите таз вперёд, напрягая пресс и ягодицы. / Верните таз назад и повторите.",2],["Standing_Rope_Crunch","Скручивания на верхнем блоке стоя","Standing Rope Crunch","k","","cable",1,0,0,"Встаньте спиной к верхнему блоку, держите канат у головы. / Скрутитесь вперёд и вниз за счёт пресса. / Медленно вернитесь в исходное положение.",2],["Standing_Soleus_And_Achilles_Stretch","Растяжка камбаловидной мышцы и ахилла стоя","Standing Soleus And Achilles Stretch","o","","",1,1,0,"Упритесь в стену, одну ногу отставьте назад. / Согните колено задней ноги, не отрывая пятку от пола. / Задержитесь на 20–30 секунд и смените ногу.",2],["Standing_Toe_Touches","Наклоны к носкам стоя","Standing Toe Touches","m","o","",1,1,0,"Встаньте прямо, ноги вместе, колени слегка мягкие. / Наклонитесь и потянитесь руками к носкам. / Задержитесь и медленно выпрямитесь.",2],["Standing_Towel_Triceps_Extension","Разгибание рук с полотенцем стоя","Standing Towel Triceps Extension","i","","",1,0,0,"Держите полотенце за спиной: одна рука сверху, другая снизу. / Нижней рукой создавайте сопротивление, верхней разгибайте руку вверх. / Повторите и смените руки.",2],["Standing_Two-Arm_Overhead_Throw","Бросок медбола из-за головы стоя","Standing Two-Arm Overhead Throw","f","ab","medball",1,2,1,"Встаньте прямо, держите медбол двумя руками. / Заведите мяч за голову, слегка прогнувшись. / Мощно бросьте мяч вперёд всем телом.",2],["Star_Jump","Прыжок звёздочка","Star Jump","l","onmf","",1,2,1,"Встаньте прямо, руки вдоль тела. / Выпрыгните вверх, разводя руки и ноги в стороны. / Приземлитесь в исходное положение и повторите.",2],["Step-up_with_Knee_Raise","Зашагивание на платформу с подъёмом колена","Step-up with Knee Raise","n","ml","",1,0,1,"Поставьте одну ногу на платформу. / Встаньте на неё, поднимая колено другой ноги к груди. / Опуститесь обратно и повторите.",2],["Step_Mill","Степпер-лестница","Step Mill","l","onm","machines",2,6,0,"Встаньте на тренажёр и выберите скорость. / Шагайте по ступеням, держа корпус прямо. / Не опирайтесь сильно на поручни.",2],["Stiff-Legged_Barbell_Deadlift","Становая тяга штанги на прямых ногах","Stiff-Legged Barbell Deadlift","m","nd","barbell",2,0,1,"Встаньте прямо со штангой в руках, колени почти прямые. / Наклонитесь вперёд с прямой спиной, опуская штангу вдоль ног. / Выпрямитесь за счёт мышц задней поверхности бедра.",2],["Stiff-Legged_Dumbbell_Deadlift","Становая тяга с гантелями на прямых ногах","Stiff-Legged Dumbbell Deadlift","m","nd","dumbbells",1,0,1,"Встаньте прямо с гантелями в руках, колени почти прямые. / Наклонитесь вперёд с прямой спиной, опуская гантели вдоль ног. / Вернитесь в исходное положение.",2],["Stiff_Leg_Barbell_Good_Morning","Гуд морнинг на прямых ногах","Stiff Leg Barbell Good Morning","d","nm","barbell",1,0,1,"Положите штангу на верх спины, ноги почти прямые. / Наклонитесь вперёд с прямой спиной до параллели с полом. / Выпрямитесь, подавая таз вперёд.",2],["Stomach_Vacuum","Вакуум живота","Stomach Vacuum","k","","",1,1,0,"Встаньте прямо и полностью выдохните. / Максимально втяните живот внутрь и задержитесь. / Расслабьте живот и сделайте вдох.",2],["Straight-Arm_Dumbbell_Pullover","Пуловер с гантелью на прямых руках","Straight-Arm Dumbbell Pullover","a","bfi","dumbbells",2,0,1,"Лягте на скамью, держите гантель над грудью прямыми руками. / Опустите гантель за голову по дуге. / Верните её над грудью.",2],["Straight-Arm_Pulldown","Пуловер на верхнем блоке стоя","Straight-Arm Pulldown","b","","cable",1,0,0,"Встаньте лицом к верхнему блоку, возьмите прямую рукоять. / Прямыми руками опустите рукоять к бёдрам. / Медленно верните руки вверх.",2],["Straight_Bar_Bench_Mid_Rows","Тяга штанги стоя на скамье","Straight Bar Bench Mid Rows","c","hb","barbell,bench",1,0,1,"Встаньте на скамью, возьмите штангу хватом сверху средней ширины. / Подтяните штангу к корпусу, сводя лопатки. / Медленно опустите штангу.",2],["Straight_Raises_on_Incline_Bench","Подъём штанги прямыми руками лёжа на наклонной скамье","Straight Raises on Incline Bench","f","e","barbell,bench",1,0,0,"Лягте грудью на наклонную скамью, штанга в прямых руках. / Поднимите штангу вперёд до уровня головы. / Медленно опустите штангу.",2],["Stride_Jump_Crossover","Прыжок с переходом через тумбу","Stride Jump Crossover","l","qpom","other",1,2,1,"Встаньте боком к тумбе, одна нога на ней. / Оттолкнитесь верхней ногой и выпрыгните вверх, перемещаясь через тумбу. / Приземлитесь с другой стороны, сменив ноги.",2],["Sumo_Deadlift","Становая тяга сумо","Sumo Deadlift","m","pjndcle","barbell",2,3,1,"Встаньте широко, носки развёрнуты, возьмите штангу узким хватом. / Поднимите штангу, разгибая ноги и таз с прямой спиной. / Опустите штангу на пол под контролем.",2],["Sumo_Deadlift_with_Bands","Становая тяга сумо с резинками","Sumo Deadlift with Bands","m","pjndcle","barbell",2,3,1,"Встаньте широко у штанги с закреплёнными резинками. / Поднимите штангу, разгибая ноги и таз с прямой спиной. / Опустите штангу под контролем.",2],["Sumo_Deadlift_with_Chains","Становая тяга сумо с цепями","Sumo Deadlift with Chains","m","qpjndcle","barbell",2,3,1,"Встаньте широко у штанги с подвешенными цепями. / Поднимите штангу, разгибая ноги и таз с прямой спиной. / Опустите штангу под контролем.",2],["Superman","Супермен","Superman","d","nm","",1,1,1,"Лягте на живот, руки вытяните вперёд. / Одновременно поднимите руки, грудь и ноги от пола. / Задержитесь и медленно опуститесь.",2],["Supine_Chest_Throw","Бросок медбола от груди лёжа","Supine Chest Throw","i","af","medball",1,2,1,"Лягте на спину, согните колени, медбол на груди. / Мощно вытолкните мяч вверх. / Поймайте мяч и опустите к груди.",2],["Supine_One-Arm_Overhead_Throw","Бросок медбола одной рукой из-за головы лёжа","Supine One-Arm Overhead Throw","k","abf","medball",1,2,1,"Лягте на спину, держите мяч одной рукой за головой. / Бросьте мяч вперёд, одновременно поднимая корпус. / Вернитесь в исходное положение.",2],["Supine_Two-Arm_Overhead_Throw","Бросок медбола двумя руками из-за головы лёжа","Supine Two-Arm Overhead Throw","k","abf","medball",1,2,1,"Лягте на спину, держите мяч двумя руками за головой. / Бросьте мяч вперёд, одновременно поднимая корпус. / Вернитесь в исходное положение.",2],["Suspended_Fallout","Выкат на петлях TRX","Suspended Fallout","k","adf","other",2,0,0,"Возьмитесь за рукояти и наклонитесь вперёд в упор. / Прямыми руками выведите рукояти вперёд над головой. / Вернитесь в исходное положение за счёт пресса.",2],["Suspended_Push-Up","Отжимания на петлях TRX","Suspended Push-Up","a","fi","other",1,0,1,"Примите упор лёжа, держась за рукояти петель. / Опуститесь, сгибая локти до уровня груди. / Выжмите себя вверх.",2],["Suspended_Reverse_Crunch","Обратные скручивания на петлях TRX","Suspended Reverse Crunch","k","","other",1,0,0,"Примите упор лёжа, стопы в петлях. / Подтяните колени к груди, округляя спину. / Вернитесь в упор лёжа.",2],["Suspended_Row","Тяга на петлях TRX","Suspended Row","c","hb","other",1,0,1,"Возьмитесь за рукояти и отклонитесь назад на прямых руках. / Подтяните грудь к рукоятям, сводя лопатки. / Медленно опуститесь назад.",2],["Suspended_Split_Squat","Сплит-присед на петлях TRX","Suspended Split Squat","l","qponm","other",2,0,1,"Поставьте стопу задней ноги в петлю. / Присядьте на передней ноге до параллели. / Вернитесь вверх, отталкиваясь передней ногой.",2],["Svend_Press","Жим Свенда","Svend Press","a","jfi","other",1,0,1,"Сожмите блин ладонями перед грудью. / Выжмите блин вперёд, продолжая сжимать его. / Верните к груди.",2],["T-Bar_Row_with_Handle","Тяга Т-грифа с рукоятью","T-Bar Row with Handle","c","hb","barbell",1,0,1,"Встаньте над Т-грифом, возьмите рукоять, спина прямая. / Подтяните гриф к животу, сводя лопатки. / Медленно опустите гриф.",2],["Tate_Press","Жим Тейта","Tate Press","i","af","dumbbells",2,0,0,"Лягте на скамью, гантели над грудью, ладони к ногам. / Согните локти, опуская гантели к груди, локти в стороны. / Разогните руки вверх.",2],["The_Straddle","Растяжка в седе ноги врозь","The Straddle","m","po","",1,1,0,"Сядьте на пол, разведите прямые ноги в стороны. / Наклонитесь вперёд, упираясь руками в пол. / Задержитесь на 10–20 секунд.",2],["Thigh_Abductor","Разведение ног в тренажёре","Thigh Abductor","q","n","machines",1,0,0,"Сядьте в тренажёр, валики с внешней стороны колен. / Разведите ноги в стороны на выдохе. / Медленно сведите ноги.",2],["Thigh_Adductor","Сведение ног в тренажёре","Thigh Adductor","p","nm","machines",1,0,0,"Сядьте в тренажёр, валики с внутренней стороны колен. / Сведите ноги вместе на выдохе. / Медленно разведите ноги.",2],["Tire_Flip","Переворот покрышки","Tire Flip","l","oajnmdfei","other",2,5,1,"Присядьте у покрышки и возьмите её снизу. / Мощно поднимите покрышку, разгибая ноги и таз. / Толкните её вперёд и переверните.",2],["Toe_Touchers","Касание носков лёжа","Toe Touchers","k","","",1,1,0,"Лягте на спину, поднимите прямые ноги вертикально. / Скрутитесь, тянясь руками к носкам. / Медленно опуститесь назад.",2],["Torso_Rotation","Повороты корпуса","Torso Rotation","k","","fitball",1,1,0,"Встаньте прямо, руки перед собой. / Поворачивайте корпус в стороны, таз неподвижен. / Чередуйте стороны плавно.",2],["Trail_Running_Walking","Бег или ходьба по пересечённой местности","Trail Running/Walking","l","onm","",1,6,0,"Выберите тропу и комфортный темп. / Держите корпус прямо, смотрите под ноги. / Ускоряйтесь или замедляйтесь по рельефу.",2],["Trap_Bar_Deadlift","Становая тяга с трэп-грифом","Trap Bar Deadlift","l","nm","other",1,0,1,"Встаньте внутрь трэп-грифа, возьмитесь за рукояти. / Поднимите гриф, разгибая ноги и таз с прямой спиной. / Опустите гриф под контролем.",2],["Tricep_Dumbbell_Kickback","Разгибание руки с гантелью в наклоне","Tricep Dumbbell Kickback","i","","dumbbells",1,0,0,"Наклонитесь вперёд, плечо параллельно полу. / Разогните руку назад до прямой. / Медленно согните её обратно.",2],["Tricep_Side_Stretch","Растяжка трицепса в сторону","Tricep Side Stretch","i","f","",1,1,0,"Заведите руку за голову, согнув локоть. / Другой рукой потяните локоть в сторону. / Задержитесь и смените руку.",2],["Triceps_Overhead_Extension_with_Rope","Разгибание рук с канатом из-за головы","Triceps Overhead Extension with Rope","i","","cable",1,0,0,"Встаньте спиной к блоку, держите канат за головой. / Разогните руки вперёд и вверх. / Медленно согните руки назад.",2],["Triceps_Pushdown","Разгибание рук на верхнем блоке","Triceps Pushdown","i","","cable",1,0,0,"Встаньте у верхнего блока, возьмите рукоять, локти прижаты. / Разогните руки вниз до прямых. / Медленно верните рукоять вверх.",2],["Triceps_Pushdown_-_Rope_Attachment","Разгибание рук на верхнем блоке с канатом","Triceps Pushdown - Rope Attachment","i","","cable",1,0,0,"Возьмите канат, локти прижаты к корпусу. / Разогните руки вниз, разводя концы каната. / Медленно верните руки вверх.",2],["Triceps_Pushdown_-_V-Bar_Attachment","Разгибание рук на верхнем блоке с V-образной рукоятью","Triceps Pushdown - V-Bar Attachment","i","","cable",1,0,0,"Возьмите V-рукоять, локти прижаты к корпусу. / Разогните руки вниз до прямых. / Медленно верните рукоять вверх.",2],["Triceps_Stretch","Растяжка трицепса","Triceps Stretch","i","b","",1,1,0,"Поднимите руку и согните её, положив ладонь на спину. / Другой рукой мягко надавите на локоть. / Задержитесь и смените руку.",2],["Tuck_Crunch","Скручивания с подтягиванием коленей","Tuck Crunch","k","","",1,0,0,"Лягте на спину, колени подтянуты к груди. / Поднимите плечи и подтяните колени к груди. / Медленно вернитесь назад.",2],["Two-Arm_Dumbbell_Preacher_Curl","Подъём гантелей на скамье Скотта","Two-Arm Dumbbell Preacher Curl","h","","dumbbells",1,0,0,"Сядьте за скамью Скотта, гантели в руках. / Согните руки, поднимая гантели к плечам. / Медленно опустите их.",2],["Two-Arm_Kettlebell_Clean","Взятие двух гирь на грудь","Two-Arm Kettlebell Clean","f","onmde","kettlebell",2,0,1,"Поставьте гири между стоп и возьмите их. / Мощно разогните таз и подбросьте гири на грудь. / Опустите их вниз под контролем.",2],["Two-Arm_Kettlebell_Jerk","Толчок двух гирь","Two-Arm Kettlebell Jerk","f","oli","kettlebell",2,0,1,"Держите гири на груди. / Слегка присядьте и вытолкните гири вверх. / Подсядьте под гири, выпрямитесь и опустите их на грудь.",2],["Two-Arm_Kettlebell_Military_Press","Жим двух гирь стоя","Two-Arm Kettlebell Military Press","f","i","kettlebell",2,0,1,"Держите гири на груди. / Выжмите гири над головой. / Медленно опустите их на грудь.",2],["Two-Arm_Kettlebell_Row","Тяга двух гирь в наклоне","Two-Arm Kettlebell Row","c","hb","kettlebell",2,0,1,"Наклонитесь с гирями в руках, спина прямая. / Подтяните гири к поясу, сводя лопатки. / Медленно опустите гири.",2],["Underhand_Cable_Pulldowns","Тяга верхнего блока обратным хватом","Underhand Cable Pulldowns","b","hcf","cable",1,0,1,"Сядьте в тренажёр, возьмите рукоять хватом снизу. / Подтяните рукоять к груди. / Медленно верните руки вверх.",2],["Upper_Back-Leg_Grab","Растяжка спины с обхватом ног","Upper Back-Leg Grab","m","dc","",1,1,0,"Сядьте, ноги прямые, колени вместе. / Наклонитесь и обхватите бёдра снизу. / Прижмите грудь к коленям и задержитесь.",2],["Upper_Back_Stretch","Растяжка верха спины","Upper Back Stretch","c","c","",1,1,0,"Сцепите руки перед собой. / Вытяните руки вперёд, округляя верх спины. / Задержитесь на 20–30 секунд.",2],["Upright_Barbell_Row","Тяга штанги к подбородку","Upright Barbell Row","f","e","barbell",1,0,1,"Встаньте прямо, штанга перед бёдрами хватом сверху. / Поднимите штангу к подбородку, локти вверх. / Медленно опустите штангу.",2],["Upright_Cable_Row","Тяга нижнего блока к подбородку","Upright Cable Row","e","f","cable",2,0,1,"Встаньте у нижнего блока, возьмите прямую рукоять. / Подтяните рукоять к подбородку, локти вверх. / Медленно опустите рукоять.",2],["Upright_Row_-_With_Bands","Тяга резинки к подбородку","Upright Row - With Bands","e","f","bands",1,0,1,"Встаньте на резинку, держите концы перед бёдрами. / Подтяните руки к подбородку, локти вверх. / Медленно опустите руки.",2],["Upward_Stretch","Растяжка вверх","Upward Stretch","f","ab","",1,1,0,"Поднимите прямые руки над головой, ладони вместе. / Тянитесь руками вверх и слегка назад. / Держите спину прямой и задержитесь.",2],["V-Bar_Pulldown","Тяга верхнего блока V-образной рукоятью","V-Bar Pulldown","b","hcf","cable",2,0,1,"Сядьте в тренажёр, возьмите V-рукоять. / Подтяните рукоять к груди, сводя лопатки. / Медленно верните руки вверх.",2],["V-Bar_Pullup","Подтягивания с V-образной рукоятью","V-Bar Pullup","b","hcf","pullup",1,0,1,"Повесьте V-рукоять на перекладину и возьмитесь за неё. / Подтянитесь, приближая грудь к рукояти. / Медленно опуститесь.",2],["Vertical_Swing","Махи гантелью вверх","Vertical Swing","m","nlf","dumbbells",1,2,1,"Держите гантель двумя руками между ног. / Сделайте мах назад, сгибая таз. / Мощно разогните таз и поднимите гантель над головой.",2],["Walking_Treadmill","Ходьба на беговой дорожке","Walking, Treadmill","l","onm","machines",1,6,0,"Встаньте на дорожку и задайте скорость. / Идите ровно, держа корпус прямо. / Поддерживайте темп нужное время.",2],["Weighted_Ball_Hyperextension","Гиперэкстензия на фитболе с весом","Weighted Ball Hyperextension","d","nmc","fitball",2,0,1,"Лягте животом на фитбол, держите блин у груди. / Опустите корпус вниз, округляясь над мячом. / Поднимите корпус до прямой линии.",2],["Weighted_Ball_Side_Bend","Боковые наклоны на фитболе с весом","Weighted Ball Side Bend","k","","fitball",2,0,0,"Лягте боком на фитбол, держите блин у головы. / Опуститесь вниз, растягивая бок. / Поднимите корпус за счёт косых мышц.",2],["Weighted_Bench_Dip","Обратные отжимания от скамьи с весом","Weighted Bench Dip","i","af","dips",2,0,1,"Упритесь руками в скамью, блин на бёдрах. / Опуститесь, сгибая локти до 90 градусов. / Выжмите себя вверх.",2],["Weighted_Crunches","Скручивания с весом","Weighted Crunches","k","","medball",1,0,0,"Лягте на спину, блин у груди. / Поднимите плечи, скручиваясь. / Медленно опуститесь.",2],["Weighted_Jump_Squat","Прыжки из приседа с весом","Weighted Jump Squat","l","onmd","barbell",2,0,1,"Держите гантели в руках, присядьте. / Мощно выпрыгните вверх. / Мягко приземлитесь в присед.",2],["Weighted_Pull_Ups","Подтягивания с отягощением","Weighted Pull Ups","b","hc","other",2,0,1,"Повесьте груз на пояс и повисните на перекладине. / Подтянитесь до подбородка над перекладиной. / Медленно опуститесь.",2],["Weighted_Sissy_Squat","Сисси-присед с весом","Weighted Sissy Squat","l","onm","barbell",3,0,1,"Держите блин у груди, встан   for (const [re, fn] of Q_PHRASES) { const m = q.match(re); if (m) { fn(f); f.seen.push(m[0].trim()); q = q.replace(m[0], " "); } }
  for (const w of q.split(" ").filter(Boolean)) {
    const rule = Q_WORDS.find(([stems]) => stems.some((s) => (s.length <= 3 ? w === s || (w.startsWith(s) && w.length <= s.length + 3) : w.startsWith(s))));
    if (rule) { rule[1](f); f.seen.push(w); continue; }

function searchAll(raw, opts = {}) {

  const out = [];

    if (opts.mine && !eqFits(e, p.eq)) continue;
    if (e.where && f.place && e.where !== f.place) continue;
    if (!eqFits(e, allowed)) continue;
    if (f.bw && e.eq.length) continue;
    if (f.eq.length && !e.eq.some((r) => r.split("|").some((x) => f.eq.includes(x)))) continue;
    if (f.cat.length && !f.cat.includes(e.cat)) continue;
    if (f.lvl === 1 && e.level > 1) continue;
    if (f.lvl === 2 && e.level !== 2) continue;
    if (f.lvl === 3 && e.level < 2) continue;
    if (f.comp != null && e.compound !== f.comp) continue;
    let score = e.db ? 0 : 3, primHit = true;
    if (f.mus.length) {

      if (!pm && !sm) continue;

    }
    if (!ok) continue;

    out.push([score + (e.compound ? 1 : 0) - e.level * 0.1, e, primHit]);

  // если по основной мышце нашлось достаточно, вспомогательные не показываем
  const res = out.filter((x) => x[2]).length >= 6 ? out.filter((x) => x[2]) : out;

  if (f.bw) bits.push("свой вес");
  if (f.eq.length) bits.push([...new Set(f.eq)].map(EQ_RU).join(" или "));
  if (f.place) bits.push(PLACES.find((x) => x.id === f.place).name.toLowerCase());
  if (f.mine) bits.push("твой инвентарь");
  if (f.lvl) bits.push(LEVELS[f.lvl - 1].name.toLowerCase());

function canDo(ex, p, levelBoost = 0) {
  const have = new Set(p.eq);
  if (ex.where && ex.where !== p.place) return false;
  if (ex.level > p.level + levelBoost) return false;
  if (p.level >= 2 && EASY.has(ex.id)) return false;
  return ex.eq.every((req) => req.split("|").some((x) => have.has(x)));

// облегчённые варианты: только для новичков
const EASY = new Set(["pushup_knee", "pushup_incline", "neg_pullup"]);
const available = (p) => EXERCISES.filter((e) => canDo(e, p, 1));

function scheme(ex, p) {
  const G = {
    lose: { sets: 3, reps: 15, rest: 30, sec: 40 },
    mass: { sets: 4, reps: 10, rest: 90, sec: 45 },
    strength: ex.compound && isWeighted(ex) ? { sets: 5, reps: 5, rest: 150, sec: 45 } : { sets: 4, reps: 8, rest: 90, sec: 45 },
    endurance: { sets: 3, reps: 20, rest: 30, sec: 50 },
    fit: { sets: 3, reps: 12, rest: 60, sec: 40 },
  }[p.goal] || { sets: 3, reps: 12, rest: 60, sec: 40 };
  let sets = G.sets - (p.level === 1 ? 1 : 0) + (p.level === 3 && ex.compound ? 1 : 0);
  sets = Math.max(2, Math.min(6, sets));
  let reps = G.reps;
  if (!isWeighted(ex) && (p.goal === "strength" || p.goal === "mass")) reps = ex.level >= 2 ? 8 : 15;
  const sec = Math.round((G.sec * (p.level === 1 ? 0.75 : p.level === 3 ? 1.4 : 1)) / 5) * 5;
  return { sets, reps: ex.unit === "s" ? sec : reps, unit: ex.unit, rest: G.rest };
}

function buildWorkout(title, groups, seed, p) {
  const r = rng(seed);
  const count = { 20: 4, 30: 5, 45: 6, 60: 7 }[p.minutes] || 5;
  const wantFinisher = (p.goal === "lose" || p.goal === "endurance") && !groups.includes("cardio");
  const slots = wantFinisher ? count - 1 : count;
  const used = new Set(), items = [], missing = new Set();
  const pick = (g, preferCompound) => {
    let pool = EXERCISES.filter((e) => e.group === g && !used.has(e.id) && canDo(e, p));
    if (!pool.length) pool = EXERCISES.filter((e) => e.group === g && !used.has(e.id) && canDo(e, p, 1));
    if (!pool.length) return null;
    if (preferCompound) { const c = pool.filter((e) => e.compound); if (c.length) pool = c; }
    return pool[Math.floor(r() * pool.length)];
  };
  const seenGroup = new Set();
  for (let i = 0, tries = 0; items.length < slots && tries < slots * 4; i++, tries++) {
    const g = groups[i % groups.length];
    const ex = pick(g, !seenGroup.has(g) && p.goal !== "endurance");
    seenGroup.add(g);
    if (!ex) { missing.add(g); continue; }
    used.add(ex.id); items.push({ id: ex.id, ...scheme(ex, p) });
  }
  if (wantFinisher) { const ex = pick("cardio", false); if (ex) { used.add(ex.id); items.push({ id: ex.id, ...scheme(ex, p) }); } }
  // базовые упражнения в начало
  items.sort((a, b) => (exById(b.id).compound && isWeighted(exById(b.id))) - (exById(a.id).compound && isWeighted(exById(a.id))));
  const realMissing = [...missing].filter((g) => !items.some((it) => exById(it.id).group === g));
  return { title, groups: [...new Set(groups)], items, missing: realMissing };
}

function weekPlan(p) {
  const sch = { ...SCHEDULES[p.days] };
  if (p.goal === "lose" && p.days >= 3) { const last = Math.max(...Object.keys(sch).map(Number)); sch[last] = "cardio"; }
  return DAYS.map((_, i) => (sch[i] ? { type: sch[i], ...DAY_TYPES[sch[i]] } : null));
}
function dayWorkout(i) {
  const p = store.profile, d = weekPlan(p)[i];
  if (!d) return null;
  const sh = store.shuffle[`${weekNo()}-${i}`] || 0;
  return buildWorkout(d.title, d.groups, hash(JSON.stringify(p)) + weekNo() * 31 + i * 7 + sh * 101, p);
}
function swapItem(w, idx) {

  const pool = EXERCISES.filter((e) => e.group === cur.group && !used.has(e.id) && canDo(e, p, 1));

  const ex = pool[Math.floor(Math.random() * pool.length)];
  w.items[idx] = { id: ex.id, ...scheme(ex, p) };

// ===================== ДЕМОНСТРАЦИЯ ТЕХНИКИ =====================
// Сцена на 15–30 с: повторы в рабочем темпе (кадры старт ↔ финиш), подсказки по шагам техники, счёт повторов.
function demoPlan(e) {
  const hold = e.unit === "s";
  if (hold) return { hold, dur: e.cat === 1 ? 20 : 25, period: 0, reps: 0 };
  const period = e.cat === 2 || e.cat === 6 || e.group === "cardio" ? 1.4 : e.compound ? 3.2 : 2.6;
  let reps = Math.round(20 / period);
  const dur = Math.min(30, Math.max(15, Math.round(reps * period)));
  return { hold, period: dur / reps, reps, dur };
}
const ease = (x) => x * x * (3 - 2 * x);
function phaseAt(plan, t) { // 0 — старт, 1 — финиш
  if (plan.hold) return t < 1.5 ? ease(t / 1.5) : 1;
  const x = (t % plan.period) / plan.period;
  return x < 0.12 ? 0 : x < 0.45 ? ease((x - 0.12) / 0.33) : x < 0.58 ? 1 : x < 0.95 ? 1 - ease((x - 0.58) / 0.37) : 0;
}
let demoRaf = 0;
function startDemo(an) {
  cancelAnimationFrame(demoRaf);
  const top = state.stack[state.stack.length - 1], e = exById(top.id), plan = demoPlan(e);
  const f1 = an.querySelector(".f1"), ph = an.querySelector(".ph"), cap = document.getElementById("demo-cap"), rep = document.getElementById("demo-rep");
  const ar = document.getElementById("anim-r"), tl = document.getElementById("demo-t"), btn = $app.querySelector("[data-anim=toggle]"), spd = $app.querySelector("[data-anim=speed]");
  const st = { t: 0, playing: true, speed: 1, last: performance.now() };
  const steps = e.steps;
  const paint = () => {
    const t = Math.min(st.t, plan.dur), p = phaseAt(plan, t);
    if (f1) f1.style.opacity = p;
    an.style.setProperty("--zoom", 1 + 0.04 * p);
    if (ph) ph.style.transform = `scale(${1 + 0.25 * p})`;
    const si = Math.min(steps.length - 1, Math.floor((t / plan.dur) * steps.length));
    cap.textContent = steps[si];
    rep.textContent = plan.hold ? (t < plan.dur ? `Держи · ${Math.ceil(plan.dur - t)} с` : "Готово") : `Повтор ${Math.min(plan.reps, Math.floor(t / plan.period) + 1)} / ${plan.reps}`;
    ar.value = Math.round(t * 10); tl.textContent = `${fmt(Math.floor(t))} / ${fmt(plan.dur)}`;
  };
  const setPlaying = (v) => { st.playing = v; if (v && st.t >= plan.dur) st.t = 0; st.last = performance.now(); btn.textContent = v ? "❚❚" : "▶"; };
  const loop = (now) => {
    if (!an.isConnected) return;
    if (st.playing) { st.t += ((now - st.last) / 1000) * st.speed; if (st.t >= plan.dur) { st.t = plan.dur; setPlaying(false); btn.textContent = "↻"; } }
    st.last = now; paint(); demoRaf = requestAnimationFrame(loop);
  };
  btn.onclick = () => { haptic(); setPlaying(!st.playing); };
  an.onclick = () => { haptic(); setPlaying(!st.playing); };
  spd.onclick = () => { haptic(); const sp = { "1×": "0.5×", "0.5×": "2×", "2×": "1×" }[spd.textContent]; spd.textContent = sp; st.speed = parseFloat(sp); };
  ar.oninput = () => { st.t = +ar.value / 10; setPlaying(false); paint(); };
  paint(); demoRaf = requestAnimationFrame(loop);
}

  H.slice(0, 30).forEach((h) => (h.x || []).forEach(([id]) => (freq[id] = (freq[id] || 0) + 1)));

  const p = store.profile;

  api({ action: "admin_stats" }).then((res) => {
    adm.loading = false;
    if (res && res.ok) adm.data = res; else adm.err = res && res.error === "forbidden" ? "Нет доступа" : "Не удалось загрузить, проверь интернет";
    render();
  });
}
function adminTab(t) {
  adm.tab = t; render(); window.scrollTo(0, 0);
  if (t === "inbox") api({ action: "admin_inbox" }).then((r) => { if (r && r.ok) { adm.inbox = r.list; render(); } });
  if (t === "send") {
    api({ action: "admin_photo" }).then((r) => { if (r && r.ok) { adm.hasPhoto = r.has; if (!r.has) adm.photo = false; render(); } });
    api({ action: "admin_scheduled" }).then((r) => { if (r && r.ok) { adm.scheduled = r.list; render(); } });
    segCount();
  }
  if (t === "more") api({ action: "admin_cfg" }).then((r) => { if (r && r.ok) { adm.cfg = r.cfg; adm.bot = r.bot || ""; render(); } });
}
function segCount() { adm.segN = null; api({ action: "admin_count", seg: adm.seg }).then((r) => { if (r && r.ok) { adm.segN = r.n; render(); } }); }
function openUser(id) {
  adm.user = { id, loading: true }; adm.reply = ""; push({ type: "admin_user", id });
  api({ action: "admin_user", id }).then((r) => { if (r && r.ok) { adm.user = r; render(); } else { adm.user = { id, err: true }; render(); } });
  api({ action: "admin_read", id }).then(() => { if (adm.inbox) adm.inbox.forEach((c) => c.id === id && (c.unread = 0)); if (adm.data) adm.data.unread = Math.max(0, (adm.data.unread || 0) - 1); });
}

function adminBlock() {
  if (adm.flag.admin) return `<button class="row" data-admin style="padding:16px;margin-top:16px"><div class="grow"><div class="title" style="font-size:15px">🛠 Админ-панель</div><div class="sub" style="margin:4px 0 0">Пользователи, сообщения, рассылка, статистика</div></div><span class="swap">Открыть</span></button>`;
  if (adm.flag.claimable) return `<div class="card" style="margin-top:16px"><b>Вы владелец бота?</b><p class="muted" style="font-size:13px;margin:6px 0 12px">Админ-панель пока ни за кем не закреплена. Нажмите, и она станет доступна только с вашего аккаунта Telegram.</p><button class="btn" data-admin-claim>Стать администратором</button></div>`;
  return "";
}

// ---------- помощники ----------
const ruN = (n, a, b, c) => { const m = n % 10, h = n % 100; return n + " " + (m === 1 && h !== 11 ? a : m >= 2 && m <= 4 && (h < 12 || h > 14) ? b : c); };
const ruDate = (d) => { if (!d) return "—"; const [y, m, dd] = String(d).slice(0, 10).split("-"); return `${+dd}.${m}.${y.slice(2)}`; };
const ruTime = (ts) => { const d = new Date(ts); return d.toLocaleDateString("ru-RU", { day: "numeric", month: "short" }) + ", " + d.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" }); };
const uName = (u) => esc([u.f, u.l].filter(Boolean).join(" ") || "Без имени");
const goalName = (id) => (GOALS.find((g) => g.id === id) || {}).name || id;
const levelName = (id) => (LEVELS.find((g) => String(g.id) === String(id)) || {}).name || id;
const placeName = (id) => (PLACES.find((g) => g.id === id) || {}).name || id;
const exName = (id) => { try { const e = exById(id); return e ? e.name : id; } catch (e) { return id; } };
const kv = (k, v) => `<div style="display:flex;justify-content:space-between;gap:12px"><span class="muted">${k}</span><b style="text-align:right">${v}</b></div>`;
const tile = (v, k) => `<div class="card" style="padding:14px"><div style="font:700 26px var(--display);color:var(--lime)">${v}</div><div class="muted" style="font-size:12px;margin-top:4px">${k}</div></div>`;
const grid3 = (a) => `<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">${a.join("")}</div>`;
const field = "width:100%;box-sizing:border-box;background:var(--bg);color:inherit;border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;font-size:15px";

// столбики за 30 дней; нажатие на столбик показывает значение
function admBars(id, title, days, vals) {
  const max = Math.max(1, ...vals), W = 300, H = 90, bw = W / vals.length;
  const total = vals.reduce((a, b) => a + b, 0);
  const bars = vals.map((v, i) => {
    const h = v ? Math.max(3, (v / max) * (H - 14)) : 0, x = i * bw;
    return `<g data-tip="${id}|${ruDate(days[i])}: ${v}"><rect x="${x}" y="0" width="${bw}" height="${H}" fill="transparent"/>${h ? `<rect x="${x + 1}" y="${H - h}" width="${bw - 2}" height="${h}" rx="2" fill="var(--lime)"/>` : ""}</g>`;
  }).join("");
  return `<div class="card" style="margin-top:8px"><div style="display:flex;justify-content:space-between;align-items:baseline"><b style="font-size:14px">${title}</b><span class="muted" style="font-size:12px" id="tip-${id}">за 30 дней: ${total}</span></div>
    <svg viewBox="0 0 ${W} ${H + 1}" style="width:100%;height:auto;margin-top:10px;display:block"><line x1="0" y1="${H + 0.5}" x2="${W}" y2="${H + 0.5}" stroke="var(--line)"/>${bars}</svg>
    <div class="muted" style="display:flex;justify-content:space-between;font-size:11px;margin-top:4px"><span>${ruDate(days[0])}</span><span>макс. ${max} в день</span><span>сегодня</span></div></div>`;
}
// горизонтальные полоски «что популярнее»
function hBars(title, obj, nameFn, empty = "Пока нет данных") {
  const rows = Object.entries(obj || {}).sort((a, b) => b[1] - a[1]).slice(0, 8), max = Math.max(1, ...rows.map((r) => r[1]));
  return `<div class="card" style="margin-top:8px"><b style="font-size:14px">${title}</b>${rows.length ? rows.map(([k, v]) => `
    <div style="margin-top:10px"><div style="display:flex;justify-content:space-between;font-size:13px"><span>${esc(nameFn(k))}</span><b>${v}</b></div>
    <div style="height:6px;border-radius:4px;background:var(--surface-2);margin-top:4px;overflow:hidden"><i style="display:block;height:100%;width:${(v / max) * 100}%;background:var(--lime);border-radius:4px"></i></div></div>`).join("") : `<p class="muted" style="font-size:13px;margin:8px 0 0">${empty}</p>`}</div>`;
}

// ---------- экраны ----------
function viewAdmin() {
  const D = adm.data;
  const head = `<div class="top"><div><button class="back" data-back style="background:var(--surface)">‹ Назад</button><div class="h1" style="margin-top:16px">Админ-панель</div></div>
    <button class="swap" data-admin-reload style="align-self:flex-end">${adm.loading ? "…" : "Обновить"}</button></div>`;
  if (!D) return head + `<div class="card" style="text-align:center;padding:32px">${adm.err ? `<p>${esc(adm.err)}</p><button class="btn" data-admin-reload style="margin-top:12px">Повторить</button>` : "Загружаю…"}</div>`;
  const tabs = [["overview", "Обзор"], ["inbox", "Сообщения" + (D.unread ? ` (${D.unread})` : "")], ["send", "Рассылка"], ["people", "Люди"], ["more", "Ещё"]];
  const bar = `<div class="chips" style="margin-bottom:12px">${tabs.map(([k, n]) => `<button class="chip ${adm.tab === k ? "active" : ""}" data-admin-tab="${k}">${n}</button>`).join("")}</div>`;
  const body = { overview: admOverview, inbox: admInbox, send: admSend, people: admPeople, more: admMore }[adm.tab](D);
  return head + bar + body;
}

function admOverview(D) {
  const R = D.ret, base = D.retBase;
  const ret = { "Один день": R.d0, "2–4 дня": R.d1_3, "5–8 дней": R.d4_7, "9–31 день": R.d8_30, "Больше месяца": R.d30 };
  return `
  ${grid3([tile(D.total, "всего"), tile(D.actWeek, "активны за неделю"), tile(D.reminders, "с напоминаниями")])}
  <div class="card" style="margin-top:8px;font-size:14px;line-height:1.9">
    ${kv("Новые: сегодня / неделя / месяц", `${D.newDay} / ${D.newWeek} / ${D.newMonth}`)}
    ${kv("Активные: сегодня / неделя / месяц", `${D.actDay} / ${D.actWeek} / ${D.actMonth}`)}
    ${kv("Тренировок / пробежек всего", `${D.workouts} / ${D.runs}`)}
    ${kv("Заблокировали бота / в бане", `${D.blocked} / ${D.banned}`)}
  </div>
  ${D.webhook ? "" : `<div class="card" style="margin-top:8px"><b>Бот пока не отвечает на /start</b><p class="muted" style="font-size:13px;margin:6px 0 12px">Подключите, чтобы бот здоровался с новыми людьми, принимал сообщения и записывал всех в список.</p><button class="btn" data-admin-webhook>Подключить</button></div>`}
  <div class="section"><div class="section-head"><div class="h2">Графики</div><span class="muted" style="font-size:12px">нажмите на столбик</span></div>
    ${admBars("new", "Новые пользователи", D.days, D.newBy)}
    ${admBars("dau", "Заходили в приложение", D.days, D.dau)}
    ${hBars("Сколько дней люди пользуются", Object.fromEntries(Object.entries(ret).filter(([, v]) => v)), (k) => k, "Появится через неделю: считаем тех, кто пришёл 7+ дней назад")}
    ${base ? `<p class="muted" style="font-size:12px;margin:6px 4px 0">Из ${ruN(base, "человека", "человек", "человек")}, пришедших неделю назад и раньше, ${D.ret.alive} всё ещё заходят.</p>` : ""}
  </div>
  <div class="section"><div class="section-head"><div class="h2">Популярное</div></div>
    ${hBars("Цели", D.goals, goalName)}
    ${hBars("Упражнения (топ у пользователей)", D.ex, exName, "Появится, когда люди начнут тренироваться")}
    ${hBars("Уровень", D.levels, levelName)}
    ${hBars("Где тренируются", D.places, placeName)}
    ${hBars("Откуда пришли", D.sources, (k) => k, "Создайте ссылки во вкладке «Ещё»")}
  </div>`;
}

function admInbox() {
  const L = adm.inbox;
  if (!L) return `<div class="card muted">Загружаю…</div>`;
  if (!L.length) return `<div class="card"><b>Пока нет сообщений</b><p class="muted" style="font-size:13px;margin:6px 0 0">Всё, что люди пишут боту, появится здесь. Бот также пришлёт вам уведомление в чат: ответьте на него свайпом влево, и ответ уйдёт человеку от лица бота.</p></div>`;
  return `<div class="list">${L.map((c) => `<button class="row" data-admin-user="${c.id}" style="padding:12px 16px;display:block;text-align:left;width:100%">
    <div style="display:flex;justify-content:space-between;gap:8px"><b style="font-size:14px">${uName(c)}${c.unread ? ` <span style="background:var(--lime);color:#000;border-radius:999px;padding:1px 7px;font-size:12px">${c.unread}</span>` : ""}</b><span class="muted" style="font-size:12px;white-space:nowrap">${ruTime(c.last)}</span></div>
    <div class="muted" style="font-size:13px;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${c.d === "out" ? "Вы: " : ""}${esc(c.t)}</div></button>`).join("")}</div>`;
}

function segOptions(D) {
  const o = [["all", "Все"], ["new7", "Новые за неделю"], ["act7", "Активные за неделю"], ["idle7", "Не заходили 7+ дней"], ["idle30", "Не заходили 30+ дней"], ["noapp", "Нажали /start, но не открыли приложение"]];
  GOALS.forEach((g) => o.push(["goal:" + g.id, "Цель: " + g.name]));
  LEVELS.forEach((g) => o.push(["level:" + g.id, "Уровень: " + g.name]));
  PLACES.forEach((g) => o.push(["place:" + g.id, "Место: " + g.name]));
  Object.keys(D.sources || {}).forEach((s) => o.push(["src:" + s, "Источник: " + s]));
  return o;
}
function admSend(D) {
  const S = adm.sending, busy = S && !S.done, opts = segOptions(D);
  const segName = (opts.find((o) => o[0] === adm.seg) || ["", "Все"])[1];
  const limit = adm.photo ? 1024 : 4096;
  const sch = adm.scheduled || [];
  const stLabel = (b) => b.status === "done" ? `отправлено ${b.sent}${b.failed ? `, не доставлено ${b.failed}` : ""}` : b.status === "run" ? `идёт: ${b.sent} отправлено` : "ждёт отправки";
  return `
  <div class="card">
    <div class="sub" style="margin:0 0 6px">Кому</div>
    <select id="adm-seg" style="${field};appearance:auto" ${busy ? "disabled" : ""}>${opts.map(([k, n]) => `<option value="${esc(k)}" ${adm.seg === k ? "selected" : ""}>${esc(n)}</option>`).join("")}</select>
    <div class="muted" style="font-size:13px;margin-top:6px">${adm.segN == null ? "Считаю получателей…" : `Получат: ${ruN(adm.segN, "человек", "человека", "человек")}`}</div>
    <div class="sub" style="margin:14px 0 6px">Текст</div>
    <textarea id="adm-text" rows="5" maxlength="${limit}" placeholder="Сообщение. {name} заменится на имя человека" style="${field};resize:vertical" ${busy ? "disabled" : ""}>${esc(adm.text)}</textarea>
    <div class="pr" style="padding:12px 0 0"><span>Кнопка «Открыть приложение»</span><button class="toggle ${adm.button ? "on" : ""}" data-admin-btn><i></i></button></div>
    <div class="pr" style="padding:12px 0 0"><div><span>Картинка</span><div class="muted" style="font-size:12px;margin-top:2px">${adm.hasPhoto ? "Последнее фото, которое вы прислали боту. До 1024 символов текста" : "Пришлите фото боту в чат, и оно появится здесь"}</div></div>
      <button class="toggle ${adm.photo ? "on" : ""}" data-admin-photo ${adm.hasPhoto ? "" : 'style="opacity:.4;pointer-events:none"'}><i></i></button></div>
    <div class="sub" style="margin:14px 0 6px">Когда</div>
    <div class="chips" style="margin:0;padding:0"><button class="chip ${adm.when === "now" ? "active" : ""}" data-admin-when="now">Сейчас</button><button class="chip ${adm.when === "later" ? "active" : ""}" data-admin-when="later">Запланировать</button></div>
    ${adm.when === "later" ? `<input type="datetime-local" id="adm-at" value="${esc(adm.at)}" style="${field};margin-top:10px"><div class="muted" style="font-size:12px;margin-top:6px">По вашему времени. Сервер рассылает партиями по ~40 человек каждые 15 минут.</div>` : ""}
    ${S ? `<p style="margin:12px 0 0">${S.done ? `Готово: доставлено ${S.sent}${S.failed ? `, не доставлено ${S.failed}` : ""}.` : `Отправляю… ${S.sent + S.failed} из ${S.total}. Не закрывайте приложение.`}</p>` : ""}
    <div style="display:flex;gap:8px;margin-top:14px"><button class="btn" data-admin-test style="flex:1;background:var(--surface-2);color:inherit">Себе</button>
      <button class="btn" data-admin-send style="flex:2" ${busy ? "disabled" : ""}>${adm.when === "later" ? "Запланировать" : "Отправить"}</button></div>
    <div class="muted" style="font-size:12px;margin-top:8px">Сегмент: ${esc(segName)}. Заблокировавшие бота и забаненные не получат.</div>
  </div>
  ${sch.length ? `<div class="section"><div class="section-head"><div class="h2">Запланированные и прошлые</div></div><div class="list">${sch.map((b) => `
    <div class="row" style="padding:12px 16px;display:block"><div style="display:flex;justify-content:space-between;gap:8px"><b style="font-size:14px">${ruTime(b.at)}</b>${b.status === "wait" ? `<button class="swap" data-admin-unsch="${esc(b.key)}">Отменить</button>` : ""}</div>
    <div class="muted" style="font-size:12px;margin-top:4px">${esc(b.segName || b.seg)} · ${stLabel(b)}${b.photo ? " · с картинкой" : ""}</div>
    <div style="font-size:13px;margin-top:6px;white-space:pre-wrap">${esc(String(b.text).slice(0, 200))}</div></div>`).join("")}</div></div>` : ""}`;
}

function admPeople(D) {
  return `<input id="adm-q" placeholder="Поиск по имени, @нику или ID" value="${esc(adm.q)}" style="${field}">
  <div id="adm-people">${admPeopleList(D)}</div>`;
}
function admPeopleList(D) {
  const q = adm.q.trim().toLowerCase();

  return `<div class="muted" style="font-size:12px;margin:8px 4px">Найдено: ${L.length}. Сортировка по последней активности.</div>
  <div class="list">${L.map((u) => `<button class="row" data-admin-user="${u.id}" style="padding:12px 16px;display:block;text-align:left;width:100%">
    <div style="display:flex;justify-content:space-between;gap:8px"><b style="font-size:14px">${uName(u)}${u.x ? ' <span class="muted">· бан</span>' : u.b ? ' <span class="muted">· заблокировал</span>' : ""}</b><span class="muted" style="font-size:12px;white-space:nowrap">${ruDate(u.a || u.s)}</span></div>
    <div class="muted" style="font-size:12px;margin-top:4px">${u.n ? "@" + esc(u.n) + " · " : ""}${ruN(u.w || 0, "тренировка", "тренировки", "тренировок")} · ${ruN(u.r || 0, "пробежка", "пробежки", "пробежек")}${u.g ? " · " + esc(goalName(u.g)) : ""}${!u.a ? " · приложение не открывал" : ""}</div></button>`).join("") || '<div class="card muted">Никого не нашли</div>'}</div>`;
}

function admMore() {

      <textarea id="adm-ntext" rows="3" style="${field};margin-top:12px;resize:vertical">${esc(C.nudgeText)}</textarea>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px"><span class="muted" style="font-size:12px">{name} — имя, {days} — дней без тренировок</span><button class="swap" data-admin-ntext>Сохранить</button></div>` : ""}
      <div class="pr" style="padding:16px 0 0;margin-top:16px;border-top:1px solid var(--line)"><div><b>Поздравления с рубежами</b><div class="muted" style="font-size:12px;margin-top:4px">10, 25, 50, 100, 200, 300 и 500 тренировок</div></div><button class="toggle ${C.milestones ? "on" : ""}" data-admin-cfg="milestones"><i></i></button></div>
    </div></div>
  <div class="section"><div class="section-head"><div class="h2">Ссылки-источники</div></div>
    <div class="card">

    </div>
    ${srcs.length ? `<div class="list" style="margin-top:8px">${srcs.map(([s, n]) => `<div class="row" style="padding:12px 16px"><div class="grow"><b style="font-size:14px">${esc(s)}</b><div class="muted" style="font-size:12px;margin-top:2px">${ruN(n, "человек", "человека", "человек")}</div></div><button class="swap" data-admin-copy="${esc(link(s))}">Копировать</button></div>`).join("")}</div>` : ""}
  </div>
  <div class="section"><div class="section-head"><div class="h2">Выгрузка</div></div>
    <div class="card"><p class="muted" style="font-size:13px;margin:0 0 12px">Бот пришлёт вам в чат файл со всеми пользователями. Он открывается в Excel и Google Таблицах.</p><button class="btn" data-admin-export>Выгрузить в Excel</button></div>
  </div>`;
}

function srcLink() {
  const nm = adm.srcName.replace(/[^\w-]/g, ""), link = `https://t.me/${adm.bot}?start=${encodeURIComponent(nm)}`;
  return nm && adm.bot ? `<div style="margin-top:10px;font-size:14px;word-break:break-all">${esc(link)}</div><button class="btn" data-admin-copy="${esc(link)}" style="margin-top:10px">Скопировать ссылку</button>` : "";
}

function viewAdminUser() {

function adminSend() {
  const text = adm.text.trim(); if (!text) { toast("Напишите текст"); return; }
  const segName = (segOptions(adm.data).find((o) => o[0] === adm.seg) || ["", ""])[1];
  const payload = { text, button: adm.button ? "Открыть приложение" : "", photo: adm.photo ? 1 : 0, seg: adm.seg };
  const ask = (q, fn) => (tg && tg.showConfirm ? tg.showConfirm(q, (ok) => ok && fn()) : confirm(q) && fn());
  if (adm.when === "later") {
    const at = adm.at && new Date(adm.at);
    if (!at || isNaN(at) || at < Date.now()) { toast("Выберите время в будущем"); return; }
    api({ action: "admin_schedule", ...payload, segName, at: at.toISOString() }).then((r) => {
      if (r && r.ok) { toast("Рассылка запланирована"); adm.text = ""; adminTab("send"); } else toast("Не получилось запланировать");
    });
    return;
  }
  const n = adm.segN == null ? "" : ` ${ruN(adm.segN, "человеку", "людям", "людям")}`;
  ask(`Отправить сообщение${n}?`, () => {
    adm.sending = { sent: 0, failed: 0, total: adm.segN || 0, done: false }; render();
    const step = (offset) => api({ action: "admin_send", ...payload, offset }).then((r) => {
      if (!r || !r.ok) { adm.sending.done = true; toast("Рассылка прервалась, проверь интернет"); render(); return; }
      adm.sending.sent += r.sent; adm.sending.failed += r.failed; adm.sending.total = r.total;
      if (r.done) { adm.sending.done = true; adm.text = ""; render(); } else { render(); step(r.next); }
    });
    step(0);
  });
}
function setCfg(set) {
  adm.cfg = { ...adm.cfg, ...set }; render();
  api({ action: "admin_cfg", set }).then((r) => { if (r && r.ok) { adm.cfg = r.cfg; render(); } else toast("Не сохранилось, проверь интернет"); });
}

const timer = { mode: "interval", work: 40, rest: 20, rounds: 8, preset: 90, running: false, phase: "work", round: 1, left: 40, total: 40, elapsed: 0, laps: [] };
let ticker = null, audioCtx = null;
function beep(freq = 880, dur = 0.12) {
  try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.frequency.value = freq; o.connect(g); g.connect(audioCtx.destination);
    g.gain.setValueAtTime(0.2, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur); o.start(); o.stop(audioCtx.currentTime + dur);
  } catch (e) {}
}
function resetTimer() {
  timer.running = false; timer.phase = "work"; timer.round = 1; timer.elapsed = 0; timer.laps = [];
  timer.left = timer.total = timer.mode === "interval" ? timer.work : timer.mode === "rest" ? timer.preset : 0;
  stopTicker();
}
function stopTicker() { if (ticker) { clearInterval(ticker); ticker = null; } }
function tick() {
  if (timer.mode === "stopwatch") { timer.elapsed++; return paintTimer(); }
  timer.left--;
  if (timer.left <= 3 && timer.left > 0) beep(660, 0.08);
  if (timer.left <= 0) {
    if (timer.mode === "rest") { beep(990, 0.4); notify(); timer.running = false; stopTicker(); timer.left = 0; return render(); }
    if (timer.phase === "work") { timer.phase = "rest"; timer.left = timer.total = timer.rest; beep(520, 0.3); haptic("heavy"); }
    else if (timer.round < timer.rounds) { timer.round++; timer.phase = "work"; timer.left = timer.total = timer.work; beep(990, 0.3); haptic("heavy"); }
    else { beep(990, 0.6); notify(); timer.running = false; stopTicker(); timer.phase = "done"; return render(); }
  }
  paintTimer();
}
function paintTimer() {
  const fg = document.getElementById("ring-fg"); if (!fg) return;
  const C = 2 * Math.PI * 140;
  const p = timer.mode === "stopwatch" ? (timer.elapsed % 60) / 60 : timer.total ? timer.left / timer.total : 0;
  fg.style.strokeDashoffset = C * (1 - p);
  fg.classList.toggle("rest", timer.phase === "rest");
  document.getElementById("t-time").textContent = fmt(timer.mode === "stopwatch" ? timer.elapsed : timer.left);
  const ph = document.getElementById("t-phase");
  if (ph) ph.textContent = timer.mode === "interval" ? (timer.phase === "done" ? "Готово!" : timer.phase === "work" ? "Работа" : "Отдых") : timer.mode === "rest" ? "Отдых" : "Секундомер";
  const rd = document.getElementById("t-round"); if (rd) rd.textContent = `Раунд ${timer.round} из ${timer.rounds}`;
}

function lineChart(values, labels, unit = "") {
  const W = 340, H = 180, P = { l: 34, r: 12, t: 16, b: 26 };
  let min = Math.min(...values), max = Math.max(...values); if (max === min) { max += 1; min = Math.max(0, min - 1); }
  min = Math.floor(min * 0.95); max = Math.ceil(max * 1.03);
  const x = (i) => P.l + (values.length === 1 ? (W - P.l - P.r) / 2 : (i * (W - P.l - P.r)) / (values.length - 1));
  const y = (v) => P.t + (H - P.t - P.b) * (1 - (v - min) / (max - min));
  const pts = values.map((v, i) => `${x(i)},${y(v)}`).join(" "), last = values.length - 1;
  const ticks = [0, 1, 2, 3].map((k) => min + ((max - min) * k) / 3);
  const step = Math.max(1, Math.ceil(values.length / 4));

// --- математика ---
function distM(a, b) {
  const R = 6371000, r = Math.PI / 180, dLa = (b[0] - a[0]) * r, dLo = (b[1] - a[1]) * r;
  const h = Math.sin(dLa / 2) ** 2 + Math.cos(a[0] * r) * Math.cos(b[0] * r) * Math.sin(dLo / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
const paceStr = (secPerKm) => (!isFinite(secPerKm) || secPerKm <= 0 || secPerKm > 3600 ? "—" : `${Math.floor(secPerKm / 60)}:${String(Math.round(secPerKm % 60)).padStart(2, "0")}`);
const hms = (s) => { s = Math.floor(s); const h = Math.floor(s / 3600); return h ? `${h}:${String(Math.floor((s % 3600) / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}` : fmt(s); };
const km = (m) => (m / 1000).toFixed(2);
const runWeight = () => (store.profile && store.profile.weight) || 70;
// ккал: бег ≈ 1 ккал на кг на км, ходьба ≈ 0,6
const kcalFor = (meters, mps) => runWeight() * (meters / 1000) * (mps > 1.8 ? 1.03 : 0.62);

// --- состояние текущей пробежки (store.run сохраняется, чтобы пережить перезагрузку) ---
const geo = { watch: null, poll: null, fix: null, err: null, wake: null, tick: null };
const runElapsed = (r = store.run) => (r ? (r.acc + (r.seg ? Date.now() - r.seg : 0)) / 1000 : 0);
function runPacing(r) {
  // текущий темп по последним ~30 с движения
  const pts = r.segs[r.segs.length - 1] || [];
  if (pts.length < 2) return Infinity;
  const last = pts[pts.length - 1]; let d = 0, i = pts.length - 1;
  while (i > 0 && last[2] - pts[i - 1][2] <= 30) { d += distM(pts[i - 1], pts[i]); i--; }
  const t = last[2] - pts[i][2];
  if (runElapsed(r) - last[2] > 12) return Infinity; // давно не двигались
  return d > 15 && t > 0 ? t / (d / 1000) : Infinity;
}

function onFix(c) {
  geo.fix = c; geo.err = null;
  const r = store.run;
  if (r && r.seg) {
    const acc = c.accuracy || 99;
    const p = [c.latitude, c.longitude, Math.round(runElapsed(r) * 10) / 10, c.altitude != null ? Math.round(c.altitude * 10) / 10 : null];
    let seg = r.segs[r.segs.length - 1];
    if (!seg) { seg = []; r.segs.push(seg); }
    const prev = seg[seg.length - 1];
    if (acc <= (prev ? 30 : 50)) {
      if (!prev) { seg.push(p); runMapAdd(p, true); }
      else {
        const d = distM(prev, p), dt = Math.max(0.5, p[2] - prev[2]);
        if (d >= 5 && d / dt < 12) {
          seg.push(p); r.m += d; r.k += kcalFor(d, d / dt);
          if (p[3] != null && acc <= 20) { if (r.alt == null) r.alt = p[3]; else if (p[3] - r.alt > 3) { r.up += p[3] - r.alt; r.alt = p[3]; } else if (r.alt - p[3] > 3) r.alt = p[3]; }
          const kmDone = Math.floor(r.m / 1000);
          if (kmDone > r.sp.length) { const t = p[2] - r.sp.reduce((a, b) => a + b, 0); r.sp.push(Math.round(t)); runCue(kmDone, p[2], t); }
          runMapAdd(p, false);
          if (Date.now() - (geo.saved || 0) > 8000) { geo.saved = Date.now(); save(); }
        }
      }
    }
  }
  else if (!r && runDot && runMap) { runDot.setLatLng([c.latitude, c.longitude]); runMap.panTo([c.latitude, c.longitude]); }

}
