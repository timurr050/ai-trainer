<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>AI-Тренер</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>html,body{background:#000;margin:0}body:not(.ready) #tabbar{display:none}.boot{position:fixed;inset:0;display:grid;place-items:center}.boot i{width:34px;height:34px;border-radius:50%;border:3px solid #262626;border-top-color:#ccff00;animation:bs .8s linear infinite}@keyframes bs{to{transform:rotate(360deg)}}</style>
</head>
<body>
<main id="app"><div class="boot"><i></i></div></main>

<nav class="tabbar" id="tabbar">
  <button data-tab="coach" class="active">
    <svg viewBox="0 0 24 24"><path d="M12 3l2.2 4.6 5 .7-3.6 3.5.9 5-4.5-2.4-4.5 2.4.9-5L4.8 8.3l5-.7z"/></svg>
    <span>Тренер</span>
  </button>
  <button data-tab="catalog">
    <svg viewBox="0 0 24 24"><path d="M6.5 6.5v11M17.5 6.5v11M3 9v6M21 9v6M6.5 12h11"/></svg>
    <span>Упражнения</span>
  </button>
  <button data-tab="timer">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/></svg>
    <span>Таймер</span>
  </button>
  <button data-tab="history">
    <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg>
    <span>История</span>
  </button>
  <button data-tab="progress">
    <svg viewBox="0 0 24 24"><path d="M3 20h18M5 16l5-5 4 3 6-7"/><path d="M15 7h5v5"/></svg>
    <span>Прогресс</span>
  </button>
</nav>

<script>
(function () {
  function load(v) {
    var l = document.createElement("link"); l.rel = "stylesheet"; l.href = "app.css?v=" + v;
    l.onload = l.onerror = function () { var s = document.createElement("script"); s.src = "app.js?v=" + v; document.body.appendChild(s); };
    document.head.appendChild(l);
  }
  var done = false, fallback = setTimeout(function () { if (!done) { done = true; load("t" + Date.now()); } }, 4000);
  fetch("version.txt?t=" + Date.now(), { cache: "no-store" })
    .then(function (r) { return r.ok ? r.text() : Promise.reject(); })
    .then(function (v) { if (!done) { done = true; clearTimeout(fallback); load(v.trim()); } },
          function () { if (!done) { done = true; clearTimeout(fallback); load("t" + Date.now()); } });
})();
</script>
</body>
</html>
