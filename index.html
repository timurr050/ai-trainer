<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>AI-Тренер</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #000;
  --surface: #111;
  --surface-2: #1a1a1a;
  --line: #262626;
  --text: #fff;
  --muted: #8a8a8a;
  --lime: #ccff00;
  --lime-dim: rgba(204, 255, 0, 0.14);
  --danger: #ff4d4d;
  --radius: 22px;
  --display: "Unbounded", system-ui, sans-serif;
  --body: "Inter", system-ui, -apple-system, sans-serif;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { background: var(--bg); color: var(--text); font-family: var(--body); }
body { min-height: 100vh; overscroll-behavior: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
img { display: block; }

#app { padding: 0 16px calc(96px + var(--safe-bottom)); max-width: 560px; margin: 0 auto; }
.screen { animation: fade .25s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* Typography */
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.h1 { font-family: var(--display); font-weight: 900; font-size: 40px; line-height: 1; letter-spacing: -.02em; text-transform: uppercase; }
.h2 { font-family: var(--display); font-weight: 700; font-size: 22px; line-height: 1.1; text-transform: uppercase; }
.h3 { font-family: var(--display); font-weight: 700; font-size: 16px; text-transform: uppercase; }
.lime { color: var(--lime); }
.muted { color: var(--muted); }
.big-num { font-family: var(--display); font-weight: 900; font-size: 34px; line-height: 1; }

.top { padding: 20px 0 16px; display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
.section { margin-top: 28px; }
.section-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }

/* Hero */
.hero { position: relative; border-radius: var(--radius); overflow: hidden; min-height: 300px; background: linear-gradient(135deg, #1d2400, #000 70%); display: flex; flex-direction: column; justify-content: flex-end; padding: 20px; }
.hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: grayscale(.2) contrast(1.1); }
.hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0) 20%, rgba(0,0,0,.92) 100%); }
.hero > *:not(img) { position: relative; z-index: 1; }
.tag { display: inline-flex; align-items: center; gap: 6px; background: var(--lime); color: #000; font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; padding: 6px 10px; border-radius: 999px; width: fit-content; }
.tag.ghost { background: rgba(255,255,255,.12); color: #fff; backdrop-filter: blur(8px); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 56px; padding: 0 24px; border-radius: 999px; background: var(--lime); color: #000; font-family: var(--display); font-weight: 700; font-size: 15px; text-transform: uppercase; letter-spacing: .02em; transition: transform .1s; }
.btn:active { transform: scale(.97); }
.btn.block { width: 100%; }
.btn.dark { background: var(--surface-2); color: #fff; }
.btn.outline { background: transparent; color: var(--lime); box-shadow: inset 0 0 0 2px var(--lime); }

/* Cards */
.card { background: var(--surface); border-radius: var(--radius); padding: 18px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--surface); border-radius: 18px; padding: 14px; }
.stat .big-num { font-size: 24px; }
.stat .eyebrow { font-size: 10px; margin-top: 6px; }

/* Week strip */
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.day { background: var(--surface); border-radius: 16px; padding: 10px 0; text-align: center; }
.day b { display: block; font-family: var(--display); font-size: 18px; margin-top: 4px; }
.day small { font-size: 11px; color: var(--muted); text-transform: uppercase; }
.day i { display: block; width: 6px; height: 6px; margin: 6px auto 0; border-radius: 50%; background: var(--line); }
.day.done i { background: var(--lime); }
.day.today { background: var(--lime); color: #000; }
.day.today small { color: #000; }
.day.today i { background: #000; }

/* Workout rows */
.list { display: flex; flex-direction: column; gap: 8px; }
.row { display: flex; align-items: center; gap: 14px; background: var(--surface); border-radius: 20px; padding: 10px; text-align: left; width: 100%; }
.thumb { width: 64px; height: 64px; border-radius: 14px; overflow: hidden; flex: none; background: linear-gradient(135deg, #2a3300, #111); }
.thumb img { width: 100%; height: 100%; object-fit: cover; }
.row .grow { flex: 1; min-width: 0; }
.row .title { font-weight: 700; font-size: 16px; }
.row .sub { font-size: 13px; color: var(--muted); margin-top: 3px; }
.row .chev { color: var(--muted); font-size: 22px; padding-right: 6px; }
.row.rest { opacity: .55; }
.pill { font-size: 11px; font-weight: 700; padding: 4px 8px; border-radius: 999px; background: var(--lime-dim); color: var(--lime); text-transform: uppercase; }

/* Chips & search */
.chips { display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px; padding: 0 16px 4px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; height: 38px; padding: 0 16px; border-radius: 999px; background: var(--surface); font-weight: 600; font-size: 14px; }
.chip.active { background: var(--lime); color: #000; }
.search { width: 100%; height: 50px; border-radius: 16px; background: var(--surface); border: 0; color: #fff; font: inherit; padding: 0 16px; margin-bottom: 12px; outline: none; }
.search:focus { box-shadow: inset 0 0 0 2px var(--lime); }

.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { position: relative; border-radius: 20px; overflow: hidden; aspect-ratio: 3/4; background: linear-gradient(160deg, #2a3300, #0d0d0d); text-align: left; }
.tile img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.tile::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 35%, rgba(0,0,0,.9)); }
.tile .cap { position: absolute; left: 12px; right: 12px; bottom: 12px; z-index: 1; }
.tile .cap b { display: block; font-family: var(--display); font-size: 14px; text-transform: uppercase; line-height: 1.15; }
.tile .cap span { font-size: 12px; color: var(--lime); font-weight: 600; }

/* Detail */
.back { display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px 0 10px; border-radius: 999px; background: rgba(0,0,0,.55); backdrop-filter: blur(8px); font-weight: 600; font-size: 14px; }
.detail-hero { position: relative; margin: 0 -16px; height: 340px; background: linear-gradient(160deg, #2a3300, #000); overflow: hidden; }
.detail-hero img { width: 100%; height: 100%; object-fit: cover; }
.detail-hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.25), transparent 30%, #000); }
.detail-hero .back { position: absolute; top: 14px; left: 16px; z-index: 2; }
.detail-body { margin-top: -60px; position: relative; z-index: 1; }
.kv { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 18px; }
.kv div { background: var(--surface); border-radius: 16px; padding: 12px; }
.kv b { display: block; font-size: 15px; margin-top: 4px; }
.steps { counter-reset: s; display: flex; flex-direction: column; gap: 10px; }
.steps li { list-style: none; display: flex; gap: 12px; line-height: 1.45; font-size: 15px; }
.steps li::before { counter-increment: s; content: counter(s); flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--lime); color: #000; font-weight: 800; display: grid; place-items: center; font-size: 13px; }

.set-table { width: 100%; border-collapse: collapse; }
.set-table td { padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
.set-table td:last-child { text-align: right; font-weight: 700; }

/* Timer */
.seg { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--surface); border-radius: 999px; padding: 4px; }
.seg button { height: 42px; border-radius: 999px; font-weight: 600; font-size: 14px; color: var(--muted); }
.seg button.active { background: var(--lime); color: #000; }
.ring-wrap { position: relative; width: min(78vw, 320px); aspect-ratio: 1; margin: 28px auto 20px; }
.ring-wrap svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring-bg { fill: none; stroke: var(--surface-2); stroke-width: 14; }
.ring-fg { fill: none; stroke: var(--lime); stroke-width: 14; stroke-linecap: round; transition: stroke-dashoffset .25s linear; }
.ring-fg.rest { stroke: #fff; }
.ring-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.ring-center .time { font-family: var(--display); font-weight: 900; font-size: clamp(48px, 17vw, 76px); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.ring-center .phase { font-family: var(--display); font-weight: 700; font-size: 14px; text-transform: uppercase; letter-spacing: .1em; color: var(--lime); }
.controls { display: flex; gap: 10px; justify-content: center; }
.controls .btn { flex: 1; }
.round-btn { width: 56px; height: 56px; flex: none !important; padding: 0; }
.steppers { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 16px; }
.stepper { background: var(--surface); border-radius: 18px; padding: 12px 8px; text-align: center; }
.stepper .val { font-family: var(--display); font-weight: 700; font-size: 20px; margin: 6px 0; }
.stepper .pm { display: flex; justify-content: center; gap: 8px; }
.stepper .pm button { width: 34px; height: 34px; border-radius: 50%; background: var(--surface-2); font-size: 18px; font-weight: 700; }
.presets { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 16px; }
.presets button { height: 52px; border-radius: 16px; background: var(--surface); font-family: var(--display); font-weight: 700; }
.presets button.active { background: var(--lime); color: #000; }
.laps { margin-top: 16px; }

/* History */
.heat { display: grid; grid-template-columns: repeat(12, 1fr); grid-auto-flow: column; grid-template-rows: repeat(7, 1fr); gap: 4px; }
.heat i { aspect-ratio: 1; border-radius: 4px; background: var(--surface-2); }
.heat i.l1 { background: rgba(204,255,0,.3); }
.heat i.l2 { background: rgba(204,255,0,.6); }
.heat i.l3 { background: var(--lime); }
.month { margin: 22px 0 10px; }
.hist { background: var(--surface); border-radius: 20px; padding: 16px; display: flex; gap: 14px; align-items: center; }
.date-box { width: 56px; flex: none; text-align: center; border-right: 1px solid var(--line); padding-right: 12px; }
.date-box b { display: block; font-family: var(--display); font-size: 24px; }
.date-box small { font-size: 11px; color: var(--muted); text-transform: uppercase; }
.hist-meta { display: flex; gap: 12px; margin-top: 6px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
.hist-meta b { color: #fff; }

/* Charts */
.chart { width: 100%; height: auto; display: block; }
.chart .grid-line { stroke: var(--line); stroke-width: 1; }
.chart .axis { fill: var(--muted); font-size: 11px; font-family: var(--body); }
.chart .line { fill: none; stroke: var(--lime); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.chart .area { fill: url(#limeFade); }
.chart .dot { fill: #000; stroke: var(--lime); stroke-width: 3; }
.chart .bar { fill: var(--surface-2); }
.chart .bar.hi { fill: var(--lime); }
.chart .val { fill: #fff; font-size: 11px; font-weight: 700; font-family: var(--body); }
.delta { font-weight: 700; color: var(--lime); font-size: 14px; }
.pr { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--line); }
.pr:last-child { border-bottom: 0; }
.pr b { font-family: var(--display); font-size: 18px; }

/* Tab bar */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: grid; grid-template-columns: repeat(5, 1fr); padding: 8px 8px calc(8px + var(--safe-bottom)); background: rgba(0,0,0,.86); backdrop-filter: blur(16px); border-top: 1px solid var(--line); }
.tabbar button { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; color: var(--muted); font-size: 10px; font-weight: 600; }
.tabbar svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.tabbar button.active { color: var(--lime); }
.tabbar.hidden { display: none; }

.toast { position: fixed; left: 50%; bottom: calc(100px + var(--safe-bottom)); transform: translateX(-50%); background: var(--lime); color: #000; font-weight: 700; padding: 12px 18px; border-radius: 999px; z-index: 20; animation: fade .2s; white-space: nowrap; }

/* ---------- v2: онбординг, сессия, пустые состояния ---------- */
.ob { min-height: 100vh; display: flex; flex-direction: column; padding-top: 20px; padding-bottom: 24px; }
.ob-progress { display: grid; grid-auto-flow: column; gap: 6px; margin-bottom: 28px; }
.ob-progress i { height: 4px; border-radius: 4px; background: var(--surface-2); }
.ob-progress i.on { background: var(--lime); }
.ob-sub { color: var(--muted); font-size: 15px; line-height: 1.45; margin-top: 12px; }
.ob-foot { margin-top: auto; padding-top: 24px; display: flex; gap: 10px; }
.ob-foot .btn { flex: 1; }
.opts { display: flex; flex-direction: column; gap: 10px; margin-top: 24px; }
.opt { position: relative; display: flex; align-items: center; gap: 14px; background: var(--surface); border-radius: 20px; padding: 16px; text-align: left; width: 100%; box-shadow: inset 0 0 0 2px transparent; transition: box-shadow .15s, background .15s; }
.opt .emo { width: 48px; height: 48px; border-radius: 14px; background: var(--surface-2); display: grid; place-items: center; font-size: 24px; flex: none; }
.opt b { display: block; font-size: 17px; }
.opt small { display: block; color: var(--muted); font-size: 13px; margin-top: 3px; line-height: 1.35; }
.opt.on { box-shadow: inset 0 0 0 2px var(--lime); background: #141a00; }
.opt.on .emo { background: var(--lime); }
.opt-photo { overflow: hidden; min-height: 110px; align-items: flex-end; }
.opt-photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .55; }
.opt-photo::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(0,0,0,.85), rgba(0,0,0,.2)); }
.opt-photo > div { position: relative; z-index: 1; }
.eq { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 24px; }
.eq button { background: var(--surface); border-radius: 18px; padding: 14px 12px; text-align: left; box-shadow: inset 0 0 0 2px transparent; min-height: 74px; }
.eq button span { font-size: 22px; display: block; }
.eq button b { display: block; font-size: 14px; margin-top: 6px; }
.eq button.on { box-shadow: inset 0 0 0 2px var(--lime); background: #141a00; }
.eq button.on b { color: var(--lime); }
.row2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(60px, 1fr)); gap: 8px; margin-top: 12px; }
.row2 button { height: 52px; border-radius: 16px; background: var(--surface); font-family: var(--display); font-weight: 700; }
.row2 button.on { background: var(--lime); color: #000; }
.label { margin-top: 26px; }

.icon-btn { width: 44px; height: 44px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; font-size: 20px; flex: none; }
.coach { display: flex; gap: 12px; align-items: flex-start; background: var(--surface); border-radius: 20px; padding: 14px; margin-top: 12px; }
.coach .ava { width: 36px; height: 36px; border-radius: 50%; background: var(--lime); color: #000; display: grid; place-items: center; font-weight: 900; font-family: var(--display); font-size: 13px; flex: none; }
.coach p { font-size: 14px; line-height: 1.45; }
.mini-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.mini-tags span { font-size: 12px; padding: 5px 9px; border-radius: 999px; background: var(--surface-2); color: #ddd; }

.empty { text-align: center; padding: 48px 24px; background: var(--surface); border-radius: var(--radius); }
.empty .big { font-size: 44px; }
.empty b { display: block; font-family: var(--display); text-transform: uppercase; font-size: 16px; margin-top: 12px; }
.empty p { color: var(--muted); font-size: 14px; line-height: 1.45; margin-top: 8px; }
.empty .btn { margin-top: 18px; }

.ex-card { background: var(--surface); border-radius: 20px; padding: 12px; }
.ex-card.done { box-shadow: inset 0 0 0 2px var(--lime); }
.ex-head { display: flex; gap: 12px; align-items: center; }
.ex-head .grow { flex: 1; min-width: 0; }
.ex-head .title { font-weight: 700; font-size: 16px; }
.ex-head .sub { font-size: 13px; color: var(--muted); margin-top: 3px; }
.swap { font-size: 12px; font-weight: 700; color: var(--lime); padding: 8px 10px; border-radius: 999px; background: var(--lime-dim); }
.sets { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; align-items: center; }
.set { min-width: 46px; height: 42px; padding: 0 10px; border-radius: 12px; background: var(--surface-2); font-weight: 700; font-size: 14px; }
.set.on { background: var(--lime); color: #000; }
.w-input { width: 84px; height: 42px; border-radius: 12px; background: var(--surface-2); border: 0; color: #fff; font: inherit; font-weight: 700; text-align: center; outline: none; }
.w-input:focus { box-shadow: inset 0 0 0 2px var(--lime); }
.restbar { position: fixed; left: 16px; right: 16px; bottom: calc(84px + var(--safe-bottom)); z-index: 15; background: var(--lime); color: #000; border-radius: 18px; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; font-weight: 800; animation: fade .2s; }
.restbar b { font-family: var(--display); font-size: 22px; }
.restbar button { font-weight: 800; font-size: 14px; padding: 6px 12px; border-radius: 999px; background: rgba(0,0,0,.12); }
.groups { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.groups button { height: 54px; border-radius: 16px; background: var(--surface); font-weight: 600; font-size: 14px; }
.groups button.on { background: var(--lime); color: #000; }
.bar-list .br { display: grid; grid-template-columns: 90px 1fr 34px; gap: 10px; align-items: center; margin: 10px 0; font-size: 13px; }
.bar-list .tr { height: 10px; border-radius: 6px; background: var(--surface-2); overflow: hidden; }
.bar-list .tr i { display: block; height: 100%; background: var(--lime); border-radius: 6px; }
.bar-list .br span:last-child { text-align: right; color: var(--muted); }
.danger-link { color: var(--danger); font-weight: 600; font-size: 14px; padding: 12px; display: block; margin: 16px auto 0; }

</style>
</head>
<body>
<main id="app"></main>

<nav class="tabbar" id="tabbar">
  <button data-tab="coach" class="active">
    <svg viewBox="0 0 24 24"><path d="M12 3l2.2 4.6 5 .7-3.6 3.5.9 5-4.5-2.4-4.5 2.4.9-5L4.8 8.3l5-.7z"/></svg>
    <span>Тренер</span>
  </button>
  <button data-tab="catalog">
    <svg viewBox="0 0 24 24"><path d="M6.5 6.5v11M17.5 6.5v11M3 9v6M21 9v6M6.5 12h11"/></svg>
    <span>Упражнения</span>
  </button>
  <button data-tab="timer">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/></svg>
    <span>Таймер</span>
  </button>
  <button data-tab="history">
    <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg>
    <span>История</span>
  </button>
  <button data-tab="progress">
    <svg viewBox="0 0 24 24"><path d="M3 20h18M5 16l5-5 4 3 6-7"/><path d="M15 7h5v5"/></svg>
    <span>Прогресс</span>
  </button>
</nav>

<script>
// ===================== БИБЛИОТЕКА =====================
// Фото: Unsplash (бесплатная лицензия Unsplash).
const IMG = (id, w = 800) => `https://images.unsplash.com/photo-${id}?auto=format&fit=crop&w=${w}&q=70`;

const PHOTOS = {
  gym: "1534438327276-14e5300c3a48",
  bench: "1571019613454-1cb2f99b2d8b",
  squat: "1574680096145-d05b474e2155",
  deadlift: "1517963879433-6ad2b056d712",
  pullup: "1598971639058-fab3c3109a00",
  press: "1581009146145-b5ef050c2e1e",
  curl: "1583454110551-21f2fa2afe61",
  plank: "1566241142559-40e1dab266c6",
  run: "1530822847156-5df684ec5ee1",
  kettlebell: "1517836357463-d25dfeac3438",
  rope: "1599058917212-d750089bc07e",
  lunge: "1594737625785-a6cbdabd333c",
  row: "1541534741688-6078c6bfb5c5",
  dips: "1526506118085-60ce8714f8c5",
  home: "1576678927484-cc907957088c",
};

<script>

// localStorage на устройстве + Telegram CloudStorage, чтобы данные были на всех устройствах пользователя.

function save() {

  if (!cloud) return;
  clearTimeout(cloudTimer);
  cloudTimer = setTimeout(() => {
    try {
      cloud.setItem("p", JSON.stringify(store.profile || null));

      parts.forEach((p, i) => cloud.setItem("h" + i, p));

}

function resetAll() {

// ===================== УТИЛИТЫ =====================
const $app = document.getElementById("app");
const $tabbar = document.getElementById("tabbar");
const exById = (id) => EXERCISES.find((e) => e.id === id);
const img = (id, w, alt = "") => `<img src="${IMG(id, w)}" alt="${esc(alt)}" loading="lazy" onerror="this.remove()">`;
const DAYS = ["Пн", "Вт", "Ср", "Чт", "Пт", "Сб", "Вс"];
const MONTHS = ["январь", "февраль", "март", "апрель", "май", "июнь", "июль", "август", "сентябрь", "октябрь", "ноябрь", "декабрь"];
const MONTHS_SHORT = ["янв", "фев", "мар", "апр", "мая", "июн", "июл", "авг", "сен", "окт", "ноя", "дек"];
const dow = (d) => (d.getDay() + 6) % 7;
const todayIdx = dow(new Date());
const mondayOf = (d = new Date()) => { const m = new Date(d); m.setHours(0, 0, 0, 0); m.setDate(m.getDate() - dow(m)); return m; };
const weekNo = () => Math.floor((mondayOf() - new Date(2024, 0, 1)) / (7 * 864e5));
const fmt = (s) => `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`;
const plural = (n, a, b, c) => { const m10 = n % 10, m100 = n % 100; return m10 === 1 && m100 !== 11 ? a : m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20) ? b : c; };
const toast = (t) => { const el = document.createElement("div"); el.className = "toast"; el.textContent = t; document.body.appendChild(el); setTimeout(() => el.remove(), 1900); };
function rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const hash = (s) => { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; };
const eqName = (id) => (EQUIPMENT.find((e) => e.id === id) || {}).name || id;
const WEIGHTED = ["dumbbells", "kettlebell", "barbell", "cable", "machines"];
const isWeighted = (ex) => ex.eq.some((r) => r.split("|").some((x) => WEIGHTED.includes(x)));

// ===================== AI-ТРЕНЕР: подбор =====================
function canDo(ex, p, levelBoost = 0) {
  const have = new Set(p.eq);
  if (ex.where && ex.where !== p.place) return false;
  if (ex.level > p.level + levelBoost) return false;
  if (p.level >= 2 && EASY.has(ex.id)) return false;
  return ex.eq.every((req) => req.split("|").some((x) => have.has(x)));
}
// облегчённые варианты: только для новичков
const EASY = new Set(["pushup_knee", "pushup_incline", "neg_pullup"]);
const available = (p) => EXERCISES.filter((e) => canDo(e, p, 1));

function scheme(ex, p) {
  const G = {
    lose: { sets: 3, reps: 15, rest: 30, sec: 40 },
    mass: { sets: 4, reps: 10, rest: 90, sec: 45 },
    strength: ex.compound && isWeighted(ex) ? { sets: 5, reps: 5, rest: 150, sec: 45 } : { sets: 4, reps: 8, rest: 90, sec: 45 },
    endurance: { sets: 3, reps: 20, rest: 30, sec: 50 },
    fit: { sets: 3, reps: 12, rest: 60, sec: 40 },
  }[p.goal] || { sets: 3, reps: 12, rest: 60, sec: 40 };
  let sets = G.sets - (p.level === 1 ? 1 : 0) + (p.level === 3 && ex.compound ? 1 : 0);
  sets = Math.max(2, Math.min(6, sets));
  let reps = G.reps;
  if (!isWeighted(ex) && (p.goal === "strength" || p.goal === "mass")) reps = ex.level >= 2 ? 8 : 15;
  const sec = Math.round((G.sec * (p.level === 1 ? 0.75 : p.level === 3 ? 1.4 : 1)) / 5) * 5;
  return { sets, reps: ex.unit === "s" ? sec : reps, unit: ex.unit, rest: G.rest };
}

function buildWorkout(title, groups, seed, p) {
  const r = rng(seed);
  const count = { 20: 4, 30: 5, 45: 6, 60: 7 }[p.minutes] || 5;
  const wantFinisher = (p.goal === "lose" || p.goal === "endurance") && !groups.includes("cardio");
  const slots = wantFinisher ? count - 1 : count;
  const used = new Set(), items = [], missing = new Set();
  const pick = (g, preferCompound) => {
    let pool = EXERCISES.filter((e) => e.group === g && !used.has(e.id) && canDo(e, p));
    if (!pool.length) pool = EXERCISES.filter((e) => e.group === g && !used.has(e.id) && canDo(e, p, 1));
    if (!pool.length) return null;
    if (preferCompound) { const c = pool.filter((e) => e.compound); if (c.length) pool = c; }
    return pool[Math.floor(r() * pool.length)];
  };
  const seenGroup = new Set();
  for (let i = 0, tries = 0; items.length < slots && tries < slots * 4; i++, tries++) {
    const g = groups[i % groups.length];
    const ex = pick(g, !seenGroup.has(g) && p.goal !== "endurance");
    seenGroup.add(g);
    if (!ex) { missing.add(g); continue; }
    used.add(ex.id); items.push({ id: ex.id, ...scheme(ex, p) });
  }
  if (wantFinisher) { const ex = pick("cardio", false); if (ex) { used.add(ex.id); items.push({ id: ex.id, ...scheme(ex, p) }); } }
  // базовые упражнения в начало
  items.sort((a, b) => (exById(b.id).compound && isWeighted(exById(b.id))) - (exById(a.id).compound && isWeighted(exById(a.id))));
  const realMissing = [...missing].filter((g) => !items.some((it) => exById(it.id).group === g));
  return { title, groups: [...new Set(groups)], items, missing: realMissing };
}

function weekPlan(p) {
  const sch = { ...SCHEDULES[p.days] };
  if (p.goal === "lose" && p.days >= 3) { const last = Math.max(...Object.keys(sch).map(Number)); sch[last] = "cardio"; }
  return DAYS.map((_, i) => (sch[i] ? { type: sch[i], ...DAY_TYPES[sch[i]] } : null));
}
function dayWorkout(i) {
  const p = store.profile, d = weekPlan(p)[i];
  if (!d) return null;
  const sh = store.shuffle[`${weekNo()}-${i}`] || 0;
  return buildWorkout(d.title, d.groups, hash(JSON.stringify(p)) + weekNo() * 31 + i * 7 + sh * 101, p);
}
function swapItem(w, idx) {
  const p = store.profile, cur = exById(w.items[idx].id);

// ===================== НАВИГАЦИЯ =====================
const state = { tab: "coach", stack: [], ob: null, obStep: 0, obReturn: false, group: "all", query: "", onlyMine: true, liftEx: null, builder: new Set() };

function go(tab) { state.tab = tab; state.stack = []; render(); window.scrollTo(0, 0); }

// ===================== ГЛАВНАЯ: ТРЕНЕР =====================
function weekStats() {
  const mon = mondayOf();
  const wk = store.history.filter((h) => new Date(h.d) >= mon);
  const doneDays = new Set(wk.map((h) => dow(new Date(h.d))));
  const days = new Set(store.history.map((h) => new Date(h.d).toDateString()));
  const plan = weekPlan(store.profile);

  if (!days.has(d.toDateString())) d.setDate(d.getDate() - 1);
  for (let i = 0; i < 120; i++) {
    if (days.has(d.toDateString())) streak++;
    else if (plan[dow(d)]) break;
    d.setDate(d.getDate() - 1);
  }
  return { count: wk.length, minutes: wk.reduce((s, h) => s + h.m, 0), doneDays, streak };
}
function coachLine(w, p) {

  let t = `Подобрал ${w.items.length} ${plural(w.items.length, "упражнение", "упражнения", "упражнений")} под твой инвентарь: ${eq}.`;
  if (w.missing.length) t += ` Для группы «${w.missing.map((g) => GROUPS[g].name).join(", ")}» не хватает инвентаря, заменил другими.`;

}

// ===================== ТАЙМЕР =====================
const timer = { mode: "interval", work: 40, rest: 20, rounds: 8, preset: 90, running: false, phase: "work", round: 1, left: 40, total: 40, elapsed: 0, laps: [] };
let ticker = null, audioCtx = null;
function beep(freq = 880, dur = 0.12) {
  try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.frequency.value = freq; o.connect(g); g.connect(audioCtx.destination);
    g.gain.setValueAtTime(0.2, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur); o.start(); o.stop(audioCtx.currentTime + dur);
  } catch (e) {}
}
function resetTimer() {
  timer.running = false; timer.phase = "work"; timer.round = 1; timer.elapsed = 0; timer.laps = [];
  timer.left = timer.total = timer.mode === "interval" ? timer.work : timer.mode === "rest" ? timer.preset : 0;
  stopTicker();
}
function stopTicker() { if (ticker) { clearInterval(ticker); ticker = null; } }
function tick() {
  if (timer.mode === "stopwatch") { timer.elapsed++; return paintTimer(); }
  timer.left--;
  if (timer.left <= 3 && timer.left > 0) beep(660, 0.08);
  if (timer.left <= 0) {
    if (timer.mode === "rest") { beep(990, 0.4); notify(); timer.running = false; stopTicker(); timer.left = 0; return render(); }
    if (timer.phase === "work") { timer.phase = "rest"; timer.left = timer.total = timer.rest; beep(520, 0.3); haptic("heavy"); }
    else if (timer.round < timer.rounds) { timer.round++; timer.phase = "work"; timer.left = timer.total = timer.work; beep(990, 0.3); haptic("heavy"); }
    else { beep(990, 0.6); notify(); timer.running = false; stopTicker(); timer.phase = "done"; return render(); }
  }
  paintTimer();
}
function paintTimer() {
  const fg = document.getElementById("ring-fg"); if (!fg) return;
  const C = 2 * Math.PI * 140;
  const p = timer.mode === "stopwatch" ? (timer.elapsed % 60) / 60 : timer.total ? timer.left / timer.total : 0;
  fg.style.strokeDashoffset = C * (1 - p);
  fg.classList.toggle("rest", timer.phase === "rest");
  document.getElementById("t-time").textContent = fmt(timer.mode === "stopwatch" ? timer.elapsed : timer.left);
  const ph = document.getElementById("t-phase");
  if (ph) ph.textContent = timer.mode === "interval" ? (timer.phase === "done" ? "Готово!" : timer.phase === "work" ? "Работа" : "Отдых") : timer.mode === "rest" ? "Отдых" : "Секундомер";
  const rd = document.getElementById("t-round"); if (rd) rd.textContent = `Раунд ${timer.round} из ${timer.rounds}`;
}
function viewTimer() {
  const C = 2 * Math.PI * 140;
  return `
  <div class="top"><div><div class="eyebrow">Интервалы и отдых</div><div class="h1" style="margin-top:8px">Таймер</div></div></div>
  <div class="seg">
    <button data-mode="interval" class="${timer.mode === "interval" ? "active" : ""}">Интервалы</button>
    <button data-mode="rest" class="${timer.mode === "rest" ? "active" : ""}">Отдых</button>
    <button data-mode="stopwatch" class="${timer.mode === "stopwatch" ? "active" : ""}">Секундомер</button>
  </div>
  <div class="ring-wrap"><svg viewBox="0 0 300 300"><circle class="ring-bg" cx="150" cy="150" r="140"/>
    <circle id="ring-fg" class="ring-fg" cx="150" cy="150" r="140" stroke-dasharray="${C}" stroke-dashoffset="0"/></svg>
    <div class="ring-center"><div class="phase" id="t-phase"></div><div class="time" id="t-time">00:00</div>
      ${timer.mode === "interval" ? `<div class="muted" id="t-round" style="font-weight:600"></div>` : ""}</div></div>
  <div class="controls">
    <button class="btn dark round-btn" data-t="reset" aria-label="Сброс">↺</button>
    <button class="btn" data-t="toggle">${timer.running ? "❚❚ Пауза" : "▶ Старт"}</button>
    ${timer.mode === "stopwatch" ? `<button class="btn dark round-btn" data-t="lap" aria-label="Круг">⚑</button>` : timer.mode === "interval" ? `<button class="btn dark round-btn" data-t="skip" aria-label="Пропустить">⏭</button>` : ""}
  </div>
  ${timer.mode === "interval" ? `<div class="steppers">${[["work", "Работа", 5, "с"], ["rest", "Отдых", 5, "с"], ["rounds", "Раунды", 1, ""]].map(([k, l, s, u]) => `
    <div class="stepper"><div class="eyebrow">${l}</div><div class="val">${timer[k]}${u}</div>
    <div class="pm"><button data-step="${k}" data-d="-${s}">−</button><button data-step="${k}" data-d="${s}">+</button></div></div>`).join("")}</div>` : ""}
  ${timer.mode === "rest" ? `<div class="presets">${[30, 60, 90, 120].map((s) => `<button data-preset="${s}" class="${timer.preset === s ? "active" : ""}">${s < 60 ? s + "с" : s / 60 + "м"}</button>`).join("")}</div>` : ""}
  ${timer.mode === "stopwatch" && timer.laps.length ? `<div class="card laps"><table class="set-table">${timer.laps.map((l, i) => `<tr><td>Круг ${timer.laps.length - i}</td><td>${fmt(l)}</td></tr>`).join("")}</table></div>` : ""}`;
}

function lineChart(values, labels, unit = "") {

  let min = Math.min(...values), max = Math.max(...values); if (max === min) { max += 1; min = Math.max(0, min - 1); }
  min = Math.floor(min * 0.95); max = Math.ceil(max * 1.03);
  const x = (i) => P.l + (values.length === 1 ? (W - P.l - P.r) / 2 : (i * (W - P.l - P.r)) / (values.length - 1));
  const y = (v) => P.t + (H - P.t - P.b) * (1 - (v - min) / (max - min));
  const pts = values.map((v, i) => `${x(i)},${y(v)}`).join(" "), last = values.length - 1;
  const ticks = [0, 1, 2, 3].map((k) => min + ((max - min) * k) / 3);
  const step = Math.max(1, Math.ceil(values.length / 4));
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">
    <defs><linearGradient id="limeFade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ccff00" stop-opacity=".35"/><stop offset="1" stop-color="#ccff00" stop-opacity="0"/></linearGradient></defs>
    ${ticks.map((t) => `<line class="grid-line" x1="${P.l}" x2="${W - P.r}" y1="${y(t)}" y2="${y(t)}"/><text class="axis" x="${P.l - 6}" y="${y(t) + 4}" text-anchor="end">${Math.round(t)}</text>`).join("")}
    <polygon class="area" points="${x(0)},${H - P.b} ${pts} ${x(last)},${H - P.b}"/><polyline class="line" points="${pts}"/>
    ${labels.map((l, i) => (i % step === 0 || i === last) ? `<text class="axis" x="${x(i)}" y="${H - 6}" text-anchor="${i === last && last ? "end" : "middle"}">${l}</text>` : "").join("")}
    <circle class="dot" cx="${x(last)}" cy="${y(values[last])}" r="6"/>
    <text class="val" x="${x(last) - 10}" y="${y(values[last]) - 12}" text-anchor="end">${values[last]}${unit}</text></svg>`;
}
function barChart(values, labels) {
  const W = 340, H = 170, P = { l: 6, r: 6, t: 20, b: 24 }, max = Math.max(1, ...values), bw = (W - P.l - P.r) / values.length;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${values.map((v, i) => { const h = Math.max(v ? 4 : 2, (H - P.t - P.b) * (v / max)); const hi = i === values.length - 1;
    return `<rect class="bar ${hi ? "hi" : ""}" x="${P.l + i * bw + 4}" y="${H - P.b - h}" width="${bw - 8}" height="${h}" rx="6"/>
    ${v ? `<text class="val" x="${P.l + i * bw + bw / 2}" y="${H - P.b - h - 6}" text-anchor="middle">${v}</text>` : ""}
    <text class="axis" x="${P.l + i * bw + bw / 2}" y="${H - 6}" text-anchor="middle">${labels[i]}</text>`; }).join("")}</svg>`;
}
function viewProgress() {
  const H = store.history;
  if (!H.length) return `<div class="top"><div><div class="eyebrow">Графики и рекорды</div><div class="h1" style="margin-top:8px">Прогресс</div></div></div>
    <div class="empty"><div class="big">📈</div><b>Данных пока нет</b><p>После первых тренировок здесь появятся графики: сколько ты занимаешься, какие мышцы прорабатываешь и как растут рабочие веса. Вписывай вес в подходах, чтобы видеть рекорды.</p><button class="btn" data-gocoach>К тренировке</button></div>`;
  // тренировки по неделям
  const mon = mondayOf(), counts = Array(8).fill(0), labels = [];
  for (let i = 7; i >= 0; i--) { const d = new Date(mon); d.setDate(d.getDate() - i * 7); labels.push(i === 0 ? "эта" : String(d.getDate())); }
  H.forEach((h) => { const w = Math.floor((mon - mondayOf(new Date(h.d))) / (7 * 864e5)); if (w >= 0 && w < 8) counts[7 - w]++; });
  // мышцы за 30 дней
  const since = Date.now() - 30 * 864e5, bySets = {};
  H.filter((h) => new Date(h.d) >= since).forEach((h) => h.x.forEach(([id, sets]) => { const e = exById(id); if (e) bySets[e.group] = (bySets[e.group] || 0) + sets; }));
  const maxSets = Math.max(1, ...Object.values(bySets));
  // веса
  const lifts = {};
  [...H].reverse().forEach((h) => h.x.forEach(([id, , , w]) => { if (w > 0) { (lifts[id] = lifts[id] || []).push({ d: new Date(h.d), w }); } }));
  const liftIds = Object.keys(lifts).sort((a, b) => lifts[b].length - lifts[a].length);
  if (!state.liftEx || !lifts[state.liftEx]) state.liftEx = liftIds[0] || null;
  const L = state.liftEx ? lifts[state.liftEx] : null;
  const records = liftIds.map((id) => [id, Math.max(...lifts[id].map((x) => x.w))]).sort((a, b) => b[1] - a[1]).slice(0, 6);
  return `
  <div class="top"><div><div class="eyebrow">Графики и рекорды</div><div class="h1" style="margin-top:8px">Прогресс</div></div></div>
  <div class="card"><div class="section-head"><div><div class="eyebrow">Тренировок в неделю</div><div class="big-num" style="margin-top:6px">${counts[7]} <span style="font-size:18px">из ${store.profile.days}</span></div></div><span class="muted" style="font-size:13px">8 недель</span></div>${barChart(counts, labels)}</div>
  <div class="card section" style="margin-top:10px"><div class="section-head"><div class="eyebrow">Подходов по мышцам за 30 дней</div></div>
    <div class="bar-list">${Object.keys(GROUPS).map((g) => `<div class="br"><span>${GROUPS[g].name}</span><div class="tr"><i style="width:${((bySets[g] || 0) / maxSets) * 100}%"></i></div><span>${bySets[g] || 0}</span></div>`).join("")}</div></div>
  ${L ? `<div class="section"><div class="chips">${liftIds.map((id) => `<button class="chip ${id === state.liftEx ? "active" : ""}" data-lift="${id}">${exById(id).name}</button>`).join("")}</div>
    <div class="card" style="margin-top:12px"><div class="section-head"><div><div class="eyebrow">Рабочий вес</div><div class="big-num" style="margin-top:6px">${L[L.length - 1].w} <span style="font-size:18px">кг</span></div></div>
      ${L.length > 1 ? `<span class="delta">${L[L.length - 1].w >= L[0].w ? "▲ +" : "▼ "}${Math.round((L[L.length - 1].w - L[0].w) * 10) / 10} кг</span>` : ""}</div>
      ${lineChart(L.map((x) => x.w), L.map((x) => `${x.d.getDate()} ${MONTHS_SHORT[x.d.getMonth()]}`), " кг")}</div></div>
    <div class="section"><div class="section-head"><div class="h2">Личные рекорды</div></div>
    <div class="card">${records.map(([id, w]) => `<div class="pr"><div style="font-weight:700">${exById(id).name}</div><b class="lime">${w} кг</b></div>`).join("")}</div></div>`
  : `<div class="coach section"><div class="ava">AI</div><p>Вписывай рабочий вес в подходах с гантелями, гирей или штангой, и здесь появятся графики силы и личные рекорды.</p></div>`}`;
}

// ===================== СОБЫТИЯ =====================
function bind() {
  const on = (sel, fn) => $app.querySelectorAll(sel).forEach((el) => (el.onclick = (ev) => { haptic(); fn(el, ev); }));
  // анкета
  on("[data-place]", (el) => { const o = state.ob; o.place = el.dataset.place; if (!o.eqTouched) o.eq = [...PLACES.find((p) => p.id === o.place).eq]; render(); });
  on("[data-eq]", (el) => { const o = state.ob, id = el.dataset.eq; o.eqTouched = true; o.eq = o.eq.includes(id) ? o.eq.filter((x) => x !== id) : [...o.eq, id]; render(); });
  on("[data-goal]", (el) => { state.ob.goal = el.dataset.goal; render(); });
  on("[data-level]", (el) => { state.ob.level = +el.dataset.level; render(); });
  on("[data-days]", (el) => { state.ob.days = +el.dataset.days; render(); });
  on("[data-min]", (el) => { state.ob.minutes = +el.dataset.min; render(); });
  on("[data-ob]", (el) => {
    if (el.dataset.ob === "back") { state.obStep--; render(); return; }
    if (state.obStep < OB_STEPS - 1) { state.obStep++; render(); window.scrollTo(0, 0); } else finishOnboarding();
  });
  // главная
  on("[data-day]", (el) => { const i = +el.dataset.day; const w = dayWorkout(i); if (!w) { toast("В этот день по плану отдых"); return; } push({ type: "preview", w, day: i }); });
  on("[data-resume]", () => { state.stack = [{ type: "session" }]; render(); });
  on("[data-settings]", () => push({ type: "settings" }));
  on("[data-builder]", () => { state.builder = new Set(); push({ type: "builder" }); });
  on("[data-bg]", (el) => { const g = el.dataset.bg; state.builder.has(g) ? state.builder.delete(g) : state.builder.add(g); render(); });
  on("[data-build]", () => { const gs = [...state.builder]; const title = gs.map((g) => GROUPS[g].name).join(" + ");
    state.stack.pop(); push({ type: "preview", w: buildWorkout(title, gs, Date.now() & 0xffffff, store.profile) }); });
  on("[data-back]", () => pop());
  on("[data-gocoach]", () => go("coach"));
  // предпросмотр
  on("[data-swap]", (el) => { const v = state.stack[state.stack.length - 1]; swapItem(v.w, +el.dataset.swap); render(); });
  on("[data-reshuffle]", () => { const v = state.stack[state.stack.length - 1]; const k = `${weekNo()}-${v.day}`; store.shuffle[k] = (store.shuffle[k] || 0) + 1; save(); v.w = dayWorkout(v.day); render(); });
  on("[data-start]", () => { const v = state.stack[state.stack.length - 1];
    if (store.session) { toast("Сначала заверши текущую тренировку"); state.stack = [{ type: "session" }]; render(); return; } startSession(v.w); });
  on("[data-ex]", (el) => push({ type: "exercise", id: el.dataset.ex }));
  // тренировка
  on("[data-set]", (el) => { const [i, j] = el.dataset.set.split(":").map(Number); const it = store.session.items[i];
    it.done[j] = !it.done[j]; save(); if (it.done[j]) { haptic("medium"); startRest(it.rest); } render(); });
  $app.querySelectorAll("[data-w]").forEach((el) => (el.oninput = () => { store.session.items[+el.dataset.w].w = el.value; save(); }));
  on("[data-finish]", () => finishSession());
  on("[data-cancel]", () => { store.session = null; clearInterval(rest.timer); rest.left = 0; save(); go("coach"); toast("Тренировка отменена"); });
  // настройки
  on("[data-edit]", (el) => { state.ob = { ...store.profile, eq: [...store.profile.eq], eqTouched: true }; state.obStep = +el.dataset.edit; state.obReturn = true; render(); window.scrollTo(0, 0); });
  on("[data-reset]", (el) => { if (el.dataset.confirm) { resetAll(); toast("Данные сброшены"); } else { el.dataset.confirm = "1"; el.textContent = "Нажми ещё раз, чтобы удалить всё"; } });
  // каталог
  on("[data-group]", (el) => { state.group = el.dataset.group; render(); });
  on("[data-mine]", (el) => { state.onlyMine = el.dataset.mine === "1"; render(); });
  const s = document.getElementById("search");
  if (s) s.oninput = () => { state.query = s.value; const pos = s.selectionStart; render(); const n = document.getElementById("search"); n.focus(); n.setSelectionRange(pos, pos); };
  // прогресс
  on("[data-lift]", (el) => { state.liftEx = el.dataset.lift; render(); });
  // таймер
  on("[data-mode]", (el) => { timer.mode = el.dataset.mode; resetTimer(); render(); });
  on("[data-preset]", (el) => { timer.preset = +el.dataset.preset; resetTimer(); render(); });
  on("[data-step]", (el) => { const k = el.dataset.step; timer[k] = Math.max(k === "rounds" ? 1 : 5, timer[k] + +el.dataset.d); resetTimer(); render(); });
  on("[data-t]", (el) => {
    const a = el.dataset.t;
    if (a === "toggle") {
      if (timer.phase === "done" || (timer.mode === "rest" && timer.left === 0)) resetTimer();
      timer.running = !timer.running;
      if (timer.running) { beep(880, 0.05); ticker = setInterval(tick, 1000); } else stopTicker();
      render();
    }
    if (a === "reset") { resetTimer(); render(); }
    if (a === "skip") { timer.left = 1; tick(); }
    if (a === "lap") { timer.laps.unshift(timer.elapsed); render(); }
  });
  if (!state.ob && store.profile && state.tab === "timer" && !state.stack.length) { paintTimer(); if (timer.running && !ticker) ticker = setInterval(tick, 1000); }
  const clock = document.getElementById("s-clock");
  if (clock && store.session) sessionClock = setInterval(() => { if (store.session) clock.textContent = fmt(Math.floor((Date.now() - store.session.startedAt) / 1000)); }, 1000);
}

render();
cloudLoad();

</script>
